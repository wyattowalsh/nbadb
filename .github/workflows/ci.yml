name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --show-error \
            --silent \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$install_dir" actionlint
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Run actionlint on all workflows
        run: actionlint

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: lint
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Lint package, tests, and extraction runtime scripts
        run: |
          uv run ruff check \
            src/ \
            tests/ \
            .github/actions/nordvpn-connect/connect.py \
            .github/actions/nordvpn-connect/supervise.py \
            .github/scripts/full_extraction_handoffs.py \
            .github/scripts/probe_discovery_transport.py \
            .github/scripts/resolve_legacy_manifest_handoff.py \
            .github/scripts/run_extract_lane.py \
            .github/scripts/seed_discovery_artifacts.py \
            .github/scripts/vpn_control_plane.py \
            .github/scripts/write_lane_metadata.py \
            .github/scripts/verify_discovery_bundle.py \
            .github/scripts/workflow_source_provenance.py
      - name: Check formatting for package, tests, and extraction runtime scripts
        run: |
          uv run ruff format --check \
            src/ \
            tests/ \
            .github/actions/nordvpn-connect/connect.py \
            .github/actions/nordvpn-connect/supervise.py \
            .github/scripts/full_extraction_handoffs.py \
            .github/scripts/probe_discovery_transport.py \
            .github/scripts/resolve_legacy_manifest_handoff.py \
            .github/scripts/run_extract_lane.py \
            .github/scripts/seed_discovery_artifacts.py \
            .github/scripts/vpn_control_plane.py \
            .github/scripts/write_lane_metadata.py \
            .github/scripts/verify_discovery_bundle.py \
            .github/scripts/workflow_source_provenance.py

  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: metadata
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - uses: ./.github/actions/refresh-metadata
        with:
          commit: "false"
      - name: Verify generated metadata is committed
        run: |
          status="$(git status --short --untracked-files=all -- dataset-metadata.json)"
          if [ -n "$status" ]; then
            echo "Generated metadata is out of date:"
            echo "$status"
            exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: typecheck
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Type-check package and extraction runtime scripts
        run: |
          uv run ty check \
            src/ \
            .github/actions/nordvpn-connect/connect.py \
            .github/actions/nordvpn-connect/supervise.py \
            .github/scripts/full_extraction_handoffs.py \
            .github/scripts/probe_discovery_transport.py \
            .github/scripts/resolve_legacy_manifest_handoff.py \
            .github/scripts/run_extract_lane.py \
            .github/scripts/seed_discovery_artifacts.py \
            .github/scripts/vpn_control_plane.py \
            .github/scripts/write_lane_metadata.py \
            .github/scripts/verify_discovery_bundle.py \
            .github/scripts/workflow_source_provenance.py

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: docs
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: uv sync --locked --extra dev
      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile
      - name: Regenerate docs artifacts
        run: uv run nbadb docs-autogen --docs-root docs/content/docs
      - name: Format generated docs artifacts
        working-directory: docs
        run: |
          pnpm exec prettier --write \
            content/docs/schema/raw-reference.mdx \
            content/docs/schema/staging-reference.mdx \
            content/docs/schema/star-reference.mdx \
            content/docs/data-dictionary/raw.mdx \
            content/docs/data-dictionary/staging.mdx \
            content/docs/data-dictionary/star.mdx \
            lib/generated/agent-catalog.json \
            lib/generated/lineage.json \
            lib/site-metrics.generated.ts
      - name: Verify generated docs are committed
        run: |
          status="$(
            git status --short --untracked-files=all -- \
              docs/content/docs \
              docs/lib/generated \
              docs/lib/site-metrics.generated.ts
          )"
          if [ -n "$status" ]; then
            echo "Generated docs artifacts are out of date:"
            echo "$status"
            exit 1
          fi
      - name: Lint docs
        working-directory: docs
        run: pnpm lint
      - name: Test docs
        working-directory: docs
        run: pnpm test
      - name: Typecheck docs
        working-directory: docs
        run: pnpm typecheck
      - name: Build docs
        working-directory: docs
        run: pnpm build

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [workflow-lint, lint, metadata, typecheck]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: contracts-a-l
            paths: tests/unit/contracts/test_[a-l]*.py
          - id: contracts-m-r
            paths: tests/unit/contracts/test_[m-r]*.py
          - id: contracts-s
            paths: tests/unit/contracts/test_s*.py
          - id: contracts-transform-output
            paths: >-
              tests/unit/contracts/test_temporal*.py
              tests/unit/contracts/test_transform_output_*.py
          - id: contracts-typed-values-a
            paths: >-
              tests/unit/contracts/test_typed_field_value_receipt.py::test_build_parse_and_strict_production_replay_are_exact
              tests/unit/contracts/test_typed_field_value_receipt.py::test_source_occurrence_summary_rederives_opaque_raw_identity
              tests/unit/contracts/test_typed_field_value_receipt.py::test_ordinary_cell_cannot_strip_its_exact_source_after_recursive_reseal
              tests/unit/contracts/test_typed_field_value_receipt.py::test_raw_parser_values_are_compared_to_committed_arrow_values
              tests/unit/contracts/test_typed_field_value_receipt.py::test_rebuilt_raw_occurrence_summary_fields_must_match_parser_body
              tests/unit/contracts/test_typed_field_value_receipt.py::test_ordinary_custom_nested_stats_values_use_the_independent_decoder
              tests/unit/contracts/test_typed_field_value_receipt.py::test_ordinary_reordered_multi_result_uses_canonical_source_ordinal
              tests/unit/contracts/test_typed_field_value_receipt.py::test_caller_projected_storage_rows_are_not_an_authority
              tests/unit/contracts/test_typed_field_value_receipt.py::test_static_values_are_reconstructed_by_the_independent_decoder
              tests/unit/contracts/test_typed_field_value_receipt.py::test_conditional_shapes_have_exact_row_partitions_and_round_trip
              tests/unit/contracts/test_typed_field_value_receipt.py::test_hybrid_unknown_stats_partition_binds_result_and_body_sources_exactly
          - id: contracts-typed-values-b
            paths: >-
              tests/unit/contracts/test_typed_field_value_receipt.py::test_selected_result_partition_carries_every_record_kind_and_zero_values
              tests/unit/contracts/test_typed_field_value_receipt.py::test_selected_missing_result_rejects_wrong_declared_index_and_raw_promotion
              tests/unit/contracts/test_typed_field_value_receipt.py::test_body_node_partition_carries_exact_parent_path_and_edge_ordinals
              tests/unit/contracts/test_typed_field_value_receipt.py::test_live_partition_carries_declarations_nulls_and_present_containers
              tests/unit/contracts/test_typed_field_value_receipt.py::test_ordinary_live_value_decoder_projects_nested_result_through_array
              tests/unit/contracts/test_typed_field_value_receipt.py::test_ordinary_live_value_decoder_preserves_optional_missing_fields
              tests/unit/contracts/test_typed_field_value_receipt.py::test_ordinary_live_value_decoder_rejects_resealed_occurrence_mismatches
              tests/unit/contracts/test_typed_field_value_receipt.py::test_ordinary_live_value_decoder_rejects_valid_foreign_response
              tests/unit/contracts/test_typed_field_value_receipt.py::test_live_nested_missing_result_set_field_uses_child_occurrence_context
              tests/unit/contracts/test_typed_field_value_receipt.py::test_live_mixed_absent_occurrence_is_exact_and_rejects_resealed_tampering
          - id: contracts-typed-values-fallback-shapes
            paths: tests/unit/contracts/test_typed_field_value_receipt.py::test_selected_result_round_trips_every_observed_fallback_shape
          - id: contracts-typed-values-c
            paths: >-
              tests/unit/contracts/test_typed_field_value_receipt.py::test_conditional_row_occurrence_discriminator_rejects_resealed_partial_states
              tests/unit/contracts/test_typed_field_value_receipt.py::test_conditional_cell_source_authority_is_an_exact_field_intersection
              tests/unit/contracts/test_typed_field_value_receipt.py::test_conditional_row_partition_rejects_dropped_duplicated_or_reordered_rows
              tests/unit/contracts/test_typed_field_value_receipt.py::test_selected_binding_rebind_with_fully_recomputed_wire_receipts_is_rejected
              tests/unit/contracts/test_typed_field_value_receipt.py::test_body_node_selector_rebind_with_fully_recomputed_wire_receipts_is_rejected
              tests/unit/contracts/test_typed_field_value_receipt.py::test_live_presence_rebind_with_fully_recomputed_wire_receipts_is_rejected
              tests/unit/contracts/test_typed_field_value_receipt.py::test_body_source_and_committed_frame_rebindings_fail_after_exact_resealing
              tests/unit/contracts/test_typed_field_value_receipt.py::test_dictionary_context_is_part_of_exact_value_equality
              tests/unit/contracts/test_typed_field_value_receipt.py::test_decimal_committed_ipc_and_value_are_exact_fixed_points
              tests/unit/contracts/test_typed_field_value_receipt.py::test_source_family_and_decoder_cannot_be_relabelled_after_reseal
              tests/unit/contracts/test_typed_field_value_receipt.py::test_duplicate_header_name_at_wrong_ordinal_is_not_collapsed
          - id: contracts-typed-values-d
            paths: >-
              tests/unit/contracts/test_typed_field_value_receipt.py::test_foreign_route_receipt_root_and_incomplete_denominator_fail_closed
              tests/unit/contracts/test_typed_field_value_receipt.py::test_parser_body_cannot_hide_a_provider_result_from_the_denominator
              tests/unit/contracts/test_typed_field_value_receipt.py::test_response_fixed_zero_route_round_trips_without_fabricated_rows
              tests/unit/contracts/test_typed_field_value_receipt.py::test_self_resealed_landing_inventory_mutations_fail_before_typed_promotion
              tests/unit/contracts/test_typed_field_value_receipt.py::test_live_route_requires_exact_external_plan_digest_and_timestamp
              tests/unit/contracts/test_typed_field_value_receipt.py::test_v1_foreign_contract_and_noncanonical_inputs_require_restart
              tests/unit/contracts/test_typed_field_value_receipt.py::test_self_resealed_foreign_raw_bundle_root_fails_structural_summary_binding
              tests/unit/contracts/test_typed_field_value_receipt.py::test_foreign_canonical_value_and_declared_product_fail_before_acceptance
              tests/unit/contracts/test_typed_field_value_receipt.py::test_route_value_budget_is_cumulative_and_atomic
              tests/unit/contracts/test_typed_field_value_receipt.py::test_parser_preallocation_gate_rejects_depth_before_json_decode
              tests/unit/contracts/test_typed_field_value_receipt.py::test_hostile_booleans_fail_at_parser_construction
          - id: contracts-value-projection
            paths: tests/unit/contracts/test_value_projection*.py
          - id: contracts-w2
            paths: tests/unit/contracts/test_w2*.py
          - id: orchestrate-a-p
            paths: tests/unit/orchestrate/test_[a-p]*.py
          - id: orchestrate-raw-publication
            paths: >-
              tests/unit/orchestrate/test_raw_publication_inventory.py
              tests/unit/orchestrate/test_raw_publication_scanner.py
          - id: orchestrate-raw-store
            paths: >-
              tests/unit/orchestrate/test_raw_request_assurance.py
              tests/unit/orchestrate/test_raw_request_context.py
              tests/unit/orchestrate/test_raw_request_store.py
          - id: orchestrate-raw-manifest
            paths: tests/unit/orchestrate/test_raw_request_manifest.py
          - id: orchestrate-raw-integration
            paths: tests/unit/orchestrate/test_raw_request_orchestrator_integration.py
          - id: orchestrate-raw-static
            paths: tests/unit/orchestrate/test_raw_request_static_authority.py
          - id: orchestrate-recurring
            paths: >-
              tests/unit/orchestrate/test_recurring*.py
              tests/unit/orchestrate/test_run_with_deadline_script.py
          - id: orchestrate-request-closure
            paths: tests/unit/orchestrate/test_request_closure_*.py
          - id: orchestrate-request-universe
            paths: tests/unit/orchestrate/test_request_universe_*.py
          - id: orchestrate-successor
            paths: tests/unit/orchestrate/test_successor_*.py
          - id: orchestrate-tail
            paths: >-
              tests/unit/orchestrate/test_scanner*.py
              tests/unit/orchestrate/test_seasons*.py
              tests/unit/orchestrate/test_staging*.py
              tests/unit/orchestrate/test_temporal*.py
              tests/unit/orchestrate/test_transformers*.py
              tests/unit/orchestrate/test_terminal*.py
              tests/unit/orchestrate/test_validate*.py
              tests/unit/orchestrate/test_verify*.py
              tests/unit/orchestrate/test_video*.py
              tests/unit/orchestrate/test_vpn*.py
          - id: orchestrate-w2-source
            paths: >-
              tests/unit/orchestrate/test_w2_source_call_builder.py
              tests/unit/orchestrate/test_w2_source_call_preparation.py
          - id: orchestrate-w2-rest
            paths: >-
              tests/unit/orchestrate/test_w2_database_assurance.py
              tests/unit/orchestrate/test_w2_operation_coordinator.py
              tests/unit/orchestrate/test_w2_operation_store.py
              tests/unit/orchestrate/test_w2_publication_inventory.py
              tests/unit/orchestrate/test_w2_runtime_environment.py
          - id: orchestrate-workflow
            paths: >-
              tests/unit/orchestrate/test_work*.py
              tests/unit/orchestrate/test_write*.py
          - id: kaggle
            paths: tests/unit/kaggle
          - id: core
            paths: tests/unit/core
          - id: extract
            paths: tests/unit/extract
          - id: transform
            paths: tests/unit/transform
          - id: application
            paths: tests/unit/agent tests/unit/chat tests/unit/cli
          - id: supporting
            paths: >-
              tests/unit/schemas
              tests/unit/load
              tests/unit/docs_gen
              tests/unit/notebooks
              tests/unit/workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: test-${{ matrix.id }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Run unit shard
        env:
          COVERAGE_FILE: .coverage.${{ matrix.id }}
          UNIT_PATHS: ${{ matrix.paths }}
        run: |
          read -r -a unit_patterns <<< "$UNIT_PATHS"
          unit_paths=()
          for pattern in "${unit_patterns[@]}"; do
            base_path="${pattern%%::*}"
            if [ "$base_path" != "$pattern" ]; then
              if [ ! -e "$base_path" ]; then
                echo "Unit shard node ID has a missing file: $pattern"
                exit 1
              fi
              unit_paths+=("$pattern")
              continue
            fi
            mapfile -t matches < <(compgen -G "$pattern")
            if [ "${#matches[@]}" -eq 0 ]; then
              if [ ! -e "$pattern" ]; then
                echo "Unit shard pattern matched no paths: $pattern"
                exit 1
              fi
              matches=("$pattern")
            fi
            unit_paths+=("${matches[@]}")
          done
          uv run pytest \
            -o addopts="--import-mode=importlib" \
            "${unit_paths[@]}" \
            --cov=src/nbadb \
            --cov-report=
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ matrix.id }}
          path: .coverage.${{ matrix.id }}
          if-no-files-found: error
          include-hidden-files: true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: test-final
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Combine unit coverage
        run: |
          uv run coverage combine coverage-data
          uv run coverage report --show-missing
      - name: Fetch nba_api endpoint-analysis docs
        run: |
          NBA_API_VERSION="$(uv run python -c 'import importlib.metadata; print(importlib.metadata.version("nba-api"))')"
          NBA_API_REF="v${NBA_API_VERSION}"
          echo "Fetching nba_api docs/tools at ${NBA_API_REF}"
          git clone --depth=1 --filter=blob:none --branch "$NBA_API_REF" \
            https://github.com/swar/nba_api.git "$RUNNER_TEMP/nba_api-upstream"
      - name: Validate endpoint support contract
        run: |
          uv run nbadb extract-completeness \
            --require-full \
            --endpoint-analysis-docs-root "$RUNNER_TEMP/nba_api-upstream" \
            --output-dir "$RUNNER_TEMP/endpoint-coverage"
      - run: uv run pytest tests/integration -x
