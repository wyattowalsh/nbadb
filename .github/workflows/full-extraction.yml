name: Full Extraction
run-name: Full Extraction chain=${{ inputs.chain_id || github.run_id }} iteration=${{ inputs.iteration }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Exact operation authority: targeted_smoke, extract, or continue"
        type: choice
        default: extract
        options:
          - targeted_smoke
          - extract
          - continue
      operation_manifest_lane_count:
        description: "Exact planned lane count bound into the operation authority"
        type: string
        default: "256"
      concurrency:
        description: "Max concurrent requests per category"
        type: choice
        default: "moderate"
        options:
          - conservative
          - moderate
          - aggressive
      vpn_parallelism:
        description: "Configured-credential VPN lanes (default 2; explicit production override 0-6)"
        type: choice
        default: "2"
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
      matrix_batch_size:
        description: "Lane jobs planned per iteration; direct max-parallel or VPN slot queues control runners"
        type: choice
        default: "256"
        options:
          - "64"
          - "128"
          - "192"
          - "256"
      direct_parallelism:
        description: "Bounded direct fallback lanes; zero for VPN-only operations"
        type: choice
        default: "2"
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
      direct_request_profile:
        description: "Request-rate profile for direct/no-VPN extract lanes"
        type: choice
        default: "direct"
        options:
          - direct
          - conservative
          - moderate
          - aggressive
          - turbo
      network_mode:
        description: "Provider network route: VPN-only, bounded VPN-to-direct fallback, or free/direct"
        type: choice
        default: auto
        options:
          - vpn
          - auto
          - direct
      chunk_profile:
        description: "Temporal lane chunk sizing profile"
        type: choice
        default: "standard"
        options:
          - standard
          - balanced-small
          - micro
      iteration:
        description: "Iteration number (auto-incremented on self-chain)"
        type: string
        default: "1"
      max_iterations:
        description: "Exact positive chain iteration bound recorded in the operation authority"
        type: string
        default: "64"
      backfill_endpoints:
        description: "Comma-separated endpoints to backfill (empty = all)"
        type: string
        default: ""
      backfill_patterns:
        description: "Comma-separated patterns to constrain the planned extraction lanes"
        type: string
        default: ""
      force_reextract:
        description: "Force re-extraction of done entries"
        type: boolean
        default: false
      chain_id:
        description: "Chain identifier (auto-set on fresh runs; required for artifact handoff)"
        type: string
        default: ""
      workflow_ref:
        description: "Source ref to use for redispatching chained runs"
        type: string
        default: ""
      workflow_sha:
        description: "Source commit SHA to check out for every chained iteration"
        type: string
        default: ""
      lane_manifest_json:
        description: "Small debug/manual lane manifest JSON override; large chains must use artifact handoff"
        type: string
        default: ""
      lane_manifest_run_id:
        description: "Run ID containing a lane manifest artifact for chained or manual resume runs"
        type: string
        default: ""
      lane_manifest_artifact_name:
        description: "Lane manifest artifact name to download from lane_manifest_run_id"
        type: string
        default: ""
      lane_manifest_artifact_id:
        description: "Exact committed lane-manifest artifact ID for chained handoff"
        type: string
        default: ""
      lane_manifest_artifact_digest:
        description: "Exact committed lane-manifest artifact SHA-256 for chained handoff"
        type: string
        default: ""
      resume_source_run_id:
        description: "Exact source run ID for operation=continue"
        type: string
        default: ""
      resume_source_manifest:
        description: 'Exact continue manifest binding JSON: {"run_attempt","name","id","digest"}'
        type: string
        default: ""
      retry_pipeline_failures:
        description: "Retry pipeline-failure lanes during resume-source planning"
        type: boolean
        default: true

env:
  NBADB_DATA_DIR: data/nbadb
  ACTIVE_CHAIN_ID: ${{ inputs.chain_id || github.run_id }}
  FULL_EXTRACTION_CHAIN_INPUT: ${{ inputs.chain_id }}
  FULL_EXTRACTION_EXPECTED_RUN_NAME: Full Extraction chain=${{ inputs.chain_id || github.run_id }} iteration=${{ inputs.iteration }}
  FULL_EXTRACTION_LANE_MANIFEST_ARTIFACT_DIGEST: ${{ inputs.lane_manifest_artifact_digest }}
  FULL_EXTRACTION_LANE_MANIFEST_ARTIFACT_ID: ${{ inputs.lane_manifest_artifact_id }}
  FULL_EXTRACTION_LANE_MANIFEST_ARTIFACT_NAME: ${{ inputs.lane_manifest_artifact_name }}
  FULL_EXTRACTION_LANE_MANIFEST_JSON_PRESENT: ${{ inputs.lane_manifest_json != '' }}
  FULL_EXTRACTION_LANE_MANIFEST_RUN_ID: ${{ inputs.lane_manifest_run_id }}
  FULL_EXTRACTION_RESUME_SOURCE_RUN_ID: ${{ inputs.resume_source_run_id }}
  FULL_EXTRACTION_RESUME_SOURCE_RUN_ATTEMPT: ${{ fromJSON(inputs.resume_source_manifest || '{}').run_attempt }}
  FULL_EXTRACTION_RESUME_SOURCE_MANIFEST_ARTIFACT_NAME: ${{ fromJSON(inputs.resume_source_manifest || '{}').name }}
  FULL_EXTRACTION_RESUME_SOURCE_MANIFEST_ARTIFACT_ID: ${{ fromJSON(inputs.resume_source_manifest || '{}').id }}
  FULL_EXTRACTION_RESUME_SOURCE_MANIFEST_ARTIFACT_DIGEST: ${{ fromJSON(inputs.resume_source_manifest || '{}').digest }}
  FULL_EXTRACTION_OPERATION: ${{ inputs.operation }}
  WORKFLOW_SOURCE_REF: ${{ inputs.workflow_ref || github.ref_name }}
  WORKFLOW_SOURCE_SHA: ${{ inputs.workflow_sha || github.sha }}
  FULL_EXTRACTION_CHUNK_PROFILE: ${{ inputs.chunk_profile }}
  FULL_EXTRACTION_NETWORK_MODE: ${{ inputs.network_mode }}

permissions:
  contents: read

concurrency:
  group: nbadb-full-extraction-chain
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────
#  plan → lane extract(matrix) → lane control/checkpoint → dispatch next or merge
# ─────────────────────────────────────────────────────────────────
jobs:
  workflow_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: full-extraction-attempt-${{ inputs.chain_id || github.run_id }}-${{ inputs.iteration }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.WORKFLOW_SOURCE_SHA }}

      - name: Validate full extraction attempt
        env:
          FULL_EXTRACTION_ATTEMPT_GATE_ROLE: primary
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/validate_full_extraction_attempt.py

      - name: Verify immutable workflow definition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANE_MANIFEST_ARTIFACT_DIGEST: ${{ inputs.lane_manifest_artifact_digest }}
          LANE_MANIFEST_ARTIFACT_ID: ${{ inputs.lane_manifest_artifact_id }}
          LANE_MANIFEST_ARTIFACT_NAME: ${{ inputs.lane_manifest_artifact_name }}
          LANE_MANIFEST_JSON: ${{ inputs.lane_manifest_json }}
          LANE_MANIFEST_RUN_ID: ${{ inputs.lane_manifest_run_id }}
          MAX_ITERATIONS: ${{ inputs.max_iterations }}
          NETWORK_MODE: ${{ inputs.network_mode }}
          DIRECT_PARALLELISM: ${{ inputs.direct_parallelism }}
          VPN_PARALLELISM: ${{ inputs.vpn_parallelism }}
          PUBLISH: ${{ false }}
          RETRY_PIPELINE_FAILURES: ${{ inputs.retry_pipeline_failures }}
          TARGETED_SMOKE: ${{ inputs.operation == 'targeted_smoke' }}
          OPERATION: ${{ inputs.operation }}
          OPERATION_MANIFEST_LANE_COUNT: ${{ inputs.operation_manifest_lane_count }}
          FORCE_REEXTRACT: ${{ inputs.force_reextract }}
          RESUME_SOURCE_RUN_ID: ${{ env.FULL_EXTRACTION_RESUME_SOURCE_RUN_ID }}
          RESUME_SOURCE_RUN_ATTEMPT: ${{ env.FULL_EXTRACTION_RESUME_SOURCE_RUN_ATTEMPT }}
          RESUME_SOURCE_MANIFEST_ARTIFACT_NAME: ${{ env.FULL_EXTRACTION_RESUME_SOURCE_MANIFEST_ARTIFACT_NAME }}
          RESUME_SOURCE_MANIFEST_ARTIFACT_ID: ${{ env.FULL_EXTRACTION_RESUME_SOURCE_MANIFEST_ARTIFACT_ID }}
          RESUME_SOURCE_MANIFEST_ARTIFACT_DIGEST: ${{ env.FULL_EXTRACTION_RESUME_SOURCE_MANIFEST_ARTIFACT_DIGEST }}
          WORKFLOW_DEFINITION_SHA: ${{ github.workflow_sha }}
          WORKFLOW_PATH: .github/workflows/full-extraction.yml
        run: |
          set -euo pipefail
          if ! [[ "$WORKFLOW_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::workflow_sha must resolve to a full 40-character commit SHA"
            exit 1
          fi
          if ! git check-ref-format --branch "$WORKFLOW_SOURCE_REF" >/dev/null 2>&1; then
            echo "::error::workflow_ref must name a valid branch, got '$WORKFLOW_SOURCE_REF'"
            exit 1
          fi

          source_commit="$(git rev-parse "${WORKFLOW_SOURCE_SHA}^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "${WORKFLOW_SOURCE_SHA,,}" != "$source_commit" ] || [ "$checked_out_commit" != "$source_commit" ]; then
            echo "::error::Pinned source checkout mismatch: expected $source_commit, got $checked_out_commit"
            exit 1
          fi

          trusted_branch_ref="refs/remotes/origin/trusted-workflow-source"
          git fetch --no-tags --no-recurse-submodules origin \
            "+refs/heads/${WORKFLOW_SOURCE_REF}:${trusted_branch_ref}"
          trusted_branch_commit="$(git rev-parse "${trusted_branch_ref}^{commit}")"
          if ! git merge-base --is-ancestor "$source_commit" "$trusted_branch_commit"; then
            echo "::error::workflow_sha $source_commit is not an ancestor of trusted workflow_ref branch '$WORKFLOW_SOURCE_REF' at $trusted_branch_commit"
            exit 1
          fi

          if [ "$PUBLISH" = "true" ]; then
            echo "::error::Publication is unavailable in full-extraction.yml; dispatch the exact handoff publication workflow"
            exit 1
          fi

          if ! [[ "$OPERATION" =~ ^(targeted_smoke|extract|continue)$ ]]; then
            echo "::error::operation must be exactly targeted_smoke, extract, or continue"
            exit 1
          fi
          if ! [[ "$OPERATION_MANIFEST_LANE_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::operation_manifest_lane_count must be a positive integer"
            exit 1
          fi
          if ! [[ "$MAX_ITERATIONS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::max_iterations must be an explicit positive integer"
            exit 1
          fi
          if ! [[ "$VPN_PARALLELISM" =~ ^[0-6]$ ]] || ! [[ "$DIRECT_PARALLELISM" =~ ^[0-6]$ ]]; then
            echo "::error::VPN/direct parallelism must be within the bounded 0-6/0-6 ranges"
            exit 1
          fi
          if [ "$NETWORK_MODE" != "vpn" ] && [ "$NETWORK_MODE" != "auto" ] && [ "$NETWORK_MODE" != "direct" ]; then
            echo "::error::network_mode must be exactly vpn, auto, or direct"
            exit 1
          fi
          if [ "$NETWORK_MODE" = "vpn" ] && [ "$DIRECT_PARALLELISM" != "0" ]; then
            echo "::error::network_mode=vpn requires direct_parallelism=0"
            exit 1
          fi
          if [ "$NETWORK_MODE" = "direct" ] && [ "$VPN_PARALLELISM" != "0" ]; then
            echo "::error::network_mode=direct requires vpn_parallelism=0"
            exit 1
          fi
          if [ "$NETWORK_MODE" = "direct" ] && [ "$DIRECT_PARALLELISM" = "0" ]; then
            echo "::error::network_mode=direct requires direct_parallelism>=1"
            exit 1
          fi
          if [ "$FORCE_REEXTRACT" = "true" ] && [ "$OPERATION" != "extract" ]; then
            echo "::error::force_reextract requires operation=extract"
            exit 1
          fi
          if [ "$RETRY_PIPELINE_FAILURES" = "true" ] && [ "$OPERATION" = "targeted_smoke" ]; then
            echo "::error::targeted_smoke forbids retry_pipeline_failures"
            exit 1
          fi

          resume_field_count=0
          [ -n "$RESUME_SOURCE_RUN_ID" ] && resume_field_count=$((resume_field_count + 1))
          [ -n "$RESUME_SOURCE_RUN_ATTEMPT" ] && resume_field_count=$((resume_field_count + 1))
          [ -n "$RESUME_SOURCE_MANIFEST_ARTIFACT_NAME" ] && resume_field_count=$((resume_field_count + 1))
          [ -n "$RESUME_SOURCE_MANIFEST_ARTIFACT_ID" ] && resume_field_count=$((resume_field_count + 1))
          [ -n "$RESUME_SOURCE_MANIFEST_ARTIFACT_DIGEST" ] && resume_field_count=$((resume_field_count + 1))
          if [ "$resume_field_count" -ne 0 ] && [ "$resume_field_count" -ne 5 ]; then
            echo "::error::continue requires all five exact resume source inputs together"
            exit 1
          fi
          if [ "$OPERATION" = "continue" ] && [ "$resume_field_count" -ne 5 ]; then
            echo "::error::operation=continue requires all five exact resume source inputs"
            exit 1
          fi
          if [ "$OPERATION" != "continue" ] && [ "$resume_field_count" -ne 0 ]; then
            echo "::error::resume source inputs require operation=continue"
            exit 1
          fi

          if [ "$TARGETED_SMOKE" = "true" ]; then
            if [ "$NETWORK_MODE" != "direct" ] || [ "$VPN_PARALLELISM" != "0" ] || [ "$DIRECT_PARALLELISM" != "1" ]; then
              echo "::error::targeted_smoke requires free/direct-only 0/1 lane capacity"
              exit 1
            fi
            if [ "$OPERATION_MANIFEST_LANE_COUNT" != "1" ] || [ "$MAX_ITERATIONS" != "1" ]; then
              echo "::error::targeted_smoke requires exactly one lane and one iteration"
              exit 1
            fi
            has_inline_manifest=false
            has_artifact_manifest=false
            [ -n "$LANE_MANIFEST_JSON" ] && has_inline_manifest=true
            if [ -n "$LANE_MANIFEST_RUN_ID" ] && [ -n "$LANE_MANIFEST_ARTIFACT_NAME" ]; then
              has_artifact_manifest=true
            fi
            if [ "$has_inline_manifest" != "true" ] && [ "$has_artifact_manifest" != "true" ]; then
              echo "::error::targeted_smoke requires an inline or artifact-backed manual lane manifest"
              exit 1
            fi
          fi

          has_manifest_receipt=false
          if [ -n "$LANE_MANIFEST_ARTIFACT_ID" ] || [ -n "$LANE_MANIFEST_ARTIFACT_DIGEST" ]; then
            if [ -z "$LANE_MANIFEST_ARTIFACT_ID" ] || [ -z "$LANE_MANIFEST_ARTIFACT_DIGEST" ]; then
              echo "::error::lane_manifest_artifact_id and lane_manifest_artifact_digest must be provided together"
              exit 1
            fi
            has_manifest_receipt=true
          fi
          if [ "$has_manifest_receipt" = "true" ] && { [ -z "$LANE_MANIFEST_RUN_ID" ] || [ -z "$LANE_MANIFEST_ARTIFACT_NAME" ]; }; then
            echo "::error::receipt-aware manifest handoff requires run ID, artifact name, ID, and digest"
            exit 1
          fi
          if [ "$has_manifest_receipt" = "true" ] && [ -n "$LANE_MANIFEST_JSON" ]; then
            echo "::error::receipt-aware manifest handoff cannot be combined with lane_manifest_json"
            exit 1
          fi

          source_blob="$(git rev-parse "${source_commit}:${WORKFLOW_PATH}")"
          definition_blob="$(gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW_PATH}" \
            -f "ref=${WORKFLOW_DEFINITION_SHA}" \
            --jq '.sha')"
          if [ -z "$definition_blob" ] || [ "$definition_blob" != "$source_blob" ]; then
            echo "::error::Workflow definition drift detected: ${WORKFLOW_PATH} at runtime workflow SHA ${WORKFLOW_DEFINITION_SHA} does not match workflow_source_sha ${source_commit}"
            exit 1
          fi

  plan:
    needs: workflow_guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      extract-matrix: ${{ steps.manifest.outputs.extract-matrix }}
      lane-count: ${{ steps.manifest.outputs.lane-count }}
      active-lane-count: ${{ steps.manifest.outputs.active-lane-count }}
      matrix-lane-count: ${{ steps.manifest.outputs.matrix-lane-count }}
      vpn-slot-count: ${{ steps.manifest.outputs.vpn-slot-count }}
      execution-slot-count: ${{ steps.manifest.outputs.execution-slot-count }}
      operation-authority-status: ${{ steps.manifest.outputs.operation-authority-status }}
      operation-authority-sha256: ${{ steps.manifest.outputs.operation-authority-sha256 }}
      operation-kind: ${{ steps.manifest.outputs.operation-kind }}
      free-execution-collector-status: ${{ steps.free_execution_collector_state.outputs.status }}
      free-execution-collector-authenticated: ${{ steps.free_execution_collector_state.outputs.authenticated }}
      free-execution-runtime-context-status: ${{ steps.free_execution_collector_state.outputs.runtime-context-status }}
      free-execution-storage-mutations-allowed: ${{ steps.free_execution_collector_state.outputs.storage-mutations-allowed }}
      free-execution-provider-calls-allowed: ${{ steps.free_execution_collector_state.outputs.provider-calls-allowed }}
      free-execution-mutations-authorized: ${{ steps.free_execution_collector_state.outputs.mutations-authorized }}
      deferred-lane-count: ${{ steps.manifest.outputs.deferred-lane-count }}
      vpn-quarantined-servers-json: ${{ steps.manifest.outputs.vpn-quarantined-servers-json }}
      chunk-profile: ${{ steps.manifest.outputs.chunk-profile }}
      coverage-fingerprint: ${{ steps.manifest.outputs.coverage-fingerprint }}
      assurance-admission-sha256: ${{ steps.manifest.outputs.assurance-admission-sha256 }}
      assurance-model-status: ${{ steps.manifest.outputs.assurance-model-status }}
      planned-wave-count: ${{ steps.manifest.outputs.planned-wave-count }}
      iteration-budget: ${{ steps.manifest.outputs.iteration-budget }}
      max-matrix-lanes: ${{ steps.manifest.outputs.max-matrix-lanes }}
      plan-manifest-artifact-id: ${{ steps.plan_manifest_receipt.outputs.artifact_id }}
      plan-manifest-artifact-digest: ${{ steps.plan_manifest_receipt.outputs.artifact_digest }}
      plan-manifest-artifact-name: ${{ steps.plan_manifest_receipt.outputs.artifact_name }}
      plan-manifest-artifact-size: ${{ steps.plan_manifest_receipt.outputs.artifact_size_bytes }}
      plan-manifest-artifact-archive-url: ${{ steps.plan_manifest_receipt.outputs.artifact_archive_url }}
      resume-manifest-resolution: ${{ steps.resume_source_manifest.outputs.resolution }}
      resume-manifest-artifact-id: ${{ steps.resume_source_manifest.outputs.artifact_id }}
      resume-manifest-artifact-name: ${{ steps.resume_source_manifest.outputs.artifact_name }}
      resume-manifest-artifact-digest: ${{ steps.resume_source_manifest.outputs.artifact_digest }}
      resume-manifest-artifact-size: ${{ steps.resume_source_manifest.outputs.artifact_size_bytes }}
      resume-manifest-artifact-archive-url: ${{ steps.resume_source_manifest.outputs.artifact_archive_url }}
      resume-source-run-id: ${{ steps.resume_source_manifest.outputs.source_run_id }}
      resume-source-head-sha: ${{ steps.resume_source_manifest.outputs.source_run_head_sha }}
      resume-source-run-attempt: ${{ steps.resume_source_manifest.outputs.source_run_attempt }}
      resume-source-run-status: ${{ steps.resume_source_manifest.outputs.source_run_status }}
      resume-source-run-conclusion: ${{ steps.resume_source_manifest.outputs.source_run_conclusion }}
      resume-source-workflow-id: ${{ steps.resume_source_manifest.outputs.source_workflow_id }}
      dependent-phase-state: ${{ steps.manifest.outputs.dependent-phase-state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.WORKFLOW_SOURCE_SHA }}

      - name: Validate full extraction attempt
        env:
          FULL_EXTRACTION_ATTEMPT_GATE_ROLE: partial
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/validate_full_extraction_attempt.py

      - name: Establish fail-closed free-execution collector state
        id: free_execution_collector_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/attest_free_execution_job.py collect

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - run: uv sync --locked

      - name: Fetch nba_api upstream docs and tools
        run: |
          NBA_API_VERSION="$(uv run python -c 'import importlib.metadata; print(importlib.metadata.version("nba-api"))')"
          NBA_API_REF="v${NBA_API_VERSION}"
          echo "Fetching nba_api docs/tools at ${NBA_API_REF}"
          git clone --depth=1 --filter=blob:none --branch "$NBA_API_REF" \
            https://github.com/swar/nba_api.git "$RUNNER_TEMP/nba_api-upstream"

          # The support bundle ingests the upstream docs/tools contract, not just endpoint docs.
          test -d "$RUNNER_TEMP/nba_api-upstream/docs/nba_api/stats/endpoints" || {
            echo "::error::nba_api clone is missing docs/nba_api/stats/endpoints"
            exit 1
          }
          test -d "$RUNNER_TEMP/nba_api-upstream/tools/stats" || {
            echo "::error::nba_api clone is missing tools/stats"
            exit 1
          }

      - name: Generate support bundle from nba_api docs/tools contract
        if: ${{ inputs.lane_manifest_json == '' && inputs.lane_manifest_run_id == '' && inputs.resume_source_run_id == '' }}
        run: |
          mkdir -p artifacts/endpoint-coverage
          # The historical option name points at the full upstream checkout used for
          # docs/nba_api/stats/endpoints and tools/stats contract ingestion.
          uv run nbadb extract-completeness \
            --require-full \
            --require-model-contract \
            --endpoint-analysis-docs-root "$RUNNER_TEMP/nba_api-upstream" \
            --output-dir artifacts/endpoint-coverage

          uv run python - <<'PY'
          import json
          import sys
          from pathlib import Path

          summary = json.loads(
              Path("artifacts/endpoint-coverage/endpoint-support-summary.json").read_text(
                  encoding="utf-8"
              )
          )
          gap_breakdown = {
              str(key): int(value)
              for key, value in dict(summary.get("gap_breakdown", {})).items()
              if int(value) > 0
          }
          disallowed_gap_keys = sorted(
              key for key in gap_breakdown if key != "season_type_contract_blocked"
          )

          failures: list[str] = []
          if int(summary.get("partial_endpoint_count", 0)) > 0:
              failures.append(
                  "partial endpoint contracts remain in the support matrix"
              )
          if int(summary.get("season_type_contract_untracked_count", 0)) > 0:
              failures.append(
                  "historical endpoints still lack explicit season-type tracking"
              )
          if int(summary.get("season_type_value_gap_count", 0)) > 0:
              failures.append("season-type value coverage gaps remain")
          if disallowed_gap_keys:
              failures.append(
                  "unexpected support-matrix gaps remain: "
                  + ", ".join(disallowed_gap_keys)
              )

          if failures:
              for failure in failures:
                  print(f"full extraction plan gate failed: {failure}", file=sys.stderr)
              sys.exit(1)

          blocked_count = gap_breakdown.get("season_type_contract_blocked", 0)
          print(
              "full extraction plan gate passed: "
              f"allowing {blocked_count} blocked cross-product support gaps"
          )
          PY

      - name: Validate adequacy scorecard artifacts
        if: ${{ inputs.lane_manifest_json == '' && inputs.lane_manifest_run_id == '' && inputs.resume_source_run_id == '' }}
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          summary = json.loads(
              Path("artifacts/endpoint-coverage/endpoint-adequacy-scorecard.json").read_text(
                  encoding="utf-8"
              )
          )["summary"]

          failures: list[str] = []
          if int(summary.get("coverage_gap_endpoint_count", 0)) > 0:
              failures.append("coverage gaps remain")
          if int(summary.get("contract_gap_endpoint_count", 0)) > 0:
              failures.append("contract gaps remain")
          if int(summary.get("downstream_unowned_endpoint_count", 0)) > 0:
              failures.append("unowned downstream endpoints remain")
          if int(summary.get("downstream_excluded_endpoint_count", 0)) > 0:
              failures.append("downstream exclusions remain")

          if failures:
              for failure in failures:
                  print(f"full extraction adequacy gate failed: {failure}", file=sys.stderr)
              sys.exit(1)

          print(
              "full extraction adequacy gate passed: "
              f"{summary.get('downstream_modeled_endpoint_count', 0)} modeled, "
              f"{summary.get('downstream_passthrough_only_endpoint_count', 0)} passthrough, "
              f"{summary.get('downstream_compatibility_reference_only_endpoint_count', 0)} compatibility-reference, and "
              f"{summary.get('downstream_not_applicable_endpoint_count', 0)} non-model "
              "endpoints are explicitly classified"
          )
          PY

      - name: Validate result-table contract artifacts
        if: ${{ inputs.lane_manifest_json == '' && inputs.lane_manifest_run_id == '' && inputs.resume_source_run_id == '' }}
        run: |
          uv run nbadb audit-models \
            --mode inventory \
            --strictness consistency \
            --require-result-table-contract \
            --output-dir artifacts/model-audit

      - name: Upload endpoint coverage diagnostics
        if: ${{ always() && steps.free_execution_collector_state.outputs.status == 'admitted' && steps.free_execution_collector_state.outputs.authenticated == 'true' && inputs.lane_manifest_json == '' && inputs.lane_manifest_run_id == '' && inputs.resume_source_run_id == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: full-extraction-endpoint-coverage-${{ env.ACTIVE_CHAIN_ID }}
          path: artifacts/endpoint-coverage/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

      - name: Generate deterministic pre-extraction contract assurance
        id: contract_assurance
        env:
          ASSURANCE_ROOT: artifacts/contract-assurance/pre-extraction
          ENDPOINT_ANALYSIS_DOCS_ROOT: ${{ runner.temp }}/nba_api-upstream
        run: |
          mkdir -p "$ASSURANCE_ROOT"
          uv run python - <<'PY'
          import os
          from pathlib import Path

          from nbadb.contracts.assurance import (
              generate_pre_extraction_assurance,
              validate_assurance_generation,
          )
          from nbadb.contracts.assurance_admission import (
              require_production_admissible,
          )

          root = Path(os.environ["ASSURANCE_ROOT"])
          reference = generate_pre_extraction_assurance(
              endpoint_analysis_docs_root=os.environ["ENDPOINT_ANALYSIS_DOCS_ROOT"],
              output_dir=root / "reference-generation",
          )
          generation = generate_pre_extraction_assurance(
              endpoint_analysis_docs_root=os.environ["ENDPOINT_ANALYSIS_DOCS_ROOT"],
              output_dir=root / "generation",
              expected_semantic_sha256=reference.semantic_sha256,
          )
          generation = validate_assurance_generation(generation.directory)
          admission = require_production_admissible(generation.admission)
          expected_source_sha = os.environ["WORKFLOW_SOURCE_SHA"].strip().lower()
          if admission.source_sha != expected_source_sha:
              raise SystemExit(
                  "contract assurance source SHA does not match the pinned workflow source"
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("admission-path=artifacts/contract-assurance/pre-extraction/generation/assurance-admission.json\n")
              output.write(
                  f"admission-sha256={generation.admission_sha256}\n"
              )
              output.write(f"model-status={generation.admission_status}\n")
          PY

      - name: Record authenticated free-execution collector state
        run: |
          echo "::notice::authenticated execution-context, job, runner, nonce, and operation collectors attested this plan job"

      - name: Verify exact input manifest receipt
        if: ${{ inputs.lane_manifest_artifact_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANE_MANIFEST_ARTIFACT_DIGEST: ${{ inputs.lane_manifest_artifact_digest }}
          LANE_MANIFEST_ARTIFACT_ID: ${{ inputs.lane_manifest_artifact_id }}
          LANE_MANIFEST_ARTIFACT_NAME: ${{ inputs.lane_manifest_artifact_name }}
          LANE_MANIFEST_RUN_ID: ${{ inputs.lane_manifest_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/workflow-provenance"
          python .github/scripts/workflow_source_provenance.py attest-run \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$LANE_MANIFEST_RUN_ID" \
            --source-sha "$WORKFLOW_SOURCE_SHA" \
            --trusted-branch "$WORKFLOW_SOURCE_REF" \
            --workflow-path .github/workflows/full-extraction.yml \
            --required-state active-or-completed \
            --output "$RUNNER_TEMP/workflow-provenance/lane-manifest-owner.json"
          python .github/scripts/workflow_source_provenance.py recheck-run \
            --attestation "$RUNNER_TEMP/workflow-provenance/lane-manifest-owner.json" \
            --required-state active-or-completed \
            --output "$RUNNER_TEMP/workflow-provenance/lane-manifest-owner-recheck.json"
          OWNER_RECHECK_PATH="$RUNNER_TEMP/workflow-provenance/lane-manifest-owner-recheck.json" python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          artifact_id = os.environ["LANE_MANIFEST_ARTIFACT_ID"]
          run_id = os.environ["LANE_MANIFEST_RUN_ID"]
          if re.fullmatch(r"[1-9][0-9]*", artifact_id) is None:
              raise SystemExit("lane-manifest artifact ID must be a positive integer")
          if re.fullmatch(r"[1-9][0-9]*", run_id) is None:
              raise SystemExit("lane-manifest run ID must be a positive integer")
          digest = os.environ["LANE_MANIFEST_ARTIFACT_DIGEST"].lower()
          if not digest.startswith("sha256:"):
              digest = f"sha256:{digest}"
          if re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("lane-manifest artifact digest must be a SHA-256")
          workflow_source_sha = os.environ["WORKFLOW_SOURCE_SHA"].strip().lower()
          if re.fullmatch(r"[0-9a-f]{40}", workflow_source_sha) is None:
              raise SystemExit("pinned workflow source SHA is invalid")
          owner_snapshot = json.loads(
              Path(os.environ["OWNER_RECHECK_PATH"]).read_text(encoding="utf-8")
          )
          owner_claim = (
              owner_snapshot.get("run")
              if isinstance(owner_snapshot, dict)
              else None
          )
          semantic_source = (
              owner_snapshot.get("semantic_source")
              if isinstance(owner_snapshot, dict)
              else None
          )
          workflow_claim = (
              owner_snapshot.get("workflow")
              if isinstance(owner_snapshot, dict)
              else None
          )
          expected_run_url = (
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"
          )
          if (
              not isinstance(owner_snapshot, dict)
              or type(owner_snapshot.get("schema_version")) is not int
              or owner_snapshot.get("schema_version") != 1
              or owner_snapshot.get("repository")
              != os.environ["GITHUB_REPOSITORY"]
              or not isinstance(owner_claim, dict)
              or type(owner_claim.get("id")) is not int
              or owner_claim.get("id") != int(run_id)
              or owner_claim.get("url") != expected_run_url
              or owner_claim.get("event") != "workflow_dispatch"
              or not isinstance(owner_claim.get("head_branch"), str)
              or not owner_claim.get("head_branch")
              or re.fullmatch(
                  r"[0-9a-f]{40}",
                  str(owner_claim.get("head_sha") or "").lower(),
              )
              is None
              or owner_claim.get("path")
              != ".github/workflows/full-extraction.yml"
              or type(owner_claim.get("attempt")) is not int
              or owner_claim.get("attempt") != 1
              or type(owner_claim.get("workflow_id")) is not int
              or owner_claim.get("workflow_id") < 1
              or not isinstance(semantic_source, dict)
              or str(semantic_source.get("sha") or "").lower()
              != workflow_source_sha
              or semantic_source.get("relation")
              not in {"identical", "ancestor"}
              or (semantic_source.get("relation") == "identical")
              != (
                  str(semantic_source.get("sha") or "").lower()
                  == str(owner_claim.get("head_sha") or "").lower()
              )
              or not isinstance(workflow_claim, dict)
              or workflow_claim.get("path")
              != ".github/workflows/full-extraction.yml"
              or re.fullmatch(
                  r"[0-9a-f]{40}",
                  str(workflow_claim.get("blob_sha") or "").lower(),
              )
              is None
              or re.fullmatch(
                  r"[0-9a-f]{64}",
                  str(workflow_claim.get("sha256") or "").lower(),
              )
              is None
              or type(workflow_claim.get("size_in_bytes")) is not int
              or workflow_claim.get("size_in_bytes") < 1
          ):
              raise SystemExit("lane-manifest owner recheck snapshot is invalid")
          run_raw = subprocess.check_output(
              [
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  "-H",
                  "X-GitHub-Api-Version: 2026-03-10",
                  (
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{run_id}"
                  ),
              ],
              text=True,
          )
          owner_run = json.loads(run_raw)
          owner_head_sha = str(owner_run.get("head_sha") or "").lower()
          owner_status = owner_run.get("status")
          owner_conclusion = owner_run.get("conclusion")
          owner_repository = owner_run.get("repository")
          valid_owner_state = (
              owner_status in {"queued", "in_progress"}
              and owner_conclusion is None
          ) or (
              owner_status == "completed"
              and owner_conclusion
              in {"cancelled", "failure", "success", "timed_out"}
          )
          if (
              type(owner_run.get("id")) is not int
              or str(owner_run.get("id")) != run_id
              or owner_run.get("url") != owner_claim.get("url")
              or not isinstance(owner_repository, dict)
              or owner_repository.get("full_name")
              != owner_snapshot.get("repository")
              or type(owner_run.get("run_attempt")) is not int
              or owner_run.get("run_attempt") != owner_claim.get("attempt")
              or owner_claim.get("attempt") != 1
              or owner_head_sha != str(owner_claim.get("head_sha") or "").lower()
              or not valid_owner_state
              or owner_status != owner_claim.get("status")
              or owner_conclusion != owner_claim.get("conclusion")
              or owner_run.get("event") != owner_claim.get("event")
              or owner_run.get("head_branch") != owner_claim.get("head_branch")
              or owner_run.get("path") != owner_claim.get("path")
              or type(owner_run.get("workflow_id")) is not int
              or owner_run.get("workflow_id") != owner_claim.get("workflow_id")
          ):
              raise SystemExit(
                  "lane-manifest owner run changed after provenance recheck"
              )
          raw = subprocess.check_output(
              [
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  "-H",
                  "X-GitHub-Api-Version: 2026-03-10",
                  (
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/artifacts/{artifact_id}"
                  ),
              ],
              text=True,
          )
          artifact = json.loads(raw)
          workflow_run = artifact.get("workflow_run")
          rest_artifact_id = artifact.get("id")
          size = artifact.get("size_in_bytes")
          expected_archive_url = (
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/"
              f"{artifact_id}/zip"
          )
          if (
              isinstance(rest_artifact_id, bool)
              or not isinstance(rest_artifact_id, int)
              or rest_artifact_id != int(artifact_id)
              or artifact.get("name") != os.environ["LANE_MANIFEST_ARTIFACT_NAME"]
              or artifact.get("digest") != digest
              or artifact.get("expired") is not False
              or artifact.get("archive_download_url") != expected_archive_url
              or isinstance(size, bool)
              or not isinstance(size, int)
              or size < 1
              or not isinstance(workflow_run, dict)
              or str(workflow_run.get("id") or "") != run_id
              or str(workflow_run.get("head_sha") or "").lower()
              != owner_head_sha
          ):
              raise SystemExit(
                  "lane-manifest REST identity does not match its committed receipt"
              )
          final_run_raw = subprocess.check_output(
              [
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  "-H",
                  "X-GitHub-Api-Version: 2026-03-10",
                  (
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{run_id}"
                  ),
              ],
              text=True,
          )
          if json.loads(final_run_raw) != owner_run:
              raise SystemExit(
                  "lane-manifest owner run changed after exact artifact selection"
              )
          PY

      - name: Download exact input manifest
        if: ${{ inputs.lane_manifest_artifact_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ inputs.lane_manifest_artifact_id }}
          path: ${{ runner.temp }}/lane-manifest-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.lane_manifest_run_id }}
          digest-mismatch: error

      - name: Resolve resume source committed manifest
        id: resume_source_manifest
        if: ${{ inputs.resume_source_run_id != '' }}
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_SOURCE_RUN_ID: ${{ inputs.resume_source_run_id }}
          OWNER_RECHECK_PATH: ${{ runner.temp }}/workflow-provenance/resume-source-owner-recheck.json
        run: python .github/scripts/full_extraction_handoffs.py resolve-resume-source-committed-manifest

      - name: Download exact resume source manifest
        if: ${{ steps.resume_source_manifest.outputs.resolution != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ steps.resume_source_manifest.outputs.artifact_id }}
          path: ${{ runner.temp }}/resume-source/manifest-committed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resume_source_manifest.outputs.source_run_id }}
          digest-mismatch: error

      - name: Prepare resume source manifest
        if: ${{ inputs.resume_source_run_id != '' }}
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_CHAIN_ID: ${{ inputs.chain_id }}
          RESUME_SOURCE_ARTIFACT_ARCHIVE_URL: ${{ steps.resume_source_manifest.outputs.artifact_archive_url }}
          RESUME_SOURCE_ARTIFACT_DIGEST: ${{ steps.resume_source_manifest.outputs.artifact_digest }}
          RESUME_SOURCE_ARTIFACT_ID: ${{ steps.resume_source_manifest.outputs.artifact_id }}
          RESUME_SOURCE_ARTIFACT_SIZE: ${{ steps.resume_source_manifest.outputs.artifact_size_bytes }}
          RESUME_SOURCE_MANIFEST_ARTIFACT_NAME: ${{ steps.resume_source_manifest.outputs.artifact_name }}
          RESUME_SOURCE_MANIFEST_RESOLUTION: ${{ steps.resume_source_manifest.outputs.resolution }}
          RESUME_SOURCE_RUN_ATTEMPT: ${{ steps.resume_source_manifest.outputs.source_run_attempt }}
          RESUME_SOURCE_RUN_CONCLUSION: ${{ steps.resume_source_manifest.outputs.source_run_conclusion }}
          RESUME_SOURCE_RUN_ID: ${{ inputs.resume_source_run_id }}
          RESUME_SOURCE_RUN_HEAD_SHA: ${{ steps.resume_source_manifest.outputs.source_run_head_sha }}
          RESUME_SOURCE_RUN_STATUS: ${{ steps.resume_source_manifest.outputs.source_run_status }}
          RESUME_SOURCE_WORKFLOW_ID: ${{ steps.resume_source_manifest.outputs.source_workflow_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/resume-source/manifest"
          if [ "$RESUME_SOURCE_MANIFEST_RESOLUTION" = "committed" ]; then
            mapfile -t source_manifests < <(
              find "$RUNNER_TEMP/resume-source/manifest-committed" \
                -name next-manifest.json -type f -print
            )
            source_artifact_name="$RESUME_SOURCE_MANIFEST_ARTIFACT_NAME"
          elif [ "$RESUME_SOURCE_MANIFEST_RESOLUTION" = "canonical" ]; then
            mapfile -t source_manifests < <(
              find "$RUNNER_TEMP/resume-source/manifest-committed" \
                -name manifest.json -type f -print
            )
            source_artifact_name="$RESUME_SOURCE_MANIFEST_ARTIFACT_NAME"
          else
            echo "::error::Resume source manifest resolution is unavailable"
            exit 1
          fi
          if [ "${#source_manifests[@]}" -ne 1 ]; then
            echo "::error::Resume source manifest resolution did not provide exactly one manifest"
            find "$RUNNER_TEMP/resume-source" -maxdepth 6 -type f -print || true
            exit 1
          fi
          source_manifest="${source_manifests[0]}"
          MANIFEST_PATH="$source_manifest" \
            REQUESTED_CHAIN_ID="$REQUESTED_CHAIN_ID" \
            RESUME_SOURCE_MANIFEST_RESOLUTION="$RESUME_SOURCE_MANIFEST_RESOLUTION" \
            SOURCE_ARTIFACT_NAME="$source_artifact_name" \
            SOURCE_RUN_HEAD_SHA="$RESUME_SOURCE_RUN_HEAD_SHA" \
            SOURCE_RUN_ID="$RESUME_SOURCE_RUN_ID" \
            python - <<'PY'
          # RESUME_SOURCE_MANIFEST_VERIFIER
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(
              Path(os.environ["MANIFEST_PATH"]).read_text(encoding="utf-8")
          )
          requested_chain_id = os.environ["REQUESTED_CHAIN_ID"]
          expected_source_sha = os.environ["WORKFLOW_SOURCE_SHA"].lower()
          manifest_chain_id = str(manifest.get("chain_id") or "").strip()
          manifest_source_sha = str(manifest.get("workflow_source_sha") or "").lower()
          source_run_head_sha = os.environ["SOURCE_RUN_HEAD_SHA"].lower()

          if manifest_chain_id != requested_chain_id:
              print(
                  "::error::Resume source manifest chain identity does not match "
                  f"requested chain_id {requested_chain_id!r}: "
                  f"{manifest_chain_id or '<missing>'!r}"
              )
              raise SystemExit(1)
          if manifest_source_sha != expected_source_sha:
              print(
                  "::error::Resume source manifest SHA does not match the pinned "
                  f"workflow source {expected_source_sha!r}: "
                  f"{manifest_source_sha or '<missing>'!r}"
              )
              raise SystemExit(1)
          if re.fullmatch(r"[0-9a-f]{40}", source_run_head_sha) is None:
              raise SystemExit("resume source owner run SHA is invalid")
          resolution = os.environ["RESUME_SOURCE_MANIFEST_RESOLUTION"]
          source_artifact_name = os.environ["SOURCE_ARTIFACT_NAME"]
          if resolution == "committed":
              state = manifest.get("chain_state")
              transaction = (
                  state.get("latest_checkpoint_transaction")
                  if isinstance(state, dict)
                  else None
              )
              identity = (
                  transaction.get("identity")
                  if isinstance(transaction, dict)
                  else None
              )
              receipt = (
                  transaction.get("receipt")
                  if isinstance(transaction, dict)
                  else None
              )
              if (
                  not source_artifact_name.startswith(
                      f"full-extraction-next-manifest-{requested_chain_id}-"
                  )
                  or not isinstance(transaction, dict)
                  or transaction.get("state") != "committed"
                  or not isinstance(identity, dict)
                  or str(identity.get("chain_id") or "") != requested_chain_id
                  or str(identity.get("source_sha") or "").lower()
                  != expected_source_sha
                  or not isinstance(receipt, dict)
                  or str(receipt.get("artifact_run_id") or "")
                  != os.environ["SOURCE_RUN_ID"]
              ):
                  print(
                      "::error::Resume source committed manifest does not contain "
                      "a matching committed checkpoint transaction"
                  )
                  raise SystemExit(1)
          elif (
              resolution != "canonical"
              or source_artifact_name
              != f"full-extraction-manifest-{requested_chain_id}"
          ):
              print("::error::Resume source manifest resolution is inconsistent")
              raise SystemExit(1)
          print(
              f"Verified resume source manifest for chain {requested_chain_id} "
              f"at {expected_source_sha}"
          )
          PY
          mkdir -p artifacts/full-extraction
          cp "$source_manifest" "$RUNNER_TEMP/resume-source/resolved-manifest.json"
          cp "$source_manifest" artifacts/full-extraction/resume-source-input-manifest.json
          SOURCE_MANIFEST_PATH=artifacts/full-extraction/resume-source-input-manifest.json \
            SELECTION_RECEIPT_PATH=artifacts/full-extraction/resume-source-selection.json \
            python - <<'PY'
          # RESUME_SOURCE_SELECTION_RECEIPT_BUILDER
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          def positive_integer(name: str) -> int:
              value = os.environ[name]
              if re.fullmatch(r"[1-9][0-9]*", value) is None:
                  raise SystemExit(f"{name} must be a positive integer")
              return int(value)

          source_path = Path(os.environ["SOURCE_MANIFEST_PATH"])
          source_bytes = source_path.read_bytes()
          source_manifest = json.loads(source_bytes)
          if not isinstance(source_manifest, dict):
              raise SystemExit("resume source manifest must be an object")

          resolution = os.environ["RESUME_SOURCE_MANIFEST_RESOLUTION"]
          source_name = (
              "next-manifest.json" if resolution == "committed" else "manifest.json"
          )
          if resolution not in {"committed", "canonical"}:
              raise SystemExit("resume source resolution is invalid")
          artifact_id = positive_integer("RESUME_SOURCE_ARTIFACT_ID")
          artifact_size = positive_integer("RESUME_SOURCE_ARTIFACT_SIZE")
          run_id = positive_integer("RESUME_SOURCE_RUN_ID")
          run_attempt = positive_integer("RESUME_SOURCE_RUN_ATTEMPT")
          workflow_id = positive_integer("RESUME_SOURCE_WORKFLOW_ID")
          digest = os.environ["RESUME_SOURCE_ARTIFACT_DIGEST"].lower()
          owner_head_sha = os.environ["RESUME_SOURCE_RUN_HEAD_SHA"].lower()
          workflow_source_sha = os.environ["WORKFLOW_SOURCE_SHA"].lower()
          repository = os.environ["GITHUB_REPOSITORY"]
          expected_archive_url = (
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{repository}"
              f"/actions/artifacts/{artifact_id}/zip"
          )
          if (
              re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None
              or re.fullmatch(r"[0-9a-f]{40}", owner_head_sha) is None
              or re.fullmatch(r"[0-9a-f]{40}", workflow_source_sha) is None
              or os.environ["RESUME_SOURCE_ARTIFACT_ARCHIVE_URL"]
              != expected_archive_url
              or os.environ["RESUME_SOURCE_RUN_STATUS"] != "completed"
              or os.environ["RESUME_SOURCE_RUN_CONCLUSION"]
              not in {"cancelled", "failure", "success", "timed_out"}
              or str(source_manifest.get("chain_id") or "")
              != os.environ["REQUESTED_CHAIN_ID"]
              or str(source_manifest.get("workflow_source_sha") or "").lower()
              != workflow_source_sha
          ):
              raise SystemExit("resume source selection receipt inputs are invalid")

          receipt = {
              "schema_version": 1,
              "resolution": resolution,
              "source_artifact": {
                  "archive_download_url": expected_archive_url,
                  "digest": digest,
                  "expired": False,
                  "id": artifact_id,
                  "name": os.environ["RESUME_SOURCE_MANIFEST_ARTIFACT_NAME"],
                  "size_in_bytes": artifact_size,
              },
              "source_run": {
                  "attempt": run_attempt,
                  "conclusion": os.environ["RESUME_SOURCE_RUN_CONCLUSION"],
                  "event": "workflow_dispatch",
                  "head_sha": owner_head_sha,
                  "id": run_id,
                  "path": ".github/workflows/full-extraction.yml",
                  "status": os.environ["RESUME_SOURCE_RUN_STATUS"],
                  "workflow_id": workflow_id,
              },
              "member": {
                  "bundled_name": source_path.name,
                  "sha256": hashlib.sha256(source_bytes).hexdigest(),
                  "size_in_bytes": len(source_bytes),
                  "source_name": source_name,
              },
          }
          Path(os.environ["SELECTION_RECEIPT_PATH"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create exact operation authority
        id: operation_authority
        env:
          OPERATION: ${{ inputs.operation }}
          MANIFEST_LANE_COUNT: ${{ inputs.operation_manifest_lane_count }}
          NETWORK_MODE: ${{ inputs.network_mode }}
          VPN_PARALLELISM: ${{ inputs.vpn_parallelism }}
          DIRECT_PARALLELISM: ${{ inputs.direct_parallelism }}
          MAX_ITERATIONS: ${{ inputs.max_iterations }}
          RETRY_PIPELINE_FAILURES: ${{ inputs.retry_pipeline_failures }}
          ALLOW_REEXTRACTION: ${{ inputs.force_reextract }}
          ITERATION: ${{ inputs.iteration }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          RESUME_SOURCE_MANIFEST_PATH: artifacts/full-extraction/resume-source-input-manifest.json
          RESUME_SELECTION_PATH: artifacts/full-extraction/resume-source-selection.json
        run: |
          mkdir -p artifacts/full-extraction
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          from nbadb.orchestrate.operation_authority import (
              ExactArtifactMemberV1,
              NetworkMode,
              OperationAuthorityV1,
              OperationKind,
          )

          def positive(name: str) -> int:
              raw = os.environ[name].strip()
              if re.fullmatch(r"[1-9][0-9]*", raw) is None:
                  raise SystemExit(f"{name} must be a positive integer")
              return int(raw)

          def nonnegative(name: str) -> int:
              raw = os.environ[name].strip()
              if re.fullmatch(r"0|[1-9][0-9]*", raw) is None:
                  raise SystemExit(f"{name} must be a nonnegative integer")
              return int(raw)

          operation = OperationKind(os.environ["OPERATION"])
          network_mode = NetworkMode(os.environ["NETWORK_MODE"])
          workflow_path = Path(".github/workflows/full-extraction.yml")
          if not workflow_path.is_file() or workflow_path.is_symlink():
              raise SystemExit("workflow authority must be one regular file")
          manifest_lane_count = positive("MANIFEST_LANE_COUNT")

          continuation_source = None
          if operation is OperationKind.CONTINUE:
              source_manifest_path = Path(os.environ["RESUME_SOURCE_MANIFEST_PATH"])
              selection_path = Path(os.environ["RESUME_SELECTION_PATH"])
              for path in (source_manifest_path, selection_path):
                  if not path.is_file() or path.is_symlink():
                      raise SystemExit("continue operation lacks its exact source evidence")
              source_manifest = json.loads(source_manifest_path.read_text(encoding="utf-8"))
              selection = json.loads(selection_path.read_text(encoding="utf-8"))
              artifact = selection["source_artifact"]
              run = selection["source_run"]
              member = selection["member"]
              declared = {
                  "run_id": os.environ["FULL_EXTRACTION_RESUME_SOURCE_RUN_ID"],
                  "run_attempt": os.environ["FULL_EXTRACTION_RESUME_SOURCE_RUN_ATTEMPT"],
                  "artifact_name": os.environ[
                      "FULL_EXTRACTION_RESUME_SOURCE_MANIFEST_ARTIFACT_NAME"
                  ],
                  "artifact_id": os.environ[
                      "FULL_EXTRACTION_RESUME_SOURCE_MANIFEST_ARTIFACT_ID"
                  ],
                  "artifact_digest": os.environ[
                      "FULL_EXTRACTION_RESUME_SOURCE_MANIFEST_ARTIFACT_DIGEST"
                  ].lower(),
              }
              observed = {
                  "run_id": str(run["id"]),
                  "run_attempt": str(run["attempt"]),
                  "artifact_name": str(artifact["name"]),
                  "artifact_id": str(artifact["id"]),
                  "artifact_digest": str(artifact["digest"]).lower(),
              }
              if declared != observed:
                  raise SystemExit(
                      "resume selection drifts from the exact dispatch inputs: "
                      f"declared={declared} observed={observed}"
                  )
              source_matrix_ids = source_manifest.get("matrix_lane_ids")
              active_lanes = [
                  lane
                  for lane in source_manifest.get("lanes", [])
                  if isinstance(lane, dict) and not lane.get("resume_only")
              ]
              source_lane_count = len(source_matrix_ids) if source_matrix_ids else len(active_lanes)
              if manifest_lane_count != source_lane_count:
                  raise SystemExit(
                      "operation_manifest_lane_count differs from the source manifest: "
                      f"declared={manifest_lane_count} source={source_lane_count}"
                  )
              continuation_source = ExactArtifactMemberV1(
                  repository=os.environ["GITHUB_REPOSITORY"],
                  run_id=int(run["id"]),
                  run_attempt=int(run["attempt"]),
                  artifact_id=int(artifact["id"]),
                  artifact_name=str(artifact["name"]),
                  artifact_digest=str(artifact["digest"]),
                  artifact_size_bytes=int(artifact["size_in_bytes"]),
                  member_path=str(member["source_name"]),
                  member_sha256=str(member["sha256"]),
                  member_size_bytes=int(member["size_in_bytes"]),
              )

          authority = OperationAuthorityV1(
              repository=os.environ["GITHUB_REPOSITORY"],
              workflow_path=workflow_path.as_posix(),
              workflow_content_sha256=hashlib.sha256(
                  workflow_path.read_bytes()
              ).hexdigest(),
              workflow_commit_sha=os.environ["GITHUB_SHA"].lower(),
              source_sha=os.environ["WORKFLOW_SOURCE_SHA"].lower(),
              trusted_ref=os.environ["GITHUB_REF"],
              run_id=int(os.environ["GITHUB_RUN_ID"]),
              run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
              event=os.environ["GITHUB_EVENT_NAME"],
              actor=os.environ["GITHUB_ACTOR"],
              chain_id=os.environ["CHAIN_ID"],
              iteration=positive("ITERATION"),
              operation=operation,
              requested_network_mode=network_mode,
              requested_vpn_parallelism=nonnegative("VPN_PARALLELISM"),
              requested_direct_parallelism=nonnegative("DIRECT_PARALLELISM"),
              max_iterations=positive("MAX_ITERATIONS"),
              retry_pipeline_failures=os.environ["RETRY_PIPELINE_FAILURES"] == "true",
              allow_re_extraction=os.environ["ALLOW_REEXTRACTION"] == "true",
              manifest_lane_count=manifest_lane_count,
              continuation_source=continuation_source,
          )
          output = Path("artifacts/full-extraction/operation-authority.json")
          output.write_text(
              json.dumps(authority.to_dict(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"path={output.as_posix()}\n")
              handle.write(f"digest={authority.authority_sha256}\n")
              handle.write(f"operation={authority.operation.value}\n")
              handle.write("status=validated\n")
          PY

      - name: Build lane manifest
        env:
          INPUT_LANE_MANIFEST_JSON: ${{ inputs.lane_manifest_json }}
          LANE_MANIFEST_ARTIFACT_DIGEST: ${{ inputs.lane_manifest_artifact_digest }}
          LANE_MANIFEST_ARTIFACT_ID: ${{ inputs.lane_manifest_artifact_id }}
          LANE_MANIFEST_RUN_ID: ${{ inputs.lane_manifest_run_id }}
          LANE_MANIFEST_ARTIFACT_NAME: ${{ inputs.lane_manifest_artifact_name }}
          RESUME_SOURCE_RUN_ID: ${{ inputs.resume_source_run_id }}
          REQUESTED_CHAIN_ID: ${{ inputs.chain_id }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          ASSURANCE_ADMISSION_PATH: ${{ steps.contract_assurance.outputs.admission-path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKFILL_ENDPOINTS: ${{ inputs.backfill_endpoints }}
          BACKFILL_PATTERNS: ${{ inputs.backfill_patterns }}
          CHUNK_PROFILE: ${{ env.FULL_EXTRACTION_CHUNK_PROFILE }}
          RETRY_PIPELINE_FAILURES: ${{ inputs.retry_pipeline_failures }}
          MATRIX_BATCH_SIZE: ${{ inputs.matrix_batch_size }}
          NETWORK_MODE: ${{ inputs.network_mode }}
          VPN_PARALLELISM: ${{ inputs.vpn_parallelism }}
          OPERATION_AUTHORITY_PATH: ${{ steps.operation_authority.outputs.path }}
          ITERATION: ${{ inputs.iteration }}
        run: python .github/scripts/full_extraction_handoffs.py build-lane-manifest

      - name: Inspect post-foundation dependent phase
        id: dependent_phase
        env:
          MANIFEST_PATH: artifacts/full-extraction/manifest.json
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(Path(os.environ["MANIFEST_PATH"]).read_text(encoding="utf-8"))
          dependent = manifest.get("dependent_workload")
          state = "not_requested"
          compile_required = False
          if dependent is not None:
              if not isinstance(dependent, dict):
                  raise SystemExit("dependent workload contract must be an object")
              state = str(dependent.get("state") or "")
              if state not in {"foundation_required", "planned", "complete"}:
                  raise SystemExit("dependent workload state is invalid")
              chain_state = manifest.get("chain_state")
              if not isinstance(chain_state, dict):
                  raise SystemExit("dependent workload chain state is invalid")
              transaction = chain_state.get("latest_checkpoint_transaction")
              compile_required = state == "foundation_required" and transaction is not None
              if compile_required:
                  if not isinstance(transaction, dict) or transaction.get("state") != "committed":
                      raise SystemExit("dependent foundation checkpoint is not committed")
                  receipt = transaction.get("receipt")
                  if not isinstance(receipt, dict):
                      raise SystemExit("dependent foundation checkpoint receipt is missing")
                  values = {
                      "checkpoint-run-id": receipt.get("artifact_run_id"),
                      "checkpoint-artifact-id": receipt.get("artifact_id"),
                      "checkpoint-artifact-name": receipt.get("artifact_name"),
                      "checkpoint-artifact-digest": receipt.get("artifact_digest"),
                  }
                  if (
                      re.fullmatch(r"[1-9][0-9]*", str(values["checkpoint-run-id"] or "")) is None
                      or re.fullmatch(r"[1-9][0-9]*", str(values["checkpoint-artifact-id"] or "")) is None
                      or not isinstance(values["checkpoint-artifact-name"], str)
                      or re.fullmatch(
                          r"sha256:[0-9a-f]{64}",
                          str(values["checkpoint-artifact-digest"] or "").lower(),
                      )
                      is None
                  ):
                      raise SystemExit("dependent foundation checkpoint receipt is invalid")
                  with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
                      for name, value in values.items():
                          output.write(f"{name}={value}\n")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"state={state}\n")
              output.write(f"compile-required={'true' if compile_required else 'false'}\n")
          PY

      - name: Attest dependent foundation owner
        if: ${{ steps.dependent_phase.outputs.compile-required == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOUNDATION_RUN_ID: ${{ steps.dependent_phase.outputs.checkpoint-run-id }}
        run: |
          mkdir -p "$RUNNER_TEMP/dependent-provenance"
          python .github/scripts/workflow_source_provenance.py attest-run \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$FOUNDATION_RUN_ID" \
            --source-sha "$WORKFLOW_SOURCE_SHA" \
            --trusted-branch "$WORKFLOW_SOURCE_REF" \
            --workflow-path .github/workflows/full-extraction.yml \
            --required-state completed \
            --output "$RUNNER_TEMP/dependent-provenance/foundation-owner.json"
          python .github/scripts/workflow_source_provenance.py recheck-run \
            --attestation "$RUNNER_TEMP/dependent-provenance/foundation-owner.json" \
            --required-state completed \
            --output "$RUNNER_TEMP/dependent-provenance/foundation-owner-recheck.json"

      - name: Restore exact dependent foundation authorities
        id: dependent_foundation
        if: ${{ steps.dependent_phase.outputs.compile-required == 'true' }}
        env:
          CHECKPOINT_ARTIFACT_ID: ${{ steps.dependent_phase.outputs.checkpoint-artifact-id }}
          CHECKPOINT_ARTIFACT_NAME: ${{ steps.dependent_phase.outputs.checkpoint-artifact-name }}
          CHECKPOINT_ARTIFACT_DIGEST: ${{ steps.dependent_phase.outputs.checkpoint-artifact-digest }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
        run: |
          owner="$RUNNER_TEMP/dependent-provenance/foundation-owner-recheck.json"
          checkpoint_receipt="$RUNNER_TEMP/dependent-provenance/checkpoint.json"
          discovery_receipt="$RUNNER_TEMP/dependent-provenance/discovery.json"
          discovery_name="full-extraction-discovery-artifacts-${CHAIN_ID}"
          python .github/scripts/workflow_source_provenance.py resolve-artifact \
            --attestation "$owner" \
            --artifact-name "$CHECKPOINT_ARTIFACT_NAME" \
            --poll-interval-seconds 0 \
            --output "$checkpoint_receipt"
          CHECKPOINT_RECEIPT="$checkpoint_receipt" python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ["CHECKPOINT_RECEIPT"]).read_text(encoding="utf-8"))
          if (
              str(receipt.get("id")) != os.environ["CHECKPOINT_ARTIFACT_ID"]
              or receipt.get("name") != os.environ["CHECKPOINT_ARTIFACT_NAME"]
              or str(receipt.get("digest") or "").lower()
              != os.environ["CHECKPOINT_ARTIFACT_DIGEST"].lower()
          ):
              raise SystemExit("dependent foundation checkpoint receipt changed")
          PY
          python .github/scripts/workflow_source_provenance.py download-artifact \
            --attestation "$owner" \
            --receipt "$checkpoint_receipt" \
            --output-dir "$RUNNER_TEMP/dependent-foundation/checkpoint" \
            --output "$checkpoint_receipt.downloaded.json"
          python .github/scripts/workflow_source_provenance.py resolve-artifact \
            --attestation "$owner" \
            --artifact-name "$discovery_name" \
            --poll-interval-seconds 0 \
            --output "$discovery_receipt"
          python .github/scripts/workflow_source_provenance.py download-artifact \
            --attestation "$owner" \
            --receipt "$discovery_receipt" \
            --output-dir "$RUNNER_TEMP/dependent-foundation/discovery" \
            --output "$discovery_receipt.downloaded.json"
          DISCOVERY_RECEIPT="$discovery_receipt" python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ["DISCOVERY_RECEIPT"]).read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"discovery-artifact-id={receipt['id']}\n")
              output.write(f"discovery-artifact-name={receipt['name']}\n")
              output.write(f"discovery-artifact-digest={receipt['digest']}\n")
          PY

      - name: Compile receipt-bound dependent workload
        if: ${{ steps.dependent_phase.outputs.compile-required == 'true' }}
        env:
          DISCOVERY_ARTIFACT_ID: ${{ steps.dependent_foundation.outputs.discovery-artifact-id }}
          DISCOVERY_ARTIFACT_NAME: ${{ steps.dependent_foundation.outputs.discovery-artifact-name }}
          DISCOVERY_ARTIFACT_DIGEST: ${{ steps.dependent_foundation.outputs.discovery-artifact-digest }}
          DISCOVERY_ARTIFACT_RUN_ID: ${{ steps.dependent_phase.outputs.checkpoint-run-id }}
        run: |
          mapfile -t checkpoint_databases < <(find "$RUNNER_TEMP/dependent-foundation/checkpoint" -name nba.duckdb -type f -print)
          mapfile -t checkpoint_reports < <(find "$RUNNER_TEMP/dependent-foundation/checkpoint" -name checkpoint-report.json -type f -print)
          mapfile -t discovery_roots < <(find "$RUNNER_TEMP/dependent-foundation/discovery" -type d -name nba.discovery-artifacts -print)
          if [ "${#checkpoint_databases[@]}" -ne 1 ] || [ "${#checkpoint_reports[@]}" -ne 1 ] || [ "${#discovery_roots[@]}" -ne 1 ]; then
            echo "::error::Dependent foundation artifact layout is incomplete or ambiguous"
            exit 1
          fi
          uv run python -m nbadb.orchestrate.full_extraction_control prepare-dependent-workload \
            --committed-manifest-path artifacts/full-extraction/manifest.json \
            --checkpoint-report-path "${checkpoint_reports[0]}" \
            --checkpoint-database-path "${checkpoint_databases[0]}" \
            --discovery-root "${discovery_roots[0]}" \
            --discovery-artifact-id "$DISCOVERY_ARTIFACT_ID" \
            --discovery-artifact-run-id "$DISCOVERY_ARTIFACT_RUN_ID" \
            --discovery-artifact-name "$DISCOVERY_ARTIFACT_NAME" \
            --discovery-artifact-digest "$DISCOVERY_ARTIFACT_DIGEST" \
            --output-dir artifacts/dependent-workload \
            > artifacts/full-extraction/dependent-workload.stdout.json

      - name: Upload dependent workload bundle
        id: dependent_artifact
        if: ${{ steps.dependent_phase.outputs.compile-required == 'true' && steps.operation_authority.outputs.status == 'validated' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: false
          name: full-extraction-dependent-workload-${{ env.ACTIVE_CHAIN_ID }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/dependent-workload/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Verify and activate dependent workload bundle
        if: ${{ steps.dependent_phase.outputs.compile-required == 'true' && steps.operation_authority.outputs.status == 'validated' }}
        env:
          ARTIFACT_DIGEST: ${{ steps.dependent_artifact.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.dependent_artifact.outputs.artifact-id }}
          ARTIFACT_NAME: full-extraction-dependent-workload-${{ env.ACTIVE_CHAIN_ID }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          VPN_PARALLELISM: ${{ inputs.vpn_parallelism }}
          OPERATION_AUTHORITY_PATH: ${{ steps.operation_authority.outputs.path }}
          ITERATION: ${{ inputs.iteration }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          receipt="$RUNNER_TEMP/dependent-provenance/dependent-artifact.json"
          python .github/scripts/workflow_source_provenance.py verify-current-artifact \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" \
            --trusted-branch "$WORKFLOW_SOURCE_REF" \
            --workflow-path .github/workflows/full-extraction.yml \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --output "$receipt"
          artifact_size_bytes="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["size_in_bytes"])' "$receipt")"
          uv run python -m nbadb.orchestrate.full_extraction_control activate-dependent-manifest \
            --manifest-path artifacts/full-extraction/manifest.json \
            --execution-plan-path artifacts/dependent-workload/dependent-execution-plan.json \
            --artifact-run-id "$GITHUB_RUN_ID" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --artifact-size-bytes "$artifact_size_bytes" \
            --iteration "$ITERATION" \
            --max-matrix-lanes 1 \
            --vpn-slot-count 0 \
            --output-path artifacts/full-extraction/manifest.json \
            > artifacts/full-extraction/dependent-activation.stdout.json
          uv run python -m nbadb.orchestrate.full_extraction_control plan \
            --operation-authority-path "$OPERATION_AUTHORITY_PATH" \
            --lane-manifest-path artifacts/full-extraction/manifest.json \
            --iteration "$ITERATION" \
            --max-matrix-lanes 256 \
            --vpn-slot-count "$VPN_PARALLELISM" \
            --output-path artifacts/full-extraction/manifest.json \
            > artifacts/full-extraction/dependent-free-admission.stdout.json

      - name: Finalize operation-authority-bound lane manifest
        id: manifest
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          OPERATION_AUTHORITY_PATH: ${{ steps.operation_authority.outputs.path }}
          OPERATION_AUTHORITY_SHA256: ${{ steps.operation_authority.outputs.digest }}
          CONTRACT_ASSURANCE_ADMISSION_PATH: ${{ steps.contract_assurance.outputs.admission-path }}
          CONTRACT_ASSURANCE_ADMISSION_SHA256: ${{ steps.contract_assurance.outputs.admission-sha256 }}
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from nbadb.orchestrate.operation_authority import OperationAuthorityV1

          manifest_path = Path("artifacts/full-extraction/manifest.json")
          authority_path = Path(os.environ["OPERATION_AUTHORITY_PATH"])
          if not manifest_path.is_file() or manifest_path.is_symlink():
              raise SystemExit("full-extraction manifest must be one regular file")
          if not authority_path.is_file() or authority_path.is_symlink():
              raise SystemExit("operation authority must be one regular file")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          authority_payload = json.loads(authority_path.read_text(encoding="utf-8"))
          authority = OperationAuthorityV1.from_dict(authority_payload)
          expected_source_sha = os.environ["WORKFLOW_SOURCE_SHA"].lower()
          if manifest.get("manifest_version") != 5:
              raise SystemExit("full-extraction plan must use manifest version 5")
          if str(manifest.get("chain_id") or "") != os.environ["CHAIN_ID"]:
              raise SystemExit("full-extraction plan chain identity changed after planning")
          if str(manifest.get("workflow_source_sha") or "").lower() != expected_source_sha:
              raise SystemExit("full-extraction plan source SHA changed after planning")
          if manifest.get("operation_authority") != authority_payload:
              raise SystemExit("manifest operation authority differs from the exact file")
          if manifest.get("operation_authority_sha256") != authority.authority_sha256:
              raise SystemExit("manifest operation authority digest differs")
          if authority.authority_sha256 != os.environ["OPERATION_AUTHORITY_SHA256"]:
              raise SystemExit("operation authority step digest changed after planning")
          if (
              "free_execution_admission" in manifest
              or "free_execution_intent_manifest" in manifest
          ):
              raise SystemExit("authorized manifest must not contain FreeExecution authority")
          github_matrix = manifest.get("github_matrix")
          if not isinstance(github_matrix, dict) or set(github_matrix) != {"include"}:
              raise SystemExit("manifest matrix is invalid")
          matrix_rows = github_matrix.get("include")
          if not isinstance(matrix_rows, list) or not matrix_rows:
              raise SystemExit("authorized extraction manifest requires a nonempty matrix")
          if len(matrix_rows) != authority.manifest_lane_count:
              raise SystemExit("operation authority lane count differs from the final matrix")
          if manifest.get("matrix_lane_count") != len(matrix_rows):
              raise SystemExit("manifest matrix accounting is invalid")
          if manifest.get("lane_count") != len(manifest.get("lanes", [])):
              raise SystemExit("manifest lane accounting is invalid")

          assurance_admission = manifest.get("assurance_admission")
          if (
              not isinstance(assurance_admission, dict)
              or assurance_admission.get("source_sha") != expected_source_sha
          ):
              raise SystemExit("full-extraction plan lacks its exact assurance admission")
          generated_admission_path = Path(
              os.environ["CONTRACT_ASSURANCE_ADMISSION_PATH"]
          )
          if (
              not generated_admission_path.is_file()
              or generated_admission_path.is_symlink()
          ):
              raise SystemExit(
                  "full-extraction plan lacks its current generated assurance admission"
              )
          generated_admission = json.loads(
              generated_admission_path.read_text(encoding="utf-8")
          )
          if generated_admission != assurance_admission:
              raise SystemExit(
                  "full-extraction plan assurance differs from the current generated admission"
              )
          generated_admission_sha256 = hashlib.sha256(
              json.dumps(
                  generated_admission,
                  allow_nan=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ).encode("utf-8")
          ).hexdigest()
          if generated_admission_sha256 != os.environ[
              "CONTRACT_ASSURANCE_ADMISSION_SHA256"
          ]:
              raise SystemExit(
                  "full-extraction generated assurance admission digest changed"
              )

          compact_matrix = json.dumps(github_matrix, separators=(",", ":"))
          compact_quarantined_servers = json.dumps(
              manifest.get("chain_state", {}).get("vpn_quarantined_servers", []),
              separators=(",", ":"),
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"extract-matrix={compact_matrix}\n")
              handle.write(f"lane-count={manifest['lane_count']}\n")
              handle.write(f"active-lane-count={manifest.get('active_lane_count', 0)}\n")
              handle.write(f"matrix-lane-count={manifest.get('matrix_lane_count', 0)}\n")
              handle.write(f"vpn-slot-count={manifest.get('vpn_slot_count', 0)}\n")
              handle.write(
                  f"execution-slot-count={authority.requested_vpn_parallelism + authority.requested_direct_parallelism}\n"
              )
              handle.write("operation-authority-status=validated\n")
              handle.write(
                  f"operation-authority-sha256={authority.authority_sha256}\n"
              )
              handle.write(f"operation-kind={authority.operation.value}\n")
              handle.write(f"deferred-lane-count={manifest.get('deferred_lane_count', 0)}\n")
              handle.write(f"vpn-quarantined-servers-json={compact_quarantined_servers}\n")
              handle.write(f"chunk-profile={manifest.get('chunk_profile', '')}\n")
              handle.write(f"coverage-fingerprint={manifest.get('coverage_fingerprint', '')}\n")
              handle.write(
                  "assurance-admission-sha256="
                  f"{hashlib.sha256(json.dumps(assurance_admission, allow_nan=False, separators=(',', ':'), sort_keys=True).encode('utf-8')).hexdigest()}\n"
              )
              handle.write(
                  f"assurance-model-status={assurance_admission['model_status']}\n"
              )
              handle.write(f"planned-wave-count={manifest.get('planned_wave_count', 0)}\n")
              handle.write(f"iteration-budget={manifest.get('iteration_budget', 0)}\n")
              dependent = manifest.get("dependent_workload")
              dependent_state = (
                  str(dependent.get("state") or "")
                  if isinstance(dependent, dict)
                  else "not_requested"
              )
              handle.write(f"dependent-phase-state={dependent_state}\n")
              handle.write(
                  f"plan-artifact-name=full-extraction-manifest-{os.environ['CHAIN_ID']}\n"
              )
              handle.write(
                  f"max-matrix-lanes={manifest.get('scheduler_diagnostics', {}).get('max_matrix_lanes', 0)}\n"
              )
          PY

      - name: Validate targeted smoke plan
        if: ${{ inputs.operation == 'targeted_smoke' }}
        env:
          LANE_COUNT: ${{ steps.manifest.outputs.lane-count }}
          ACTIVE_LANE_COUNT: ${{ steps.manifest.outputs.active-lane-count }}
          MATRIX_LANE_COUNT: ${{ steps.manifest.outputs.matrix-lane-count }}
          DEFERRED_LANE_COUNT: ${{ steps.manifest.outputs.deferred-lane-count }}
          VPN_SLOT_COUNT: ${{ steps.manifest.outputs.vpn-slot-count }}
          OPERATION_AUTHORITY_STATUS: ${{ steps.manifest.outputs.operation-authority-status }}
        run: |
          set -euo pipefail
          if [ "$LANE_COUNT" != "1" ] || \
             [ "$ACTIVE_LANE_COUNT" != "1" ] || \
             [ "$MATRIX_LANE_COUNT" != "1" ] || \
             [ "$DEFERRED_LANE_COUNT" != "0" ] || \
             [ "$VPN_SLOT_COUNT" != "0" ] || \
             [ "$OPERATION_AUTHORITY_STATUS" != "validated" ]; then
            echo "::error::Targeted smoke must execute one exact free/direct lane"
            exit 1
          fi
          echo "::notice::Targeted smoke admitted one diagnostic free/direct lane"

      - name: Plan summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("artifacts/full-extraction/manifest.json").read_text(encoding="utf-8"))
          lanes = manifest.get("lanes", [])
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## Lane Plan\n")
              handle.write(f"**Lane count:** {manifest.get('lane_count', 0)}\n")
              handle.write(f"**Active lanes:** {manifest.get('active_lane_count', 0)}\n")
              handle.write(f"**This wave:** {manifest.get('matrix_lane_count', 0)}\n")
              handle.write(f"**Deferred lanes:** {manifest.get('deferred_lane_count', 0)}\n")
              authority = manifest.get("operation_authority", {})
              handle.write(
                  "**Operation authority:** "
                  f"`{authority.get('operation', 'missing')}` "
                  f"digest=`{manifest.get('operation_authority_sha256', '')}`\n"
              )
              handle.write(
                  "**Provider capacity:** "
                  f"vpn={manifest.get('vpn_slot_count', 0)} "
                  f"direct={manifest.get('direct_slot_count', 0)}\n"
              )
              handle.write(f"**Chunk profile:** {manifest.get('chunk_profile', '')}\n")
              handle.write(f"**Coverage fingerprint:** `{manifest.get('coverage_fingerprint', '')}`\n")
              admission = manifest.get("assurance_admission", {})
              handle.write(
                  f"**Assurance admission:** `{admission.get('model_status', '')}`\n"
              )
              handle.write(f"**Planned waves:** {manifest.get('planned_wave_count', 0)}\n")
              handle.write(f"**Iteration budget:** {manifest.get('iteration_budget', 0)}\n")
              for lane in lanes:
                  season_range = "n/a"
                  if lane.get("season_start") is not None and lane.get("season_end") is not None:
                      season_range = f"{lane['season_start']}:{lane['season_end']}"
                  handle.write(
                      f"- `{lane['lane_id']}` ({lane['lane_kind']}) "
                      f"patterns={','.join(lane.get('patterns', [])) or 'none'} "
                      f"seasons={season_range} "
                      f"resume_only={lane.get('resume_only', False)}\n"
                  )
          PY

      - name: Upload lane manifest
        id: plan_manifest_artifact
        if: ${{ steps.manifest.outputs.operation-authority-status == 'validated' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: ${{ steps.manifest.outputs.plan-artifact-name }}
          path: |
            artifacts/full-extraction/manifest.json
            artifacts/full-extraction/manifest.stdout.json
            artifacts/full-extraction/input-manifest.json
            artifacts/full-extraction/resume-source-input-manifest.json
            artifacts/full-extraction/resume-source-manifest.json
            artifacts/full-extraction/resume-source-manifest.stdout.json
            artifacts/full-extraction/resume-source-selection.json
            artifacts/full-extraction/operation-authority.json
            artifacts/contract-assurance/pre-extraction/generation/
            artifacts/endpoint-coverage/
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 6

      - name: Verify uploaded lane manifest receipt
        id: plan_manifest_receipt
        if: ${{ steps.manifest.outputs.operation-authority-status == 'validated' }}
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          CURRENT_RUN_HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_ARTIFACT_DIGEST: ${{ steps.plan_manifest_artifact.outputs.artifact-digest }}
          PLAN_ARTIFACT_ID: ${{ steps.plan_manifest_artifact.outputs.artifact-id }}
          PLAN_ARTIFACT_NAME: ${{ steps.manifest.outputs.plan-artifact-name }}
        run: |
          python - <<'PY'
          # PLAN_MANIFEST_ARTIFACT_RECEIPT_VERIFIER
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def gh_json(path: str) -> object:
              raw = subprocess.check_output(
                  [
                      "gh",
                      "api",
                      "--method",
                      "GET",
                      "-H",
                      "Accept: application/vnd.github+json",
                      "-H",
                      "X-GitHub-Api-Version: 2026-03-10",
                      path,
                  ],
                  text=True,
              )
              return json.loads(raw)

          artifact_id_raw = os.environ["PLAN_ARTIFACT_ID"]
          if re.fullmatch(r"[1-9][0-9]*", artifact_id_raw) is None:
              raise SystemExit("uploaded plan artifact ID must be positive")
          artifact_id = int(artifact_id_raw)
          digest_hex = os.environ["PLAN_ARTIFACT_DIGEST"].lower().removeprefix(
              "sha256:"
          )
          if re.fullmatch(r"[0-9a-f]{64}", digest_hex) is None:
              raise SystemExit("uploaded plan artifact digest must be SHA-256")
          digest = f"sha256:{digest_hex}"
          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          owner_head_sha = os.environ["CURRENT_RUN_HEAD_SHA"].lower()
          source_sha = os.environ["WORKFLOW_SOURCE_SHA"].lower()
          expected_name = f"full-extraction-manifest-{os.environ['CHAIN_ID']}"
          expected_artifact_url = (
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{repository}"
              f"/actions/artifacts/{artifact_id}"
          )
          expected_archive_url = f"{expected_artifact_url}/zip"
          expected_run_url = (
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{repository}"
              f"/actions/runs/{run_id}"
          )
          if (
              os.environ["PLAN_ARTIFACT_NAME"] != expected_name
              or re.fullmatch(r"[1-9][0-9]*", run_id) is None
              or run_attempt != "1"
              or re.fullmatch(r"[0-9a-f]{40}", owner_head_sha) is None
              or re.fullmatch(r"[0-9a-f]{40}", source_sha) is None
          ):
              raise SystemExit("uploaded plan artifact receipt inputs are invalid")

          def validate_owner(raw: object) -> dict[str, object]:
              if not isinstance(raw, dict):
                  raise SystemExit("uploaded plan artifact REST owner is invalid")
              workflow_id = raw.get("workflow_id")
              owner_repository = raw.get("repository")
              if (
                  type(raw.get("id")) is not int
                  or raw.get("id") != int(run_id)
                  or raw.get("url") != expected_run_url
                  or not isinstance(owner_repository, dict)
                  or owner_repository.get("full_name") != repository
                  or raw.get("event") != "workflow_dispatch"
                  or raw.get("head_branch") != os.environ["WORKFLOW_SOURCE_REF"]
                  or raw.get("path")
                  != ".github/workflows/full-extraction.yml"
                  or str(raw.get("head_sha") or "").lower() != owner_head_sha
                  or type(raw.get("run_attempt")) is not int
                  or raw.get("run_attempt") != 1
                  or type(workflow_id) is not int
                  or workflow_id < 1
                  or raw.get("status") not in {"queued", "in_progress"}
                  or raw.get("conclusion") is not None
              ):
                  raise SystemExit("uploaded plan artifact REST owner is invalid")
              return raw

          owner_run = validate_owner(
              gh_json(f"/repos/{repository}/actions/runs/{run_id}")
          )
          artifact = gh_json(f"/repos/{repository}/actions/artifacts/{artifact_id}")
          if not isinstance(artifact, dict):
              raise SystemExit("uploaded plan artifact REST provenance is invalid")
          rest_id = artifact.get("id")
          rest_size = artifact.get("size_in_bytes")
          workflow_run = artifact.get("workflow_run")
          if (
              isinstance(rest_id, bool)
              or not isinstance(rest_id, int)
              or rest_id != artifact_id
              or artifact.get("url") != expected_artifact_url
              or artifact.get("archive_download_url") != expected_archive_url
              or artifact.get("name") != expected_name
              or str(artifact.get("digest") or "").lower() != digest
              or isinstance(rest_size, bool)
              or not isinstance(rest_size, int)
              or rest_size < 1
              or artifact.get("expired") is not False
              or not isinstance(workflow_run, dict)
              or type(workflow_run.get("id")) is not int
              or workflow_run.get("id") != int(run_id)
              or str(workflow_run.get("head_sha") or "").lower() != owner_head_sha
          ):
              raise SystemExit(
                  "uploaded plan artifact REST identity does not match its upload receipt"
              )
          final_owner_run = validate_owner(
              gh_json(f"/repos/{repository}/actions/runs/{run_id}")
          )
          if final_owner_run != owner_run:
              raise SystemExit(
                  "uploaded plan artifact owner changed after exact artifact selection"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"artifact_archive_url={expected_archive_url}\n")
              handle.write(f"artifact_digest={digest}\n")
              handle.write(f"artifact_id={artifact_id}\n")
              handle.write(f"artifact_name={expected_name}\n")
              handle.write(f"artifact_size_bytes={rest_size}\n")
          PY

  free_execution_blocked:
    needs: plan
    if: ${{ always() && needs.plan.result == 'success' && (needs.plan.outputs.operation-authority-status != 'validated' || needs.plan.outputs.free-execution-collector-status != 'admitted' || needs.plan.outputs.free-execution-collector-authenticated != 'true' || needs.plan.outputs.free-execution-runtime-context-status != 'authenticated' || needs.plan.outputs.free-execution-storage-mutations-allowed != 'true' || needs.plan.outputs.free-execution-provider-calls-allowed != 'true' || needs.plan.outputs.free-execution-mutations-authorized != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Stop before provider execution
        env:
          ADMISSION_STATUS: ${{ needs.plan.outputs.operation-authority-status }}
          BLOCKER_CODES: ${{ needs.plan.outputs.free-execution-collector-status }}
        run: |
          echo "::error::Full extraction is not authentically admitted for provider or persistent-storage mutation: status='${ADMISSION_STATUS:-<missing>}' blockers='${BLOCKER_CODES:-<missing>}'"
          exit 1

  publication_preflight:
    needs: [workflow_guard, plan]
    if: ${{ false && needs.plan.result == 'success' && needs.plan.outputs.operation-authority-status == 'validated' && needs.plan.outputs.free-execution-collector-status == 'admitted' && needs.plan.outputs.free-execution-collector-authenticated == 'true' && needs.plan.outputs.free-execution-runtime-context-status == 'authenticated' && needs.plan.outputs.free-execution-storage-mutations-allowed == 'true' && needs.plan.outputs.free-execution-provider-calls-allowed == 'true' && needs.plan.outputs.free-execution-mutations-authorized == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.WORKFLOW_SOURCE_SHA }}

      - name: Validate full extraction attempt
        env:
          FULL_EXTRACTION_ATTEMPT_GATE_ROLE: partial
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/validate_full_extraction_attempt.py

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - run: uv sync --locked

      - name: Fail fast on Kaggle publication readiness
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          WORKFLOW_SOURCE_REF: ${{ env.WORKFLOW_SOURCE_REF }}
        run: |
          set -euo pipefail
          if [ "$EVENT_REF_NAME" != "$DEFAULT_BRANCH" ] || [ "$WORKFLOW_SOURCE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error::publish=true requires the default branch '$DEFAULT_BRANCH'; event_ref='$EVENT_REF_NAME' workflow_source_ref='$WORKFLOW_SOURCE_REF'"
            exit 1
          fi
          if [ -z "${KAGGLE_USERNAME:-}" ] || [ -z "${KAGGLE_KEY:-}" ]; then
            echo "::error::KAGGLE_USERNAME and KAGGLE_KEY are required when publish=true"
            exit 1
          fi
          uv run python - <<'PY'
          from nbadb.kaggle.client import KaggleClient

          try:
              result = KaggleClient().publication_preflight()
          except Exception as exc:
              print(
                  "::error::Kaggle publication preflight failed "
                  f"({type(exc).__name__})"
              )
              raise SystemExit(1) from None
          if result.get("acceptable") is not True:
              raise SystemExit("Kaggle publication preflight was not acceptable")
          version = result.get("version")
          if isinstance(version, bool) or not isinstance(version, int) or version <= 0:
              raise SystemExit("Kaggle publication preflight did not resolve an exact version")
          print(f"Kaggle publication preflight passed at exact remote version {version}")
          PY

  preflight:
    needs: [plan, publication_preflight]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.operation-authority-status == 'validated' && needs.plan.outputs.free-execution-collector-status == 'admitted' && needs.plan.outputs.free-execution-collector-authenticated == 'true' && needs.plan.outputs.free-execution-runtime-context-status == 'authenticated' && needs.plan.outputs.free-execution-storage-mutations-allowed == 'true' && needs.plan.outputs.free-execution-provider-calls-allowed == 'true' && needs.plan.outputs.free-execution-mutations-authorized == 'true' && needs.plan.outputs.matrix-lane-count != '0' && (!false || needs.publication_preflight.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      effective-network-mode: ${{ steps.network_mode.outputs.effective-network-mode }}
      vpn-auth-source: ${{ steps.vpn.outputs.auth-source }}
      vpn-server: ${{ steps.vpn.outputs.server }}
      vpn-quarantined-servers-json: ${{ steps.vpn_quarantine.outputs.vpn-quarantined-servers-json }}
      vpn-capacity-required: ${{ steps.vpn_capacity.outputs.required }}
      vpn-capacity-count: ${{ steps.vpn_capacity.outputs.capacity-count }}
      vpn-capacity-matrix: ${{ steps.vpn_capacity.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.WORKFLOW_SOURCE_SHA }}

      - name: Validate full extraction attempt
        env:
          FULL_EXTRACTION_ATTEMPT_GATE_ROLE: partial
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/validate_full_extraction_attempt.py

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - run: uv sync --locked

      - name: Validate VPN credentials are present
        if: ${{ inputs.network_mode != 'direct' }}
        env:
          OPENVPN_USER: ${{ secrets.OPENVPN_USER }}
          OPENVPN_PASSWORD: ${{ secrets.OPENVPN_PASSWORD }}
          NORDVPN_TOKEN: ${{ secrets.NORDVPN_TOKEN }}
        run: |
          if [ -n "$OPENVPN_USER" ] || [ -n "$OPENVPN_PASSWORD" ]; then
            if [ -z "$OPENVPN_USER" ] || [ -z "$OPENVPN_PASSWORD" ]; then
              echo "::error::OPENVPN_USER and OPENVPN_PASSWORD must both be set when using direct OpenVPN credentials"
              exit 1
            fi
            exit 0
          fi
          if [ -z "$NORDVPN_TOKEN" ]; then
            echo "::error::Provide OPENVPN_USER/OPENVPN_PASSWORD or NORDVPN_TOKEN before running full extraction"
            exit 1
          fi

      - name: Download lane manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: full-extraction-manifest-${{ env.ACTIVE_CHAIN_ID }}
          path: plan-artifact/

      - name: Validate planned lanes
        run: |
          mkdir -p artifacts/full-extraction
          manifest_path="$(find plan-artifact -name manifest.json -type f -print -quit)"
          if [ -z "$manifest_path" ]; then
            echo "::error::Plan artifact did not contain manifest.json"
            find plan-artifact -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$manifest_path" artifacts/full-extraction/preflight-manifest.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          from nbadb.orchestrate.full_extraction_control import normalize_manifest, validate_manifest

          raw_manifest = json.loads(
              Path("artifacts/full-extraction/preflight-manifest.json").read_text(encoding="utf-8")
          )
          manifest = normalize_manifest(raw_manifest)
          validate_manifest(list(manifest.lanes))
          PY

      - name: Preflight VPN validation
        id: vpn
        if: ${{ inputs.network_mode != 'direct' }}
        timeout-minutes: 8
        continue-on-error: true
        env:
          OPENVPN_USER: ${{ secrets.OPENVPN_USER }}
          OPENVPN_PASSWORD: ${{ secrets.OPENVPN_PASSWORD }}
          NORDVPN_TOKEN: ${{ secrets.NORDVPN_TOKEN }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_LIMIT: "4"
          SERVER_POOL_SIZE: "96"
          # Preflight is a single selector, so retain Nord's ranked recommendations.
          # Parallel discovery/capacity/extract selectors use stable hash partitions.
          PRESERVE_RECOMMENDATION_RANK: "true"
          FALLBACK_TECHNOLOGY: "openvpn_tcp"
          CONNECT_TIMEOUT_SECONDS: "60"
          OVERALL_TIMEOUT_SECONDS: "300"
          QUARANTINED_SERVERS_JSON: ${{ needs.plan.outputs.vpn-quarantined-servers-json }}
        run: |
          export LANE_INDEX=$((RUN_ATTEMPT - 1))
          set +e
          bash .github/scripts/run_with_deadline.sh \
            450 \
            10 \
            python3 .github/actions/nordvpn-connect/supervise.py
          rc=$?
          exit "$rc"

      - name: Build redacted preflight VPN diagnostics
        if: ${{ always() && inputs.network_mode != 'direct' }}
        env:
          VPN_STATUS: ${{ steps.vpn.outputs.status }}
          VPN_AUTH_SOURCE: ${{ steps.vpn.outputs.auth-source }}
          VPN_SERVER: ${{ steps.vpn.outputs.server }}
          VPN_EXIT_IP: ${{ steps.vpn.outputs.exit-ip }}
          NBA_PROBE_STATUS: ${{ steps.vpn.outputs.nba-probe-status }}
          NBA_PROBE_DIAGNOSTIC: ${{ steps.vpn.outputs.nba-probe-diagnostic }}
          ATTEMPTED_SERVERS_JSON: ${{ steps.vpn.outputs.attempted-servers-json }}
          FAILED_SERVERS_JSON: ${{ steps.vpn.outputs.failed-servers-json }}
        run: |
          mkdir -p artifacts/full-extraction/preflight-vpn-diagnostics
          python3 - <<'PY'
          # PREFLIGHT_VPN_DIAGNOSTICS
          import json
          import os
          from pathlib import Path

          def server_list(name: str) -> list[str]:
              raw = os.environ.get(name, "") or "[]"
              try:
                  values = json.loads(raw)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"{name} is not valid JSON: {exc}") from exc
              if not isinstance(values, list):
                  raise SystemExit(f"{name} must be a JSON array")
              return [str(value).strip() for value in values if str(value).strip()]

          payload = {
              "schema_version": 1,
              "status": os.environ.get("VPN_STATUS", "") or "unknown",
              "auth_source": os.environ.get("VPN_AUTH_SOURCE", ""),
              "server": os.environ.get("VPN_SERVER", ""),
              "exit_ip": os.environ.get("VPN_EXIT_IP", ""),
              "nba_probe_status": os.environ.get("NBA_PROBE_STATUS", "") or "unknown",
              "nba_probe_diagnostic": os.environ.get("NBA_PROBE_DIAGNOSTIC", ""),
              "attempted_servers": server_list("ATTEMPTED_SERVERS_JSON"),
              "failed_servers": server_list("FAILED_SERVERS_JSON"),
          }
          Path(
              "artifacts/full-extraction/preflight-vpn-diagnostics/summary.json"
          ).write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload redacted preflight VPN diagnostics
        if: ${{ always() && inputs.network_mode != 'direct' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: full-extraction-preflight-vpn-diagnostics-${{ env.ACTIVE_CHAIN_ID }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/full-extraction/preflight-vpn-diagnostics/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Resolve effective network mode
        id: network_mode
        if: always()
        env:
          REQUESTED_NETWORK_MODE: ${{ inputs.network_mode }}
          VPN_STATUS: ${{ steps.vpn.outputs.status }}
          VPN_AUTH_SOURCE: ${{ steps.vpn.outputs.auth-source }}
          VPN_SERVER: ${{ steps.vpn.outputs.server }}
          VPN_EXIT_IP: ${{ steps.vpn.outputs.exit-ip }}
        run: |
          requested="${REQUESTED_NETWORK_MODE:-vpn}"
          status="${VPN_STATUS:-unknown}"
          auth_source="${VPN_AUTH_SOURCE:-}"
          effective="$requested"

          if [ "$status" = "connected" ]; then
            case "$auth_source" in
              configured|token) ;;
              *)
                echo "::error::VPN connected without a valid credential-source attestation"
                exit 1
                ;;
            esac
            if [ -z "${VPN_SERVER:-}" ] || [ -z "${VPN_EXIT_IP:-}" ]; then
              echo "::error::VPN connected without complete server and exit-IP attestations"
              exit 1
            fi
          fi

          if [ "$requested" = "direct" ]; then
            effective="direct"
            echo "::notice::Skipping VPN preflight; direct no-VPN extraction requested"
          elif [ "$requested" = "auto" ]; then
            if [ "$status" = "connected" ]; then
              effective="vpn"
              echo "::notice::Preflight VPN validation connected via ${VPN_SERVER:-unknown} (${VPN_EXIT_IP:-unknown}); using VPN extraction"
            else
              effective="direct"
              echo "::warning::Preflight VPN validation returned ${status}; falling back to direct no-VPN extraction"
            fi
          elif [ "$requested" = "vpn" ]; then
            effective="vpn"
            if [ "$status" = "connected" ]; then
              echo "::notice::Preflight VPN validation connected via ${VPN_SERVER:-unknown} (${VPN_EXIT_IP:-unknown})"
            else
              echo "::error::Preflight VPN validation returned ${status}; refusing requested VPN extraction"
              exit 1
            fi
          else
            echo "::error::Unsupported network_mode: $requested"
            exit 1
          fi

          {
            echo "effective-network-mode=$effective"
          } >> "$GITHUB_OUTPUT"

      - name: Carry preflight VPN failures into the chain quarantine
        id: vpn_quarantine
        if: always()
        env:
          CHAIN_QUARANTINE_JSON: ${{ needs.plan.outputs.vpn-quarantined-servers-json }}
          PREFLIGHT_FAILED_JSON: ${{ steps.vpn.outputs.failed-servers-json }}
        run: |
          python3 - <<'PY'
          # PREFLIGHT_VPN_QUARANTINE
          import json
          import os
          from pathlib import Path

          combined: list[str] = []
          for name in ("CHAIN_QUARANTINE_JSON", "PREFLIGHT_FAILED_JSON"):
              raw = os.environ.get(name, "") or "[]"
              try:
                  values = json.loads(raw)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"{name} is not valid JSON: {exc}") from exc
              if not isinstance(values, list):
                  raise SystemExit(f"{name} must be a JSON array")
              for value in values:
                  server = str(value).strip()
                  if server and server not in combined:
                      combined.append(server)

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(
                  "vpn-quarantined-servers-json="
                  + json.dumps(combined, separators=(",", ":"))
                  + "\n"
              )
          PY

      - name: Build concurrent VPN capacity gate
        id: vpn_capacity
        if: always()
        env:
          EFFECTIVE_NETWORK_MODE: ${{ steps.network_mode.outputs.effective-network-mode }}
          MATRIX_LANE_COUNT: ${{ needs.plan.outputs.matrix-lane-count }}
          ACTIVE_LANE_COUNT: ${{ needs.plan.outputs.active-lane-count }}
          REQUESTED_VPN_PARALLELISM: ${{ inputs.vpn_parallelism }}
          VPN_AUTH_SOURCE: ${{ steps.vpn.outputs.auth-source }}
        run: |
          python3 - <<'PY'
          # VPN_CAPACITY_MATRIX
          import json
          import os
          from pathlib import Path

          requested = int(os.environ["REQUESTED_VPN_PARALLELISM"])
          matrix_lane_count = int(os.environ["MATRIX_LANE_COUNT"])
          active_lane_count = int(os.environ["ACTIVE_LANE_COUNT"])
          effective_mode = os.environ.get("EFFECTIVE_NETWORK_MODE", "")
          auth_source = os.environ.get("VPN_AUTH_SOURCE", "")

          manifest = json.loads(
              Path("artifacts/full-extraction/preflight-manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          github_matrix = manifest.get("github_matrix")
          if not isinstance(github_matrix, dict):
              raise SystemExit("preflight manifest github_matrix must be an object")
          include = github_matrix.get("include")
          if not isinstance(include, list):
              raise SystemExit("preflight manifest github_matrix.include must be a list")
          if len(include) != matrix_lane_count:
              raise SystemExit(
                  "preflight matrix lane count does not match github_matrix.include: "
                  f"declared={matrix_lane_count}, observed={len(include)}"
              )
          if any(not isinstance(lane, dict) for lane in include):
              raise SystemExit("preflight manifest matrix entries must be objects")
          resume_only_values = [lane.get("resume_only", False) for lane in include]
          if any(type(value) is not bool for value in resume_only_values):
              raise SystemExit(
                  "preflight manifest matrix resume_only values must be exact booleans"
              )
          active_matrix_lanes = sum(not value for value in resume_only_values)
          if active_lane_count > 0 and matrix_lane_count > 0 and active_matrix_lanes == 0:
              raise SystemExit(
                  "active extraction lanes exist but this matrix contains no executable lanes"
              )
          capacity = min(requested, active_matrix_lanes)
          required = effective_mode == "vpn" and auth_source == "configured" and capacity > 0
          fresh_slot_count = max(capacity - 1, 0) if required else 0
          capacity_matrix = {
              "include": [
                  {
                      "lane_index": lane_index,
                      "expected_capacity": capacity if required else 0,
                      "server_limit": 1 if lane_index == 0 else 6,
                      "auth_recovery_rounds": 0 if lane_index == 0 else 1,
                      "fallback_technology": "" if lane_index == 0 else "openvpn_tcp",
                      "preferred_only": lane_index == 0,
                      "preserve_recommendation_rank": (
                          lane_index > 0 and fresh_slot_count == 1
                      ),
                      "recommendation_slot_count": (
                          0 if lane_index == 0 else fresh_slot_count
                      ),
                      "recommendation_slot_index": max(lane_index - 1, 0),
                  }
                  for lane_index in range(capacity if required else 1)
              ]
          }

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"required={str(required).lower()}\n")
              handle.write(f"capacity-count={capacity if required else 0}\n")
              handle.write(
                  "matrix="
                  + json.dumps(capacity_matrix, separators=(",", ":"))
                  + "\n"
              )
          print(
              "Concurrent VPN capacity gate: "
              f"required={str(required).lower()}, lanes={capacity if required else 0}, "
              f"fresh_slots={fresh_slot_count}, active_matrix_lanes={active_matrix_lanes}"
          )
          PY

      - name: Summarize preflight network mode
        if: always()
        env:
          EFFECTIVE_NETWORK_MODE: ${{ steps.network_mode.outputs.effective-network-mode }}
          REQUESTED_NETWORK_MODE: ${{ inputs.network_mode }}
          VPN_AUTH_SOURCE: ${{ steps.vpn.outputs.auth-source }}
        run: |
          {
            echo "## Network Preflight"
            echo "**Requested network mode:** ${REQUESTED_NETWORK_MODE:-vpn}"
            echo "**Effective network mode:** ${EFFECTIVE_NETWORK_MODE:-vpn}"
            if [ "${EFFECTIVE_NETWORK_MODE:-vpn}" = "vpn" ]; then
              echo "**Validated VPN credential source:** ${VPN_AUTH_SOURCE:-unknown}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disconnect preflight VPN
        if: ${{ always() && inputs.network_mode != 'direct' }}
        uses: ./.github/actions/nordvpn-disconnect
        with:
          pid: ${{ steps.vpn.outputs.pid }}
          pid-file: ${{ steps.vpn.outputs.pid-file }}
          work-dir: ${{ steps.vpn.outputs.work-dir }}

  discovery_seed:
    needs: [plan, preflight]
    if: ${{ always() && !cancelled() && needs.plan.outputs.operation-authority-status == 'validated' && needs.plan.outputs.free-execution-collector-status == 'admitted' && needs.plan.outputs.free-execution-collector-authenticated == 'true' && needs.plan.outputs.free-execution-runtime-context-status == 'authenticated' && needs.plan.outputs.free-execution-storage-mutations-allowed == 'true' && needs.plan.outputs.free-execution-provider-calls-allowed == 'true' && needs.plan.outputs.free-execution-mutations-authorized == 'true' && needs.plan.outputs.matrix-lane-count != '0' && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    outputs:
      vpn-server: ${{ steps.vpn.outputs.server }}
      vpn-failed-servers-json: ${{ steps.vpn.outputs.failed-servers-json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.WORKFLOW_SOURCE_SHA }}

      - name: Validate full extraction attempt
        env:
          FULL_EXTRACTION_ATTEMPT_GATE_ROLE: partial
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/validate_full_extraction_attempt.py

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - run: uv sync --locked

      - name: Download lane manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: full-extraction-manifest-${{ env.ACTIVE_CHAIN_ID }}
          path: plan-artifact/

      - name: Resolve prior discovery artifact receipt
        id: prior_discovery
        if: ${{ inputs.lane_manifest_run_id != '' || inputs.resume_source_run_id != '' }}
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          DISCOVERY_ARTIFACT_NAME: full-extraction-discovery-artifacts-${{ env.ACTIVE_CHAIN_ID }}
          DISCOVERY_RECOVERY_PREFIX: full-extraction-discovery-recovery-${{ env.ACTIVE_CHAIN_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST_SOURCE_RUN_ID: ${{ inputs.lane_manifest_run_id || inputs.resume_source_run_id }}
          OWNER_RECHECK_PATH: ${{ runner.temp }}/workflow-provenance/discovery-source-owner-recheck.json
        run: python .github/scripts/full_extraction_handoffs.py resolve-prior-discovery-artifact-receipt

      - name: Download exact prior discovery artifact
        if: ${{ inputs.lane_manifest_run_id != '' || inputs.resume_source_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ steps.prior_discovery.outputs.artifact_id }}
          path: prior-discovery/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.prior_discovery.outputs.source_run_id }}
          digest-mismatch: error

      - name: Restore prior discovery artifacts
        if: ${{ inputs.lane_manifest_run_id != '' || inputs.resume_source_run_id != '' }}
        env:
          DISCOVERY_SOURCE_KIND: ${{ steps.prior_discovery.outputs.source_kind }}
        run: |
          mkdir -p data/nbadb
          discovery_source="prior-discovery"
          discovery_source_kind="$DISCOVERY_SOURCE_KIND"
          if [ "$discovery_source_kind" != "canonical" ] \
            && [ "$discovery_source_kind" != "recovery" ]; then
            echo "::error::Resolved discovery source kind is invalid"
            exit 1
          fi
          if find "$discovery_source" plan-artifact -type l -print -quit | grep -q .; then
            echo "::error::Discovery restore rejects symbolic links"
            exit 1
          fi

          mapfile -t restored_manifests < <(
            find "$discovery_source" -type f -name discovery-manifest.json -print
          )
          mapfile -t active_manifests < <(
            find plan-artifact -type f -name manifest.json -print
          )
          mapfile -t artifact_dirs < <(
            find "$discovery_source" -type d -name nba.discovery-artifacts -print
          )
          mapfile -t discovery_summaries < <(
            find "$discovery_source" -type f -name discovery-seed-summary.json -print
          )
          mapfile -t workload_manifests < <(
            find "$discovery_source" \
              -type f \
              -name nba.player-team-season-workload.player-team-season-workload.json \
              -print
          )
          mapfile -t workload_parquets < <(
            find "$discovery_source" \
              -type f \
              -name 'nba.player-team-season-workload*.parquet' \
              -print
          )
          if [ "${#restored_manifests[@]}" -ne 1 ]; then
            echo "::error::Discovery restore source manifest layout is ambiguous"
            exit 1
          fi
          if [ "${#active_manifests[@]}" -ne 1 ]; then
            echo "::error::Discovery restore requires exactly one active lane manifest"
            exit 1
          fi
          if [ "${#artifact_dirs[@]}" -gt 1 ] \
            || [ "${#discovery_summaries[@]}" -gt 1 ] \
            || [ "${#workload_manifests[@]}" -gt 1 ] \
            || [ "${#workload_parquets[@]}" -gt 1 ]; then
            echo "::error::Discovery restore artifact layout is ambiguous"
            exit 1
          fi
          declare -A restored_basenames=()
          while IFS= read -r restored_file; do
            restored_basename="$(basename "$restored_file")"
            if [ -n "${restored_basenames[$restored_basename]:-}" ]; then
              echo "::error::Discovery restore contains duplicate file basenames"
              exit 1
            fi
            restored_basenames["$restored_basename"]="$restored_file"
          done < <(
            find "$discovery_source" \
              -type d \
              -name nba.discovery-artifacts \
              -prune \
              -o \
              -type f \
              -print
          )
          if [ "$discovery_source_kind" = "canonical" ] \
            && { [ "${#artifact_dirs[@]}" -ne 1 ] \
              || [ "${#discovery_summaries[@]}" -ne 1 ] \
              || [ "${#workload_manifests[@]}" -ne 1 ] \
              || [ "${#workload_parquets[@]}" -ne 1 ]; }; then
            echo "::error::Canonical discovery bundle layout is incomplete"
            exit 1
          fi
          RESTORED_MANIFEST_PATH="${restored_manifests[0]}" \
            ACTIVE_MANIFEST_PATH="${active_manifests[0]}" \
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          restored = json.loads(
              Path(os.environ["RESTORED_MANIFEST_PATH"]).read_text(encoding="utf-8")
          )
          active = json.loads(
              Path(os.environ["ACTIVE_MANIFEST_PATH"]).read_text(encoding="utf-8")
          )
          if not isinstance(restored, dict) or not isinstance(active, dict):
              raise SystemExit("discovery restore manifests must be objects")
          for field in ("chain_id", "workflow_source_sha", "coverage_fingerprint"):
              restored_value = str(restored.get(field) or "").strip().lower()
              active_value = str(active.get(field) or "").strip().lower()
              if not restored_value or restored_value != active_value:
                  raise SystemExit(
                      f"restored discovery manifest {field} does not match the active plan"
                  )
          PY

          if [ "${#artifact_dirs[@]}" -eq 1 ]; then
            rm -rf data/nbadb/nba.discovery-artifacts
            cp -R "${artifact_dirs[0]}" data/nbadb/nba.discovery-artifacts
          fi

          find data/nbadb \
            -maxdepth 1 \
            -type f \
            -name 'nba.player-team-season-workload*.parquet' \
            -delete
          rm -f data/nbadb/nba.player-team-season-workload.player-team-season-workload.json
          if [ "${#workload_manifests[@]}" -eq 1 ] \
            && [ "${#workload_parquets[@]}" -eq 1 ]; then
            cp "${workload_parquets[0]}" \
              "data/nbadb/$(basename "${workload_parquets[0]}")"
            cp "${workload_manifests[0]}" \
              data/nbadb/nba.player-team-season-workload.player-team-season-workload.json
          elif [ "${#workload_parquets[@]}" -eq 1 ] \
            || [ "${#workload_manifests[@]}" -eq 1 ]; then
            if [ "$discovery_source_kind" = "canonical" ]; then
              echo "::error::Canonical discovery workload bundle is incomplete"
              exit 1
            fi
            echo "::warning::Prior player/team workload artifact is incomplete; ignoring it"
          elif [ "$discovery_source_kind" = "canonical" ]; then
            echo "::error::Canonical discovery workload bundle is missing"
            exit 1
          fi

          if [ -f data/nbadb/nba.player-team-season-workload.player-team-season-workload.json ]; then
            if ! uv run python - <<'PY'
          from pathlib import Path

          from nbadb.orchestrate.workload_contract import PlayerTeamSeasonWorkloadStore

          store = PlayerTeamSeasonWorkloadStore.from_duckdb_path(Path("data/nbadb/nba.duckdb"))
          if store.integrity_attestation() is None:
              raise SystemExit("restored workload pointer or generation failed integrity validation")
          PY
            then
              if [ "$discovery_source_kind" = "canonical" ]; then
                echo "::error::Canonical discovery workload failed integrity validation"
                exit 1
              fi
              echo "::warning::Discarding invalid recovery workload state before reseeding"
              find data/nbadb \
                -maxdepth 1 \
                -type f \
                -name 'nba.player-team-season-workload*.parquet' \
                -delete
              rm -f data/nbadb/nba.player-team-season-workload.player-team-season-workload.json
            fi
          fi

      - name: Configure discovery seed concurrency
        env:
          EFFECTIVE_NETWORK_MODE: ${{ needs.preflight.outputs.effective-network-mode }}
          SEED_REQUEST_PROFILE: ${{ inputs.concurrency }}
          DIRECT_REQUEST_PROFILE: ${{ inputs.direct_request_profile }}
        run: |
          if [ "$EFFECTIVE_NETWORK_MODE" = "direct" ]; then
            case "${DIRECT_REQUEST_PROFILE:-direct}" in
              turbo)
                seed_concurrency=8
                seed_rate_limit=6
                ;;
              aggressive)
                seed_concurrency=6
                seed_rate_limit=5
                ;;
              moderate)
                seed_concurrency=4
                seed_rate_limit=4
                ;;
              direct|conservative)
                seed_concurrency=2
                seed_rate_limit=2
                ;;
              *)
                echo "::error::Unsupported direct_request_profile: ${DIRECT_REQUEST_PROFILE:-direct}"
                exit 1
                ;;
            esac
          else
            case "$SEED_REQUEST_PROFILE" in
              conservative)
                seed_concurrency=2
                seed_rate_limit=1
                ;;
              moderate)
                seed_concurrency=3
                seed_rate_limit=2
                ;;
              aggressive)
                seed_concurrency=4
                seed_rate_limit=3
                ;;
              *)
                echo "::error::Unsupported discovery seed concurrency profile: $SEED_REQUEST_PROFILE"
                exit 1
                ;;
            esac
          fi
          {
            echo "NBADB_RATE_LIMIT=$seed_rate_limit"
            echo "NBADB_DISCOVERY_CONCURRENCY=$seed_concurrency"
            echo "NBADB_DISCOVERY_SEED_CONCURRENCY=$seed_concurrency"
          } >> "$GITHUB_ENV"
          echo "::notice::Discovery seed profile: concurrency=$seed_concurrency rate=${seed_rate_limit}/s ($EFFECTIVE_NETWORK_MODE)"

      - name: Connect NordVPN tunnel for discovery seeding
        id: vpn
        if: ${{ needs.preflight.outputs.effective-network-mode == 'vpn' }}
        timeout-minutes: 8
        env:
          OPENVPN_USER: ${{ secrets.OPENVPN_USER }}
          OPENVPN_PASSWORD: ${{ secrets.OPENVPN_PASSWORD }}
          NORDVPN_TOKEN: ${{ secrets.NORDVPN_TOKEN }}
          REQUIRE_TOKEN_AUTH: ${{ needs.preflight.outputs.vpn-auth-source == 'token' && 'true' || 'false' }}
          CONFIGURED_AUTH_PREVALIDATED: ${{ needs.preflight.outputs.vpn-auth-source == 'configured' && 'true' || 'false' }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_LIMIT: "6"
          SERVER_POOL_SIZE: "96"
          FALLBACK_TECHNOLOGY: "openvpn_tcp"
          CONNECT_TIMEOUT_SECONDS: "60"
          OVERALL_TIMEOUT_SECONDS: "300"
          QUARANTINED_SERVERS_JSON: ${{ needs.preflight.outputs.vpn-quarantined-servers-json }}
          PREFERRED_SERVERS_JSON: ${{ format('["{0}"]', needs.preflight.outputs.vpn-server) }}
          PREFERRED_SERVER_SLOT_COUNT: "1"
        run: |
          export LANE_INDEX=$((RUN_ATTEMPT - 1))
          set +e
          bash .github/scripts/run_with_deadline.sh \
            450 \
            10 \
            python3 .github/actions/nordvpn-connect/supervise.py
          rc=$?
          exit "$rc"

      - name: Block discovery provider work until runtime collectors exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERATION_AUTHORITY_STATUS: ${{ needs.plan.outputs.operation-authority-status }}
          COLLECTOR_STATUS: ${{ needs.plan.outputs.free-execution-collector-status }}
          COLLECTOR_AUTHENTICATED: ${{ needs.plan.outputs.free-execution-collector-authenticated }}
          RUNTIME_CONTEXT_STATUS: ${{ needs.plan.outputs.free-execution-runtime-context-status }}
          STORAGE_MUTATIONS_ALLOWED: ${{ needs.plan.outputs.free-execution-storage-mutations-allowed }}
          PROVIDER_CALLS_ALLOWED: ${{ needs.plan.outputs.free-execution-provider-calls-allowed }}
          MUTATIONS_AUTHORIZED: ${{ needs.plan.outputs.free-execution-mutations-authorized }}
        run: python3 .github/scripts/attest_free_execution_job.py authorize --output artifacts/discovery/free-execution-authorization.json

      - name: Seed discovery artifacts
        env:
          NBADB_DISCOVERY_SEED_DEADLINE_SECONDS: "5400"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERATION_AUTHORITY_STATUS: ${{ needs.plan.outputs.operation-authority-status }}
          COLLECTOR_STATUS: ${{ needs.plan.outputs.free-execution-collector-status }}
          COLLECTOR_AUTHENTICATED: ${{ needs.plan.outputs.free-execution-collector-authenticated }}
          RUNTIME_CONTEXT_STATUS: ${{ needs.plan.outputs.free-execution-runtime-context-status }}
          STORAGE_MUTATIONS_ALLOWED: ${{ needs.plan.outputs.free-execution-storage-mutations-allowed }}
          PROVIDER_CALLS_ALLOWED: ${{ needs.plan.outputs.free-execution-provider-calls-allowed }}
          MUTATIONS_AUTHORIZED: ${{ needs.plan.outputs.free-execution-mutations-authorized }}
        run: |
          mkdir -p artifacts/discovery data/nbadb
          python3 .github/scripts/attest_free_execution_job.py verify --input artifacts/discovery/free-execution-authorization.json
          manifest_path="$(find plan-artifact -name manifest.json -type f -print -quit)"
          if [ -z "$manifest_path" ]; then
            echo "::error::Plan artifact did not contain manifest.json"
            find plan-artifact -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$manifest_path" artifacts/discovery/discovery-manifest.json
          bash .github/scripts/run_with_deadline.sh \
            5700 \
            15 \
            uv run python .github/scripts/seed_discovery_artifacts.py \
            --manifest-path artifacts/discovery/discovery-manifest.json \
            --duckdb-path data/nbadb/nba.duckdb \
            --summary-path artifacts/discovery/discovery-seed-summary.json

      - name: Verify complete discovery bundle
        run: |
          uv run python .github/scripts/verify_discovery_bundle.py \
            --summary-path artifacts/discovery/discovery-seed-summary.json \
            --manifest-path artifacts/discovery/discovery-manifest.json \
            --duckdb-path data/nbadb/nba.duckdb

      - name: Upload discovery artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: full-extraction-discovery-artifacts-${{ env.ACTIVE_CHAIN_ID }}
          path: |
            data/nbadb/nba.discovery-artifacts/
            data/nbadb/nba.player-team-season-workload.*.parquet
            data/nbadb/nba.player-team-season-workload.player-team-season-workload.json
            artifacts/discovery/discovery-manifest.json
            artifacts/discovery/discovery-seed-summary.json
            artifacts/discovery/free-execution-authorization.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload incomplete discovery recovery artifact
        if: ${{ always() && !success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: full-extraction-discovery-recovery-${{ env.ACTIVE_CHAIN_ID }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            data/nbadb/nba.discovery-artifacts/
            data/nbadb/nba.player-team-season-workload.parquet
            data/nbadb/nba.player-team-season-workload.*.parquet
            data/nbadb/nba.player-team-season-workload.player-team-season-workload.json
            artifacts/discovery/discovery-manifest.json
            artifacts/discovery/discovery-seed-summary.json
            artifacts/discovery/free-execution-authorization.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Upload discovery seed VPN diagnostics
        if: ${{ always() && needs.preflight.outputs.effective-network-mode == 'vpn' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: discovery-seed-vpn-diagnostics-${{ env.ACTIVE_CHAIN_ID }}
          path: |
            ${{ runner.temp }}/nordvpn/openvpn.log
            ${{ runner.temp }}/nordvpn/openvpn.pid
            ${{ runner.temp }}/nordvpn/vpn-exit-ip.json
            ${{ runner.temp }}/nordvpn/baseline-ip.json
            ${{ runner.temp }}/nordvpn/*.ovpn
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

      - name: Disconnect discovery seed VPN
        if: ${{ always() && needs.preflight.outputs.effective-network-mode == 'vpn' }}
        uses: ./.github/actions/nordvpn-disconnect
        with:
          pid: ${{ steps.vpn.outputs.pid }}
          pid-file: ${{ steps.vpn.outputs.pid-file }}
          work-dir: ${{ steps.vpn.outputs.work-dir }}

  vpn_capacity:
    needs: [plan, preflight, discovery_seed]
    if: ${{ always() && !cancelled() && needs.plan.outputs.operation-authority-status == 'validated' && needs.plan.outputs.free-execution-collector-status == 'admitted' && needs.plan.outputs.free-execution-collector-authenticated == 'true' && needs.plan.outputs.free-execution-runtime-context-status == 'authenticated' && needs.plan.outputs.free-execution-storage-mutations-allowed == 'true' && needs.plan.outputs.free-execution-provider-calls-allowed == 'true' && needs.plan.outputs.free-execution-mutations-authorized == 'true' && needs.plan.result == 'success' && needs.preflight.result == 'success' && needs.discovery_seed.result == 'success' && needs.preflight.outputs.vpn-capacity-required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.vpn_parallelism) }}
      matrix: ${{ fromJSON(needs.preflight.outputs.vpn-capacity-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.WORKFLOW_SOURCE_SHA }}

      - name: Validate full extraction attempt
        env:
          FULL_EXTRACTION_ATTEMPT_GATE_ROLE: partial
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/validate_full_extraction_attempt.py

      - name: Reject partial VPN capacity reruns
        if: ${{ github.run_attempt > 1 }}
        env:
          EXPECTED_CAPACITY: ${{ matrix.expected_capacity }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          jobs_path="$RUNNER_TEMP/vpn-capacity-attempt-jobs.json"
          gh api \
            --method GET \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${RUN_ATTEMPT}/jobs?per_page=100" \
            > "$jobs_path"
          JOBS_PATH="$jobs_path" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = int(os.environ["EXPECTED_CAPACITY"])
          pages = json.loads(Path(os.environ["JOBS_PATH"]).read_text(encoding="utf-8"))
          if not isinstance(pages, list):
              raise SystemExit("VPN capacity attempt job inventory must be a list of pages")
          jobs = []
          for page in pages:
              if not isinstance(page, dict) or not isinstance(page.get("jobs"), list):
                  raise SystemExit("VPN capacity attempt job inventory is malformed")
              jobs.extend(page["jobs"])
          cohort = [
              job
              for job in jobs
              if isinstance(job, dict)
              and str(job.get("name") or "").startswith("vpn_capacity (")
          ]
          if len(cohort) != expected:
              raise SystemExit(
                  "partial VPN capacity rerun detected: current attempt contains "
                  f"{len(cohort)} of {expected} matrix jobs; rerun all jobs so every "
                  "simultaneous-capacity marker is produced in one run attempt"
              )
          print(f"::notice::VPN capacity rerun contains the complete {expected}-job cohort")
          PY

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - run: uv sync --locked

      - name: Merge discovery failures into capacity quarantine
        id: capacity_quarantine
        env:
          PREFLIGHT_QUARANTINE_JSON: ${{ needs.preflight.outputs.vpn-quarantined-servers-json }}
          DISCOVERY_FAILED_SERVERS_JSON: ${{ needs.discovery_seed.outputs.vpn-failed-servers-json || '[]' }}
        run: |
          python3 - <<'PY'
          # CAPACITY_VPN_QUARANTINE
          import json
          import os
          from pathlib import Path

          combined: list[str] = []
          for name in ("PREFLIGHT_QUARANTINE_JSON", "DISCOVERY_FAILED_SERVERS_JSON"):
              values = json.loads(os.environ.get(name, "") or "[]")
              if not isinstance(values, list) or any(not isinstance(value, str) for value in values):
                  raise SystemExit(f"{name} must be a JSON array of server hostnames")
              for value in values:
                  server = value.strip().lower()
                  if server and server not in combined:
                      combined.append(server)

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(
                  "vpn-quarantined-servers-json="
                  + json.dumps(combined, separators=(",", ":"))
                  + "\n"
              )
          PY

      - name: Prove concurrent VPN capacity
        id: vpn
        timeout-minutes: 16
        continue-on-error: true
        uses: ./.github/actions/nordvpn-connect
        with:
          openvpn-user: ${{ secrets.OPENVPN_USER }}
          openvpn-password: ${{ secrets.OPENVPN_PASSWORD }}
          nordvpn-token: ${{ secrets.NORDVPN_TOKEN }}
          configured-auth-prevalidated: "true"
          lane-index: ${{ matrix.lane_index }}
          server-limit: ${{ matrix.server_limit }}
          server-pool-size: "96"
          auth-rejection-limit: "1"
          auth-recovery-rejection-limit: "3"
          auth-recovery-rounds: ${{ matrix.auth_recovery_rounds }}
          auth-recovery-base-delay-seconds: "300"
          require-auth-recovery-budget: "true"
          quarantined-servers-json: ${{ steps.capacity_quarantine.outputs.vpn-quarantined-servers-json }}
          preferred-servers-json: ${{ format('["{0}","{1}"]', needs.discovery_seed.outputs.vpn-server, needs.preflight.outputs.vpn-server) }}
          preferred-server-slot-count: ${{ matrix.expected_capacity }}
          preferred-only: ${{ matrix.preferred_only }}
          preserve-recommendation-rank: ${{ matrix.preserve_recommendation_rank }}
          recommendation-slot-count: ${{ matrix.recommendation_slot_count }}
          recommendation-slot-index: ${{ matrix.recommendation_slot_index }}
          fallback-technology: ${{ matrix.fallback_technology }}
          connect-timeout-seconds: "60"
          overall-timeout-seconds: "780"

      - name: Write connected VPN capacity marker
        if: ${{ steps.vpn.outcome == 'success' && steps.vpn.outputs.status == 'connected' && steps.vpn.outputs.auth-source == 'configured' }}
        env:
          MARKER_KIND: capacity
          MARKER_PATH: artifacts/vpn-control/capacity-marker.json
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          SOURCE_SHA: ${{ env.WORKFLOW_SOURCE_SHA }}
          LANE_ID: capacity-${{ matrix.lane_index }}
          LANE_INDEX: ${{ matrix.lane_index }}
          VPN_AUTH_SOURCE: ${{ steps.vpn.outputs.auth-source }}
          VPN_STATUS: ${{ steps.vpn.outputs.status }}
          VPN_SERVER: ${{ steps.vpn.outputs.server }}
          VPN_EXIT_IP: ${{ steps.vpn.outputs.exit-ip }}
          VPN_ATTEMPTED_SERVERS_JSON: ${{ steps.vpn.outputs.attempted-servers-json }}
          VPN_FAILED_SERVERS_JSON: ${{ steps.vpn.outputs.failed-servers-json }}
        run: python3 .github/scripts/vpn_control_plane.py write-marker --kind capacity

      - name: Publish connected VPN capacity marker
        id: capacity_marker
        if: ${{ steps.vpn.outcome == 'success' && steps.vpn.outputs.status == 'connected' && steps.vpn.outputs.auth-source == 'configured' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: false
          name: vpn-capacity-connected-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-lane-${{ matrix.lane_index }}
          path: artifacts/vpn-control/capacity-marker.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Wait before retrying VPN capacity marker upload
        if: ${{ steps.capacity_marker.outcome == 'failure' }}
        run: sleep 15

      - name: Retry connected VPN capacity marker
        id: capacity_marker_retry
        if: ${{ steps.capacity_marker.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: vpn-capacity-connected-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-lane-${{ matrix.lane_index }}
          path: artifacts/vpn-control/capacity-marker.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Wait for simultaneous VPN capacity
        id: capacity_barrier
        if: ${{ steps.capacity_marker.outcome == 'success' || steps.capacity_marker_retry.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_CAPACITY: ${{ matrix.expected_capacity }}
        run: >-
          python3 .github/scripts/vpn_control_plane.py capacity-wait
          --timeout-seconds 780
          --poll-interval-seconds 10

      - name: Revalidate VPN after capacity barrier
        id: capacity_recheck
        if: ${{ steps.capacity_barrier.outcome == 'success' }}
        env:
          VPN_PID: ${{ steps.vpn.outputs.pid }}
          VPN_INTERFACE: ${{ steps.vpn.outputs.interface }}
          VPN_EXIT_IP: ${{ steps.vpn.outputs.exit-ip }}
        run: |
          set -euo pipefail
          if [ -z "$VPN_PID" ] || [ -z "$VPN_INTERFACE" ] || [ -z "$VPN_EXIT_IP" ]; then
            echo "::error::VPN capacity marker lacks a complete live-tunnel attestation"
            exit 1
          fi
          sudo kill -0 "$VPN_PID"
          ip route get 1.1.1.1 | grep -Eq "(^| )dev ${VPN_INTERFACE}( |$)"
          observed_exit_ip="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 https://api.ipify.org)"
          if [ "$observed_exit_ip" != "$VPN_EXIT_IP" ]; then
            echo "::error::VPN exit IP changed before the simultaneous-capacity barrier completed"
            exit 1
          fi
          echo "::notice::Simultaneous VPN capacity remains live on ${VPN_INTERFACE} (${VPN_EXIT_IP})"

      - name: Upload VPN capacity diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: vpn-capacity-diagnostics-${{ env.ACTIVE_CHAIN_ID }}-${{ matrix.lane_index }}
          path: |
            ${{ runner.temp }}/nordvpn/openvpn.log
            ${{ runner.temp }}/nordvpn/openvpn.pid
            ${{ runner.temp }}/nordvpn/vpn-exit-ip.json
            ${{ runner.temp }}/nordvpn/baseline-ip.json
            ${{ runner.temp }}/nordvpn/*.ovpn
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

      - name: Disconnect VPN capacity probe
        if: always()
        uses: ./.github/actions/nordvpn-disconnect
        with:
          pid: ${{ steps.vpn.outputs.pid }}
          pid-file: ${{ steps.vpn.outputs.pid-file }}
          work-dir: ${{ steps.vpn.outputs.work-dir }}

      - name: Enforce concurrent VPN capacity
        if: always()
        env:
          CONNECT_OUTCOME: ${{ steps.vpn.outcome }}
          MARKER_OUTCOME: ${{ steps.capacity_marker.outcome == 'success' && steps.capacity_marker.outcome || steps.capacity_marker_retry.outcome }}
          BARRIER_OUTCOME: ${{ steps.capacity_barrier.outcome }}
          RECHECK_OUTCOME: ${{ steps.capacity_recheck.outcome }}
          VPN_AUTH_SOURCE: ${{ steps.vpn.outputs.auth-source }}
          VPN_STATUS: ${{ steps.vpn.outputs.status }}
        run: |
          if [ "$CONNECT_OUTCOME" != "success" ] || \
             [ "$VPN_STATUS" != "connected" ] || \
             [ "$VPN_AUTH_SOURCE" != "configured" ] || \
             [ "$MARKER_OUTCOME" != "success" ] || \
             [ "$BARRIER_OUTCOME" != "success" ] || \
             [ "$RECHECK_OUTCOME" != "success" ]; then
            echo "::error::Concurrent VPN capacity probe ${{ matrix.lane_index }} failed: outcome=${CONNECT_OUTCOME:-unknown}, status=${VPN_STATUS:-unknown}, auth_source=${VPN_AUTH_SOURCE:-unknown}, marker=${MARKER_OUTCOME:-unknown}, barrier=${BARRIER_OUTCOME:-unknown}, recheck=${RECHECK_OUTCOME:-unknown}"
            exit 1
          fi
          echo "::notice::Concurrent VPN capacity probe ${{ matrix.lane_index }} passed"

  vpn_quarantine:
    needs: [plan, preflight, discovery_seed, vpn_capacity]
    if: ${{ always() && !cancelled() && needs.plan.outputs.operation-authority-status == 'validated' && needs.plan.outputs.free-execution-collector-status == 'admitted' && needs.plan.outputs.free-execution-collector-authenticated == 'true' && needs.plan.outputs.free-execution-runtime-context-status == 'authenticated' && needs.plan.outputs.free-execution-storage-mutations-allowed == 'true' && needs.plan.outputs.free-execution-provider-calls-allowed == 'true' && needs.plan.outputs.free-execution-mutations-authorized == 'true' && needs.plan.result == 'success' && needs.preflight.result == 'success' && needs.discovery_seed.result == 'success' && (needs.vpn_capacity.result == 'success' || needs.vpn_capacity.result == 'skipped') && needs.plan.outputs.matrix-lane-count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      vpn-quarantined-servers-json: ${{ steps.aggregate.outputs.vpn-quarantined-servers-json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.WORKFLOW_SOURCE_SHA }}

      - name: Validate full extraction attempt
        env:
          FULL_EXTRACTION_ATTEMPT_GATE_ROLE: partial
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/validate_full_extraction_attempt.py

      - name: Download singleton VPN capacity marker
        if: ${{ needs.preflight.outputs.vpn-capacity-required == 'true' && needs.preflight.outputs.vpn-capacity-count == '1' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vpn-capacity-connected-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-lane-0
          path: capacity-markers/vpn-capacity-connected-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-lane-0/

      - name: Download parallel VPN capacity markers
        if: ${{ needs.preflight.outputs.vpn-capacity-required == 'true' && needs.preflight.outputs.vpn-capacity-count != '1' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: vpn-capacity-connected-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-lane-*
          path: capacity-markers/
          merge-multiple: false

      - name: Validate VPN capacity evidence and finalize quarantine
        id: aggregate
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          SOURCE_SHA: ${{ env.WORKFLOW_SOURCE_SHA }}
          EXPECTED_CAPACITY: ${{ needs.preflight.outputs.vpn-capacity-count }}
          BASELINE_QUARANTINE_JSON: ${{ needs.preflight.outputs.vpn-quarantined-servers-json }}
          DISCOVERY_FAILED_SERVERS_JSON: ${{ needs.discovery_seed.outputs.vpn-failed-servers-json || '[]' }}
          VPN_CAPACITY_MARKER_DIRECTORY: capacity-markers
          VPN_QUARANTINE_REPORT_PATH: artifacts/vpn-control/effective-quarantine.json
        run: python3 .github/scripts/vpn_control_plane.py aggregate-quarantine

      - name: Upload effective VPN quarantine report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: vpn-quarantine-${{ env.ACTIVE_CHAIN_ID }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/vpn-control/effective-quarantine.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  extract:
    needs: [plan, preflight, discovery_seed, vpn_capacity, vpn_quarantine]
    if: ${{ always() && !cancelled() && needs.plan.outputs.operation-authority-status == 'validated' && needs.plan.outputs.free-execution-collector-status == 'admitted' && needs.plan.outputs.free-execution-collector-authenticated == 'true' && needs.plan.outputs.free-execution-runtime-context-status == 'authenticated' && needs.plan.outputs.free-execution-storage-mutations-allowed == 'true' && needs.plan.outputs.free-execution-provider-calls-allowed == 'true' && needs.plan.outputs.free-execution-mutations-authorized == 'true' && needs.plan.result == 'success' && needs.preflight.result == 'success' && needs.discovery_seed.result == 'success' && (needs.vpn_capacity.result == 'success' || needs.vpn_capacity.result == 'skipped') && needs.vpn_quarantine.result == 'success' && needs.plan.outputs.matrix-lane-count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.extract-matrix) }}
    concurrency:
      group: nbadb-free-direct-provider-slot-${{ matrix.execution_slot }}
      cancel-in-progress: false

    steps:
      - name: Initialize lane job budget
        env:
          JOB_TIMEOUT_SECONDS: "21000"
          FINALIZATION_RESERVE_SECONDS: "1200"
        run: |
          started_at="$(date +%s)"
          {
            echo "NBADB_EXTRACT_JOB_DEADLINE_EPOCH_SECONDS=$((started_at + JOB_TIMEOUT_SECONDS))"
            echo "NBADB_EXTRACT_FINALIZATION_RESERVE_SECONDS=$FINALIZATION_RESERVE_SECONDS"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.WORKFLOW_SOURCE_SHA }}

      - name: Validate full extraction attempt
        env:
          FULL_EXTRACTION_ATTEMPT_GATE_ROLE: partial
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/validate_full_extraction_attempt.py

      - name: Check run-attempt VPN auth circuit
        id: vpn_auth_circuit
        if: ${{ !matrix.resume_only && needs.preflight.outputs.effective-network-mode == 'vpn' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          SOURCE_SHA: ${{ env.WORKFLOW_SOURCE_SHA }}
          VPN_AUTH_SOURCE: ${{ needs.preflight.outputs.vpn-auth-source }}
        run: python3 .github/scripts/vpn_control_plane.py auth-guard

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - run: uv sync --locked

      - name: Download exact current-run raw-request authority
        if: ${{ !matrix.resume_only }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.plan-manifest-artifact-id }}
          path: raw-request-plan-authority/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error

      - name: Fetch exact nba_api authority for raw requests
        if: ${{ !matrix.resume_only }}
        run: |
          NBA_API_VERSION="$(uv run python -c 'import importlib.metadata; print(importlib.metadata.version("nba-api"))')"
          NBA_API_REF="v${NBA_API_VERSION}"
          git clone --depth=1 --filter=blob:none --branch "$NBA_API_REF" \
            https://github.com/swar/nba_api.git "$RUNNER_TEMP/nba_api-upstream"
          test -d "$RUNNER_TEMP/nba_api-upstream/docs/nba_api/stats/endpoints" || {
            echo "::error::raw-request nba_api authority lacks endpoint docs"
            exit 1
          }
          test -d "$RUNNER_TEMP/nba_api-upstream/tools/stats" || {
            echo "::error::raw-request nba_api authority lacks tools/stats"
            exit 1
          }

      - name: Admit exact raw-request assurance authority
        if: ${{ !matrix.resume_only }}
        env:
          EXPECTED_ASSURANCE_ADMISSION_SHA256: ${{ needs.plan.outputs.assurance-admission-sha256 }}
        run: |
          mapfile -t admissions < <(find raw-request-plan-authority -type f -name assurance-admission.json -print)
          if [ "${#admissions[@]}" -ne 1 ]; then
            echo "::error::Raw-request authority requires exactly one assurance admission"
            exit 1
          fi
          generation_dir="$(dirname "${admissions[0]}")"
          if [ -L "${admissions[0]}" ] || [ -L "$generation_dir" ] || [ ! -d "$generation_dir" ]; then
            echo "::error::Raw-request assurance generation is not a regular directory"
            exit 1
          fi
          GENERATED_ADMISSION="${admissions[0]}" uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          admission = json.loads(
              Path(os.environ["GENERATED_ADMISSION"]).read_text(encoding="utf-8")
          )
          digest = hashlib.sha256(
              json.dumps(
                  admission,
                  allow_nan=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ).encode("utf-8")
          ).hexdigest()
          if digest != os.environ["EXPECTED_ASSURANCE_ADMISSION_SHA256"]:
              raise SystemExit(
                  "raw-request assurance admission differs from the plan receipt"
              )
          PY
          {
            echo "NBADB_ENABLE_RAW_REQUEST_AUTHORITY=true"
            echo "NBADB_RAW_REQUEST_ASSURANCE_GENERATION=$(realpath "$generation_dir")"
            echo "ENDPOINT_ANALYSIS_DOCS_ROOT=$(realpath "$RUNNER_TEMP/nba_api-upstream")"
          } >> "$GITHUB_ENV"

      - name: Restore exact dependent workload bundle
        if: ${{ matrix.lane_kind == 'post_foundation_dependent_matchup' }}
        env:
          DEPENDENT_ARTIFACT_RUN_ID: ${{ matrix.dependent_artifact_run_id }}
          DEPENDENT_ARTIFACT_ID: ${{ matrix.dependent_artifact_id }}
          DEPENDENT_ARTIFACT_NAME: ${{ matrix.dependent_artifact_name }}
          DEPENDENT_ARTIFACT_DIGEST: ${{ matrix.dependent_artifact_digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/dependent-provenance" dependent-workload-artifact
          owner="$RUNNER_TEMP/dependent-provenance/owner-${DEPENDENT_ARTIFACT_RUN_ID}.json"
          owner_recheck="$RUNNER_TEMP/dependent-provenance/owner-${DEPENDENT_ARTIFACT_RUN_ID}-recheck.json"
          receipt="$RUNNER_TEMP/dependent-provenance/artifact-${DEPENDENT_ARTIFACT_ID}.json"
          python .github/scripts/workflow_source_provenance.py attest-run \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$DEPENDENT_ARTIFACT_RUN_ID" \
            --source-sha "$WORKFLOW_SOURCE_SHA" \
            --trusted-branch "$WORKFLOW_SOURCE_REF" \
            --workflow-path .github/workflows/full-extraction.yml \
            --required-state active-or-completed \
            --output "$owner"
          python .github/scripts/workflow_source_provenance.py recheck-run \
            --attestation "$owner" \
            --required-state active-or-completed \
            --output "$owner_recheck"
          python .github/scripts/workflow_source_provenance.py resolve-artifact \
            --attestation "$owner_recheck" \
            --artifact-name "$DEPENDENT_ARTIFACT_NAME" \
            --poll-interval-seconds 0 \
            --output "$receipt"
          DEPENDENT_RECEIPT="$receipt" python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ["DEPENDENT_RECEIPT"]).read_text(encoding="utf-8"))
          if (
              str(receipt.get("id")) != os.environ["DEPENDENT_ARTIFACT_ID"]
              or receipt.get("name") != os.environ["DEPENDENT_ARTIFACT_NAME"]
              or str(receipt.get("digest") or "").lower()
              != os.environ["DEPENDENT_ARTIFACT_DIGEST"].lower()
          ):
              raise SystemExit("dependent workload artifact receipt changed")
          PY
          python .github/scripts/workflow_source_provenance.py download-artifact \
            --attestation "$owner_recheck" \
            --receipt "$receipt" \
            --output-dir dependent-workload-artifact \
            --output "$receipt.downloaded.json"
          mapfile -t execution_plans < <(find dependent-workload-artifact -name dependent-execution-plan.json -type f -print)
          if [ "${#execution_plans[@]}" -ne 1 ]; then
            echo "::error::Dependent workload artifact must contain exactly one execution plan"
            exit 1
          fi

      - name: Download discovery artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: full-extraction-discovery-artifacts-${{ env.ACTIVE_CHAIN_ID }}
          path: discovery-artifact/

      # ── Restore attested state from a previous iteration ──
      - name: Restore durable lane state artifact
        id: state_artifact_restore
        if: ${{ matrix.state_artifact_run_id != '' || matrix.state_artifact_name != '' || matrix.state_artifact_digest != '' || matrix.state_artifact_id != '' || matrix.state_artifact_archive_digest != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_ARTIFACT_ARCHIVE_DIGEST: ${{ matrix.state_artifact_archive_digest }}
          STATE_ARTIFACT_ID: ${{ matrix.state_artifact_id }}
          STATE_ARTIFACT_RUN_ID: ${{ matrix.state_artifact_run_id }}
          STATE_ARTIFACT_NAME: ${{ matrix.state_artifact_name }}
          STATE_ARTIFACT_DIGEST: ${{ matrix.state_artifact_digest }}
          COVERAGE_UNITS_HASH: ${{ matrix.coverage_units_hash }}
          PATTERNS: ${{ matrix.patterns }}
          SEASON_START: ${{ matrix.season_start }}
          SEASON_END: ${{ matrix.season_end }}
          SEASON_TYPES: ${{ matrix.season_types }}
        run: |
          if [ -z "$STATE_ARTIFACT_RUN_ID" ] || [ -z "$STATE_ARTIFACT_NAME" ] || [ -z "$STATE_ARTIFACT_DIGEST" ] || [ -z "$STATE_ARTIFACT_ID" ] || [ -z "$STATE_ARTIFACT_ARCHIVE_DIGEST" ]; then
            echo "::error::Run ID, name, database digest, artifact ID, and archive digest are all required for resumable lane ${{ matrix.lane_id }}"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/lane-state-artifact" data/nbadb artifacts/extraction
          rm -rf "$RUNNER_TEMP/lane-state-artifact"/*
          mkdir -p "$RUNNER_TEMP/workflow-provenance"
          state_owner="$RUNNER_TEMP/workflow-provenance/state-artifact-owner-${STATE_ARTIFACT_RUN_ID}.json"
          state_receipt="$RUNNER_TEMP/workflow-provenance/state-artifact-${STATE_ARTIFACT_ID}.json"
          python .github/scripts/workflow_source_provenance.py attest-run \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$STATE_ARTIFACT_RUN_ID" \
            --source-sha "$WORKFLOW_SOURCE_SHA" \
            --trusted-branch "$WORKFLOW_SOURCE_REF" \
            --workflow-path .github/workflows/full-extraction.yml \
            --required-state completed \
            --output "$state_owner"
          python .github/scripts/workflow_source_provenance.py resolve-artifact \
            --attestation "$state_owner" \
            --artifact-name "$STATE_ARTIFACT_NAME" \
            --poll-interval-seconds 0 \
            --output "$state_receipt"
          STATE_RECEIPT="$state_receipt" python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ["STATE_RECEIPT"]).read_text(encoding="utf-8"))
          if (
              str(receipt.get("id") or "") != os.environ["STATE_ARTIFACT_ID"]
              or str(receipt.get("digest") or "").lower()
              != os.environ["STATE_ARTIFACT_ARCHIVE_DIGEST"].lower()
          ):
              raise SystemExit("durable lane state receipt does not match the manifest pointer")
          PY
          python .github/scripts/workflow_source_provenance.py download-artifact \
            --attestation "$state_owner" \
            --receipt "$state_receipt" \
            --output-dir "$RUNNER_TEMP/lane-state-artifact" \
            --output "$state_receipt.downloaded.json"
          mapfile -t state_databases < <(find "$RUNNER_TEMP/lane-state-artifact" -name nba.duckdb -type f -print)
          if [ "${#state_databases[@]}" -ne 1 ]; then
            echo "::error::State artifact $STATE_ARTIFACT_NAME must contain exactly one nba.duckdb"
            exit 1
          fi
          mapfile -t state_attestations < <(find "$RUNNER_TEMP/lane-state-artifact" -name lane-state-attestation.json -type f -print)
          if [ "${#state_attestations[@]}" -ne 1 ]; then
            echo "::error::State artifact $STATE_ARTIFACT_NAME must contain exactly one lane-state-attestation.json"
            exit 1
          fi
          state_db="${state_databases[0]}"
          workload_args=()
          if [[ ",$PATTERNS," == *",player_team_season,"* ]]; then
            workload_manifest="$(find discovery-artifact -type f -name nba.player-team-season-workload.player-team-season-workload.json -print -quit)"
            if [ -z "$workload_manifest" ]; then
              echo "::error::Workload-bound lane state requires the active discovery workload manifest"
              exit 1
            fi
            workload_args+=(
              --workload-duckdb-path "$(dirname "$workload_manifest")/nba.duckdb"
              --workload-season-start "$SEASON_START"
              --workload-season-end "$SEASON_END"
              --workload-season-types "$SEASON_TYPES"
            )
          fi
          uv run python .github/scripts/validate_lane_state.py \
            "$state_db" \
            --expected-sha256 "$STATE_ARTIFACT_DIGEST" \
            --require-journal \
            --allow-attested-empty \
            --attestation-path "${state_attestations[0]}" \
            --expected-source-sha "$WORKFLOW_SOURCE_SHA" \
            --expected-chain-id "$ACTIVE_CHAIN_ID" \
            --expected-lane-id "${{ matrix.lane_id }}" \
            --expected-coverage-units-hash "$COVERAGE_UNITS_HASH" \
            --expected-run-id "$STATE_ARTIFACT_RUN_ID" \
            --expected-artifact-name "$STATE_ARTIFACT_NAME" \
            "${workload_args[@]}"
          cp "$state_db" data/nbadb/nba.duckdb
          cp "${state_attestations[0]}" artifacts/extraction/lane-state-attestation.json
          echo "restored=true" >> "$GITHUB_OUTPUT"

      - name: Assess restored state
        id: restore_state
        env:
          STATE_ARTIFACT_RESTORED: ${{ steps.state_artifact_restore.outputs.restored }}
          STATE_ARTIFACT_REQUIRED: ${{ matrix.state_artifact_run_id != '' || matrix.state_artifact_name != '' || matrix.state_artifact_digest != '' }}
          STATE_ARTIFACT_DIGEST: ${{ matrix.state_artifact_digest }}
          STATE_ARTIFACT_RUN_ID: ${{ matrix.state_artifact_run_id }}
          STATE_ARTIFACT_NAME: ${{ matrix.state_artifact_name }}
          COVERAGE_UNITS_HASH: ${{ matrix.coverage_units_hash }}
          PATTERNS: ${{ matrix.patterns }}
          SEASON_START: ${{ matrix.season_start }}
          SEASON_END: ${{ matrix.season_end }}
          SEASON_TYPES: ${{ matrix.season_types }}
        run: |
          mkdir -p data/nbadb
          mark_untrusted() {
            mkdir -p artifacts/extraction
            printf '%s\n' "$1" > artifacts/extraction/lane-state-untrusted
          }
          restore_source="none"
          restore_usable="false"
          if [ "$STATE_ARTIFACT_REQUIRED" = "true" ]; then
            if [ "$STATE_ARTIFACT_RESTORED" != "true" ] || [ ! -f data/nbadb/nba.duckdb ]; then
              mark_untrusted "required durable lane state was not restored"
              echo "::error::Required durable lane state was not restored"
              exit 1
            fi
            restore_source="artifact"
            workload_args=()
            if [[ ",$PATTERNS," == *",player_team_season,"* ]]; then
              workload_manifest="$(find discovery-artifact -type f -name nba.player-team-season-workload.player-team-season-workload.json -print -quit)"
              if [ -z "$workload_manifest" ]; then
                mark_untrusted "active discovery workload manifest is missing"
                echo "::error::Workload-bound lane state requires the active discovery workload manifest"
                exit 1
              fi
              workload_args+=(
                --workload-duckdb-path "$(dirname "$workload_manifest")/nba.duckdb"
                --workload-season-start "$SEASON_START"
                --workload-season-end "$SEASON_END"
                --workload-season-types "$SEASON_TYPES"
              )
            fi
            if ! uv run python .github/scripts/validate_lane_state.py \
              data/nbadb/nba.duckdb \
              --expected-sha256 "$STATE_ARTIFACT_DIGEST" \
              --require-journal \
              --allow-attested-empty \
              --attestation-path artifacts/extraction/lane-state-attestation.json \
              --expected-source-sha "$WORKFLOW_SOURCE_SHA" \
              --expected-chain-id "$ACTIVE_CHAIN_ID" \
              --expected-lane-id "${{ matrix.lane_id }}" \
              --expected-coverage-units-hash "$COVERAGE_UNITS_HASH" \
              --expected-run-id "$STATE_ARTIFACT_RUN_ID" \
              --expected-artifact-name "$STATE_ARTIFACT_NAME" \
              "${workload_args[@]}"; then
              mark_untrusted "durable lane state failed exact validation"
              exit 1
            fi
            restore_usable="true"
          elif [ -e data/nbadb/nba.duckdb ] || [ -e data/nbadb/nba.duckdb.wal ]; then
            mark_untrusted "fresh lane contains unexpected DuckDB state"
            echo "::error::Fresh lane contains unexpected unattested DuckDB state"
            exit 1
          fi

          restart_mode="clean-restart"
          if [ "$restore_usable" = "true" ]; then
            restart_mode="resume"
          fi

          {
            echo "restore-source=$restore_source"
            echo "restore-usable=$restore_usable"
            echo "restart-mode=$restart_mode"
          } >> "$GITHUB_OUTPUT"

      - name: Install discovery artifacts after state restore
        run: |
          mkdir -p data/nbadb
          artifact_dir="$(find discovery-artifact -type d -name nba.discovery-artifacts -print -quit)"
          if [ -n "$artifact_dir" ]; then
            rm -rf data/nbadb/nba.discovery-artifacts
            cp -R "$artifact_dir" data/nbadb/nba.discovery-artifacts
          else
            echo "::notice::No seeded discovery artifact directory found"
          fi

          find data/nbadb \
            -maxdepth 1 \
            -type f \
            -name 'nba.player-team-season-workload*.parquet' \
            -delete
          rm -f data/nbadb/nba.player-team-season-workload.player-team-season-workload.json

          mapfile -t workload_parquets < <(
            find discovery-artifact \
              -type f \
              -name 'nba.player-team-season-workload.*.parquet' \
              -print
          )
          workload_manifest="$(find discovery-artifact -type f -name nba.player-team-season-workload.player-team-season-workload.json -print -quit)"
          if [ "${#workload_parquets[@]}" -gt 0 ] || [ -n "$workload_manifest" ]; then
            if [ "${#workload_parquets[@]}" -eq 0 ] || [ -z "$workload_manifest" ]; then
              echo "::error::Seeded player/team workload artifact is incomplete"
              exit 1
            fi
            for workload_parquet in "${workload_parquets[@]}"; do
              cp "$workload_parquet" "data/nbadb/$(basename "$workload_parquet")"
            done
            cp "$workload_manifest" data/nbadb/nba.player-team-season-workload.player-team-season-workload.json
          else
            echo "::notice::No seeded player/team workload artifact found"
          fi

      - name: Verify installed discovery bundle
        run: |
          summary_path="$(find discovery-artifact -type f -name discovery-seed-summary.json -print -quit)"
          manifest_path="$(find discovery-artifact -type f -name discovery-manifest.json -print -quit)"
          if [ -z "$summary_path" ]; then
            echo "::error::Downloaded discovery bundle is missing discovery-seed-summary.json"
            exit 1
          fi
          if [ -z "$manifest_path" ]; then
            echo "::error::Downloaded discovery bundle is missing discovery-manifest.json"
            exit 1
          fi
          uv run python .github/scripts/verify_discovery_bundle.py \
            --summary-path "$summary_path" \
            --manifest-path "$manifest_path" \
            --duckdb-path data/nbadb/nba.duckdb

      - name: Show lane info
        env:
          LANE_ID: ${{ matrix.lane_id }}
          LANE_INDEX: ${{ matrix.lane_index }}
          NAME: ${{ matrix.lane_name }}
          KIND: ${{ matrix.lane_kind }}
          SEASON_START: ${{ matrix.season_start }}
          SEASON_END: ${{ matrix.season_end }}
          PATTERNS: ${{ matrix.patterns }}
          SEASON_TYPES: ${{ matrix.season_types }}
          CONTEXT_MEASURES: ${{ matrix.context_measures }}
          RESUME_ONLY: ${{ matrix.resume_only }}
          PARENT_LANE_ID: ${{ matrix.parent_lane_id }}
          SPLIT_GENERATION: ${{ matrix.split_generation }}
          ITERATION: ${{ inputs.iteration }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          WORKFLOW_REF: ${{ env.WORKFLOW_SOURCE_REF }}
          WORKFLOW_SHA: ${{ env.WORKFLOW_SOURCE_SHA }}
          RESTORE_SOURCE: ${{ steps.restore_state.outputs.restore-source }}
          RESTORE_USABLE: ${{ steps.restore_state.outputs.restore-usable }}
          RESTART_MODE: ${{ steps.restore_state.outputs.restart-mode }}
          RESTORE_ERROR: ${{ steps.state_artifact_restore.outputs.restore-error }}
        run: |
          echo "::notice::Lane $LANE_ID (#$LANE_INDEX, $KIND) — $NAME — iteration $ITERATION"
          echo "::notice::Chain $CHAIN_ID — source ref $WORKFLOW_REF @ $WORKFLOW_SHA"
          echo "::notice::Restore source: ${RESTORE_SOURCE:-none}"
          echo "::notice::Restore usable: ${RESTORE_USABLE:-false}"
          echo "::notice::Restart mode: ${RESTART_MODE:-clean-restart}"
          [ -n "$PARENT_LANE_ID" ] && echo "::notice::Parent lane: $PARENT_LANE_ID (split generation ${SPLIT_GENERATION:-0})"
          [ -n "$PATTERNS" ] && echo "::notice::Patterns: $PATTERNS" || echo "::notice::Patterns: all"
          [ -n "$SEASON_TYPES" ] && echo "::notice::Season types: $SEASON_TYPES" || echo "::notice::Season types: none"
          [ -n "$CONTEXT_MEASURES" ] && echo "::notice::Video contexts: $CONTEXT_MEASURES" || echo "::notice::Video contexts: none"
          echo "::notice::Resume only: $RESUME_ONLY"
          if [ "$RESTORE_USABLE" = "true" ] && [ -f data/nbadb/nba.duckdb ]; then
            echo "::notice::Resuming from attested durable state"
            ls -lh data/nbadb/ 2>/dev/null || true
          else
            echo "::notice::Fresh start"
          fi

      - name: Recheck VPN auth circuit before connector
        id: vpn_auth_circuit_final
        if: ${{ !matrix.resume_only && needs.preflight.outputs.effective-network-mode == 'vpn' && steps.vpn_auth_circuit.outputs.status == 'closed' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          SOURCE_SHA: ${{ env.WORKFLOW_SOURCE_SHA }}
          VPN_AUTH_SOURCE: ${{ needs.preflight.outputs.vpn-auth-source }}
        run: python3 .github/scripts/vpn_control_plane.py auth-guard

      # ── Connect NordVPN tunnel for active extraction lanes ──
      - name: Connect NordVPN tunnel
        id: vpn
        if: ${{ !matrix.resume_only && needs.preflight.outputs.effective-network-mode == 'vpn' && steps.vpn_auth_circuit.outputs.status == 'closed' && steps.vpn_auth_circuit_final.outputs.status == 'closed' }}
        timeout-minutes: 16
        env:
          OPENVPN_USER: ${{ secrets.OPENVPN_USER }}
          OPENVPN_PASSWORD: ${{ secrets.OPENVPN_PASSWORD }}
          NORDVPN_TOKEN: ${{ secrets.NORDVPN_TOKEN }}
          REQUIRE_TOKEN_AUTH: ${{ needs.preflight.outputs.vpn-auth-source == 'token' && 'true' || 'false' }}
          CONFIGURED_AUTH_PREVALIDATED: ${{ needs.preflight.outputs.vpn-auth-source == 'configured' && 'true' || 'false' }}
          LANE_INDEX: ${{ matrix.lane_index }}
          # Give active extract lanes a broader recommendation pool so the chain
          # does not burn an iteration on a few bad NordVPN hosts.
          SERVER_LIMIT: "6"
          SERVER_POOL_SIZE: "96"
          FALLBACK_TECHNOLOGY: "openvpn_tcp"
          CONNECT_TIMEOUT_SECONDS: "60"
          # Hold a throttled matrix slot instead of immediately admitting another
          # runner that would amplify an account-wide authentication cooldown.
          AUTH_REJECTION_LIMIT: "1"
          AUTH_RECOVERY_REJECTION_LIMIT: "3"
          AUTH_RECOVERY_ROUNDS: "1"
          AUTH_RECOVERY_BASE_DELAY_SECONDS: "300"
          REQUIRE_AUTH_RECOVERY_BUDGET: "true"
          OVERALL_TIMEOUT_SECONDS: "780"
          QUARANTINED_SERVERS_JSON: ${{ needs.vpn_quarantine.outputs.vpn-quarantined-servers-json }}
          PREFERRED_SERVERS_JSON: ${{ format('["{0}","{1}"]', needs.discovery_seed.outputs.vpn-server, needs.preflight.outputs.vpn-server) }}
          PREFERRED_SERVER_SLOT_COUNT: ${{ needs.preflight.outputs.vpn-auth-source == 'token' && '1' || inputs.vpn_parallelism }}
          RECOMMENDATION_SLOT_COUNT: ${{ needs.preflight.outputs.vpn-auth-source == 'token' && '0' || needs.plan.outputs.vpn-slot-count }}
          RECOMMENDATION_SLOT_INDEX: ${{ matrix.vpn_slot }}
        run: |
          set +e
          bash .github/scripts/run_with_deadline.sh \
            930 \
            5 \
            python3 .github/actions/nordvpn-connect/supervise.py
          rc=$?
          exit "$rc"

      - name: Write VPN auth circuit marker
        if: ${{ always() && steps.vpn.outputs.status == 'vpn_auth_failure' }}
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          SOURCE_SHA: ${{ env.WORKFLOW_SOURCE_SHA }}
          LANE_ID: ${{ matrix.lane_id }}
          LANE_INDEX: ${{ matrix.lane_index }}
          VPN_AUTH_SOURCE: ${{ needs.preflight.outputs.vpn-auth-source }}
          VPN_STATUS: ${{ steps.vpn.outputs.status }}
          VPN_SERVER: ${{ steps.vpn.outputs.server || needs.preflight.outputs.vpn-server }}
          VPN_EXIT_IP: ${{ steps.vpn.outputs.exit-ip }}
          VPN_ATTEMPTED_SERVERS_JSON: ${{ steps.vpn.outputs.attempted-servers-json || '[]' }}
          VPN_FAILED_SERVERS_JSON: ${{ steps.vpn.outputs.failed-servers-json || '[]' }}
          MARKER_PATH: artifacts/vpn-control/auth-circuit-marker.json
        run: python3 .github/scripts/vpn_control_plane.py write-marker --kind auth-circuit

      - name: Publish VPN auth circuit marker
        id: vpn_auth_circuit_marker
        if: ${{ always() && steps.vpn.outputs.status == 'vpn_auth_failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: false
          name: full-extraction-vpn-auth-circuit-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/vpn-control/auth-circuit-marker.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Check for a sibling VPN auth circuit marker
        id: vpn_auth_circuit_lookup
        if: ${{ always() && steps.vpn.outputs.status == 'vpn_auth_failure' && steps.vpn_auth_circuit_marker.outcome == 'failure' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          SOURCE_SHA: ${{ env.WORKFLOW_SOURCE_SHA }}
          VPN_AUTH_SOURCE: ${{ needs.preflight.outputs.vpn-auth-source }}
        run: >-
          python3 .github/scripts/vpn_control_plane.py verify-auth
          --timeout-seconds 30
          --poll-interval-seconds 5

      - name: Retry VPN auth circuit marker publication
        id: vpn_auth_circuit_marker_retry
        if: ${{ always() && steps.vpn.outputs.status == 'vpn_auth_failure' && steps.vpn_auth_circuit_marker.outcome == 'failure' && steps.vpn_auth_circuit_lookup.outputs.status == 'absent_timeout' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: false
          name: full-extraction-vpn-auth-circuit-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/vpn-control/auth-circuit-marker.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Verify VPN auth circuit marker
        id: vpn_auth_circuit_verify
        if: ${{ always() && steps.vpn.outputs.status == 'vpn_auth_failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          SOURCE_SHA: ${{ env.WORKFLOW_SOURCE_SHA }}
          VPN_AUTH_SOURCE: ${{ needs.preflight.outputs.vpn-auth-source }}
        run: >-
          python3 .github/scripts/vpn_control_plane.py verify-auth
          --timeout-seconds 120
          --poll-interval-seconds 5

      # ── Configure environment ──
      - name: Configure extraction environment
        env:
          CONCURRENCY: ${{ inputs.concurrency }}
          EFFECTIVE_NETWORK_MODE: ${{ needs.preflight.outputs.effective-network-mode }}
          DIRECT_REQUEST_PROFILE: ${{ inputs.direct_request_profile }}
          DIRECT_TIMEOUT_CAP_MINUTES: "30"
          PATTERNS: ${{ matrix.patterns }}
          ENDPOINTS: ${{ matrix.endpoints }}
        run: |
          lane_concurrency="$CONCURRENCY"
          effective_network_mode="${EFFECTIVE_NETWORK_MODE:-vpn}"
          write_env() {
            printf '%s\n' "$1" >> "$GITHUB_ENV"
          }

          if [ "$effective_network_mode" = "direct" ]; then
            direct_timeout_cap_minutes="${DIRECT_TIMEOUT_CAP_MINUTES:-30}"
            if ! [[ "$direct_timeout_cap_minutes" =~ ^[0-9]+$ ]] || [ "$direct_timeout_cap_minutes" -le 0 ]; then
              echo "::error::Unsupported direct_timeout_cap_minutes: $direct_timeout_cap_minutes"
              exit 1
            fi
            write_env "NBADB_DIRECT_LANE_TIMEOUT_CAP_SECONDS=$((direct_timeout_cap_minutes * 60))"

            direct_profile="${DIRECT_REQUEST_PROFILE:-direct}"
            case "$direct_profile" in
              direct|conservative|moderate|aggressive|turbo)
                lane_concurrency="$direct_profile"
                ;;
              *)
                echo "::error::Unsupported direct_request_profile: $direct_profile"
                exit 1
                ;;
            esac
            echo "::notice::Using direct no-VPN extraction profile: $lane_concurrency"
            case "$direct_profile" in
              turbo|aggressive)
                write_env 'NBADB_REQUEST_TIMEOUT_CAP=10'
                ;;
              moderate)
                write_env 'NBADB_REQUEST_TIMEOUT_CAP=15'
                ;;
              *)
                write_env 'NBADB_REQUEST_TIMEOUT_CAP=20'
                ;;
            esac
            write_env 'NBADB_EXTRACT_MAX_RETRIES=0'
            write_env 'NBADB_EXTRACT_RETRY_BASE_DELAY=0.5'
            # Direct-mode player-history lanes can contain hundreds of
            # player-season calls. Keep the slow family to one player at a
            # time so a direct egress stall records a concrete failure instead
            # of leaving an entire chunk in the running state.
            write_env 'NBADB_ADAPTIVE_CHUNK_MIN_SIZE=1'
            write_env 'NBADB_ADAPTIVE_CHUNK_MAX_SIZE=100'
            write_env 'NBADB_FAMILY_CHUNK_MULTIPLIERS={"default":1.0,"box_score":1.0,"play_by_play":0.5,"player_history":0.001,"team_history":0.5}'
          fi
          # Hosted runners have repeatedly dropped long-running singleton player lanes
          # after clean VPN setup, so force those lanes onto the lowest-stress profile.
          if [ "$effective_network_mode" != "direct" ] && [ "$PATTERNS" = "player" ] && [ -n "$ENDPOINTS" ] && [ "${ENDPOINTS#*,}" = "$ENDPOINTS" ]; then
            lane_concurrency="conservative"
            echo "::notice::Forcing conservative extraction profile for singleton player lane: $ENDPOINTS"
          fi

          case "$lane_concurrency" in
            direct)
              write_env 'NBADB_RATE_LIMIT=2'
              write_env 'NBADB_DISCOVERY_CONCURRENCY=2'
              write_env 'NBADB_THREAD_POOL_SIZE=24'
              write_env 'NBADB_CIRCUIT_BREAKER_MAX_WAIT=240'
              write_env 'NBADB_DEFAULT_CHUNK_SIZE=400'
              write_env 'NBADB_PBP_CHUNK_SIZE=800'
              ;;
            conservative)
              write_env 'NBADB_RATE_LIMIT=6'
              write_env 'NBADB_DISCOVERY_CONCURRENCY=4'
              write_env 'NBADB_THREAD_POOL_SIZE=48'
              write_env 'NBADB_CIRCUIT_BREAKER_MAX_WAIT=180'
              write_env 'NBADB_DEFAULT_CHUNK_SIZE=750'
              write_env 'NBADB_PBP_CHUNK_SIZE=1500'
              ;;
            moderate)
              write_env 'NBADB_RATE_LIMIT=10'
              write_env 'NBADB_DISCOVERY_CONCURRENCY=6'
              write_env 'NBADB_THREAD_POOL_SIZE=64'
              write_env 'NBADB_CIRCUIT_BREAKER_MAX_WAIT=120'
              write_env 'NBADB_DEFAULT_CHUNK_SIZE=1000'
              write_env 'NBADB_PBP_CHUNK_SIZE=2000'
              ;;
            aggressive)
              write_env 'NBADB_RATE_LIMIT=14'
              write_env 'NBADB_DISCOVERY_CONCURRENCY=8'
              write_env 'NBADB_THREAD_POOL_SIZE=96'
              write_env 'NBADB_CIRCUIT_BREAKER_MAX_WAIT=90'
              write_env 'NBADB_DEFAULT_CHUNK_SIZE=1250'
              write_env 'NBADB_PBP_CHUNK_SIZE=2500'
              ;;
            turbo)
              write_env 'NBADB_RATE_LIMIT=24'
              write_env 'NBADB_DISCOVERY_CONCURRENCY=12'
              write_env 'NBADB_THREAD_POOL_SIZE=128'
              write_env 'NBADB_CIRCUIT_BREAKER_MAX_WAIT=60'
              write_env 'NBADB_DEFAULT_CHUNK_SIZE=2000'
              write_env 'NBADB_PBP_CHUNK_SIZE=4000'
              ;;
            *)
              echo "::error::Unsupported concurrency setting: $lane_concurrency"
              exit 1
              ;;
          esac
          if [ "$effective_network_mode" = "direct" ]; then
            # Keep direct egress retries observable. The generic concurrency
            # profile writes a larger breaker wait above, so apply this after
            # the profile block.
            write_env 'NBADB_CIRCUIT_BREAKER_MAX_WAIT=15'
          fi

      - name: Rehydrate completed lane
        if: ${{ matrix.resume_only }}
        env:
          RESTORE_USABLE: ${{ steps.restore_state.outputs.restore-usable }}
        run: |
          if [ "$RESTORE_USABLE" != "true" ] || [ ! -f data/nbadb/nba.duckdb ]; then
            echo "::error::Lane marked resume_only but no usable durable DuckDB state was restored"
            exit 1
          fi
          echo "::notice::Lane already complete; reusing attested durable state and skipping extraction"

      - name: Block extraction provider work until runtime collectors exist
        if: ${{ !matrix.resume_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERATION_AUTHORITY_STATUS: ${{ needs.plan.outputs.operation-authority-status }}
          COLLECTOR_STATUS: ${{ needs.plan.outputs.free-execution-collector-status }}
          COLLECTOR_AUTHENTICATED: ${{ needs.plan.outputs.free-execution-collector-authenticated }}
          RUNTIME_CONTEXT_STATUS: ${{ needs.plan.outputs.free-execution-runtime-context-status }}
          STORAGE_MUTATIONS_ALLOWED: ${{ needs.plan.outputs.free-execution-storage-mutations-allowed }}
          PROVIDER_CALLS_ALLOWED: ${{ needs.plan.outputs.free-execution-provider-calls-allowed }}
          MUTATIONS_AUTHORIZED: ${{ needs.plan.outputs.free-execution-mutations-authorized }}
          LANE_ID: ${{ matrix.lane_id }}
        run: python3 .github/scripts/attest_free_execution_job.py authorize --output artifacts/extraction/free-execution-authorization.json

      # ── Run extraction ──
      - name: Run extraction
        id: extract
        if: ${{ !matrix.resume_only }}
        env:
          SEASON_START: ${{ matrix.season_start }}
          SEASON_END: ${{ matrix.season_end }}
          PATTERNS: ${{ matrix.patterns }}
          SEASON_TYPES: ${{ matrix.season_types }}
          CONTEXT_MEASURES: ${{ matrix.context_measures }}
          BACKFILL_ENDPOINTS: ${{ matrix.endpoints }}
          FORCE_REEXTRACT: ${{ inputs.force_reextract }}
          LANE_TIMEOUT_SECONDS: ${{ matrix.timeout_seconds }}
          EXTRACT_SUMMARY_PATH: artifacts/extraction/extract-summary.json
          NBADB_NETWORK_MODE: ${{ needs.preflight.outputs.effective-network-mode }}
          LANE_KIND: ${{ matrix.lane_kind }}
          LANE_ID: ${{ matrix.lane_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERATION_AUTHORITY_STATUS: ${{ needs.plan.outputs.operation-authority-status }}
          COLLECTOR_STATUS: ${{ needs.plan.outputs.free-execution-collector-status }}
          COLLECTOR_AUTHENTICATED: ${{ needs.plan.outputs.free-execution-collector-authenticated }}
          RUNTIME_CONTEXT_STATUS: ${{ needs.plan.outputs.free-execution-runtime-context-status }}
          STORAGE_MUTATIONS_ALLOWED: ${{ needs.plan.outputs.free-execution-storage-mutations-allowed }}
          PROVIDER_CALLS_ALLOWED: ${{ needs.plan.outputs.free-execution-provider-calls-allowed }}
          MUTATIONS_AUTHORIZED: ${{ needs.plan.outputs.free-execution-mutations-authorized }}
          DEPENDENT_PLAN_SHA256: ${{ matrix.dependent_plan_sha256 }}
          DEPENDENT_BUNDLE_SHA256: ${{ matrix.dependent_bundle_sha256 }}
          DEPENDENT_FOUNDATION_TRANSACTION_SHA256: ${{ matrix.dependent_foundation_transaction_sha256 }}
          DEPENDENT_PROVIDER_AUTHORITY_SHA256: ${{ matrix.dependent_provider_authority_sha256 }}
          DEPENDENT_LANE_SHA256: ${{ matrix.dependent_lane_sha256 }}
        run: |
          mkdir -p artifacts/extraction
          python3 .github/scripts/attest_free_execution_job.py verify --input artifacts/extraction/free-execution-authorization.json
          if [ "$LANE_KIND" = "post_foundation_dependent_matchup" ]; then
            mapfile -t execution_plans < <(find dependent-workload-artifact -name dependent-execution-plan.json -type f -print)
            if [ "${#execution_plans[@]}" -ne 1 ]; then
              echo "::error::Dependent lane requires exactly one execution plan"
              exit 1
            fi
            uv run python -m nbadb.orchestrate.dependent_workload_execution \
              --plan-path "${execution_plans[0]}" \
              --lane-id "$LANE_ID" \
              --expected-plan-sha256 "$DEPENDENT_PLAN_SHA256" \
              --expected-bundle-sha256 "$DEPENDENT_BUNDLE_SHA256" \
              --expected-lane-sha256 "$DEPENDENT_LANE_SHA256" \
              --expected-foundation-transaction-sha256 "$DEPENDENT_FOUNDATION_TRANSACTION_SHA256" \
              --expected-source-sha "$WORKFLOW_SOURCE_SHA" \
              --expected-provider-authority-sha256 "$DEPENDENT_PROVIDER_AUTHORITY_SHA256" \
              --data-dir data/nbadb \
              --timeout-seconds "$LANE_TIMEOUT_SECONDS" \
              --summary-path "$EXTRACT_SUMMARY_PATH"
          else
            python .github/scripts/run_extract_lane.py
          fi

      - name: Upload VPN diagnostics
        if: ${{ always() && needs.preflight.outputs.effective-network-mode == 'vpn' && (steps.vpn_auth_circuit_final.outputs.status || steps.vpn_auth_circuit.outputs.status) != 'vpn_auth_circuit_open' && (steps.vpn_auth_circuit_final.outputs.status || steps.vpn_auth_circuit.outputs.status) != 'vpn_auth_circuit_check_failed' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: extraction-vpn-diagnostics-${{ env.ACTIVE_CHAIN_ID }}-${{ matrix.lane_id }}
          path: |
            ${{ runner.temp }}/nordvpn/openvpn.log
            ${{ runner.temp }}/nordvpn/openvpn.pid
            ${{ runner.temp }}/nordvpn/vpn-exit-ip.json
            ${{ runner.temp }}/nordvpn/baseline-ip.json
            ${{ runner.temp }}/nordvpn/*.ovpn
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

      - name: Disconnect VPN
        if: ${{ always() && !matrix.resume_only && needs.preflight.outputs.effective-network-mode == 'vpn' && (steps.vpn_auth_circuit_final.outputs.status || steps.vpn_auth_circuit.outputs.status) != 'vpn_auth_circuit_open' && (steps.vpn_auth_circuit_final.outputs.status || steps.vpn_auth_circuit.outputs.status) != 'vpn_auth_circuit_check_failed' }}
        uses: ./.github/actions/nordvpn-disconnect
        with:
          pid: ${{ steps.vpn.outputs.pid }}
          pid-file: ${{ steps.vpn.outputs.pid-file }}
          work-dir: ${{ steps.vpn.outputs.work-dir }}

      - name: Finalize lane status
        id: lane_status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RESUME_ONLY: ${{ matrix.resume_only }}
          RESTORE_USABLE: ${{ steps.restore_state.outputs.restore-usable }}
          EXTRACT_STATUS: ${{ steps.extract.outputs.status }}
          VPN_STATUS: ${{ steps.vpn.outputs.status }}
          VPN_AUTH_CIRCUIT_STATUS: ${{ steps.vpn_auth_circuit_final.outputs.status || steps.vpn_auth_circuit.outputs.status }}
          EFFECTIVE_NETWORK_MODE: ${{ needs.preflight.outputs.effective-network-mode }}
        run: |
          if [ "$JOB_STATUS" = "cancelled" ]; then
            status="cancelled"
          elif [ "$RESUME_ONLY" = "true" ] && [ "$RESTORE_USABLE" = "true" ] && [ -f data/nbadb/nba.duckdb ]; then
            status="complete"
          elif [ -n "$EXTRACT_STATUS" ]; then
            status="$EXTRACT_STATUS"
          elif [ "$VPN_AUTH_CIRCUIT_STATUS" = "vpn_auth_circuit_open" ] || \
               [ "$VPN_AUTH_CIRCUIT_STATUS" = "vpn_auth_circuit_check_failed" ]; then
            status="$VPN_AUTH_CIRCUIT_STATUS"
          elif [ -n "$VPN_STATUS" ] && [ "$VPN_STATUS" != "connected" ]; then
            status="$VPN_STATUS"
          elif [ "$EFFECTIVE_NETWORK_MODE" = "direct" ]; then
            status="failed-before-extract"
          else
            status="failed-before-extract"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # ── Progress summary ──
      - name: Lane progress
        if: always()
        env:
          LANE_ID: ${{ matrix.lane_id }}
          NAME: ${{ matrix.lane_name }}
          KIND: ${{ matrix.lane_kind }}
          ITERATION: ${{ inputs.iteration }}
          STATUS: ${{ steps.lane_status.outputs.status }}
          EXTRACT_STATUS: ${{ steps.extract.outputs.status }}
          TIMEOUT_SECONDS: ${{ matrix.timeout_seconds }}
          EFFECTIVE_TIMEOUT_SECONDS: ${{ steps.extract.outputs.effective-timeout-seconds || matrix.timeout_seconds }}
          VPN_SERVER: ${{ steps.vpn.outputs.server }}
          VPN_INTERFACE: ${{ steps.vpn.outputs.interface }}
          VPN_BASELINE_IP: ${{ steps.vpn.outputs.baseline-ip }}
          VPN_EXIT_IP: ${{ steps.vpn.outputs.exit-ip }}
          VPN_STATUS: ${{ steps.vpn.outputs.status }}
          REQUESTED_NETWORK_MODE: ${{ inputs.network_mode }}
          EFFECTIVE_NETWORK_MODE: ${{ needs.preflight.outputs.effective-network-mode }}
          RESTORE_SOURCE: ${{ steps.restore_state.outputs.restore-source }}
          RESTORE_USABLE: ${{ steps.restore_state.outputs.restore-usable }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          RESUME_ONLY: ${{ matrix.resume_only }}
        run: |
          effective_vpn_status="${VPN_STATUS:-}"
          if [ "$RESUME_ONLY" = "true" ] && [ -z "$effective_vpn_status" ]; then
            effective_vpn_status="resume-only"
          elif [ "$EFFECTIVE_NETWORK_MODE" = "direct" ] && [ -z "$effective_vpn_status" ]; then
            effective_vpn_status="direct-no-vpn"
          elif [ -z "$effective_vpn_status" ]; then
            effective_vpn_status="unknown"
          fi
          {
            echo "## Lane $LANE_ID ($NAME) — Iteration $ITERATION"
            echo "**Status:** $STATUS"
            echo "**Extract status:** ${EXTRACT_STATUS:-not-run}"
            echo "**Kind:** $KIND"
            echo "**Chain ID:** $CHAIN_ID"
            echo "**Restore source:** ${RESTORE_SOURCE:-none}"
            echo "**Restore usable:** ${RESTORE_USABLE:-false}"
            echo "**Resume only:** $RESUME_ONLY"
            echo "**Requested network mode:** ${REQUESTED_NETWORK_MODE:-vpn}"
            echo "**Effective network mode:** ${EFFECTIVE_NETWORK_MODE:-vpn}"
            echo "**Lane timeout seconds:** $TIMEOUT_SECONDS"
            echo "**Effective lane timeout seconds:** $EFFECTIVE_TIMEOUT_SECONDS"
            echo "**VPN status:** $effective_vpn_status"
            echo "**VPN server:** ${VPN_SERVER:-n/a}"
            echo "**VPN interface:** ${VPN_INTERFACE:-n/a}"
            echo "**VPN IP:** ${VPN_BASELINE_IP:-unknown} → ${VPN_EXIT_IP:-unknown}"
            echo '```'
            ls -lh data/nbadb/ 2>/dev/null || echo "No data directory"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write lane metadata
        id: lane_metadata
        if: ${{ always() && (steps.vpn_auth_circuit_final.outputs.status || steps.vpn_auth_circuit.outputs.status) != 'vpn_auth_circuit_open' && (steps.vpn_auth_circuit_final.outputs.status || steps.vpn_auth_circuit.outputs.status) != 'vpn_auth_circuit_check_failed' }}
        env:
          LANE_ID: ${{ matrix.lane_id }}
          LANE_INDEX: ${{ matrix.lane_index }}
          NAME: ${{ matrix.lane_name }}
          KIND: ${{ matrix.lane_kind }}
          ITERATION: ${{ inputs.iteration }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          SOURCE_REF: ${{ env.WORKFLOW_SOURCE_REF }}
          SOURCE_SHA: ${{ env.WORKFLOW_SOURCE_SHA }}
          STATUS: ${{ steps.lane_status.outputs.status }}
          CACHE_HIT: "false"
          RESTORE_SOURCE: ${{ steps.restore_state.outputs.restore-source || 'none' }}
          RESTORE_USABLE: ${{ steps.restore_state.outputs.restore-usable || 'false' }}
          RESTART_MODE: ${{ steps.restore_state.outputs.restart-mode || 'clean-restart' }}
          RESTORE_ERROR: ${{ steps.state_artifact_restore.outputs.restore-error || '' }}
          RESUME_ONLY: ${{ matrix.resume_only }}
          TIMEOUT_SECONDS: ${{ matrix.timeout_seconds }}
          EFFECTIVE_TIMEOUT_SECONDS: ${{ steps.extract.outputs.effective-timeout-seconds || matrix.timeout_seconds }}
          PATTERNS: ${{ matrix.patterns }}
          SEASON_TYPES: ${{ matrix.season_types }}
          CONTEXT_MEASURES: ${{ matrix.context_measures }}
          ENDPOINTS: ${{ matrix.endpoints }}
          COVERAGE_UNITS_HASH: ${{ matrix.coverage_units_hash }}
          SEASON_START: ${{ matrix.season_start }}
          SEASON_END: ${{ matrix.season_end }}
          PARENT_LANE_ID: ${{ matrix.parent_lane_id }}
          SPLIT_GENERATION: ${{ matrix.split_generation }}
          STARTED_AT: ${{ steps.extract.outputs.started-at }}
          FINISHED_AT: ${{ steps.extract.outputs.finished-at }}
          EXTRACT_STATUS: ${{ steps.extract.outputs.status || 'not-run' }}
          EXTRACT_EXIT_CODE: ${{ steps.extract.outputs.exit-code || '' }}
          NETWORK_MODE: ${{ inputs.network_mode }}
          EFFECTIVE_NETWORK_MODE: ${{ needs.preflight.outputs.effective-network-mode }}
          DIRECT_EGRESS_REASON: ${{ needs.preflight.outputs.effective-network-mode == 'direct' && 'vpn-unavailable-or-bypassed' || '' }}
          VPN_STATUS: ${{ steps.vpn.outputs.status || (needs.preflight.outputs.effective-network-mode == 'direct' && 'direct-no-vpn' || '') }}
          VPN_SERVER: ${{ steps.vpn.outputs.server }}
          VPN_INTERFACE: ${{ steps.vpn.outputs.interface }}
          VPN_EXIT_IP: ${{ steps.vpn.outputs.exit-ip }}
          VPN_ATTEMPTED_SERVERS_JSON: ${{ steps.vpn.outputs.attempted-servers-json || '[]' }}
          VPN_FAILED_SERVERS_JSON: ${{ steps.vpn.outputs.failed-servers-json || '[]' }}
          EXTRACT_SUMMARY_PATH: artifacts/extraction/extract-summary.json
          RECOVERY_ARTIFACT_NAME: extraction-lane-recovery-${{ env.ACTIVE_CHAIN_ID }}-${{ matrix.lane_id }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        run: |
          mkdir -p artifacts/extraction
          if [[ ",${PATTERNS}," == *",player_team_season,"* ]]; then
            workload_manifest="$(find discovery-artifact -type f -name nba.player-team-season-workload.player-team-season-workload.json -print -quit)"
            if [ -n "$workload_manifest" ]; then
              workload_duckdb_path="$(dirname "$workload_manifest")/nba.duckdb"
              export WORKLOAD_DUCKDB_PATH="$workload_duckdb_path"
            fi
          fi
          uv run python .github/scripts/write_lane_metadata.py

      - name: Write circuit-deferred lane metadata
        id: circuit_lane_metadata
        if: ${{ always() && ((steps.vpn_auth_circuit_final.outputs.status || steps.vpn_auth_circuit.outputs.status) == 'vpn_auth_circuit_open' || (steps.vpn_auth_circuit_final.outputs.status || steps.vpn_auth_circuit.outputs.status) == 'vpn_auth_circuit_check_failed') }}
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          ITERATION: ${{ inputs.iteration }}
          LANE_ID: ${{ matrix.lane_id }}
          LANE_INDEX: ${{ matrix.lane_index }}
          NAME: ${{ matrix.lane_name }}
          KIND: ${{ matrix.lane_kind }}
          SOURCE_REF: ${{ env.WORKFLOW_SOURCE_REF }}
          SOURCE_SHA: ${{ env.WORKFLOW_SOURCE_SHA }}
          COVERAGE_UNITS_HASH: ${{ matrix.coverage_units_hash }}
          TIMEOUT_SECONDS: ${{ matrix.timeout_seconds }}
          EFFECTIVE_TIMEOUT_SECONDS: ${{ matrix.timeout_seconds }}
          RESUME_ONLY: ${{ matrix.resume_only }}
          PATTERNS: ${{ matrix.patterns }}
          SEASON_TYPES: ${{ matrix.season_types }}
          ENDPOINTS: ${{ matrix.endpoints }}
          CONTEXT_MEASURES: ${{ matrix.context_measures }}
          SEASON_START: ${{ matrix.season_start }}
          SEASON_END: ${{ matrix.season_end }}
          PARENT_LANE_ID: ${{ matrix.parent_lane_id }}
          SPLIT_GENERATION: ${{ matrix.split_generation }}
          NETWORK_MODE: ${{ inputs.network_mode }}
          EFFECTIVE_NETWORK_MODE: ${{ needs.preflight.outputs.effective-network-mode }}
          VPN_AUTH_SOURCE: ${{ needs.preflight.outputs.vpn-auth-source }}
          VPN_AUTH_CIRCUIT_STATUS: ${{ steps.vpn_auth_circuit_final.outputs.status || steps.vpn_auth_circuit.outputs.status }}
        run: python3 .github/scripts/vpn_control_plane.py write-deferred-metadata

      - name: Upload circuit-deferred lane metadata
        id: circuit_lane_metadata_artifact
        if: ${{ always() && steps.circuit_lane_metadata.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: extraction-lane-metadata-${{ env.ACTIVE_CHAIN_ID }}-${{ matrix.lane_id }}
          path: artifacts/extraction/lane-metadata.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Retry circuit-deferred lane metadata upload
        id: circuit_lane_metadata_artifact_retry
        if: ${{ always() && steps.circuit_lane_metadata_artifact.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: extraction-lane-metadata-${{ env.ACTIVE_CHAIN_ID }}-${{ matrix.lane_id }}
          path: artifacts/extraction/lane-metadata.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      # ── Upload lane artifact ──
      - name: Upload complete lane artifact
        id: complete_lane_artifact
        if: ${{ always() && steps.lane_metadata.outcome == 'success' && steps.lane_metadata.outputs.snapshot-attested == 'true' && steps.lane_metadata.outputs.final-outcome == 'complete' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: extraction-lane-${{ env.ACTIVE_CHAIN_ID }}-${{ matrix.lane_id }}
          path: |
            data/nbadb/nba.duckdb
            artifacts/extraction/lane-state-attestation.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload incomplete lane state artifact
        id: recovery_lane_artifact
        if: ${{ always() && steps.lane_metadata.outcome == 'success' && steps.lane_metadata.outputs.snapshot-attested == 'true' && steps.lane_metadata.outputs.final-outcome != 'complete' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: extraction-lane-recovery-${{ env.ACTIVE_CHAIN_ID }}-${{ matrix.lane_id }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            data/nbadb/nba.duckdb
            artifacts/extraction/lane-state-attestation.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Wait before retrying lane artifact upload
        if: ${{ always() && (steps.complete_lane_artifact.outcome == 'failure' || steps.recovery_lane_artifact.outcome == 'failure') }}
        run: sleep 15

      - name: Retry complete lane artifact upload
        id: complete_lane_artifact_retry
        if: ${{ always() && steps.complete_lane_artifact.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: extraction-lane-${{ env.ACTIVE_CHAIN_ID }}-${{ matrix.lane_id }}
          path: |
            data/nbadb/nba.duckdb
            artifacts/extraction/lane-state-attestation.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Retry incomplete lane state artifact upload
        id: recovery_lane_artifact_retry
        if: ${{ always() && steps.recovery_lane_artifact.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: extraction-lane-recovery-${{ env.ACTIVE_CHAIN_ID }}-${{ matrix.lane_id }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            data/nbadb/nba.duckdb
            artifacts/extraction/lane-state-attestation.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Finalize durable lane artifact receipt
        id: finalize_lane_metadata
        if: ${{ always() && steps.lane_metadata.outcome == 'success' }}
        env:
          COMPLETE_ARTIFACT_DIGEST: ${{ steps.complete_lane_artifact.outcome == 'success' && steps.complete_lane_artifact.outputs.artifact-digest || steps.complete_lane_artifact_retry.outputs.artifact-digest }}
          COMPLETE_ARTIFACT_ID: ${{ steps.complete_lane_artifact.outcome == 'success' && steps.complete_lane_artifact.outputs.artifact-id || steps.complete_lane_artifact_retry.outputs.artifact-id }}
          COMPLETE_ARTIFACT_OUTCOME: ${{ steps.complete_lane_artifact.outcome == 'success' && steps.complete_lane_artifact.outcome || steps.complete_lane_artifact_retry.outcome }}
          FINAL_OUTCOME: ${{ steps.lane_metadata.outputs.final-outcome }}
          RECOVERY_ARTIFACT_DIGEST: ${{ steps.recovery_lane_artifact.outcome == 'success' && steps.recovery_lane_artifact.outputs.artifact-digest || steps.recovery_lane_artifact_retry.outputs.artifact-digest }}
          RECOVERY_ARTIFACT_ID: ${{ steps.recovery_lane_artifact.outcome == 'success' && steps.recovery_lane_artifact.outputs.artifact-id || steps.recovery_lane_artifact_retry.outputs.artifact-id }}
          RECOVERY_ARTIFACT_OUTCOME: ${{ steps.recovery_lane_artifact.outcome == 'success' && steps.recovery_lane_artifact.outcome || steps.recovery_lane_artifact_retry.outcome }}
          SNAPSHOT_ATTESTED: ${{ steps.lane_metadata.outputs.snapshot-attested }}
        run: |
          python - <<'PY'
          # FINALIZE_LANE_ARTIFACT_RECEIPT
          import json
          import os
          import re
          from pathlib import Path

          path = Path("artifacts/extraction/lane-metadata.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          state_artifact = payload.get("state_artifact")
          if not isinstance(payload, dict) or not isinstance(state_artifact, dict):
              raise SystemExit("lane metadata is missing state_artifact")

          snapshot_attested = os.environ.get("SNAPSHOT_ATTESTED") == "true"
          final_outcome = os.environ.get("FINAL_OUTCOME", "")
          complete = final_outcome == "complete"
          prefix = "COMPLETE" if complete else "RECOVERY"
          upload_outcome = os.environ.get(f"{prefix}_ARTIFACT_OUTCOME", "")
          artifact_id = os.environ.get(f"{prefix}_ARTIFACT_ID", "")
          raw_artifact_digest = os.environ.get(f"{prefix}_ARTIFACT_DIGEST", "").lower()
          artifact_digest_hex = raw_artifact_digest.removeprefix("sha256:")
          artifact_digest = (
              f"sha256:{artifact_digest_hex}"
              if re.fullmatch(r"[0-9a-f]{64}", artifact_digest_hex) is not None
              else ""
          )

          durable = (
              snapshot_attested
              and upload_outcome == "success"
              and re.fullmatch(r"[1-9][0-9]*", artifact_id) is not None
              and bool(artifact_digest)
          )
          state_artifact["uploaded"] = durable
          if durable:
              state_artifact["artifact_id"] = artifact_id
              state_artifact["artifact_digest"] = artifact_digest
          else:
              state_artifact["attested"] = False
              state_artifact["artifact_id"] = ""
              state_artifact["artifact_digest"] = ""
              if snapshot_attested:
                  payload["status"] = "pipeline_failure"
                  payload["raw_status"] = "state-artifact-upload-failed"
                  payload["failure_class"] = "runner_infrastructure"
                  payload["root_error_type"] = "StateArtifactUploadFailure"
                  failure_counts = payload.get("failure_class_counts")
                  if not isinstance(failure_counts, dict):
                      failure_counts = {}
                      payload["failure_class_counts"] = failure_counts
                  failure_counts["runner_infrastructure"] = (
                      int(failure_counts.get("runner_infrastructure") or 0) + 1
                  )
                  root_counts = payload.get("root_error_type_counts")
                  if not isinstance(root_counts, dict):
                      root_counts = {}
                      payload["root_error_type_counts"] = root_counts
                  root_counts["StateArtifactUploadFailure"] = (
                      int(root_counts.get("StateArtifactUploadFailure") or 0) + 1
                  )

          temporary_path = path.with_suffix(".json.tmp")
          temporary_path.write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          temporary_path.replace(path)

          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with Path(output_path).open("a", encoding="utf-8") as handle:
                  handle.write(f"artifact-durable={str(durable).lower()}\n")
                  handle.write(f"final-outcome={payload.get('status', '')}\n")
          PY

      - name: Upload lane metadata
        id: lane_metadata_artifact
        if: ${{ always() && steps.lane_metadata.outcome == 'success' && steps.finalize_lane_metadata.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: extraction-lane-metadata-${{ env.ACTIVE_CHAIN_ID }}-${{ matrix.lane_id }}
          path: |
            artifacts/extraction/lane-metadata.json
            artifacts/extraction/extract-summary.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Retry lane metadata upload
        id: lane_metadata_artifact_retry
        if: ${{ always() && steps.lane_metadata_artifact.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: extraction-lane-metadata-${{ env.ACTIVE_CHAIN_ID }}-${{ matrix.lane_id }}
          path: |
            artifacts/extraction/lane-metadata.json
            artifacts/extraction/extract-summary.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload diagnostics-only lane snapshot
        if: ${{ always() && ((steps.circuit_lane_metadata.outcome == 'success' && steps.circuit_lane_metadata_artifact.outcome == 'failure' && steps.circuit_lane_metadata_artifact_retry.outcome != 'success') || (steps.circuit_lane_metadata.outcome != 'success' && (steps.lane_metadata.outcome != 'success' || steps.finalize_lane_metadata.outcome != 'success' || steps.finalize_lane_metadata.outputs.artifact-durable != 'true' || (steps.lane_metadata_artifact.outcome == 'failure' && steps.lane_metadata_artifact_retry.outcome != 'success')))) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: extraction-lane-diagnostics-only-${{ env.ACTIVE_CHAIN_ID }}-${{ matrix.lane_id }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            data/nbadb/nba.duckdb
            data/nbadb/nba.duckdb.wal
            artifacts/extraction/lane-metadata.json
            artifacts/extraction/lane-state-attestation.json
            artifacts/extraction/lane-state-untrusted
            artifacts/extraction/extract-summary.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  # ─────────────────────────────────────────────────────────────
  #  Replay a prior terminal checkpoint without rebuilding it
  # ─────────────────────────────────────────────────────────────
  terminal_replay:
    needs: [plan, publication_preflight]
    if: ${{ always() && !cancelled() && inputs.resume_source_run_id != '' && needs.plan.result == 'success' && needs.plan.outputs.operation-authority-status == 'validated' && needs.plan.outputs.free-execution-collector-status == 'admitted' && needs.plan.outputs.free-execution-collector-authenticated == 'true' && needs.plan.outputs.free-execution-runtime-context-status == 'authenticated' && needs.plan.outputs.free-execution-storage-mutations-allowed == 'true' && needs.plan.outputs.free-execution-provider-calls-allowed == 'true' && needs.plan.outputs.free-execution-mutations-authorized == 'true' && (!false || needs.publication_preflight.result == 'success') && needs.plan.outputs.lane-count != '0' && needs.plan.outputs.active-lane-count == '0' && needs.plan.outputs.matrix-lane-count == '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-name: ${{ steps.replay_receipt.outputs.artifact-name }}
      artifact-id: ${{ steps.replay_receipt.outputs.artifact-id }}
      artifact-digest: ${{ steps.replay_receipt.outputs.artifact-digest }}
      artifact-size: ${{ steps.replay_receipt.outputs.artifact-size-bytes }}
      artifact-archive-url: ${{ steps.replay_receipt.outputs.artifact-archive-url }}
      checkpoint-generation: ${{ steps.replay.outputs.checkpoint_generation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.WORKFLOW_SOURCE_SHA }}

      - name: Validate full extraction attempt
        env:
          FULL_EXTRACTION_ATTEMPT_GATE_ROLE: partial
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/validate_full_extraction_attempt.py

      - name: Verify exact zero-active plan artifact receipt
        id: plan_artifact
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          CURRENT_RUN_HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_ARTIFACT_DIGEST: ${{ needs.plan.outputs.plan-manifest-artifact-digest }}
          PLAN_ARTIFACT_ID: ${{ needs.plan.outputs.plan-manifest-artifact-id }}
          PLAN_ARTIFACT_NAME: ${{ needs.plan.outputs.plan-manifest-artifact-name }}
          PLAN_ARTIFACT_ARCHIVE_URL: ${{ needs.plan.outputs.plan-manifest-artifact-archive-url }}
          PLAN_ARTIFACT_SIZE: ${{ needs.plan.outputs.plan-manifest-artifact-size }}
        run: |
          python - <<'PY'
          # TERMINAL_REPLAY_PLAN_ARTIFACT_VERIFIER
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def gh_json(path: str) -> object:
              raw = subprocess.check_output(
                  [
                      "gh",
                      "api",
                      "--method",
                      "GET",
                      "-H",
                      "Accept: application/vnd.github+json",
                      "-H",
                      "X-GitHub-Api-Version: 2026-03-10",
                      path,
                  ],
                  text=True,
              )
              return json.loads(raw)

          artifact_id_raw = os.environ["PLAN_ARTIFACT_ID"]
          if re.fullmatch(r"[1-9][0-9]*", artifact_id_raw) is None:
              raise SystemExit("plan artifact ID must be a positive integer")
          artifact_id = int(artifact_id_raw)
          artifact_size_raw = os.environ["PLAN_ARTIFACT_SIZE"]
          if re.fullmatch(r"[1-9][0-9]*", artifact_size_raw) is None:
              raise SystemExit("plan artifact size must be a positive integer")
          expected_artifact_size = int(artifact_size_raw)
          digest_hex = os.environ["PLAN_ARTIFACT_DIGEST"].lower().removeprefix(
              "sha256:"
          )
          if re.fullmatch(r"[0-9a-f]{64}", digest_hex) is None:
              raise SystemExit("plan artifact digest must be SHA-256")
          artifact_digest = f"sha256:{digest_hex}"
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          chain_id = os.environ["CHAIN_ID"]
          repository = os.environ["GITHUB_REPOSITORY"]
          owner_head_sha = os.environ["CURRENT_RUN_HEAD_SHA"].lower()
          source_sha = os.environ["WORKFLOW_SOURCE_SHA"].lower()
          expected_name = f"full-extraction-manifest-{chain_id}"
          expected_artifact_url = (
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{repository}"
              f"/actions/artifacts/{artifact_id}"
          )
          expected_archive_url = f"{expected_artifact_url}/zip"
          if (
              os.environ["PLAN_ARTIFACT_NAME"] != expected_name
              or os.environ["PLAN_ARTIFACT_ARCHIVE_URL"]
              != expected_archive_url
              or re.fullmatch(r"[1-9][0-9]*", run_id) is None
              or run_attempt != "1"
              or re.fullmatch(r"[0-9a-f]{40}", owner_head_sha) is None
              or re.fullmatch(r"[0-9a-f]{40}", source_sha) is None
          ):
              raise SystemExit("plan artifact job outputs are invalid")

          expected_run_url = (
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{repository}"
              f"/actions/runs/{run_id}"
          )

          def validate_owner(raw: object) -> dict[str, object]:
              if not isinstance(raw, dict):
                  raise SystemExit("plan artifact REST owner is invalid")
              workflow_id = raw.get("workflow_id")
              owner_repository = raw.get("repository")
              if (
                  type(raw.get("id")) is not int
                  or raw.get("id") != int(run_id)
                  or raw.get("url") != expected_run_url
                  or not isinstance(owner_repository, dict)
                  or owner_repository.get("full_name") != repository
                  or str(raw.get("head_sha") or "").lower() != owner_head_sha
                  or raw.get("event") != "workflow_dispatch"
                  or raw.get("head_branch") != os.environ["WORKFLOW_SOURCE_REF"]
                  or raw.get("path")
                  != ".github/workflows/full-extraction.yml"
                  or type(raw.get("run_attempt")) is not int
                  or raw.get("run_attempt") != 1
                  or type(workflow_id) is not int
                  or workflow_id < 1
                  or raw.get("status") not in {"queued", "in_progress"}
                  or raw.get("conclusion") is not None
              ):
                  raise SystemExit("plan artifact REST owner is invalid")
              return raw

          owner_run = validate_owner(
              gh_json(f"/repos/{repository}/actions/runs/{run_id}")
          )
          artifact = gh_json(
              f"/repos/{repository}/actions/artifacts/{artifact_id}"
          )
          if not isinstance(artifact, dict):
              raise SystemExit("plan artifact REST provenance is invalid")
          rest_id = artifact.get("id")
          rest_size = artifact.get("size_in_bytes")
          workflow_run = artifact.get("workflow_run")
          if (
              isinstance(rest_id, bool)
              or not isinstance(rest_id, int)
              or rest_id != artifact_id
              or artifact.get("url") != expected_artifact_url
              or artifact.get("archive_download_url") != expected_archive_url
              or artifact.get("name") != expected_name
              or str(artifact.get("digest") or "").lower() != artifact_digest
              or isinstance(rest_size, bool)
              or not isinstance(rest_size, int)
              or rest_size != expected_artifact_size
              or artifact.get("expired") is not False
              or not isinstance(workflow_run, dict)
              or type(workflow_run.get("id")) is not int
              or workflow_run.get("id") != int(run_id)
              or str(workflow_run.get("head_sha") or "").lower() != owner_head_sha
          ):
              raise SystemExit(
                  "plan artifact REST identity does not match its exact job receipt"
              )
          final_owner_run = validate_owner(
              gh_json(f"/repos/{repository}/actions/runs/{run_id}")
          )
          if final_owner_run != owner_run:
              raise SystemExit(
                  "plan artifact owner changed after exact artifact selection"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"artifact_digest={artifact_digest}\n")
              handle.write(f"artifact_id={artifact_id}\n")
              handle.write(f"artifact_name={expected_name}\n")
              handle.write(f"artifact_size_bytes={rest_size}\n")
          PY

      - name: Download exact zero-active plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.plan-manifest-artifact-id }}
          path: plan-artifact/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error

      - name: Verify plan-selected resume source receipt
        id: source_selection
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          EXPECTED_ARTIFACT_ARCHIVE_URL: ${{ needs.plan.outputs.resume-manifest-artifact-archive-url }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.plan.outputs.resume-manifest-artifact-digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.plan.outputs.resume-manifest-artifact-id }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.plan.outputs.resume-manifest-artifact-name }}
          EXPECTED_ARTIFACT_SIZE: ${{ needs.plan.outputs.resume-manifest-artifact-size }}
          EXPECTED_RESOLUTION: ${{ needs.plan.outputs.resume-manifest-resolution }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.plan.outputs.resume-source-run-attempt }}
          EXPECTED_RUN_CONCLUSION: ${{ needs.plan.outputs.resume-source-run-conclusion }}
          EXPECTED_RUN_HEAD_SHA: ${{ needs.plan.outputs.resume-source-head-sha }}
          EXPECTED_RUN_ID: ${{ needs.plan.outputs.resume-source-run-id }}
          EXPECTED_RUN_STATUS: ${{ needs.plan.outputs.resume-source-run-status }}
          EXPECTED_WORKFLOW_ID: ${{ needs.plan.outputs.resume-source-workflow-id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_SOURCE_RUN_ID: ${{ inputs.resume_source_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/workflow-provenance"
          python .github/scripts/workflow_source_provenance.py attest-run \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$EXPECTED_RUN_ID" \
            --source-sha "$WORKFLOW_SOURCE_SHA" \
            --trusted-branch "$WORKFLOW_SOURCE_REF" \
            --workflow-path .github/workflows/full-extraction.yml \
            --required-state completed \
            --output "$RUNNER_TEMP/workflow-provenance/terminal-source-owner.json"
          python .github/scripts/workflow_source_provenance.py recheck-run \
            --attestation "$RUNNER_TEMP/workflow-provenance/terminal-source-owner.json" \
            --required-state completed \
            --output "$RUNNER_TEMP/workflow-provenance/terminal-source-owner-recheck.json"
          OWNER_RECHECK_PATH="$RUNNER_TEMP/workflow-provenance/terminal-source-owner-recheck.json" python - <<'PY'
          # TERMINAL_REPLAY_PLAN_SELECTION_VERIFIER
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def exactly_one(name: str) -> Path:
              matches = list(Path("plan-artifact").rglob(name))
              if (
                  len(matches) != 1
                  or matches[0].is_symlink()
                  or not matches[0].is_file()
              ):
                  raise SystemExit(
                      f"plan artifact must contain exactly one regular {name}"
                  )
              return matches[0]

          def positive_integer(value: str, label: str) -> int:
              if re.fullmatch(r"[1-9][0-9]*", value) is None:
                  raise SystemExit(f"{label} must be a positive integer")
              return int(value)

          def gh_json(path: str) -> object:
              raw = subprocess.check_output(
                  [
                      "gh",
                      "api",
                      "--method",
                      "GET",
                      "-H",
                      "Accept: application/vnd.github+json",
                      "-H",
                      "X-GitHub-Api-Version: 2026-03-10",
                      path,
                  ],
                  text=True,
              )
              return json.loads(raw)

          plan_path = exactly_one("manifest.json")
          source_path = exactly_one("resume-source-input-manifest.json")
          receipt_path = exactly_one("resume-source-selection.json")
          plan_manifest = json.loads(plan_path.read_text(encoding="utf-8"))
          source_bytes = source_path.read_bytes()
          source_manifest = json.loads(source_bytes)
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          if (
              not isinstance(plan_manifest, dict)
              or not isinstance(source_manifest, dict)
              or not isinstance(receipt, dict)
              or set(receipt) != {
                  "member",
                  "resolution",
                  "schema_version",
                  "source_artifact",
                  "source_run",
              }
              or receipt.get("schema_version") != 1
          ):
              raise SystemExit("plan-selected resume source receipt is malformed")
          source_artifact = receipt.get("source_artifact")
          source_run = receipt.get("source_run")
          member = receipt.get("member")
          if (
              not isinstance(source_artifact, dict)
              or set(source_artifact) != {
                  "archive_download_url",
                  "digest",
                  "expired",
                  "id",
                  "name",
                  "size_in_bytes",
              }
              or not isinstance(source_run, dict)
              or set(source_run) != {
                  "attempt",
                  "conclusion",
                  "event",
                  "head_sha",
                  "id",
                  "path",
                  "status",
                  "workflow_id",
              }
              or not isinstance(member, dict)
              or set(member)
              != {"bundled_name", "sha256", "size_in_bytes", "source_name"}
          ):
              raise SystemExit("plan-selected resume source receipt is malformed")

          expected_artifact_id = positive_integer(
              os.environ["EXPECTED_ARTIFACT_ID"],
              "selected source artifact ID",
          )
          expected_artifact_size = positive_integer(
              os.environ["EXPECTED_ARTIFACT_SIZE"],
              "selected source artifact size",
          )
          expected_run_id = positive_integer(
              os.environ["EXPECTED_RUN_ID"],
              "selected source run ID",
          )
          expected_run_attempt = positive_integer(
              os.environ["EXPECTED_RUN_ATTEMPT"],
              "selected source run attempt",
          )
          expected_workflow_id = positive_integer(
              os.environ["EXPECTED_WORKFLOW_ID"],
              "selected source workflow ID",
          )
          expected_digest = os.environ["EXPECTED_ARTIFACT_DIGEST"].lower()
          expected_owner_head_sha = os.environ["EXPECTED_RUN_HEAD_SHA"].lower()
          expected_source_sha = os.environ["WORKFLOW_SOURCE_SHA"].lower()
          resolution = os.environ["EXPECTED_RESOLUTION"]
          chain_id = os.environ["CHAIN_ID"]
          repository = os.environ["GITHUB_REPOSITORY"]
          owner_snapshot = json.loads(
              Path(os.environ["OWNER_RECHECK_PATH"]).read_text(encoding="utf-8")
          )
          owner_claim = (
              owner_snapshot.get("run")
              if isinstance(owner_snapshot, dict)
              else None
          )
          semantic_source = (
              owner_snapshot.get("semantic_source")
              if isinstance(owner_snapshot, dict)
              else None
          )
          workflow_claim = (
              owner_snapshot.get("workflow")
              if isinstance(owner_snapshot, dict)
              else None
          )
          if (
              os.environ["REQUESTED_SOURCE_RUN_ID"] != str(expected_run_id)
              or expected_run_attempt != 1
              or resolution not in {"committed", "canonical"}
              or re.fullmatch(r"sha256:[0-9a-f]{64}", expected_digest) is None
              or re.fullmatch(r"[0-9a-f]{40}", expected_owner_head_sha) is None
              or re.fullmatch(r"[0-9a-f]{40}", expected_source_sha) is None
              or os.environ["EXPECTED_RUN_STATUS"] != "completed"
              or os.environ["EXPECTED_RUN_CONCLUSION"]
              not in {"cancelled", "failure", "success", "timed_out"}
              or str(plan_manifest.get("chain_id") or "") != chain_id
              or str(plan_manifest.get("workflow_source_sha") or "").lower()
              != expected_source_sha
              or str(source_manifest.get("chain_id") or "") != chain_id
              or str(source_manifest.get("workflow_source_sha") or "").lower()
              != expected_source_sha
              or not isinstance(owner_snapshot, dict)
              or type(owner_snapshot.get("schema_version")) is not int
              or owner_snapshot.get("schema_version") != 1
              or owner_snapshot.get("repository") != repository
              or not isinstance(owner_claim, dict)
              or type(owner_claim.get("id")) is not int
              or owner_claim.get("id") != expected_run_id
              or owner_claim.get("url")
              != (
                  f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{repository}"
                  f"/actions/runs/{expected_run_id}"
              )
              or owner_claim.get("event") != "workflow_dispatch"
              or not isinstance(owner_claim.get("head_branch"), str)
              or not owner_claim.get("head_branch")
              or owner_claim.get("path")
              != ".github/workflows/full-extraction.yml"
              or type(owner_claim.get("attempt")) is not int
              or owner_claim.get("attempt") != 1
              or str(owner_claim.get("head_sha") or "").lower()
              != expected_owner_head_sha
              or owner_claim.get("status")
              != os.environ["EXPECTED_RUN_STATUS"]
              or owner_claim.get("conclusion")
              != os.environ["EXPECTED_RUN_CONCLUSION"]
              or type(owner_claim.get("workflow_id")) is not int
              or owner_claim.get("workflow_id") != expected_workflow_id
              or not isinstance(semantic_source, dict)
              or str(semantic_source.get("sha") or "").lower()
              != expected_source_sha
              or semantic_source.get("relation")
              not in {"identical", "ancestor"}
              or (semantic_source.get("relation") == "identical")
              != (
                  str(semantic_source.get("sha") or "").lower()
                  == str(owner_claim.get("head_sha") or "").lower()
              )
              or not isinstance(workflow_claim, dict)
              or workflow_claim.get("path")
              != ".github/workflows/full-extraction.yml"
              or re.fullmatch(
                  r"[0-9a-f]{40}",
                  str(workflow_claim.get("blob_sha") or "").lower(),
              )
              is None
              or re.fullmatch(
                  r"[0-9a-f]{64}",
                  str(workflow_claim.get("sha256") or "").lower(),
              )
              is None
              or type(workflow_claim.get("size_in_bytes")) is not int
              or workflow_claim.get("size_in_bytes") < 1
          ):
              raise SystemExit("plan-selected resume source job outputs are invalid")

          expected_artifact_url = (
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{repository}"
              f"/actions/artifacts/{expected_artifact_id}"
          )
          expected_archive_url = f"{expected_artifact_url}/zip"
          expected_run_url = (
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{repository}"
              f"/actions/runs/{expected_run_id}"
          )
          expected_source_name = (
              "next-manifest.json"
              if resolution == "committed"
              else "manifest.json"
          )
          if (
              receipt.get("resolution") != resolution
              or source_artifact.get("id") != expected_artifact_id
              or source_artifact.get("name")
              != os.environ["EXPECTED_ARTIFACT_NAME"]
              or str(source_artifact.get("digest") or "").lower()
              != expected_digest
              or source_artifact.get("size_in_bytes") != expected_artifact_size
              or source_artifact.get("expired") is not False
              or source_artifact.get("archive_download_url")
              != expected_archive_url
              or os.environ["EXPECTED_ARTIFACT_ARCHIVE_URL"]
              != expected_archive_url
              or source_run.get("id") != expected_run_id
              or source_run.get("attempt") != expected_run_attempt
              or str(source_run.get("head_sha") or "").lower()
              != expected_owner_head_sha
              or source_run.get("status") != os.environ["EXPECTED_RUN_STATUS"]
              or source_run.get("conclusion")
              != os.environ["EXPECTED_RUN_CONCLUSION"]
              or source_run.get("event") != "workflow_dispatch"
              or source_run.get("path")
              != ".github/workflows/full-extraction.yml"
              or source_run.get("workflow_id") != expected_workflow_id
              or member.get("bundled_name")
              != "resume-source-input-manifest.json"
              or member.get("source_name") != expected_source_name
              or member.get("size_in_bytes") != len(source_bytes)
              or len(source_bytes) < 1
              or str(member.get("sha256") or "").lower()
              != hashlib.sha256(source_bytes).hexdigest()
          ):
              raise SystemExit(
                  "plan-selected resume source receipt does not match job outputs"
              )

          artifact_name = os.environ["EXPECTED_ARTIFACT_NAME"]
          if resolution == "canonical":
              if artifact_name != f"full-extraction-manifest-{chain_id}":
                  raise SystemExit(
                      "canonical source artifact name does not match the chain"
                  )
          else:
              name_match = re.fullmatch(
                  (
                      rf"full-extraction-next-manifest-{re.escape(chain_id)}-"
                      rf"iter-[1-9][0-9]*-run-{expected_run_id}-"
                      r"attempt-(?P<attempt>[1-9][0-9]*)"
                  ),
                  artifact_name,
              )
              if (
                  name_match is None
                  or int(name_match.group("attempt")) > expected_run_attempt
              ):
                  raise SystemExit(
                      "committed source artifact name does not match its owner run"
                  )

          owner_run = gh_json(
              f"/repos/{repository}/actions/runs/{expected_run_id}"
          )
          if not isinstance(owner_run, dict):
              raise SystemExit("plan-selected resume source REST owner is invalid")
          rest_workflow_id = owner_run.get("workflow_id")
          rest_repository = owner_run.get("repository")
          if (
              type(owner_run.get("id")) is not int
              or owner_run.get("id") != expected_run_id
              or owner_run.get("url") != owner_claim.get("url")
              or owner_run.get("url") != expected_run_url
              or not isinstance(rest_repository, dict)
              or rest_repository.get("full_name") != repository
              or type(owner_run.get("run_attempt")) is not int
              or owner_run.get("run_attempt") != owner_claim.get("attempt")
              or owner_run.get("run_attempt") != 1
              or str(owner_run.get("head_sha") or "").lower()
              != str(owner_claim.get("head_sha") or "").lower()
              or owner_run.get("status") != owner_claim.get("status")
              or owner_run.get("conclusion") != owner_claim.get("conclusion")
              or owner_run.get("event") != owner_claim.get("event")
              or owner_run.get("head_branch") != owner_claim.get("head_branch")
              or owner_run.get("path") != owner_claim.get("path")
              or isinstance(rest_workflow_id, bool)
              or not isinstance(rest_workflow_id, int)
              or rest_workflow_id != owner_claim.get("workflow_id")
          ):
              raise SystemExit(
                  "plan-selected resume source REST identity changed after planning"
              )

          artifact = gh_json(
              f"/repos/{repository}/actions/artifacts/{expected_artifact_id}"
          )
          if not isinstance(artifact, dict):
              raise SystemExit("plan-selected resume source REST artifact is invalid")
          rest_artifact_id = artifact.get("id")
          rest_artifact_size = artifact.get("size_in_bytes")
          workflow_run = artifact.get("workflow_run")
          if (
              isinstance(rest_artifact_id, bool)
              or not isinstance(rest_artifact_id, int)
              or rest_artifact_id != expected_artifact_id
              or artifact.get("url") != expected_artifact_url
              or artifact.get("archive_download_url") != expected_archive_url
              or artifact.get("name") != artifact_name
              or str(artifact.get("digest") or "").lower() != expected_digest
              or isinstance(rest_artifact_size, bool)
              or not isinstance(rest_artifact_size, int)
              or rest_artifact_size != expected_artifact_size
              or artifact.get("expired") is not False
              or not isinstance(workflow_run, dict)
              or str(workflow_run.get("id") or "") != str(expected_run_id)
              or str(workflow_run.get("head_sha") or "").lower()
              != expected_owner_head_sha
          ):
              raise SystemExit(
                  "plan-selected resume source REST identity changed after planning"
              )
          final_owner_run = gh_json(
              f"/repos/{repository}/actions/runs/{expected_run_id}"
          )
          if final_owner_run != owner_run:
              raise SystemExit(
                  "plan-selected resume source owner changed after exact artifact selection"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"artifact_id={expected_artifact_id}\n")
              handle.write(f"artifact_name={artifact_name}\n")
              handle.write(f"source_run_id={expected_run_id}\n")
              handle.write(f"source_run_attempt={expected_run_attempt}\n")
          PY

      - name: Resolve exact source checkpoint receipt
        id: source_checkpoint
        if: ${{ steps.source_selection.outputs.artifact_id != '' }}
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_RECHECK_PATH: ${{ runner.temp }}/workflow-provenance/terminal-source-owner-recheck.json
          SOURCE_RUN_ID: ${{ steps.source_selection.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source_selection.outputs.source_run_attempt }}
        run: python .github/scripts/full_extraction_handoffs.py resolve-exact-source-checkpoint-receipt

      - name: Download exact source checkpoint
        if: ${{ steps.source_checkpoint.outputs.artifact_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ steps.source_checkpoint.outputs.artifact_id }}
          path: source-checkpoint/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source_checkpoint.outputs.source_run_id }}
          digest-mismatch: error

      - name: Attest terminal replay inputs
        id: replay
        if: ${{ steps.source_checkpoint.outputs.artifact_id != '' }}
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          EXPECTED_CHECKPOINT_GENERATION: ${{ steps.source_checkpoint.outputs.checkpoint_generation }}
          EXPECTED_COVERAGE_FINGERPRINT: ${{ steps.source_checkpoint.outputs.coverage_fingerprint }}
          EXPECTED_DATABASE_SHA256: ${{ steps.source_checkpoint.outputs.database_sha256 }}
          EXPECTED_REPORT_SHA256: ${{ steps.source_checkpoint.outputs.report_sha256 }}
          EXPECTED_W2_AUTHORITY_IDENTITY_SHA256: ${{ steps.source_checkpoint.outputs.w2_authority_identity_sha256 }}
          EXPECTED_W2_DATABASE_AUTHORITY_SHA256: ${{ steps.source_checkpoint.outputs.w2_database_authority_sha256 }}
          EXPECTED_W2_EXPECTED_CALL_COUNT: ${{ steps.source_checkpoint.outputs.w2_expected_call_count }}
          EXPECTED_W2_EXPECTED_CALL_INVENTORY_SHA256: ${{ steps.source_checkpoint.outputs.w2_expected_call_inventory_sha256 }}
          EXPECTED_W2_DATABASE_AUTHORITY_CLOSED: ${{ steps.source_checkpoint.outputs.w2_database_authority_closed }}
          SOURCE_CHECKPOINT_ARTIFACT: ${{ steps.source_checkpoint.outputs.artifact_name }}
          SOURCE_RUN_ID: ${{ steps.source_checkpoint.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source_checkpoint.outputs.source_run_attempt }}
        run: python .github/scripts/full_extraction_handoffs.py attest-terminal-replay-inputs

      - name: Upload attested terminal replay inputs
        id: replay_upload
        if: ${{ steps.source_checkpoint.outputs.artifact_name != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: ${{ steps.replay.outputs.artifact_name }}
          path: terminal-replay-inputs/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Verify terminal replay artifact receipt
        id: replay_receipt
        if: ${{ steps.replay_upload.outcome == 'success' }}
        env:
          ARTIFACT_DIGEST: ${{ steps.replay_upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.replay_upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.replay.outputs.artifact_name }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_RUN_HEAD_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          receipt="$RUNNER_TEMP/terminal-replay-artifact-receipt.json"
          python .github/scripts/workflow_source_provenance.py verify-current-artifact \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$CURRENT_RUN_ID" \
            --run-attempt "$CURRENT_RUN_ATTEMPT" \
            --head-sha "$CURRENT_RUN_HEAD_SHA" \
            --trusted-branch "$WORKFLOW_SOURCE_REF" \
            --workflow-path .github/workflows/full-extraction.yml \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --output "$receipt"
          RECEIPT_PATH="$receipt" python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ["RECEIPT_PATH"]).read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"artifact-id={receipt['id']}\n")
              output.write(f"artifact-name={receipt['name']}\n")
              output.write(f"artifact-digest={receipt['digest']}\n")
              output.write(f"artifact-size-bytes={receipt['size_in_bytes']}\n")
              output.write(f"artifact-archive-url={receipt['archive_download_url']}\n")
          PY

  # ─────────────────────────────────────────────────────────────
  #  Targeted smoke: stop green after one terminal checkpoint
  # ─────────────────────────────────────────────────────────────
  targeted_smoke_assurance:
    needs: [plan, preflight, discovery_seed, extract, lane_control, checkpoint]
    if: ${{ always() && !cancelled() && inputs.operation == 'targeted_smoke' && needs.plan.outputs.operation-authority-status == 'validated' && needs.plan.outputs.free-execution-collector-status == 'admitted' && needs.plan.outputs.free-execution-collector-authenticated == 'true' && needs.plan.outputs.free-execution-runtime-context-status == 'authenticated' && needs.plan.outputs.free-execution-storage-mutations-allowed == 'true' && needs.plan.outputs.free-execution-provider-calls-allowed == 'true' && needs.plan.outputs.free-execution-mutations-authorized == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.WORKFLOW_SOURCE_SHA }}

      - name: Validate full extraction attempt
        env:
          FULL_EXTRACTION_ATTEMPT_GATE_ROLE: partial
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/validate_full_extraction_attempt.py

      - name: Verify terminal targeted smoke
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          DISCOVERY_RESULT: ${{ needs.discovery_seed.result }}
          EXTRACT_RESULT: ${{ needs.extract.result }}
          CONTROL_RESULT: ${{ needs.lane_control.result }}
          CHECKPOINT_RESULT: ${{ needs.checkpoint.result }}
          LANE_COUNT: ${{ needs.plan.outputs.lane-count }}
          MATRIX_LANE_COUNT: ${{ needs.plan.outputs.matrix-lane-count }}
          ACTIVE_LANE_COUNT: ${{ needs.lane_control.outputs.active-lane-count }}
          RESUME_ONLY_LANE_COUNT: ${{ needs.lane_control.outputs.resume-only-lane-count }}
          CONTRACT_BLOCKED_LANE_COUNT: ${{ needs.lane_control.outputs.contract-blocked-lane-count }}
          CHECKPOINT_TERMINAL_READY: ${{ needs.checkpoint.outputs.terminal-ready }}
          CHECKPOINT_ACTIVE_LANE_COUNT: ${{ needs.checkpoint.outputs.active-lane-count }}
        run: |
          set -euo pipefail
          for result in \
            "$PLAN_RESULT" \
            "$PREFLIGHT_RESULT" \
            "$DISCOVERY_RESULT" \
            "$EXTRACT_RESULT" \
            "$CONTROL_RESULT" \
            "$CHECKPOINT_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::Targeted smoke dependency did not succeed: $result"
              exit 1
            fi
          done
          if [ "$LANE_COUNT" != "1" ] || [ "$MATRIX_LANE_COUNT" != "1" ]; then
            echo "::error::Targeted smoke must contain exactly one planned and dispatched lane"
            exit 1
          fi
          if [ "$ACTIVE_LANE_COUNT" != "0" ] || [ "$CHECKPOINT_ACTIVE_LANE_COUNT" != "0" ]; then
            echo "::error::Targeted smoke left active lanes"
            exit 1
          fi
          if [ "$RESUME_ONLY_LANE_COUNT" != "1" ] || [ "$CONTRACT_BLOCKED_LANE_COUNT" != "0" ]; then
            echo "::error::Targeted smoke lane did not finish as one complete resume-only lane"
            exit 1
          fi
          if [ "$CHECKPOINT_TERMINAL_READY" != "true" ]; then
            echo "::error::Targeted smoke checkpoint is not terminal-ready"
            exit 1
          fi
          echo "::notice::Targeted smoke passed terminal lane and checkpoint attestation"

  # ─────────────────────────────────────────────────────────────
  #  Merge the cumulative checkpoint once all lanes are complete
  # ─────────────────────────────────────────────────────────────
  merge:
    needs: [plan, preflight, extract, terminal_replay, lane_control, checkpoint]
    if: ${{ always() && !cancelled() && inputs.operation != 'targeted_smoke' && needs.plan.result == 'success' && needs.plan.outputs.operation-authority-status == 'validated' && needs.plan.outputs.free-execution-collector-status == 'admitted' && needs.plan.outputs.free-execution-collector-authenticated == 'true' && needs.plan.outputs.free-execution-runtime-context-status == 'authenticated' && needs.plan.outputs.free-execution-storage-mutations-allowed == 'true' && needs.plan.outputs.free-execution-provider-calls-allowed == 'true' && needs.plan.outputs.free-execution-mutations-authorized == 'true' && needs.plan.outputs.lane-count != '0' && (((needs.preflight.result == 'success' || (inputs.resume_source_run_id != '' && needs.plan.outputs.active-lane-count == '0' && needs.plan.outputs.matrix-lane-count == '0' && needs.terminal_replay.result == 'success' && needs.terminal_replay.outputs.artifact-name == '')) && needs.lane_control.result == 'success' && needs.checkpoint.result == 'success' && needs.lane_control.outputs.active-lane-count == '0' && needs.checkpoint.outputs.terminal-ready == 'true' && needs.checkpoint.outputs.active-lane-count == '0') || (needs.terminal_replay.result == 'success' && needs.terminal_replay.outputs.artifact-name != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    outputs:
      final-data-artifact-name: nbadb-full-extraction-assured-${{ env.ACTIVE_CHAIN_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
      final-data-artifact-id: ${{ steps.assured_data.outputs.artifact-id }}
      final-data-artifact-digest: ${{ steps.assured_data.outputs.artifact-digest }}
      coverage-fingerprint: ${{ steps.terminal_identity.outputs.coverage_fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.WORKFLOW_SOURCE_SHA }}

      - name: Validate full extraction attempt
        env:
          FULL_EXTRACTION_ATTEMPT_GATE_ROLE: partial
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/validate_full_extraction_attempt.py

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - run: uv sync --locked

      - name: Verify terminal manifest receipt before download
        if: ${{ needs.terminal_replay.outputs.artifact-name == '' }}
        env:
          ARTIFACT_ARCHIVE_URL: ${{ needs.checkpoint.outputs.manifest-artifact-archive-url }}
          ARTIFACT_DIGEST: ${{ needs.checkpoint.outputs.manifest-artifact-digest }}
          ARTIFACT_ID: ${{ needs.checkpoint.outputs.manifest-artifact-id }}
          ARTIFACT_NAME: ${{ needs.checkpoint.outputs.manifest-artifact-name }}
          ARTIFACT_SIZE: ${{ needs.checkpoint.outputs.manifest-artifact-size }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          receipt="$RUNNER_TEMP/terminal-manifest-receipt.json"
          python .github/scripts/workflow_source_provenance.py verify-current-artifact \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" \
            --trusted-branch "$WORKFLOW_SOURCE_REF" \
            --workflow-path .github/workflows/full-extraction.yml \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --output "$receipt"
          RECEIPT_PATH="$receipt" python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ["RECEIPT_PATH"]).read_text(encoding="utf-8"))
          if (
              str(receipt.get("size_in_bytes") or "") != os.environ["ARTIFACT_SIZE"]
              or receipt.get("archive_download_url") != os.environ["ARTIFACT_ARCHIVE_URL"]
          ):
              raise SystemExit("terminal manifest receipt outputs changed before download")
          PY

      - name: Verify replayed terminal receipt before download
        if: ${{ needs.terminal_replay.outputs.artifact-name != '' }}
        env:
          ARTIFACT_ARCHIVE_URL: ${{ needs.terminal_replay.outputs.artifact-archive-url }}
          ARTIFACT_DIGEST: ${{ needs.terminal_replay.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ needs.terminal_replay.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ needs.terminal_replay.outputs.artifact-name }}
          ARTIFACT_SIZE: ${{ needs.terminal_replay.outputs.artifact-size }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          receipt="$RUNNER_TEMP/terminal-replay-receipt.json"
          python .github/scripts/workflow_source_provenance.py verify-current-artifact \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" \
            --trusted-branch "$WORKFLOW_SOURCE_REF" \
            --workflow-path .github/workflows/full-extraction.yml \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --output "$receipt"
          RECEIPT_PATH="$receipt" python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ["RECEIPT_PATH"]).read_text(encoding="utf-8"))
          if (
              str(receipt.get("size_in_bytes") or "") != os.environ["ARTIFACT_SIZE"]
              or receipt.get("archive_download_url") != os.environ["ARTIFACT_ARCHIVE_URL"]
          ):
              raise SystemExit("terminal replay receipt outputs changed before download")
          PY

      - name: Download terminal manifest from completed lanes
        if: ${{ needs.terminal_replay.outputs.artifact-name == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.checkpoint.outputs.manifest-artifact-id }}
          path: next-manifest-artifact/
          digest-mismatch: error

      - name: Download terminal checkpoint from completed lanes
        if: ${{ needs.terminal_replay.outputs.artifact-name == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.checkpoint.outputs.artifact-id }}
          path: checkpoint-artifact/
          digest-mismatch: error

      - name: Download replayed terminal checkpoint
        if: ${{ needs.terminal_replay.outputs.artifact-name != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.terminal_replay.outputs.artifact-id }}
          path: replay-terminal-artifact/
          digest-mismatch: error

      - name: Prepare checkpoint-first merge
        env:
          TERMINAL_REPLAYED: ${{ needs.terminal_replay.outputs.artifact-name != '' }}
        run: |
          mkdir -p lanes artifacts/full-extraction checkpoint-artifact
          if [ "$TERMINAL_REPLAYED" = "true" ]; then
            manifest_path="$(find replay-terminal-artifact -name terminal-manifest.json -type f -print -quit)"
            replay_report="$(find replay-terminal-artifact -name checkpoint-report.json -type f -print -quit)"
            replay_database="$(find replay-terminal-artifact -name nba.duckdb -type f -print -quit)"
            if [ -z "$replay_report" ] || [ -z "$replay_database" ]; then
              echo "::error::Replayed terminal artifact did not contain its attested checkpoint"
              find replay-terminal-artifact -maxdepth 6 -type f -print || true
              exit 1
            fi
            cp "$replay_report" checkpoint-artifact/checkpoint-report.json
            cp "$replay_database" checkpoint-artifact/nba.duckdb
          else
            manifest_path="$(find next-manifest-artifact \( -name next-manifest.json -o -name manifest.json \) -type f -print -quit)"
            mapfile -t checkpoint_reports < <(
              find checkpoint-artifact -name checkpoint-report.json -type f -print
            )
            mapfile -t checkpoint_databases < <(
              find checkpoint-artifact -name nba.duckdb -type f -print
            )
            if [ "${#checkpoint_reports[@]}" -ne 1 ] || \
               [ "${#checkpoint_databases[@]}" -ne 1 ]; then
              echo "::error::Terminal checkpoint artifact must contain exactly one report and database"
              find checkpoint-artifact -maxdepth 8 -type f -print || true
              exit 1
            fi
            checkpoint_report="${checkpoint_reports[0]}"
            checkpoint_database="${checkpoint_databases[0]}"
            if [ "$checkpoint_report" != "checkpoint-artifact/checkpoint-report.json" ]; then
              cp "$checkpoint_report" checkpoint-artifact/checkpoint-report.json
            fi
            if [ "$checkpoint_database" != "checkpoint-artifact/nba.duckdb" ]; then
              cp "$checkpoint_database" checkpoint-artifact/nba.duckdb
            fi
          fi
          if [ -z "$manifest_path" ]; then
            echo "::error::Terminal manifest artifact did not contain a usable manifest"
            find next-manifest-artifact replay-terminal-artifact -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi
          cp "$manifest_path" artifacts/full-extraction/merge-manifest.json
          echo "Terminal merge will use the verified cumulative checkpoint only."

      - name: Validate terminal checkpoint identity
        id: terminal_identity
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
        run: |
          set -euo pipefail
          uv run python -m nbadb.orchestrate.full_extraction_control verify-checkpoint \
            --lane-manifest-path artifacts/full-extraction/merge-manifest.json \
            --checkpoint-dir checkpoint-artifact \
            --checkpoint-report-path checkpoint-artifact/checkpoint-report.json \
            --chain-id "$CHAIN_ID" \
            --source-sha "$WORKFLOW_SOURCE_SHA" \
            --pointer-prefix latest \
            > artifacts/full-extraction/verified-terminal-checkpoint.json

          VERIFIED_CHECKPOINT_PATH=artifacts/full-extraction/verified-terminal-checkpoint.json \
            CHECKPOINT_REPORT_PATH=checkpoint-artifact/checkpoint-report.json \
            TERMINAL_IDENTITY_PATH=artifacts/full-extraction/terminal-assurance-report.json \
            python - <<'PY'
          # TERMINAL_CHECKPOINT_IDENTITY_BINDER
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          verified = json.loads(
              Path(os.environ["VERIFIED_CHECKPOINT_PATH"]).read_text(encoding="utf-8")
          )
          report_path = Path(os.environ["CHECKPOINT_REPORT_PATH"])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          coverage_fingerprint = str(verified.get("coverage_fingerprint") or "").lower()
          provider_authority = verified.get("provider_authority")
          evidence = report.get("contract_blocked_evidence")
          evidence_sha256 = str(report.get("contract_blocked_evidence_sha256") or "")
          failures: list[str] = []
          if re.fullmatch(r"[0-9a-f]{64}", coverage_fingerprint) is None:
              failures.append("verified terminal checkpoint coverage fingerprint is invalid")
          if str(report.get("coverage_fingerprint") or "").lower() != coverage_fingerprint:
              failures.append("terminal checkpoint coverage fingerprint is unbound")
          if (
              not isinstance(provider_authority, dict)
              or report.get("provider_authority") != provider_authority
              or not isinstance(provider_authority.get("authority_sha256"), str)
              or re.fullmatch(
                  r"[0-9a-f]{64}", provider_authority["authority_sha256"]
              ) is None
          ):
              failures.append("terminal checkpoint provider authority is unbound")
          if report.get("terminal_ready") is not True or int(report.get("active_lane_count", -1)) != 0:
              failures.append("terminal checkpoint is not terminal-ready")
          if (
              not isinstance(evidence, dict)
              or evidence.get("schema_version") != 1
              or not isinstance(evidence.get("contract_blocked_lanes"), list)
          ):
              failures.append("terminal contract-blocked evidence is invalid")
          else:
              actual_evidence_sha256 = hashlib.sha256(
                  json.dumps(evidence, sort_keys=True, separators=(",", ":")).encode(
                      "utf-8"
                  )
              ).hexdigest()
              if evidence_sha256 != actual_evidence_sha256:
                  failures.append("terminal contract-blocked evidence digest does not match")
              if int(report.get("contract_blocked_lane_count", -1)) != len(
                  evidence["contract_blocked_lanes"]
              ):
                  failures.append("terminal contract-blocked evidence count does not match")
          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              raise SystemExit(1)

          checkpoint_report_bytes = json.dumps(
              report,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          identity = {
              "schema_version": 3,
              "chain_id": os.environ["CHAIN_ID"],
              "source_sha": os.environ["WORKFLOW_SOURCE_SHA"].lower(),
              "coverage_fingerprint": coverage_fingerprint,
              "checkpoint_artifact_name": verified.get("artifact_name"),
              "checkpoint_generation": verified.get("checkpoint_generation"),
              "checkpoint_database_sha256": verified.get("database_sha256"),
              "checkpoint_report_sha256": hashlib.sha256(
                  checkpoint_report_bytes
              ).hexdigest(),
              "checkpoint_report": report,
              "contract_blocked_lane_count": report.get("contract_blocked_lane_count", 0),
              "contract_blocked_evidence": evidence,
              "contract_blocked_evidence_sha256": evidence_sha256,
              "provider_authority": provider_authority,
              "provider_authority_sha256": provider_authority["authority_sha256"],
          }
          Path(os.environ["TERMINAL_IDENTITY_PATH"]).write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"coverage_fingerprint={coverage_fingerprint}\n")
          PY

      - name: Merge lane databases
        run: |
          mkdir -p data/nbadb
          uv run python -m nbadb.orchestrate.full_extraction_control merge \
            --artifacts-dir lanes \
            --output-dir data/nbadb \
            --manifest-path artifacts/full-extraction/merge-manifest.json \
            --checkpoint-dir checkpoint-artifact \
            --checkpoint-report-path checkpoint-artifact/checkpoint-report.json

      # Transform from merged staging once every planned lane is complete.
      - name: Transform and load
        run: uv run nbadb backfill run --transform-only --verbose

      - name: Download exact free-execution admission for live snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.plan-manifest-artifact-id }}
          path: live-snapshot-admission-artifact/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error

      - name: Block live snapshot provider work until runtime collectors exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERATION_AUTHORITY_STATUS: ${{ needs.plan.outputs.operation-authority-status }}
          COLLECTOR_STATUS: ${{ needs.plan.outputs.free-execution-collector-status }}
          COLLECTOR_AUTHENTICATED: ${{ needs.plan.outputs.free-execution-collector-authenticated }}
          RUNTIME_CONTEXT_STATUS: ${{ needs.plan.outputs.free-execution-runtime-context-status }}
          STORAGE_MUTATIONS_ALLOWED: ${{ needs.plan.outputs.free-execution-storage-mutations-allowed }}
          PROVIDER_CALLS_ALLOWED: ${{ needs.plan.outputs.free-execution-provider-calls-allowed }}
          MUTATIONS_AUTHORIZED: ${{ needs.plan.outputs.free-execution-mutations-authorized }}
        run: python3 .github/scripts/attest_free_execution_job.py authorize --output artifacts/live-snapshot/free-execution-authorization.json

      - name: Append live snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPERATION_AUTHORITY_STATUS: ${{ needs.plan.outputs.operation-authority-status }}
          COLLECTOR_STATUS: ${{ needs.plan.outputs.free-execution-collector-status }}
          COLLECTOR_AUTHENTICATED: ${{ needs.plan.outputs.free-execution-collector-authenticated }}
          RUNTIME_CONTEXT_STATUS: ${{ needs.plan.outputs.free-execution-runtime-context-status }}
          STORAGE_MUTATIONS_ALLOWED: ${{ needs.plan.outputs.free-execution-storage-mutations-allowed }}
          PROVIDER_CALLS_ALLOWED: ${{ needs.plan.outputs.free-execution-provider-calls-allowed }}
          MUTATIONS_AUTHORIZED: ${{ needs.plan.outputs.free-execution-mutations-authorized }}
        run: |
          python3 .github/scripts/attest_free_execution_job.py verify --input artifacts/live-snapshot/free-execution-authorization.json
          uv run nbadb live-snapshot --verbose

      - name: Merge summary
        if: always()
        run: |
          {
            echo "## Merge — Iteration ${{ inputs.iteration }}"
            echo "**Chain ID:** ${{ env.ACTIVE_CHAIN_ID }}"
            echo "**Source ref:** ${{ env.WORKFLOW_SOURCE_REF }}"
            echo "**Source SHA:** ${{ env.WORKFLOW_SOURCE_SHA }}"
            echo "**Planned lanes:** ${{ needs.plan.outputs.lane-count }}"
            echo '```'
            ls -lh data/nbadb/ 2>/dev/null || echo "No data directory"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Export may update the database, so the terminal hard scan runs afterward.
      - name: Export all formats
        run: uv run nbadb export

      - name: Scan data quality
        id: scan
        uses: ./.github/actions/scan-report
        with:
          report-name: full-extraction-scan-report
          report-dir: artifacts/health/full
          fail-on: error
          full-publication: true
          checkpoint-report: checkpoint-artifact/checkpoint-report.json
          checkpoint-manifest: artifacts/full-extraction/merge-manifest.json
          checkpoint-dir: checkpoint-artifact
          checkpoint-chain-id: ${{ env.ACTIVE_CHAIN_ID }}
          checkpoint-source-sha: ${{ env.WORKFLOW_SOURCE_SHA }}

      - name: Build assured data manifest
        env:
          COVERAGE_FINGERPRINT: ${{ steps.terminal_identity.outputs.coverage_fingerprint }}
        run: |
          source_sha="${WORKFLOW_SOURCE_SHA,,}"
          cp artifacts/full-extraction/terminal-assurance-report.json \
            data/nbadb/terminal-assurance-report.json
          uv run python -m nbadb.core.artifact_identity build \
            --root data/nbadb \
            --chain-id "$ACTIVE_CHAIN_ID" \
            --source-sha "$source_sha" \
            --coverage-fingerprint "$COVERAGE_FINGERPRINT"

      - name: Upload assured final data artifact
        id: assured_data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: nbadb-full-extraction-assured-${{ env.ACTIVE_CHAIN_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/nbadb/*.duckdb
            data/nbadb/*.sqlite
            data/nbadb/parquet/
            data/nbadb/csv/
            data/nbadb/terminal-assurance-report.json
            data/nbadb/assured-artifact-manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record non-publishing canary outcome
        run: |
          {
            echo "## Publication"
            echo ""
            echo "**Publish requested:** false"
            echo ""
            echo "Terminal merge, transform, export, and scan assurance completed."
            echo "Metadata commit/push: skipped."
            echo "Kaggle upload: skipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final database
        if: ${{ always() && false == false }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: nbadb-full-extraction-${{ env.ACTIVE_CHAIN_ID }}
          path: |
            data/nbadb/*.duckdb
            data/nbadb/*.sqlite
            data/nbadb/parquet/
            data/nbadb/csv/
            data/nbadb/terminal-assurance-report.json
            data/nbadb/assured-artifact-manifest.json
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0

  # ─────────────────────────────────────────────────────────────
  #  Publish only after terminal assurance has produced exact data
  # ─────────────────────────────────────────────────────────────
  publish:
    needs: [plan, publication_preflight, merge]
    if: ${{ false && needs.plan.outputs.operation-authority-status == 'validated' && needs.plan.outputs.free-execution-collector-status == 'admitted' && needs.plan.outputs.free-execution-collector-authenticated == 'true' && needs.plan.outputs.free-execution-runtime-context-status == 'authenticated' && needs.plan.outputs.free-execution-storage-mutations-allowed == 'true' && needs.plan.outputs.free-execution-provider-calls-allowed == 'true' && needs.plan.outputs.free-execution-mutations-authorized == 'true' && needs.publication_preflight.result == 'success' && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: nbadb-kaggle-publish
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.WORKFLOW_SOURCE_SHA }}

      - name: Validate full extraction attempt
        env:
          FULL_EXTRACTION_ATTEMPT_GATE_ROLE: publication_reconcile
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/validate_full_extraction_attempt.py

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - run: uv sync --locked

      - name: Verify exact assured data artifact receipt
        env:
          ARTIFACT_DIGEST: ${{ needs.merge.outputs.final-data-artifact-digest }}
          ARTIFACT_ID: ${{ needs.merge.outputs.final-data-artifact-id }}
          ARTIFACT_NAME: ${{ needs.merge.outputs.final-data-artifact-name }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_RUN_HEAD_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCER_RUN_ATTEMPT: "1"
        run: |
          expected_artifact_name="nbadb-full-extraction-assured-${CHAIN_ID}-${CURRENT_RUN_ID}-${PRODUCER_RUN_ATTEMPT}"
          if [ "$ARTIFACT_NAME" != "$expected_artifact_name" ]; then
            echo "::error::Assured artifact name is not bound to its attempt-one producer"
            exit 1
          fi
          python .github/scripts/workflow_source_provenance.py verify-current-artifact \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$CURRENT_RUN_ID" \
            --run-attempt "$CURRENT_RUN_ATTEMPT" \
            --head-sha "$CURRENT_RUN_HEAD_SHA" \
            --trusted-branch "$WORKFLOW_SOURCE_REF" \
            --workflow-path .github/workflows/full-extraction.yml \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --producer-artifact-name "$expected_artifact_name" \
            --reconciliation-role publication_reconcile \
            --output "$RUNNER_TEMP/assured-data-artifact-receipt.json"

      - name: Download exact assured data artifact
        env:
          ARTIFACT_DIGEST: ${{ needs.merge.outputs.final-data-artifact-digest }}
          ARTIFACT_ID: ${{ needs.merge.outputs.final-data-artifact-id }}
          ARTIFACT_NAME: ${{ needs.merge.outputs.final-data-artifact-name }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCER_RUN_ATTEMPT: "1"
          RECEIPT_PATH: ${{ runner.temp }}/assured-data-artifact-receipt.json
          RECONCILIATION_ROLE: publication_reconcile
          SOURCE_RUN_ID: ${{ github.run_id }}
          ARTIFACT_OUTPUT_DIR: data/nbadb
        run: |
          set -euo pipefail
          if ! [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Assured artifact ID must be a positive integer"
            exit 1
          fi

          archive_path="$RUNNER_TEMP/assured-data-artifact.zip"
          gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$archive_path"

          ARTIFACT_ARCHIVE_PATH="$archive_path" \
            python - <<'PY'
          # ASSURED_ARTIFACT_ARCHIVE_VERIFIER
          import hashlib
          import json
          import os
          import re
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          artifact_id = os.environ["ARTIFACT_ID"]
          artifact_name = os.environ["ARTIFACT_NAME"]
          source_run_id = os.environ["SOURCE_RUN_ID"]
          current_run_attempt = os.environ["CURRENT_RUN_ATTEMPT"]
          producer_run_attempt = os.environ["PRODUCER_RUN_ATTEMPT"]
          for field_name, value in (
              ("artifact ID", artifact_id),
              ("source run ID", source_run_id),
              ("current run attempt", current_run_attempt),
              ("producer run attempt", producer_run_attempt),
          ):
              if re.fullmatch(r"[1-9][0-9]*", value) is None:
                  print(f"::error::{field_name} must be a positive integer")
                  raise SystemExit(1)
          raw_expected_digest = os.environ["ARTIFACT_DIGEST"].strip().lower()
          expected_digest_hex = raw_expected_digest.removeprefix("sha256:")
          if re.fullmatch(r"[0-9a-f]{64}", expected_digest_hex) is None:
              print("::error::Assured artifact digest is not a SHA-256")
              raise SystemExit(1)
          expected_digest = f"sha256:{expected_digest_hex}"
          expected_artifact_name = (
              f"nbadb-full-extraction-assured-{os.environ['CHAIN_ID']}-"
              f"{source_run_id}-{producer_run_attempt}"
          )
          if artifact_name != expected_artifact_name:
              print("::error::artifact name is not bound to its attempt-one producer")
              raise SystemExit(1)

          receipt = json.loads(
              Path(os.environ["RECEIPT_PATH"]).read_text(encoding="utf-8")
          )
          failures: list[str] = []
          if type(receipt.get("id")) is not int or receipt.get("id") != int(artifact_id):
              failures.append("artifact receipt ID does not match")
          if str(receipt.get("name") or "") != artifact_name:
              failures.append("artifact receipt name does not match")
          if (
              type(receipt.get("workflow_run_id")) is not int
              or receipt.get("workflow_run_id") != int(source_run_id)
          ):
              failures.append("artifact receipt workflow run identity does not match")
          if (
              type(receipt.get("producer_run_attempt")) is not int
              or receipt.get("producer_run_attempt") != int(producer_run_attempt)
              or int(producer_run_attempt) != 1
          ):
              failures.append("artifact receipt producer attempt does not match")
          if (
              type(receipt.get("verified_owner_run_attempt")) is not int
              or receipt.get("verified_owner_run_attempt")
              != int(current_run_attempt)
          ):
              failures.append("artifact receipt owner attempt does not match")
          if receipt.get("reconciliation_role") != os.environ["RECONCILIATION_ROLE"]:
              failures.append("artifact receipt reconciliation role does not match")
          if str(receipt.get("digest") or "").lower() != expected_digest:
              failures.append("artifact receipt digest does not match")

          archive_path = Path(os.environ["ARTIFACT_ARCHIVE_PATH"])
          digest = hashlib.sha256()
          with archive_path.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
          actual_digest = "sha256:" + digest.hexdigest()
          if actual_digest != expected_digest:
              failures.append(
                  "artifact archive SHA-256 does not match upload digest: "
                  f"expected={expected_digest}, actual={actual_digest}"
              )
          if receipt.get("size_in_bytes") != archive_path.stat().st_size:
              failures.append("artifact archive size does not match its receipt")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              raise SystemExit(1)

          try:
              archive = zipfile.ZipFile(archive_path)
          except zipfile.BadZipFile:
              print("::error::artifact archive is not a valid ZIP file")
              raise SystemExit(1)

          with archive:
              infos = archive.infolist()
              if not infos:
                  print("::error::artifact archive is empty")
                  raise SystemExit(1)

              members: list[tuple[zipfile.ZipInfo, PurePosixPath, bool]] = []
              member_kinds: dict[PurePosixPath, str] = {}
              for member in infos:
                  member_path = PurePosixPath(member.filename)
                  mode = member.external_attr >> 16
                  file_type = stat.S_IFMT(mode)
                  is_directory = member.is_dir()
                  unsafe = (
                      not member.filename
                      or member_path.is_absolute()
                      or not member_path.parts
                      or str(member_path) in {"", "."}
                      or ".." in member_path.parts
                      or "\\" in member.filename
                      or member_path in member_kinds
                      or stat.S_ISLNK(mode)
                      or (
                          is_directory
                          and file_type not in {0, stat.S_IFDIR}
                      )
                      or (
                          not is_directory
                          and file_type not in {0, stat.S_IFREG}
                      )
                  )
                  if unsafe:
                      print("::error::artifact archive contains an unsafe member")
                      raise SystemExit(1)
                  member_kinds[member_path] = (
                      "directory" if is_directory else "file"
                  )
                  members.append((member, member_path, is_directory))

              for member_path, kind in member_kinds.items():
                  for parent in member_path.parents:
                      if str(parent) == ".":
                          break
                      if member_kinds.get(parent) == "file":
                          print(
                              "::error::artifact archive contains a file-parent collision"
                          )
                          raise SystemExit(1)
                  if kind == "file" and member_path.name in {"", ".", ".."}:
                      print("::error::artifact archive contains an unsafe member")
                      raise SystemExit(1)

              output_dir = Path(os.environ["ARTIFACT_OUTPUT_DIR"])
              if output_dir.is_symlink():
                  print("::error::assured artifact output directory is a symlink")
                  raise SystemExit(1)
              output_root = output_dir.resolve()
              targets: list[tuple[zipfile.ZipInfo, Path, bool]] = []
              for member, member_path, is_directory in members:
                  target = output_dir.joinpath(*member_path.parts)
                  cursor = output_dir
                  if cursor.is_symlink():
                      print("::error::assured artifact output directory is a symlink")
                      raise SystemExit(1)
                  for part in member_path.parts:
                      cursor /= part
                      if cursor.is_symlink():
                          print(
                              "::error::artifact archive destination contains a symlink"
                          )
                          raise SystemExit(1)
                      if (
                          cursor != target
                          and cursor.exists()
                          and not cursor.is_dir()
                      ):
                          print(
                              "::error::artifact archive destination parent "
                              "is not a directory"
                          )
                          raise SystemExit(1)
                  resolved_target = target.resolve()
                  if output_root not in {
                      resolved_target,
                      *resolved_target.parents,
                  }:
                      print("::error::artifact archive member escapes output directory")
                      raise SystemExit(1)
                  if is_directory:
                      if target.exists() and not target.is_dir():
                          print("::error::artifact archive destination collision")
                          raise SystemExit(1)
                  elif target.exists():
                      print("::error::artifact archive destination collision")
                      raise SystemExit(1)
                  targets.append((member, target, is_directory))

              output_dir.mkdir(parents=True, exist_ok=True)
              for member, target, is_directory in targets:
                  if is_directory:
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(member) as source, target.open("xb") as destination:
                      while chunk := source.read(1024 * 1024):
                          destination.write(chunk)
          PY

      - name: Validate assured data artifact identity
        env:
          ARTIFACT_NAME: ${{ needs.merge.outputs.final-data-artifact-name }}
          COVERAGE_FINGERPRINT: ${{ needs.merge.outputs.coverage-fingerprint }}
          EXPECTED_ARTIFACT_PREFIX: nbadb-full-extraction-assured-${{ env.ACTIVE_CHAIN_ID }}-${{ github.run_id }}-
        run: |
          set -euo pipefail
          source_sha="${WORKFLOW_SOURCE_SHA,,}"
          artifact_attempt="${ARTIFACT_NAME#"$EXPECTED_ARTIFACT_PREFIX"}"
          if [ "$artifact_attempt" = "$ARTIFACT_NAME" ] || ! [[ "$artifact_attempt" =~ ^[0-9]+$ ]]; then
            echo "::error::Assured artifact identity mismatch: expected '${EXPECTED_ARTIFACT_PREFIX}<attempt>', got '$ARTIFACT_NAME'"
            exit 1
          fi
          test -f data/nbadb/nba.duckdb
          test -f data/nbadb/nba.sqlite
          test -d data/nbadb/parquet
          test -d data/nbadb/csv
          test -f data/nbadb/terminal-assurance-report.json
          test -f data/nbadb/assured-artifact-manifest.json
          uv run python -m nbadb.core.artifact_identity verify \
            --root data/nbadb \
            --chain-id "$ACTIVE_CHAIN_ID" \
            --source-sha "$source_sha" \
            --coverage-fingerprint "$COVERAGE_FINGERPRINT"

      - name: Restore Kaggle publication reconciliation state
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: logs/kaggle/kaggle-publication-state.json
          key: nbadb-kaggle-publication-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nbadb-kaggle-publication-state-${{ github.run_id }}-

      - name: Validate Kaggle publication readiness
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          WORKFLOW_SOURCE_REF: ${{ env.WORKFLOW_SOURCE_REF }}
        run: |
          set -euo pipefail
          if [ "$EVENT_REF_NAME" != "$DEFAULT_BRANCH" ] || [ "$WORKFLOW_SOURCE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error::publish=true requires the default branch '$DEFAULT_BRANCH'; event_ref='$EVENT_REF_NAME' workflow_source_ref='$WORKFLOW_SOURCE_REF'"
            exit 1
          fi
          if [ -z "${KAGGLE_USERNAME:-}" ] || [ -z "${KAGGLE_KEY:-}" ]; then
            echo "::error::KAGGLE_USERNAME and KAGGLE_KEY are required when publish=true"
            exit 1
          fi

          uv run python - <<'PY'
          import os
          import re
          from pathlib import Path

          from nbadb.kaggle.client import KaggleClient

          try:
              client = KaggleClient()
              result = client.publication_preflight()
          except Exception as exc:
              print(
                  "::error::Kaggle publication preflight failed "
                  f"({type(exc).__name__})"
              )
              raise SystemExit(1) from None

          if not isinstance(result, dict):
              print("::error::Kaggle publication preflight returned an invalid result")
              raise SystemExit(1)

          acceptable = result.get("acceptable")
          version = result.get("version")
          state = str(result.get("state") or "").strip()
          if acceptable is not True:
              print("::error::Kaggle publication preflight was not acceptable")
              raise SystemExit(1)
          if isinstance(version, bool) or not isinstance(version, int) or version <= 0:
              print("::error::Kaggle publication preflight did not resolve a positive exact version")
              raise SystemExit(1)
          if re.fullmatch(r"[a-z][a-z0-9_]{0,63}", state) is None:
              print("::error::Kaggle publication preflight returned an invalid state")
              raise SystemExit(1)

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## Kaggle Publication Preflight\n")
              handle.write("**Acceptable:** `true`\n")
              handle.write(f"**State:** `{state}`\n")
              handle.write(f"**Exact remote version:** `{version}`\n")
          PY

      - name: Revalidate frozen publication source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse "${WORKFLOW_SOURCE_SHA}^{commit}")"
          target_ref="refs/remotes/origin/frozen-publication-target"
          git fetch --no-tags --no-recurse-submodules origin \
            "+refs/heads/${DEFAULT_BRANCH}:${target_ref}"
          target_commit="$(git rev-parse "${target_ref}^{commit}")"
          if [ "$target_commit" != "$source_commit" ]; then
            read -r commit parent extra < <(git rev-list --parents -n 1 "$target_commit")
            changed_paths="$(git diff-tree --no-commit-id --name-only -r "$target_commit")"
            commit_subject="$(git log -1 --format=%s "$target_commit")"
            expected_metadata="$RUNNER_TEMP/expected-dataset-metadata.json"
            observed_metadata="$RUNNER_TEMP/observed-dataset-metadata.json"
            uv run nbadb metadata \
              --data-dir data/nbadb \
              --output "$expected_metadata"
            git show "${target_commit}:dataset-metadata.json" > "$observed_metadata" 2>/dev/null || true
            if [ "$commit" != "$target_commit" ] || \
               [ "$parent" != "$source_commit" ] || \
               [ -n "${extra:-}" ] || \
               [ "$changed_paths" != "dataset-metadata.json" ] || \
               [ "$commit_subject" != "chore: regenerate dataset-metadata.json" ] || \
               ! cmp --silent "$expected_metadata" "$observed_metadata"; then
              echo "::error::Default branch moved during extraction: expected $source_commit or its exact metadata-only publication child, found $target_commit"
              exit 1
            fi
            echo "::notice::Accepting exact metadata-only publication child $target_commit for rerun reconciliation"
          fi
          printf 'NBADB_KAGGLE_EXPECTED_DEFAULT_HEAD_SHA=%s\n' "$target_commit" >> "$GITHUB_ENV"

      - name: Upload to Kaggle
        env:
          GH_TOKEN: ${{ github.token }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          NBADB_KAGGLE_PUBLICATION_SOURCE_SHA: ${{ env.WORKFLOW_SOURCE_SHA }}
          NBADB_KAGGLE_REQUIRE_DEFAULT_HEAD: "true"
        run: |
          uv run nbadb upload \
            --data-dir data/nbadb \
            --verify-remote \
            --full-publication \
            --publication-ledger github-deployment \
            --require-durable-intent \
            --remote-timeout 3600 \
            --remote-poll-interval 15 \
            -m "Full extraction chain=${ACTIVE_CHAIN_ID} source=${WORKFLOW_SOURCE_SHA} coverage=${{ needs.merge.outputs.coverage-fingerprint }}"

      - name: Detect Kaggle publication reconciliation state
        id: kaggle_publication_state
        if: always()
        run: |
          if [ -f logs/kaggle/kaggle-publication-state.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Kaggle publication state was not created"
          fi

      - name: Persist Kaggle publication reconciliation state
        if: ${{ always() && steps.kaggle_publication_state.outputs.exists == 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: logs/kaggle/kaggle-publication-state.json
          key: nbadb-kaggle-publication-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Kaggle publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: full-extraction-kaggle-publication-receipt-${{ env.ACTIVE_CHAIN_ID }}
          path: |
            logs/kaggle/kaggle-upload-manifest.json
            logs/kaggle/kaggle-publication-state.json
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 6

      - name: Upload final database
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: nbadb-full-extraction-${{ env.ACTIVE_CHAIN_ID }}
          path: |
            data/nbadb/*.duckdb
            data/nbadb/*.sqlite
            data/nbadb/parquet/
            data/nbadb/csv/
            data/nbadb/terminal-assurance-report.json
            data/nbadb/assured-artifact-manifest.json
            data/nbadb/dataset-metadata.json
            logs/kaggle/kaggle-upload-manifest.json
            logs/kaggle/kaggle-publication-state.json
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0

      - name: Refresh checked-in metadata
        uses: ./.github/actions/refresh-metadata
        with:
          data-dir: data/nbadb
          push-ref: ${{ github.event.repository.default_branch }}

      - name: Resolve checked-in metadata head
        id: metadata_head
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/publication
          uv run python - <<'PY'
          # METADATA_HEAD_EVIDENCE_BUILDER
          import json
          import os
          import subprocess
          from dataclasses import asdict
          from pathlib import Path

          from nbadb.kaggle.release_control import MetadataHeadEvidence

          def git(*args: str, text: bool = True) -> subprocess.CompletedProcess:
              return subprocess.run(
                  ["git", *args],
                  check=True,
                  capture_output=True,
                  text=text,
              )

          source_sha = git("rev-parse", f"{os.environ['WORKFLOW_SOURCE_SHA']}^{{commit}}").stdout.strip()
          default_branch = os.environ["DEFAULT_BRANCH"]
          tracking_ref = "refs/remotes/origin/metadata-closeout-target"
          git(
              "fetch",
              "--no-tags",
              "--no-recurse-submodules",
              "origin",
              f"+refs/heads/{default_branch}:{tracking_ref}",
          )
          metadata_head_sha = git("rev-parse", f"{tracking_ref}^{{commit}}").stdout.strip()

          if metadata_head_sha == source_sha:
              parent_shas: tuple[str, ...] = ()
              changed_files: tuple[str, ...] = ()
              byte_reproducible = True
          else:
              commit_row = git("rev-list", "--parents", "-n", "1", metadata_head_sha).stdout.split()
              if commit_row != [metadata_head_sha, source_sha]:
                  raise SystemExit(
                      "metadata head must be one direct non-merge child of the frozen source"
                  )
              parent_shas = (source_sha,)
              changed_files = tuple(
                  line
                  for line in git(
                      "diff-tree",
                      "--no-commit-id",
                      "--name-only",
                      "-r",
                      metadata_head_sha,
                  ).stdout.splitlines()
                  if line
              )
              subject = git("log", "-1", "--format=%s", metadata_head_sha).stdout.strip()
              if subject != "chore: regenerate dataset-metadata.json":
                  raise SystemExit("metadata child commit subject is not the approved fixed value")
              expected_metadata = Path(os.environ["RUNNER_TEMP"]) / "expected-closeout-metadata.json"
              subprocess.run(
                  [
                      "uv",
                      "run",
                      "nbadb",
                      "metadata",
                      "--data-dir",
                      "data/nbadb",
                      "--output",
                      str(expected_metadata),
                  ],
                  check=True,
              )
              observed = git(
                  "show",
                  f"{metadata_head_sha}:dataset-metadata.json",
                  text=False,
              ).stdout
              byte_reproducible = observed == expected_metadata.read_bytes()

          evidence = MetadataHeadEvidence(
              repository=os.environ["GITHUB_REPOSITORY"],
              source_sha=source_sha,
              metadata_head_sha=metadata_head_sha,
              parent_shas=parent_shas,
              changed_files=changed_files,
              byte_reproducible=byte_reproducible,
          )
          if metadata_head_sha != source_sha:
              if changed_files != ("dataset-metadata.json",):
                  raise SystemExit("metadata child must change only dataset-metadata.json")
              if not byte_reproducible:
                  raise SystemExit("metadata child bytes are not reproducible from the assured data")

          Path("artifacts/publication/metadata-head-evidence.json").write_text(
              json.dumps(asdict(evidence), sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"metadata_head_sha={metadata_head_sha}\n")
              output.write(
                  "metadata_child_created="
                  f"{'true' if metadata_head_sha != source_sha else 'false'}\n"
              )
          PY

      - name: Dispatch exact metadata-head CI
        id: metadata_ci_dispatch
        if: ${{ steps.metadata_head.outputs.metadata_child_created == 'true' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METADATA_HEAD_SHA: ${{ steps.metadata_head.outputs.metadata_head_sha }}
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          # METADATA_CI_DISPATCH_RECEIPT_VERIFIER
          import json
          import os
          import subprocess
          from dataclasses import asdict
          from pathlib import Path

          from nbadb.kaggle.release_control import CIDispatchReceipt

          API_VERSION = "2026-03-10"
          CI_PATH = ".github/workflows/ci.yml"

          def gh_json(method: str, path: str, *, payload: dict | None = None) -> dict:
              args = [
                  "gh",
                  "api",
                  "--method",
                  method,
                  "-H",
                  "Accept: application/vnd.github+json",
                  "-H",
                  f"X-GitHub-Api-Version: {API_VERSION}",
                  path,
              ]
              if payload is not None:
                  args.extend(["--input", "-"])
              result = subprocess.run(
                  args,
                  input=None if payload is None else json.dumps(payload, separators=(",", ":")),
                  check=True,
                  capture_output=True,
                  text=True,
              )
              parsed = json.loads(result.stdout)
              if not isinstance(parsed, dict):
                  raise SystemExit(f"GitHub {method} {path} did not return an object")
              return parsed

          repository = os.environ["GITHUB_REPOSITORY"]
          metadata_head_sha = os.environ["METADATA_HEAD_SHA"].lower()
          api_url = os.environ["GITHUB_API_URL"].rstrip("/")
          server_url = os.environ["GITHUB_SERVER_URL"].rstrip("/")
          workflow = gh_json(
              "GET",
              f"/repos/{repository}/actions/workflows/ci.yml",
          )
          workflow_id = workflow.get("id")
          if (
              isinstance(workflow_id, bool)
              or not isinstance(workflow_id, int)
              or workflow_id <= 0
              or workflow.get("path") != CI_PATH
              or workflow.get("name") != "CI"
              or workflow.get("state") != "active"
          ):
              raise SystemExit("CI workflow identity is invalid or inactive")

          dispatch_payload = {"ref": os.environ["DEFAULT_BRANCH"], "inputs": {}}
          response = gh_json(
              "POST",
              f"/repos/{repository}/actions/workflows/ci.yml/dispatches",
              payload=dispatch_payload,
          )
          if set(response) != {"workflow_run_id", "run_url", "html_url"}:
              raise SystemExit("CI dispatch response fields are invalid")
          run_id = response.get("workflow_run_id")
          if isinstance(run_id, bool) or not isinstance(run_id, int) or run_id <= 0:
              raise SystemExit("CI dispatch did not return a positive workflow_run_id")
          expected_run_url = f"{api_url}/repos/{repository}/actions/runs/{run_id}"
          expected_html_url = f"{server_url}/{repository}/actions/runs/{run_id}"
          if response.get("run_url") != expected_run_url or response.get("html_url") != expected_html_url:
              raise SystemExit("CI dispatch returned run URLs outside the exact repository identity")

          run = gh_json("GET", f"/repos/{repository}/actions/runs/{run_id}")
          repository_receipt = run.get("repository")
          head_repository_receipt = run.get("head_repository")
          if (
              run.get("id") != run_id
              or run.get("url") != expected_run_url
              or run.get("html_url") != expected_html_url
              or run.get("workflow_id") != workflow_id
              or run.get("path") != CI_PATH
              or run.get("name") != "CI"
              or run.get("event") != "workflow_dispatch"
              or run.get("run_attempt") != 1
              or run.get("head_sha") != metadata_head_sha
              or run.get("head_branch") != os.environ["DEFAULT_BRANCH"]
              or not isinstance(repository_receipt, dict)
              or repository_receipt.get("full_name") != repository
              or not isinstance(head_repository_receipt, dict)
              or head_repository_receipt.get("full_name") != repository
          ):
              raise SystemExit("returned CI run identity does not bind the exact metadata head")

          receipt = CIDispatchReceipt(
              repository=repository,
              workflow_id=workflow_id,
              workflow_path=CI_PATH,
              run_id=run_id,
              head_sha=metadata_head_sha,
              event="workflow_dispatch",
              explicitly_dispatched=True,
          )
          Path("artifacts/publication/metadata-ci-dispatch.json").write_text(
              json.dumps(asdict(receipt), sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"ci_run_id={run_id}\n")
              output.write(f"ci_workflow_id={workflow_id}\n")
          PY

      - name: Verify exact metadata-head CI closeout
        timeout-minutes: 70
        env:
          CI_RUN_ID: ${{ steps.metadata_ci_dispatch.outputs.ci_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METADATA_CI_MAX_POLLS: "120"
          METADATA_CI_POLL_INTERVAL_SECONDS: "30"
          METADATA_HEAD_SHA: ${{ steps.metadata_head.outputs.metadata_head_sha }}
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          # METADATA_CI_CLOSEOUT_VERIFIER
          import json
          import os
          import subprocess
          import time
          from dataclasses import asdict
          from pathlib import Path
          from urllib.parse import quote

          from nbadb.kaggle.release_control import (
              REQUIRED_METADATA_CI_JOBS,
              CIDispatchReceipt,
              CIJobReceipt,
              CIRunReceipt,
              MetadataHeadEvidence,
              validate_metadata_head,
          )

          API_VERSION = "2026-03-10"
          CI_PATH = ".github/workflows/ci.yml"

          def positive_int(name: str, *, maximum: int | None = None) -> int:
              raw = os.environ.get(name, "")
              if not raw.isdigit() or raw.startswith("0"):
                  raise SystemExit(f"{name} must be a positive integer")
              value = int(raw)
              if maximum is not None and value > maximum:
                  raise SystemExit(f"{name} exceeds its fail-closed maximum")
              return value

          def nonnegative_int(name: str, *, maximum: int) -> int:
              raw = os.environ.get(name, "")
              if not raw.isdigit():
                  raise SystemExit(f"{name} must be a nonnegative integer")
              value = int(raw)
              if value > maximum:
                  raise SystemExit(f"{name} exceeds its fail-closed maximum")
              return value

          def gh_json(path: str) -> dict:
              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      "--method",
                      "GET",
                      "-H",
                      "Accept: application/vnd.github+json",
                      "-H",
                      f"X-GitHub-Api-Version: {API_VERSION}",
                      path,
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              parsed = json.loads(result.stdout)
              if not isinstance(parsed, dict):
                  raise SystemExit(f"GitHub GET {path} did not return an object")
              return parsed

          def verify_default_ref(
              *,
              repository: str,
              default_branch: str,
              api_url: str,
              expected_sha: str,
          ) -> None:
              encoded_branch = quote(default_branch, safe="")
              ref = gh_json(f"/repos/{repository}/git/ref/heads/{encoded_branch}")
              ref_object = ref.get("object")
              expected_ref_url = (
                  f"{api_url}/repos/{repository}/git/refs/heads/{encoded_branch}"
              )
              if (
                  ref.get("ref") != f"refs/heads/{default_branch}"
                  or ref.get("url") != expected_ref_url
                  or not isinstance(ref_object, dict)
                  or ref_object.get("type") != "commit"
                  or ref_object.get("sha") != expected_sha
              ):
                  raise SystemExit("default branch no longer equals the validated metadata head")

          def exact_run(run_id: int, workflow_id: int, head_sha: str) -> dict:
              run = gh_json(f"/repos/{repository}/actions/runs/{run_id}")
              expected_url = f"{api_url}/repos/{repository}/actions/runs/{run_id}"
              expected_html = f"{server_url}/{repository}/actions/runs/{run_id}"
              repository_receipt = run.get("repository")
              head_repository_receipt = run.get("head_repository")
              if (
                  run.get("id") != run_id
                  or run.get("url") != expected_url
                  or run.get("html_url") != expected_html
                  or run.get("workflow_id") != workflow_id
                  or run.get("path") != CI_PATH
                  or run.get("name") != "CI"
                  or run.get("event") != "workflow_dispatch"
                  or run.get("run_attempt") != 1
                  or run.get("head_sha") != head_sha
                  or run.get("head_branch") != default_branch
                  or not isinstance(repository_receipt, dict)
                  or repository_receipt.get("full_name") != repository
                  or not isinstance(head_repository_receipt, dict)
                  or head_repository_receipt.get("full_name") != repository
              ):
                  raise SystemExit("CI run identity changed during closeout")
              return run

          def complete_job_inventory(run_id: int) -> list[dict]:
              jobs: list[dict] = []
              total_count: int | None = None
              for page in range(1, 12):
                  payload = gh_json(
                      f"/repos/{repository}/actions/runs/{run_id}/attempts/1/jobs"
                      f"?per_page=100&page={page}"
                  )
                  observed_total = payload.get("total_count")
                  page_jobs = payload.get("jobs")
                  if (
                      isinstance(observed_total, bool)
                      or not isinstance(observed_total, int)
                      or observed_total < 0
                      or observed_total > 1000
                      or not isinstance(page_jobs, list)
                      or not all(isinstance(job, dict) for job in page_jobs)
                  ):
                      raise SystemExit("CI job inventory response is malformed")
                  if total_count is None:
                      total_count = observed_total
                  elif observed_total != total_count:
                      raise SystemExit("CI job total_count changed during pagination")
                  jobs.extend(page_jobs)
                  if len(jobs) >= observed_total:
                      break
                  if not page_jobs:
                      raise SystemExit("CI job pagination ended before total_count")
              if total_count is None or len(jobs) != total_count:
                  raise SystemExit("CI job inventory does not match total_count")
              job_ids = [job.get("id") for job in jobs]
              job_names = [job.get("name") for job in jobs]
              if (
                  any(isinstance(job_id, bool) or not isinstance(job_id, int) or job_id <= 0 for job_id in job_ids)
                  or any(not isinstance(name, str) or not name for name in job_names)
                  or len(job_ids) != len(set(job_ids))
                  or len(job_names) != len(set(job_names))
              ):
                  raise SystemExit("CI job inventory contains invalid or duplicate identities")
              return jobs

          head_payload = json.loads(
              Path("artifacts/publication/metadata-head-evidence.json").read_text(
                  encoding="utf-8"
              )
          )
          head = MetadataHeadEvidence(
              repository=head_payload["repository"],
              source_sha=head_payload["source_sha"],
              metadata_head_sha=head_payload["metadata_head_sha"],
              parent_shas=tuple(head_payload["parent_shas"]),
              changed_files=tuple(head_payload["changed_files"]),
              byte_reproducible=head_payload["byte_reproducible"],
          )
          if head.metadata_head_sha != os.environ["METADATA_HEAD_SHA"].lower():
              raise SystemExit("metadata head output differs from its evidence receipt")

          repository = head.repository
          default_branch = os.environ["DEFAULT_BRANCH"]
          api_url = os.environ["GITHUB_API_URL"].rstrip("/")
          server_url = os.environ["GITHUB_SERVER_URL"].rstrip("/")
          closeout_path = Path("artifacts/publication/metadata-closeout.json")
          if head.metadata_head_sha == head.source_sha:
              if os.environ.get("CI_RUN_ID"):
                  raise SystemExit("unchanged metadata head unexpectedly dispatched CI")
              validation = validate_metadata_head(head)
              verify_default_ref(
                  repository=repository,
                  default_branch=default_branch,
                  api_url=api_url,
                  expected_sha=head.metadata_head_sha,
              )
              closeout_path.write_text(
                  json.dumps(asdict(validation), sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          dispatch_payload = json.loads(
              Path("artifacts/publication/metadata-ci-dispatch.json").read_text(
                  encoding="utf-8"
              )
          )
          dispatch = CIDispatchReceipt(**dispatch_payload)
          run_id = positive_int("CI_RUN_ID")
          if dispatch.run_id != run_id or dispatch.head_sha != head.metadata_head_sha:
              raise SystemExit("CI dispatch output differs from its receipt")
          max_polls = positive_int("METADATA_CI_MAX_POLLS", maximum=240)
          poll_interval = nonnegative_int(
              "METADATA_CI_POLL_INTERVAL_SECONDS",
              maximum=60,
          )

          final_run: dict | None = None
          final_jobs: list[dict] | None = None
          for poll in range(max_polls):
              run = exact_run(run_id, dispatch.workflow_id, head.metadata_head_sha)
              jobs = complete_job_inventory(run_id)
              names = {job.get("name") for job in jobs}
              required_jobs_completed = names == set(REQUIRED_METADATA_CI_JOBS) and all(
                  job.get("status") == "completed" for job in jobs
              )
              if run.get("status") == "completed" and required_jobs_completed:
                  final_run = run
                  final_jobs = jobs
                  break
              if not names.issubset(REQUIRED_METADATA_CI_JOBS):
                  raise SystemExit("CI exposed an unexpected job name")
              if poll + 1 < max_polls:
                  time.sleep(poll_interval)
          if final_run is None or final_jobs is None:
              raise SystemExit("exact metadata-head CI did not complete inside the bounded poll window")
          if final_run.get("status") != "completed" or final_run.get("conclusion") != "success":
              raise SystemExit("exact metadata-head CI run did not succeed")

          job_receipts: list[CIJobReceipt] = []
          for listed_job in final_jobs:
              job_id = listed_job["id"]
              direct = gh_json(f"/repos/{repository}/actions/jobs/{job_id}")
              expected_url = f"{api_url}/repos/{repository}/actions/jobs/{job_id}"
              expected_run_url = f"{api_url}/repos/{repository}/actions/runs/{run_id}"
              expected_html = f"{server_url}/{repository}/runs/{run_id}/jobs/{job_id}"
              if (
                  direct.get("id") != job_id
                  or direct.get("name") != listed_job.get("name")
                  or direct.get("run_id") != run_id
                  or direct.get("head_sha") != head.metadata_head_sha
                  or direct.get("head_branch") != default_branch
                  or direct.get("url") != expected_url
                  or direct.get("run_url") != expected_run_url
                  or direct.get("html_url") != expected_html
                  or direct.get("workflow_name") != "CI"
              ):
                  raise SystemExit("direct CI job receipt does not match its inventory row")
              job_receipts.append(
                  CIJobReceipt(
                      name=direct.get("name"),
                      job_id=direct.get("id"),
                      run_id=direct.get("run_id"),
                      run_attempt=1,
                      head_sha=direct.get("head_sha"),
                      status=direct.get("status"),
                      conclusion=direct.get("conclusion"),
                  )
              )

          ci_run = CIRunReceipt(
              repository=repository,
              workflow_id=dispatch.workflow_id,
              workflow_path=CI_PATH,
              run_id=run_id,
              run_attempt=final_run.get("run_attempt"),
              head_sha=final_run.get("head_sha"),
              event=final_run.get("event"),
              directly_verified=True,
              jobs=tuple(job_receipts),
          )
          validation = validate_metadata_head(head, dispatch=dispatch, ci_run=ci_run)

          verify_default_ref(
              repository=repository,
              default_branch=default_branch,
              api_url=api_url,
              expected_sha=head.metadata_head_sha,
          )

          closeout_path.write_text(
              json.dumps(
                  {
                      "validation": asdict(validation),
                      "dispatch": asdict(dispatch),
                      "ci_run": asdict(ci_run),
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload metadata closeout receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: full-extraction-metadata-closeout-${{ env.ACTIVE_CHAIN_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publication/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  # ─────────────────────────────────────────────────────────────
  #  Lane control: carry a manifest forward and classify unresolved lanes
  # ─────────────────────────────────────────────────────────────
  lane_control:
    needs: [plan, preflight, discovery_seed, vpn_quarantine, extract, terminal_replay]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.operation-authority-status == 'validated' && needs.plan.outputs.free-execution-collector-status == 'admitted' && needs.plan.outputs.free-execution-collector-authenticated == 'true' && needs.plan.outputs.free-execution-runtime-context-status == 'authenticated' && needs.plan.outputs.free-execution-storage-mutations-allowed == 'true' && needs.plan.outputs.free-execution-provider-calls-allowed == 'true' && needs.plan.outputs.free-execution-mutations-authorized == 'true' && ((needs.plan.outputs.active-lane-count != '0' && needs.preflight.result == 'success' && needs.discovery_seed.result == 'success' && needs.extract.result != 'skipped') || (inputs.resume_source_run_id != '' && needs.plan.outputs.active-lane-count == '0' && needs.plan.outputs.matrix-lane-count == '0' && needs.terminal_replay.result == 'success' && needs.terminal_replay.outputs.artifact-name == '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      active-lane-count: ${{ steps.next_manifest.outputs.active_lane_count }}
      resume-only-lane-count: ${{ steps.next_manifest.outputs.resume_only_lane_count }}
      contract-blocked-lane-count: ${{ steps.next_manifest.outputs.contract_blocked_lane_count }}
      split-lane-count: ${{ steps.next_manifest.outputs.split_lane_count }}
      vpn-auth-circuit-open: ${{ steps.next_manifest.outputs.vpn_auth_circuit_open }}
      artifact-name: ${{ steps.next_manifest.outputs.artifact_name }}
      candidate-artifact-name: ${{ steps.next_manifest.outputs.candidate_artifact_name }}
      checkpoint-artifact-name: ${{ steps.next_manifest.outputs.checkpoint_artifact_name }}
      checkpoint-generation: ${{ steps.next_manifest.outputs.checkpoint_generation }}
      iteration-budget: ${{ steps.next_manifest.outputs.iteration_budget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.WORKFLOW_SOURCE_SHA }}

      - name: Validate full extraction attempt
        env:
          FULL_EXTRACTION_ATTEMPT_GATE_ROLE: partial
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/validate_full_extraction_attempt.py

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - run: uv sync --locked

      - name: Download lane metadata
        if: ${{ needs.plan.outputs.active-lane-count != '0' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: extraction-lane-metadata-${{ env.ACTIVE_CHAIN_ID }}-*
          path: lane-metadata/

      - name: Download lane manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: full-extraction-manifest-${{ env.ACTIVE_CHAIN_ID }}
          path: plan-artifact/

      - name: Prepare next manifest
        env:
          ITERATION: ${{ inputs.iteration }}
          MAX_ITERATIONS: ${{ inputs.max_iterations }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          RETRY_PIPELINE_FAILURES: ${{ inputs.retry_pipeline_failures }}
          PREFLIGHT_QUARANTINE_JSON: ${{ needs.vpn_quarantine.outputs.vpn-quarantined-servers-json }}
        run: |
          mkdir -p artifacts/full-extraction
          effective_matrix_batch_size=1
          manifest_path="$(find plan-artifact -name manifest.json -type f -print -quit)"
          if [ -z "$manifest_path" ]; then
            echo "::error::Plan artifact did not contain manifest.json"
            find plan-artifact -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$manifest_path" artifacts/full-extraction/current-manifest.json
          uv run python - <<'PY'
          # PREFLIGHT_QUARANTINE_PERSISTENCE
          import json
          import os
          from pathlib import Path

          manifest_path = Path("artifacts/full-extraction/current-manifest.json")
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          chain_state = payload.setdefault("chain_state", {})
          if not isinstance(chain_state, dict):
              raise SystemExit("current manifest chain_state must be an object")
          existing = chain_state.get("vpn_quarantined_servers", [])
          incoming = json.loads(os.environ.get("PREFLIGHT_QUARANTINE_JSON", "") or "[]")
          if not isinstance(existing, list) or not isinstance(incoming, list):
              raise SystemExit("VPN quarantine state must be represented as JSON arrays")
          combined = sorted(
              {
                  str(server).strip()
                  for server in [*existing, *incoming]
                  if str(server).strip()
              }
          )
          chain_state["vpn_quarantined_servers"] = combined
          manifest_path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          checkpoint_generation="$(CURRENT_MANIFEST=artifacts/full-extraction/current-manifest.json python - <<'PY'
          # CHECKPOINT_GENERATION_RESOLVER
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(
              Path(os.environ["CURRENT_MANIFEST"]).read_text(encoding="utf-8")
          )
          chain_id = os.environ["CHAIN_ID"]
          expected_source_sha = os.environ["WORKFLOW_SOURCE_SHA"].lower()
          if not isinstance(manifest, dict):
              raise SystemExit("checkpoint provenance manifest must be an object")
          if str(manifest.get("chain_id") or "") != chain_id:
              raise SystemExit("checkpoint provenance manifest chain identity does not match")
          if str(manifest.get("workflow_source_sha") or "").lower() != expected_source_sha:
              raise SystemExit("checkpoint provenance manifest source SHA does not match")

          state = manifest.get("chain_state", {})
          if not isinstance(state, dict):
              raise SystemExit("checkpoint provenance chain_state must be an object")
          previous_run_id = str(state.get("latest_checkpoint_run_id") or "").strip()
          previous_artifact_name = str(
              state.get("latest_checkpoint_artifact_name") or ""
          ).strip()
          previous_coverage_hash = str(
              state.get("latest_checkpoint_coverage_hash") or ""
          ).strip().lower()
          raw_previous_generation = state.get("latest_checkpoint_generation", 0)
          if isinstance(raw_previous_generation, bool) or not isinstance(
              raw_previous_generation, int
          ):
              raise SystemExit(
                  "trusted previous checkpoint generation must be a non-negative integer"
              )
          previous_generation = raw_previous_generation
          if previous_generation < 0:
              raise SystemExit(
                  "trusted previous checkpoint generation must be a non-negative integer"
              )

          if previous_generation == 0:
              if previous_run_id or previous_artifact_name or previous_coverage_hash:
                  raise SystemExit(
                      "checkpoint pointer cannot exist without a positive trusted generation"
                  )
          else:
              if re.fullmatch(r"[1-9][0-9]*", previous_run_id) is None:
                  raise SystemExit(
                      "positive trusted checkpoint generation requires a valid source run ID"
                  )
              expected_previous_name = (
                  f"full-extraction-checkpoint-{chain_id}-iter-{previous_generation}"
              )
              if previous_artifact_name != expected_previous_name:
                  raise SystemExit(
                      "trusted previous checkpoint artifact suffix does not match its generation: "
                      f"expected {expected_previous_name}, got "
                      f"{previous_artifact_name or '<missing>'}"
                  )
              if re.fullmatch(r"[0-9a-f]{64}", previous_coverage_hash) is None:
                  raise SystemExit(
                      "positive trusted checkpoint generation requires a coverage SHA-256"
                  )

          print(previous_generation + 1)
          PY
          )"
          CHECKPOINT_GENERATION="$checkpoint_generation"
          CHECKPOINT_ARTIFACT_NAME="full-extraction-checkpoint-${CHAIN_ID}-iter-${CHECKPOINT_GENERATION}"
          export CHECKPOINT_ARTIFACT_NAME CHECKPOINT_GENERATION
          common_resume_args=(
            resume
            --lane-manifest-path artifacts/full-extraction/current-manifest.json
            --metadata-dir lane-metadata
            --completed-artifact-run-id "${{ github.run_id }}"
            --iteration "$ITERATION"
            --max-matrix-lanes "$effective_matrix_batch_size"
            --vpn-slot-count 0
            --allow-missing-attempted-metadata
          )
          if [ "$RETRY_PIPELINE_FAILURES" = "true" ]; then
            common_resume_args+=(--allow-pipeline-failures)
          fi
          uv run python -m nbadb.orchestrate.full_extraction_control \
            "${common_resume_args[@]}" \
            --output-path artifacts/full-extraction/next-manifest.json \
            > artifacts/full-extraction/next-manifest.stdout.json

          uv run python -m nbadb.orchestrate.full_extraction_control audit \
            --metadata-dir lane-metadata \
            --output-path artifacts/full-extraction/extraction-audit.json \
            > artifacts/full-extraction/extraction-audit.stdout.json

          {
            echo "CHECKPOINT_ARTIFACT_NAME=$CHECKPOINT_ARTIFACT_NAME"
            echo "CHECKPOINT_GENERATION=$CHECKPOINT_GENERATION"
          } >> "$GITHUB_ENV"

      - name: Build next manifest
        id: next_manifest
        env:
          ITERATION: ${{ inputs.iteration }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
        run: |
          uv run python - <<'PY'
          # LANE_CONTROL_CONTRACT_BLOCKED_POSTPROCESSOR
          import json
          import os
          import re
          from pathlib import Path

          from nbadb.orchestrate.full_extraction_control import (
              _canonical_contract_blocked_audit_row,
              _hash_payload,
              normalize_manifest,
              redispatch_manifest_payload,
          )

          payload = json.loads(
              Path("artifacts/full-extraction/next-manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          current_payload = json.loads(
              Path("artifacts/full-extraction/current-manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          next_state = payload.get("chain_state", {})
          current_state = current_payload.get("chain_state", {})
          if not isinstance(next_state, dict) or not isinstance(current_state, dict):
              raise SystemExit("checkpoint manifest chain_state must be an object")
          audit = json.loads(
              Path("artifacts/full-extraction/extraction-audit.json").read_text(
                  encoding="utf-8"
              )
          )
          if not isinstance(audit, dict):
              raise SystemExit("extraction audit must be an object")

          def canonical_rows(raw_rows: object, *, label: str) -> list[dict[str, object]]:
              if not isinstance(raw_rows, list):
                  raise SystemExit(f"{label} blocked evidence must be a list")
              rows: list[dict[str, object]] = []
              seen: set[str] = set()
              for raw_row in raw_rows:
                  if not isinstance(raw_row, dict):
                      raise SystemExit(f"{label} blocked evidence rows must be objects")
                  lane_id = str(raw_row.get("lane_id") or "").strip()
                  if not lane_id or lane_id in seen:
                      raise SystemExit(f"{label} blocked lane IDs must be unique")
                  canonical_input = dict(raw_row)
                  canonical_input["lane_kind"] = raw_row.get("kind")
                  try:
                      row = _canonical_contract_blocked_audit_row(
                          lane_id,
                          canonical_input,
                      )
                  except ValueError as exc:
                      raise SystemExit(
                          f"{label} blocked evidence is invalid for {lane_id}: {exc}"
                      ) from exc
                  if _hash_payload(row) != _hash_payload(raw_row):
                      raise SystemExit(
                          f"{label} blocked evidence is not canonical for {lane_id}"
                      )
                  seen.add(lane_id)
                  rows.append(row)
              return sorted(rows, key=lambda row: str(row["lane_id"]))

          previous_blocked_rows = canonical_rows(
              current_state.get("contract_blocked_evidence", []),
              label="current chain-state",
          )
          previous_blocked_digest = str(
              current_state.get("contract_blocked_evidence_sha256") or ""
          )
          if previous_blocked_rows:
              previous_bundle = {
                  "schema_version": 1,
                  "contract_blocked_lanes": previous_blocked_rows,
              }
              if _hash_payload(previous_bundle) != previous_blocked_digest:
                  raise SystemExit("current chain-state blocked evidence digest does not match")
          elif previous_blocked_digest:
              empty_bundle = {"schema_version": 1, "contract_blocked_lanes": []}
              if _hash_payload(empty_bundle) != previous_blocked_digest:
                  raise SystemExit("current chain-state empty blocked evidence digest is invalid")

          pending_blocked_rows = canonical_rows(
              current_state.get("pending_contract_blocked_evidence", []),
              label="current pending chain-state",
          )
          pending_blocked_digest = str(
              current_state.get("pending_contract_blocked_evidence_sha256") or ""
          )
          if pending_blocked_rows:
              pending_bundle = {
                  "schema_version": 1,
                  "contract_blocked_lanes": pending_blocked_rows,
              }
              if _hash_payload(pending_bundle) != pending_blocked_digest:
                  raise SystemExit(
                      "current chain-state pending blocked evidence digest does not match"
                  )
          elif pending_blocked_digest:
              raise SystemExit(
                  "current chain-state pending blocked evidence digest has no rows"
              )

          current_blocked_rows = canonical_rows(
              audit.get("contract_blocked_lanes", []),
              label="current extraction audit",
          )
          blocked_rows_by_id = {
              str(row["lane_id"]): row for row in previous_blocked_rows
          }
          for label, rows in (
              ("pending", pending_blocked_rows),
              ("current", current_blocked_rows),
          ):
              for row in rows:
                  lane_id = str(row["lane_id"])
                  prior = blocked_rows_by_id.get(lane_id)
                  if prior is not None and _hash_payload(prior) != _hash_payload(row):
                      raise SystemExit(f"{label} blocked evidence changed for {lane_id}")
                  blocked_rows_by_id[lane_id] = row
          merged_blocked_rows = [
              blocked_rows_by_id[lane_id] for lane_id in sorted(blocked_rows_by_id)
          ]
          merged_blocked_bundle = {
              "schema_version": 1,
              "contract_blocked_lanes": merged_blocked_rows,
          }
          merged_blocked_digest = _hash_payload(merged_blocked_bundle)
          next_state["previous_contract_blocked_evidence"] = previous_blocked_rows
          next_state["previous_contract_blocked_evidence_sha256"] = (
              previous_blocked_digest
          )
          next_state["contract_blocked_evidence"] = merged_blocked_rows
          next_state["contract_blocked_evidence_sha256"] = merged_blocked_digest
          next_state["pending_contract_blocked_evidence"] = []
          next_state["pending_contract_blocked_evidence_sha256"] = ""
          current_run_ids = current_state.get("artifact_run_ids", [])
          next_run_ids = next_state.get("artifact_run_ids", [])
          if not isinstance(current_run_ids, list) or not isinstance(next_run_ids, list):
              raise SystemExit("checkpoint artifact_run_ids must be lists")
          artifact_run_ids = [
              str(run_id).strip()
              for run_id in [*current_run_ids, *next_run_ids]
              if str(run_id).strip()
          ]
          if any(re.fullmatch(r"[1-9][0-9]*", run_id) is None for run_id in artifact_run_ids):
              raise SystemExit("checkpoint artifact run IDs must be positive integers")
          next_state["artifact_run_ids"] = list(dict.fromkeys(artifact_run_ids))
          Path("artifacts/full-extraction/next-manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          manifest = normalize_manifest(payload)
          summary = payload.get("resume_summary", {})
          redispatch_payload = redispatch_manifest_payload(
              list(manifest.lanes),
              assurance_admission=manifest.assurance_admission,
              chain_state=manifest.chain_state,
              chain_id=os.environ["CHAIN_ID"],
              workflow_source_sha=os.environ["WORKFLOW_SOURCE_SHA"],
              provider_authority=manifest.provider_authority,
          )
          redispatch_json = json.dumps(redispatch_payload, separators=(",", ":"))
          artifact_name = (
              f"full-extraction-next-manifest-{os.environ['CHAIN_ID']}-iter-"
              f"{int(os.environ['ITERATION']) + 1}-run-{os.environ['GITHUB_RUN_ID']}-"
              f"attempt-{os.environ['GITHUB_RUN_ATTEMPT']}"
          )
          candidate_artifact_name = (
              f"full-extraction-checkpoint-candidate-{os.environ['CHAIN_ID']}-"
              f"run-{os.environ['GITHUB_RUN_ID']}-attempt-{os.environ['GITHUB_RUN_ATTEMPT']}"
          )
          report = {
              "artifact_name": artifact_name,
              "candidate_artifact_name": candidate_artifact_name,
              "checkpoint_artifact_name": os.environ["CHECKPOINT_ARTIFACT_NAME"],
              "checkpoint_generation": int(os.environ["CHECKPOINT_GENERATION"]),
              "active_lane_count": int(summary.get("active_lane_count", 0)),
              "resume_only_lane_count": int(summary.get("resume_only_lane_count", 0)),
              "contract_blocked_lane_count": int(summary.get("contract_blocked_lane_count", 0)),
              "split_lane_count": int(summary.get("split_lane_count", 0)),
              "vpn_auth_circuit_deferred_lane_count": int(
                  summary.get("vpn_auth_circuit_deferred_lane_count", 0)
              ),
              "vpn_auth_circuit_check_failed_lane_count": int(
                  summary.get("vpn_auth_circuit_check_failed_lane_count", 0)
              ),
              "vpn_auth_circuit_rejection_lane_count": int(
                  summary.get("vpn_auth_circuit_rejection_lane_count", 0)
              ),
              "vpn_auth_circuit_open": str(
                  int(summary.get("vpn_auth_circuit_deferred_lane_count", 0)) > 0
                  or int(summary.get("vpn_auth_circuit_rejection_lane_count", 0)) > 0
              ).lower(),
              "outcome_counts": summary.get("outcome_counts", {}),
              "failure_reason_counts": summary.get("failure_reason_counts", {}),
              "failure_class_counts": summary.get("failure_class_counts", {}),
              "iteration_budget": int(payload.get("iteration_budget", 0)),
              "redispatch_payload_bytes": len(redispatch_json.encode("utf-8")),
              "next_iteration": int(os.environ["ITERATION"]) + 1,
          }
          Path("artifacts/full-extraction/chain-dispatch.json").write_text(
              json.dumps(report, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("artifacts/full-extraction/resume-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("artifacts/full-extraction/next-manifest.inspect.txt").write_text(
              "\n".join(
                  [
                      f"active_lane_count={report['active_lane_count']}",
                      f"resume_only_lane_count={report['resume_only_lane_count']}",
                      f"contract_blocked_lane_count={report['contract_blocked_lane_count']}",
                      f"split_lane_count={report['split_lane_count']}",
                      "vpn_auth_circuit_deferred_lane_count="
                      + str(report["vpn_auth_circuit_deferred_lane_count"]),
                      "vpn_auth_circuit_check_failed_lane_count="
                      + str(report["vpn_auth_circuit_check_failed_lane_count"]),
                      "vpn_auth_circuit_rejection_lane_count="
                      + str(report["vpn_auth_circuit_rejection_lane_count"]),
                      f"vpn_auth_circuit_open={report['vpn_auth_circuit_open']}",
                      "outcome_counts="
                      + json.dumps(report["outcome_counts"], sort_keys=True),
                      "failure_reason_counts="
                      + json.dumps(report["failure_reason_counts"], sort_keys=True),
                      "failure_class_counts="
                      + json.dumps(report["failure_class_counts"], sort_keys=True),
                      f"iteration_budget={report['iteration_budget']}",
                      f"redispatch_payload_bytes={report['redispatch_payload_bytes']}",
                      f"artifact_name={artifact_name}",
                      f"candidate_artifact_name={candidate_artifact_name}",
                      f"checkpoint_artifact_name={report['checkpoint_artifact_name']}",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for key, value in report.items():
                  if isinstance(value, dict):
                      value = json.dumps(value, sort_keys=True)
                  handle.write(f"{key}={value}\n")
          PY

          active_lane_count="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("artifacts/full-extraction/chain-dispatch.json").read_text())["active_lane_count"])
          PY
          )"
          resume_only_lane_count="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("artifacts/full-extraction/chain-dispatch.json").read_text())["resume_only_lane_count"])
          PY
          )"
          contract_blocked_lane_count="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("artifacts/full-extraction/chain-dispatch.json").read_text())["contract_blocked_lane_count"])
          PY
          )"
          split_lane_count="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("artifacts/full-extraction/chain-dispatch.json").read_text())["split_lane_count"])
          PY
          )"
          vpn_auth_circuit_deferred_lane_count="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("artifacts/full-extraction/chain-dispatch.json").read_text())["vpn_auth_circuit_deferred_lane_count"])
          PY
          )"
          vpn_auth_circuit_check_failed_lane_count="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("artifacts/full-extraction/chain-dispatch.json").read_text())["vpn_auth_circuit_check_failed_lane_count"])
          PY
          )"
          vpn_auth_circuit_rejection_lane_count="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("artifacts/full-extraction/chain-dispatch.json").read_text())["vpn_auth_circuit_rejection_lane_count"])
          PY
          )"
          vpn_auth_circuit_open="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("artifacts/full-extraction/chain-dispatch.json").read_text())["vpn_auth_circuit_open"])
          PY
          )"
          artifact_name="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("artifacts/full-extraction/chain-dispatch.json").read_text())["artifact_name"])
          PY
          )"
          failure_reason_counts="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.dumps(json.loads(Path("artifacts/full-extraction/chain-dispatch.json").read_text())["failure_reason_counts"], sort_keys=True))
          PY
          )"
          outcome_counts="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.dumps(json.loads(Path("artifacts/full-extraction/chain-dispatch.json").read_text())["outcome_counts"], sort_keys=True))
          PY
          )"
          rows_persisted="$(python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path("artifacts/full-extraction/extraction-audit.json").read_text())
          print(audit.get("rows_persisted", 0))
          PY
          )"
          top_endpoint_blockers="$(python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path("artifacts/full-extraction/extraction-audit.json").read_text())
          endpoint_counts = audit.get("endpoint_status_counts", {})
          blockers = []
          for endpoint, counts in endpoint_counts.items():
              blocked = int(counts.get("contract_blocked", 0))
              failed = int(counts.get("pipeline_failure", 0))
              waiting = int(counts.get("needs_resume", 0))
              total = blocked + failed + waiting
              if total:
                  blockers.append((total, endpoint, counts))
          blockers.sort(reverse=True)
          print(", ".join(f"{endpoint}:{total}" for total, endpoint, _counts in blockers[:5]) or "none")
          PY
          )"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("artifacts/full-extraction/next-manifest.json").read_text(encoding="utf-8")
          )
          quarantine_payload = {
              "chain_id": os.environ["CHAIN_ID"],
              "vpn_quarantined_servers": manifest.get("chain_state", {}).get(
                  "vpn_quarantined_servers", []
              ),
          }
          Path("artifacts/full-extraction/vpn-quarantine.json").write_text(
              json.dumps(quarantine_payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          {
            echo "## Full Extraction Control Plane"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Control-plane health | OK |"
            echo "| Lane outcomes | \`$outcome_counts\` |"
            echo "| Top endpoint blockers | \`$top_endpoint_blockers\` |"
            echo "| Rows persisted | $rows_persisted |"
            echo "| Active lanes | $active_lane_count |"
            echo "| Resume-only lanes | $resume_only_lane_count |"
            echo "| Contract-blocked lanes | $contract_blocked_lane_count |"
            echo "| Split child lanes | $split_lane_count |"
            echo "| VPN auth-circuit deferred lanes | $vpn_auth_circuit_deferred_lane_count |"
            echo "| VPN auth-circuit lookup failures | $vpn_auth_circuit_check_failed_lane_count |"
            echo "| VPN auth-circuit rejecting lanes | $vpn_auth_circuit_rejection_lane_count |"
            if [ "$active_lane_count" -gt 0 ]; then
              if [ "$vpn_auth_circuit_open" = "true" ]; then
                echo "| Next action | Stop after checkpoint; repair VPN account capacity, then resume this chain |"
              else
                echo "| Next action | Redispatch iteration $((ITERATION + 1)) via \`$artifact_name\` |"
              fi
            else
              echo "| Next action | Merge terminal checkpoint artifact |"
            fi
            echo ""
            echo "**Unresolved reasons:** \`$failure_reason_counts\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload checkpoint candidate manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: false
          name: ${{ steps.next_manifest.outputs.candidate_artifact_name || format('full-extraction-checkpoint-candidate-{0}-run-{1}-attempt-{2}', env.ACTIVE_CHAIN_ID, github.run_id, github.run_attempt) }}
          path: |
            artifacts/full-extraction/current-manifest.json
            artifacts/full-extraction/next-manifest.json
            artifacts/full-extraction/next-manifest.stdout.json
            artifacts/full-extraction/next-manifest.inspect.txt
            artifacts/full-extraction/resume-summary.json
            artifacts/full-extraction/extraction-audit.json
            artifacts/full-extraction/extraction-audit.stdout.json
            artifacts/full-extraction/chain-dispatch.json
            artifacts/full-extraction/vpn-quarantine.json
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 6

      - name: Upload VPN quarantine artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: full-extraction-vpn-quarantine-${{ env.ACTIVE_CHAIN_ID }}
          path: artifacts/full-extraction/vpn-quarantine.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

  # ─────────────────────────────────────────────────────────────
  #  Checkpoint: aggregate complete lanes into a cumulative database
  # ─────────────────────────────────────────────────────────────
  checkpoint:
    needs: [plan, preflight, discovery_seed, extract, lane_control]
    if: ${{ always() && !cancelled() && needs.plan.outputs.operation-authority-status == 'validated' && needs.plan.outputs.free-execution-collector-status == 'admitted' && needs.plan.outputs.free-execution-collector-authenticated == 'true' && needs.plan.outputs.free-execution-runtime-context-status == 'authenticated' && needs.plan.outputs.free-execution-storage-mutations-allowed == 'true' && needs.plan.outputs.free-execution-provider-calls-allowed == 'true' && needs.plan.outputs.free-execution-mutations-authorized == 'true' && needs.lane_control.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-name: ${{ steps.checkpoint.outputs.artifact_name }}
      artifact-id: ${{ steps.commit_manifest.outputs.artifact_id }}
      artifact-digest: ${{ steps.commit_manifest.outputs.artifact_digest }}
      artifact-receipt-source: ${{ steps.checkpoint_receipt.outputs.receipt_source }}
      manifest-artifact-name: ${{ steps.commit_manifest.outputs.manifest_artifact_name }}
      manifest-artifact-id: ${{ steps.committed_manifest.outputs.artifact-id }}
      manifest-artifact-digest: ${{ steps.committed_manifest.outputs.artifact-digest }}
      manifest-artifact-size: ${{ steps.committed_manifest.outputs.artifact-size-bytes }}
      manifest-artifact-archive-url: ${{ steps.committed_manifest.outputs.artifact-archive-url }}
      checkpoint-generation: ${{ steps.checkpoint.outputs.checkpoint_generation }}
      coverage-fingerprint: ${{ steps.checkpoint.outputs.coverage_fingerprint }}
      terminal-ready: ${{ steps.checkpoint.outputs.terminal_ready }}
      active-lane-count: ${{ steps.checkpoint.outputs.active_lane_count }}
      dependent-activation-required: ${{ steps.checkpoint.outputs.dependent_activation_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.WORKFLOW_SOURCE_SHA }}

      - name: Validate full extraction attempt
        env:
          FULL_EXTRACTION_ATTEMPT_GATE_ROLE: partial
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/validate_full_extraction_attempt.py

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - run: uv sync --locked

      - name: Download lane-control manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.lane_control.outputs.candidate-artifact-name }}
          path: lane-control-artifact/

      - name: Select previous checkpoint owner provenance
        id: previous_checkpoint_owner
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          matches = [
              path
              for path in Path("lane-control-artifact").rglob("current-manifest.json")
              if path.is_file() and not path.is_symlink()
          ]
          if len(matches) != 1:
              raise SystemExit(
                  "lane-control artifact must contain exactly one current-manifest.json"
              )
          manifest = json.loads(matches[0].read_text(encoding="utf-8"))
          expected_source_sha = os.environ["WORKFLOW_SOURCE_SHA"].lower()
          if (
              not isinstance(manifest, dict)
              or re.fullmatch(r"[0-9a-f]{40}", expected_source_sha) is None
              or str(manifest.get("workflow_source_sha") or "").lower()
              != expected_source_sha
          ):
              raise SystemExit("previous checkpoint manifest source SHA is invalid")
          state = manifest.get("chain_state", {})
          if not isinstance(state, dict):
              raise SystemExit("checkpoint chain_state must be an object")
          run_id = str(state.get("latest_checkpoint_run_id") or "").strip()
          artifact_name = str(
              state.get("latest_checkpoint_artifact_name") or ""
          ).strip()
          if bool(run_id) != bool(artifact_name):
              raise SystemExit("previous checkpoint pointer is incomplete")
          if run_id and re.fullmatch(r"[1-9][0-9]*", run_id) is None:
              raise SystemExit("previous checkpoint run ID is invalid")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"run_id={run_id}\n")
          PY

      - name: Attest previous checkpoint owner provenance
        if: ${{ steps.previous_checkpoint_owner.outputs.run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_CHECKPOINT_RUN_ID: ${{ steps.previous_checkpoint_owner.outputs.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/workflow-provenance"
          python .github/scripts/workflow_source_provenance.py attest-run \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$PREVIOUS_CHECKPOINT_RUN_ID" \
            --source-sha "$WORKFLOW_SOURCE_SHA" \
            --trusted-branch "$WORKFLOW_SOURCE_REF" \
            --workflow-path .github/workflows/full-extraction.yml \
            --required-state active-or-completed \
            --output "$RUNNER_TEMP/workflow-provenance/previous-checkpoint-owner.json"
          python .github/scripts/workflow_source_provenance.py recheck-run \
            --attestation "$RUNNER_TEMP/workflow-provenance/previous-checkpoint-owner.json" \
            --required-state active-or-completed \
            --output "$RUNNER_TEMP/workflow-provenance/previous-checkpoint-owner-recheck.json"

      - name: Resolve previous checkpoint receipt
        id: previous_checkpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p previous-checkpoint artifacts/full-extraction
          current_manifest="$(find lane-control-artifact -name current-manifest.json -type f -print -quit)"
          if [ -z "$current_manifest" ]; then
            echo "::error::Lane-control artifact did not contain current-manifest.json"
            find lane-control-artifact -maxdepth 4 -type f -print || true
            exit 1
          fi

          CURRENT_MANIFEST="$current_manifest" OWNER_RECHECK_PATH="$RUNNER_TEMP/workflow-provenance/previous-checkpoint-owner-recheck.json" python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          manifest_path = Path(os.environ["CURRENT_MANIFEST"])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected_source_sha = os.environ["WORKFLOW_SOURCE_SHA"].lower()
          if (
              not isinstance(manifest, dict)
              or re.fullmatch(r"[0-9a-f]{40}", expected_source_sha) is None
              or str(manifest.get("workflow_source_sha") or "").lower()
              != expected_source_sha
          ):
              raise SystemExit("previous checkpoint manifest source SHA is invalid")
          state = manifest.get("chain_state", {})
          if not isinstance(state, dict):
              raise SystemExit("checkpoint chain_state must be an object")
          run_id = str(state.get("latest_checkpoint_run_id") or "").strip()
          artifact_name = str(
              state.get("latest_checkpoint_artifact_name") or ""
          ).strip()
          has_transaction = "latest_checkpoint_transaction" in state
          transaction = (
              state["latest_checkpoint_transaction"] if has_transaction else None
          )
          output = Path(os.environ["GITHUB_OUTPUT"])
          if not run_id and not artifact_name and not has_transaction:
              with output.open("a", encoding="utf-8") as handle:
                  handle.write("run_id=\nartifact_name=\nartifact_id=\n")
              raise SystemExit(0)
          if re.fullmatch(r"[1-9][0-9]*", run_id) is None or not artifact_name:
              raise SystemExit("previous checkpoint pointer is incomplete")
          if not has_transaction:
              with output.open("a", encoding="utf-8") as handle:
                  handle.write(f"run_id={run_id}\n")
                  handle.write(f"artifact_name={artifact_name}\n")
                  handle.write("artifact_id=\n")
              raise SystemExit(0)
          if not isinstance(transaction, dict) or transaction.get("state") != "committed":
              raise SystemExit("previous checkpoint transaction must be committed")
          identity = transaction.get("identity")
          receipt = transaction.get("receipt")
          if not isinstance(identity, dict) or not isinstance(receipt, dict):
              raise SystemExit("previous checkpoint transaction receipt is missing")
          artifact_id = receipt.get("artifact_id")
          if isinstance(artifact_id, bool) or not isinstance(artifact_id, int) or artifact_id < 1:
              raise SystemExit("previous checkpoint artifact ID must be positive")
          expected_digest = str(receipt.get("artifact_digest") or "")
          expected_size = receipt.get("artifact_size_bytes")
          if (
              str(receipt.get("artifact_run_id") or "") != run_id
              or str(receipt.get("artifact_name") or "") != artifact_name
              or str(identity.get("source_sha") or "").lower()
              != expected_source_sha
              or str(receipt.get("source_sha") or "").lower()
              != expected_source_sha
              or re.fullmatch(r"sha256:[0-9a-f]{64}", expected_digest) is None
              or isinstance(expected_size, bool)
              or not isinstance(expected_size, int)
              or expected_size < 1
          ):
              raise SystemExit("previous checkpoint artifact receipt is invalid")
          repository = os.environ["GITHUB_REPOSITORY"]
          owner_snapshot = json.loads(
              Path(os.environ["OWNER_RECHECK_PATH"]).read_text(encoding="utf-8")
          )
          owner_claim = (
              owner_snapshot.get("run")
              if isinstance(owner_snapshot, dict)
              else None
          )
          semantic_source = (
              owner_snapshot.get("semantic_source")
              if isinstance(owner_snapshot, dict)
              else None
          )
          workflow_claim = (
              owner_snapshot.get("workflow")
              if isinstance(owner_snapshot, dict)
              else None
          )
          if (
              not isinstance(owner_snapshot, dict)
              or type(owner_snapshot.get("schema_version")) is not int
              or owner_snapshot.get("schema_version") != 1
              or owner_snapshot.get("repository") != repository
              or not isinstance(owner_claim, dict)
              or type(owner_claim.get("id")) is not int
              or owner_claim.get("id") != int(run_id)
              or owner_claim.get("url")
              != (
                  f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{repository}"
                  f"/actions/runs/{run_id}"
              )
              or owner_claim.get("event") != "workflow_dispatch"
              or not isinstance(owner_claim.get("head_branch"), str)
              or not owner_claim.get("head_branch")
              or re.fullmatch(
                  r"[0-9a-f]{40}",
                  str(owner_claim.get("head_sha") or "").lower(),
              )
              is None
              or owner_claim.get("path")
              != ".github/workflows/full-extraction.yml"
              or type(owner_claim.get("attempt")) is not int
              or owner_claim.get("attempt") != 1
              or type(owner_claim.get("workflow_id")) is not int
              or owner_claim.get("workflow_id") < 1
              or not isinstance(semantic_source, dict)
              or str(semantic_source.get("sha") or "").lower()
              != expected_source_sha
              or semantic_source.get("relation")
              not in {"identical", "ancestor"}
              or (semantic_source.get("relation") == "identical")
              != (
                  str(semantic_source.get("sha") or "").lower()
                  == str(owner_claim.get("head_sha") or "").lower()
              )
              or not isinstance(workflow_claim, dict)
              or workflow_claim.get("path")
              != ".github/workflows/full-extraction.yml"
              or re.fullmatch(
                  r"[0-9a-f]{40}",
                  str(workflow_claim.get("blob_sha") or "").lower(),
              )
              is None
              or re.fullmatch(
                  r"[0-9a-f]{64}",
                  str(workflow_claim.get("sha256") or "").lower(),
              )
              is None
              or type(workflow_claim.get("size_in_bytes")) is not int
              or workflow_claim.get("size_in_bytes") < 1
          ):
              raise SystemExit(
                  "previous checkpoint owner recheck snapshot is invalid"
              )
          run_raw = subprocess.check_output(
              [
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  "-H",
                  "X-GitHub-Api-Version: 2026-03-10",
                  (
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{run_id}"
                  ),
              ],
              text=True,
          )
          owner_run = json.loads(run_raw)
          owner_head_sha = str(owner_run.get("head_sha") or "").lower()
          owner_repository = owner_run.get("repository")
          owner_status = owner_run.get("status")
          owner_conclusion = owner_run.get("conclusion")
          valid_owner_state = (
              owner_status in {"queued", "in_progress"}
              and owner_conclusion is None
          ) or (
              owner_status == "completed"
              and owner_conclusion
              in {"cancelled", "failure", "success", "timed_out"}
          )
          if (
              type(owner_run.get("id")) is not int
              or str(owner_run.get("id")) != run_id
              or owner_run.get("url") != owner_claim.get("url")
              or not isinstance(owner_repository, dict)
              or owner_repository.get("full_name") != repository
              or type(owner_run.get("run_attempt")) is not int
              or owner_run.get("run_attempt") != owner_claim.get("attempt")
              or owner_claim.get("attempt") != 1
              or owner_head_sha != str(owner_claim.get("head_sha") or "").lower()
              or not valid_owner_state
              or owner_status != owner_claim.get("status")
              or owner_conclusion != owner_claim.get("conclusion")
              or owner_run.get("event") != owner_claim.get("event")
              or owner_run.get("head_branch") != owner_claim.get("head_branch")
              or owner_run.get("path") != owner_claim.get("path")
              or type(owner_run.get("workflow_id")) is not int
              or owner_run.get("workflow_id") != owner_claim.get("workflow_id")
          ):
              raise SystemExit(
                  "previous checkpoint owner run changed after provenance recheck"
              )
          raw = subprocess.check_output(
              [
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  "-H",
                  "X-GitHub-Api-Version: 2026-03-10",
                  f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}",
              ],
              text=True,
          )
          artifact = json.loads(raw)
          workflow_run = artifact.get("workflow_run", {})
          rest_artifact_id = artifact.get("id")
          rest_artifact_size = artifact.get("size_in_bytes")
          expected_archive_url = (
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{repository}"
              f"/actions/artifacts/{artifact_id}/zip"
          )
          if (
              isinstance(rest_artifact_id, bool)
              or not isinstance(rest_artifact_id, int)
              or rest_artifact_id != artifact_id
              or artifact.get("name") != artifact_name
              or artifact.get("digest") != expected_digest
              or artifact.get("archive_download_url") != expected_archive_url
              or isinstance(rest_artifact_size, bool)
              or not isinstance(rest_artifact_size, int)
              or rest_artifact_size != expected_size
              or artifact.get("expired") is not False
              or not isinstance(workflow_run, dict)
              or str(workflow_run.get("id") or "") != run_id
              or str(workflow_run.get("head_sha") or "").lower()
              != owner_head_sha
          ):
              raise SystemExit(
                  "previous checkpoint REST identity does not match its committed receipt"
              )
          final_run_raw = subprocess.check_output(
              [
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  "-H",
                  "X-GitHub-Api-Version: 2026-03-10",
                  (
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{run_id}"
                  ),
              ],
              text=True,
          )
          if json.loads(final_run_raw) != owner_run:
              raise SystemExit(
                  "previous checkpoint owner changed after exact artifact selection"
              )
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"run_id={run_id}\n")
              handle.write(f"artifact_name={artifact_name}\n")
              handle.write(f"artifact_id={artifact_id}\n")
          PY

      - name: Download previous checkpoint by immutable ID
        if: ${{ steps.previous_checkpoint.outputs.artifact_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ steps.previous_checkpoint.outputs.artifact_id }}
          path: previous-checkpoint/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_checkpoint.outputs.run_id }}
          digest-mismatch: error

      - name: Download legacy previous checkpoint
        if: ${{ steps.previous_checkpoint.outputs.artifact_id == '' && steps.previous_checkpoint.outputs.run_id != '' }}
        env:
          ARTIFACT_NAME: ${{ steps.previous_checkpoint.outputs.artifact_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          legacy_receipt="$RUNNER_TEMP/workflow-provenance/legacy-previous-checkpoint.json"
          python .github/scripts/workflow_source_provenance.py resolve-artifact \
            --attestation "$RUNNER_TEMP/workflow-provenance/previous-checkpoint-owner-recheck.json" \
            --artifact-name "$ARTIFACT_NAME" \
            --output "$legacy_receipt"
          python .github/scripts/workflow_source_provenance.py download-artifact \
            --attestation "$RUNNER_TEMP/workflow-provenance/previous-checkpoint-owner-recheck.json" \
            --receipt "$legacy_receipt" \
            --output-dir previous-checkpoint \
            --output "$legacy_receipt.downloaded.json"

      - name: Verify previous checkpoint before inventory use
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/full-extraction
          current_manifest="$(find lane-control-artifact -name current-manifest.json -type f -print -quit)"
          previous_report="$(find previous-checkpoint -name checkpoint-report.json -type f -print -quit || true)"
          previous_database="$(find previous-checkpoint -name nba.duckdb -type f -print -quit || true)"
          if [ -z "$current_manifest" ]; then
            echo "::error::Lane-control artifact did not contain current-manifest.json"
            exit 1
          fi
          if [ -z "$previous_report" ] && [ -z "$previous_database" ]; then
            echo "::notice::No downloaded previous checkpoint requires verification"
            exit 0
          fi
          if [ -z "$previous_report" ] || [ -z "$previous_database" ]; then
            echo "::error::Downloaded previous checkpoint is incomplete"
            find previous-checkpoint -maxdepth 6 -type f -print || true
            exit 1
          fi

          uv run python -m nbadb.orchestrate.full_extraction_control verify-checkpoint \
            --lane-manifest-path "$current_manifest" \
            --checkpoint-dir previous-checkpoint \
            --checkpoint-report-path "$previous_report" \
            --chain-id "$CHAIN_ID" \
            --source-sha "$WORKFLOW_SOURCE_SHA" \
            --pointer-prefix latest \
            > artifacts/full-extraction/verified-previous-checkpoint.json

      - name: Download checkpoint lane inputs
        env:
          ACTIVE_CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/full-extraction checkpoint-discovery lane-metadata lanes
          current_manifest="$(find lane-control-artifact -name current-manifest.json -type f -print -quit)"
          if [ -z "$current_manifest" ]; then
            echo "::error::Lane-control artifact did not contain current-manifest.json"
            find lane-control-artifact -maxdepth 4 -type f -print || true
            exit 1
          fi

          run_ids_path="$RUNNER_TEMP/checkpoint-artifact-run-ids.txt"
          CURRENT_MANIFEST="$current_manifest" \
            RUN_IDS_PATH="$run_ids_path" \
            python - <<'PY'
          # CHECKPOINT_SOURCE_RUN_RESOLVER
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(
              Path(os.environ["CURRENT_MANIFEST"]).read_text(encoding="utf-8")
          )
          chain_id = os.environ["ACTIVE_CHAIN_ID"]
          expected_source_sha = os.environ["WORKFLOW_SOURCE_SHA"].lower()
          if not isinstance(manifest, dict):
              raise SystemExit("checkpoint current manifest must be an object")
          if str(manifest.get("chain_id") or "") != chain_id:
              raise SystemExit("checkpoint current manifest chain identity does not match")
          if str(manifest.get("workflow_source_sha") or "").lower() != expected_source_sha:
              raise SystemExit("checkpoint current manifest source SHA does not match")

          chain_state = manifest.get("chain_state", {})
          if not isinstance(chain_state, dict):
              raise SystemExit("checkpoint current manifest chain_state must be an object")
          raw_run_ids = chain_state.get("artifact_run_ids", [])
          if not isinstance(raw_run_ids, list):
              raise SystemExit("checkpoint artifact_run_ids must be a list")

          run_ids: list[str] = []
          for raw_run_id in [*raw_run_ids, os.environ["CURRENT_RUN_ID"]]:
              if isinstance(raw_run_id, bool):
                  raise SystemExit("checkpoint artifact run IDs must be positive integers")
              run_id = str(raw_run_id).strip()
              if re.fullmatch(r"[1-9][0-9]*", run_id) is None:
                  raise SystemExit(
                      f"checkpoint artifact run ID is invalid: {run_id or '<empty>'}"
                  )
              if run_id not in run_ids:
                  run_ids.append(run_id)

          Path(os.environ["RUN_IDS_PATH"]).write_text(
              "".join(f"{run_id}\n" for run_id in run_ids),
              encoding="utf-8",
          )
          PY

          inventories_dir="$RUNNER_TEMP/checkpoint-artifact-inventories"
          checkpoint_provenance_dir="$RUNNER_TEMP/workflow-provenance/checkpoint-inputs"
          mkdir -p "$inventories_dir" "$checkpoint_provenance_dir"
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            owner_attestation="$checkpoint_provenance_dir/run-${run_id}-owner.json"
            python .github/scripts/workflow_source_provenance.py attest-run \
              --repository "$GITHUB_REPOSITORY" \
              --run-id "$run_id" \
              --source-sha "$WORKFLOW_SOURCE_SHA" \
              --trusted-branch "$WORKFLOW_SOURCE_REF" \
              --workflow-path .github/workflows/full-extraction.yml \
              --required-state active-or-completed \
              --output "$owner_attestation"
            for receipt_kind in metadata lane discovery; do
              case "$receipt_kind" in
                metadata) receipt_prefix="extraction-lane-metadata-${ACTIVE_CHAIN_ID}-" ;;
                lane) receipt_prefix="extraction-lane-${ACTIVE_CHAIN_ID}-" ;;
                discovery) receipt_prefix="full-extraction-discovery-" ;;
              esac
              python .github/scripts/workflow_source_provenance.py \
                resolve-artifacts-by-prefix \
                --attestation "$owner_attestation" \
                --artifact-name-prefix "$receipt_prefix" \
                --poll-interval-seconds 0 \
                --output "$checkpoint_provenance_dir/run-${run_id}-${receipt_kind}.json"
            done
            RUN_ID="$run_id" \
              INVENTORIES_DIR="$inventories_dir" \
              PROVENANCE_DIR="$checkpoint_provenance_dir" \
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["RUN_ID"]
          provenance_dir = Path(os.environ["PROVENANCE_DIR"])
          artifacts: list[dict[str, object]] = []
          for kind in ("metadata", "lane", "discovery"):
              bundle = json.loads(
                  (provenance_dir / f"run-{run_id}-{kind}.json").read_text(
                      encoding="utf-8"
                  )
              )
              raw_artifacts = bundle.get("artifacts") if isinstance(bundle, dict) else None
              if not isinstance(raw_artifacts, list):
                  raise SystemExit("checkpoint stable artifact receipt bundle is malformed")
              artifacts.extend(raw_artifacts)
          artifact_ids = [artifact.get("id") for artifact in artifacts]
          if len(artifact_ids) != len(set(artifact_ids)):
              raise SystemExit("checkpoint stable artifact inventory contains duplicate IDs")
          output = Path(os.environ["INVENTORIES_DIR"]) / f"run-{run_id}.json"
          output.write_text(
              json.dumps([{"artifacts": artifacts}], sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          done < "$run_ids_path"

          verified_previous_checkpoint="$(find artifacts/full-extraction -name verified-previous-checkpoint.json -type f -print -quit || true)"
          download_plan="$RUNNER_TEMP/checkpoint-lane-input-downloads.tsv"
          CURRENT_MANIFEST="$current_manifest" \
            DOWNLOAD_PLAN_PATH="$download_plan" \
            INVENTORIES_DIR="$inventories_dir" \
            VERIFIED_PREVIOUS_CHECKPOINT_PATH="$verified_previous_checkpoint" \
            RUN_IDS_PATH="$run_ids_path" \
            python - <<'PY'
          # CHECKPOINT_LANE_INPUT_RESOLVER
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path(os.environ["CURRENT_MANIFEST"]).read_text(encoding="utf-8")
          )
          chain_id = os.environ["ACTIVE_CHAIN_ID"]
          lanes = manifest.get("lanes", [])
          if not isinstance(lanes, list):
              raise SystemExit("checkpoint manifest lanes must be a list")
          lane_ids: list[str] = []
          for lane in lanes:
              if not isinstance(lane, dict):
                  raise SystemExit("checkpoint manifest lane entries must be objects")
              lane_id = str(lane.get("lane_id") or "").strip()
              if not lane_id or lane_id in lane_ids:
                  raise SystemExit("checkpoint manifest lane IDs must be non-empty and unique")
              lane_ids.append(lane_id)

          previous_lane_ids: set[str] = set()
          verified_previous_checkpoint_path = os.environ.get(
              "VERIFIED_PREVIOUS_CHECKPOINT_PATH", ""
          )
          if verified_previous_checkpoint_path:
              verified_previous_checkpoint = json.loads(
                  Path(verified_previous_checkpoint_path).read_text(encoding="utf-8")
              )
              raw_previous_lane_ids = verified_previous_checkpoint.get("included_lane_ids")
              if not isinstance(raw_previous_lane_ids, list):
                  raise SystemExit(
                      "verified previous checkpoint included_lane_ids must be a list"
                  )
              previous_lane_ids = {
                  str(lane_id).strip()
                  for lane_id in raw_previous_lane_ids
                  if str(lane_id).strip()
              }

          run_ids = [
              line.strip()
              for line in Path(os.environ["RUN_IDS_PATH"])
              .read_text(encoding="utf-8")
              .splitlines()
              if line.strip()
          ]
          run_rank = {run_id: index for index, run_id in enumerate(run_ids)}
          expected_names: dict[str, tuple[str, str]] = {}
          for lane_id in lane_ids:
              if lane_id in previous_lane_ids:
                  continue
              expected_names[f"extraction-lane-metadata-{chain_id}-{lane_id}"] = (
                  "metadata",
                  lane_id,
              )
              expected_names[f"extraction-lane-{chain_id}-{lane_id}"] = (
                  "lane",
                  lane_id,
              )

          candidates: dict[tuple[str, str], list[tuple[str, str]]] = {}
          discovery_name = f"full-extraction-discovery-artifacts-{chain_id}"
          discovery_candidates: list[tuple[str, str]] = []
          inventories_dir = Path(os.environ["INVENTORIES_DIR"])
          for run_id in run_ids:
              inventory_path = inventories_dir / f"run-{run_id}.json"
              pages = json.loads(inventory_path.read_text(encoding="utf-8"))
              if not isinstance(pages, list):
                  raise SystemExit(f"artifact inventory for run {run_id} must be a list")
              seen_names: set[str] = set()
              for page in pages:
                  if not isinstance(page, dict) or not isinstance(page.get("artifacts", []), list):
                      raise SystemExit(f"artifact inventory for run {run_id} is malformed")
                  for artifact in page.get("artifacts", []):
                      if (
                          not isinstance(artifact, dict)
                          or artifact.get("expired") is not False
                      ):
                          continue
                      name = str(artifact.get("name") or "")
                      if name in seen_names:
                          raise SystemExit(
                              f"artifact inventory for run {run_id} contains duplicate {name!r}"
                          )
                      seen_names.add(name)
                      if name == discovery_name:
                          discovery_candidates.append((run_id, name))
                          continue
                      expected = expected_names.get(name)
                      if expected is not None:
                          candidates.setdefault(expected, []).append((run_id, name))

          downloads: list[tuple[str, str, str]] = []
          for lane_id in lane_ids:
              if lane_id in previous_lane_ids:
                  continue
              metadata_candidates = candidates.get(("metadata", lane_id), [])
              lane_candidates = candidates.get(("lane", lane_id), [])
              paired_candidates = [
                  (lane_candidate, metadata_candidate)
                  for lane_candidate in lane_candidates
                  for metadata_candidate in metadata_candidates
                  if lane_candidate[0] == metadata_candidate[0]
              ]
              if lane_candidates and len(paired_candidates) != 1:
                  locations = ", ".join(
                      f"{lane_candidate[0]}:{lane_candidate[1]}+{metadata_candidate[1]}"
                      for lane_candidate, metadata_candidate in paired_candidates
                  ) or "none"
                  raise SystemExit(
                      "checkpoint lane artifact requires exactly one same-run "
                      f"lane/metadata pair for {lane_id}; found "
                      f"{len(paired_candidates)}: {locations}"
                  )
              if paired_candidates:
                  selected_lane, selected_metadata = paired_candidates[0]
                  downloads.append((selected_metadata[0], "metadata", selected_metadata[1]))
                  downloads.append((selected_lane[0], "lane", selected_lane[1]))

          requires_workload = any(
              isinstance(lane, dict)
              and "player_team_season" in lane.get("patterns", [])
              for lane in lanes
          )
          if requires_workload:
              if not discovery_candidates:
                  raise SystemExit(
                      "checkpoint manifest requires an exact discovery workload artifact"
                  )
              selected_discovery = max(
                  discovery_candidates,
                  key=lambda candidate: run_rank[candidate[0]],
              )
              downloads.append(
                  (selected_discovery[0], "discovery", selected_discovery[1])
              )

          downloads.sort(key=lambda row: (run_rank[row[0]], row[1], row[2]))
          Path(os.environ["DOWNLOAD_PLAN_PATH"]).write_text(
              "".join("\t".join(row) + "\n" for row in downloads),
              encoding="utf-8",
          )
          PY

          while IFS=$'\t' read -r run_id artifact_kind artifact_name; do
            [ -n "$run_id" ] || continue
            case "$artifact_kind" in
              metadata) target_root="lane-metadata" ;;
              lane) target_root="lanes" ;;
              discovery) target_root="checkpoint-discovery" ;;
              *) echo "::error::Unknown checkpoint artifact kind: $artifact_kind"; exit 1 ;;
            esac
            target_dir="$target_root/run-${run_id}/${artifact_name}"
            owner_attestation="$checkpoint_provenance_dir/run-${run_id}-owner.json"
            receipt_path="$checkpoint_provenance_dir/download-${run_id}-${artifact_kind}.json"
            python .github/scripts/workflow_source_provenance.py resolve-artifact \
              --attestation "$owner_attestation" \
              --artifact-name "$artifact_name" \
              --poll-interval-seconds 0 \
              --output "$receipt_path"
            python .github/scripts/workflow_source_provenance.py download-artifact \
              --attestation "$owner_attestation" \
              --receipt "$receipt_path" \
              --output-dir "$target_dir" \
              --output "$receipt_path.downloaded.json"
          done < "$download_plan"

      - name: Restore dependent execution plan for checkpoint accounting
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_manifest="$(find lane-control-artifact -name current-manifest.json -type f -print -quit)"
          if [ -z "$current_manifest" ]; then
            echo "::error::Lane-control artifact did not contain current-manifest.json"
            exit 1
          fi
          eval "$(CURRENT_MANIFEST="$current_manifest" python - <<'PY'
          import json
          import os
          import shlex
          from pathlib import Path

          manifest = json.loads(Path(os.environ["CURRENT_MANIFEST"]).read_text(encoding="utf-8"))
          dependent = manifest.get("dependent_workload")
          if dependent is None or dependent.get("state") == "foundation_required":
              print("dependent_plan_required=false")
              raise SystemExit(0)
          if not isinstance(dependent, dict) or dependent.get("state") not in {"planned", "complete"}:
              raise SystemExit("checkpoint dependent workload contract is invalid")
          values = {
              "dependent_plan_required": "true",
              "dependent_artifact_run_id": str(dependent.get("artifact_run_id") or ""),
              "dependent_artifact_id": str(dependent.get("artifact_id") or ""),
              "dependent_artifact_name": str(dependent.get("artifact_name") or ""),
              "dependent_artifact_digest": str(dependent.get("artifact_digest") or ""),
          }
          for name, value in values.items():
              print(f"{name}={shlex.quote(value)}")
          PY
          )"
          if [ "$dependent_plan_required" != "true" ]; then
            echo "::notice::Checkpoint has no activated dependent execution plan"
            exit 0
          fi
          provenance_root="$RUNNER_TEMP/workflow-provenance/checkpoint-inputs"
          owner="$provenance_root/run-${dependent_artifact_run_id}-owner.json"
          owner_recheck="$provenance_root/run-${dependent_artifact_run_id}-dependent-recheck.json"
          receipt="$provenance_root/dependent-${dependent_artifact_id}.json"
          if [ ! -f "$owner" ]; then
            echo "::error::Dependent artifact owner attestation is missing"
            exit 1
          fi
          python .github/scripts/workflow_source_provenance.py recheck-run \
            --attestation "$owner" \
            --required-state active-or-completed \
            --output "$owner_recheck"
          python .github/scripts/workflow_source_provenance.py resolve-artifact \
            --attestation "$owner_recheck" \
            --artifact-name "$dependent_artifact_name" \
            --poll-interval-seconds 0 \
            --output "$receipt"
          DEPENDENT_RECEIPT="$receipt" \
            DEPENDENT_ARTIFACT_ID="$dependent_artifact_id" \
            DEPENDENT_ARTIFACT_NAME="$dependent_artifact_name" \
            DEPENDENT_ARTIFACT_DIGEST="$dependent_artifact_digest" \
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ["DEPENDENT_RECEIPT"]).read_text(encoding="utf-8"))
          if (
              str(receipt.get("id")) != os.environ["DEPENDENT_ARTIFACT_ID"]
              or receipt.get("name") != os.environ["DEPENDENT_ARTIFACT_NAME"]
              or str(receipt.get("digest") or "").lower()
              != os.environ["DEPENDENT_ARTIFACT_DIGEST"].lower()
          ):
              raise SystemExit("checkpoint dependent artifact receipt changed")
          PY
          python .github/scripts/workflow_source_provenance.py download-artifact \
            --attestation "$owner_recheck" \
            --receipt "$receipt" \
            --output-dir dependent-checkpoint-plan \
            --output "$receipt.downloaded.json"
          mapfile -t plans < <(find dependent-checkpoint-plan -name dependent-execution-plan.json -type f -print)
          if [ "${#plans[@]}" -ne 1 ]; then
            echo "::error::Dependent checkpoint plan is absent or ambiguous"
            exit 1
          fi

      - name: Build checkpoint database
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          CHECKPOINT_ARTIFACT_NAME: ${{ needs.lane_control.outputs.checkpoint-artifact-name }}
          EXPECTED_CHECKPOINT_GENERATION: ${{ needs.lane_control.outputs.checkpoint-generation }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          LANE_CONTROL_ACTIVE_LANE_COUNT: ${{ needs.lane_control.outputs.active-lane-count }}
          LANE_CONTROL_CONTRACT_BLOCKED_LANE_COUNT: ${{ needs.lane_control.outputs.contract-blocked-lane-count }}
        run: |
          mkdir -p data/nbadb-checkpoint artifacts/full-extraction
          checkpoint_manifest="$(find lane-control-artifact -name next-manifest.json -type f -print -quit)"
          current_manifest="$(find lane-control-artifact -name current-manifest.json -type f -print -quit)"
          if [ -z "$checkpoint_manifest" ]; then
            echo "::error::Lane-control artifact did not contain next-manifest.json"
            find lane-control-artifact -maxdepth 4 -type f -print || true
            exit 1
          fi
          if [ -z "$current_manifest" ]; then
            echo "::error::Lane-control artifact did not contain current-manifest.json"
            find lane-control-artifact -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$checkpoint_manifest" artifacts/full-extraction/checkpoint-manifest.json

          requires_workload_contract="$(CHECKPOINT_MANIFEST="$checkpoint_manifest" python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(os.environ["CHECKPOINT_MANIFEST"]).read_text(encoding="utf-8"))
          requires_workload = any(
              "player_team_season" in lane.get("patterns", [])
              for lane in manifest.get("lanes", [])
              if isinstance(lane, dict)
          )
          print("true" if requires_workload else "false")
          PY
          )"
          workload_args=()
          if [ "$requires_workload_contract" = "true" ]; then
            workload_manifest="$(find checkpoint-discovery -type f -name nba.player-team-season-workload.player-team-season-workload.json -print -quit)"
            if [ -z "$workload_manifest" ]; then
              echo "::error::Player/team/season checkpoint manifest requires the discovery workload manifest"
              exit 1
            fi
            workload_args+=(
              --workload-duckdb-path "$(dirname "$workload_manifest")/nba.duckdb"
            )
          fi

          dependent_args=()
          mapfile -t dependent_plans < <(find dependent-checkpoint-plan -name dependent-execution-plan.json -type f -print 2>/dev/null || true)
          if [ "${#dependent_plans[@]}" -gt 1 ]; then
            echo "::error::Dependent checkpoint execution plan is ambiguous"
            exit 1
          fi
          if [ "${#dependent_plans[@]}" -eq 1 ]; then
            dependent_args+=(--dependent-execution-plan-path "${dependent_plans[0]}")
          fi

          previous_args=()
          previous_report="$(find previous-checkpoint -name checkpoint-report.json -type f -print -quit || true)"
          if [ -n "$previous_report" ]; then
            previous_args+=(
              --previous-checkpoint-dir previous-checkpoint
              --previous-checkpoint-report-path "$previous_report"
            )
          fi

          uv run python -m nbadb.orchestrate.full_extraction_control checkpoint \
            --lane-manifest-path artifacts/full-extraction/checkpoint-manifest.json \
            --metadata-dir lane-metadata \
            --artifacts-dir lanes \
            "${workload_args[@]}" \
            "${dependent_args[@]}" \
            "${previous_args[@]}" \
            --output-dir data/nbadb-checkpoint \
            --report-path artifacts/full-extraction/checkpoint-report.json \
            --chain-id "$CHAIN_ID" \
            --run-id "$CURRENT_RUN_ID" \
            --source-sha "$WORKFLOW_SOURCE_SHA" \
            --checkpoint-generation "$EXPECTED_CHECKPOINT_GENERATION" \
            --checkpoint-artifact-name "$CHECKPOINT_ARTIFACT_NAME" \
            > artifacts/full-extraction/checkpoint.stdout.json

      - name: Bind checkpoint blocked evidence
        env:
          LANE_CONTROL_CONTRACT_BLOCKED_LANE_COUNT: ${{ needs.lane_control.outputs.contract-blocked-lane-count }}
        run: |
          checkpoint_manifest=artifacts/full-extraction/checkpoint-manifest.json
          current_manifest="$(find lane-control-artifact -name current-manifest.json -type f -print -quit)"
          if [ -z "$current_manifest" ]; then
            echo "::error::Lane-control artifact did not contain current-manifest.json"
            exit 1
          fi
          previous_report="$(find previous-checkpoint -name checkpoint-report.json -type f -print -quit || true)"
          extraction_audit="$(find lane-control-artifact -name extraction-audit.json -type f -print -quit)"
          if [ -z "$extraction_audit" ]; then
            echo "::error::Lane-control artifact did not contain extraction-audit.json"
            exit 1
          fi
          EXTRACTION_AUDIT_PATH="$extraction_audit" \
            CURRENT_MANIFEST_PATH="$current_manifest" \
            NEXT_MANIFEST_PATH="$checkpoint_manifest" \
            PREVIOUS_CHECKPOINT_REPORT_PATH="$previous_report" \
            VERIFIED_PREVIOUS_CHECKPOINT_PATH="$(find artifacts/full-extraction -name verified-previous-checkpoint.json -type f -print -quit || true)" \
            CHECKPOINT_REPORT_PATH=artifacts/full-extraction/checkpoint-report.json \
            LANE_CONTROL_CONTRACT_BLOCKED_LANE_COUNT="$LANE_CONTROL_CONTRACT_BLOCKED_LANE_COUNT" \
            uv run python - <<'PY'
          # CHECKPOINT_CONTRACT_BLOCKED_EVIDENCE_BINDER
          import hashlib
          import json
          import os
          from pathlib import Path

          from nbadb.orchestrate.full_extraction_control import (
              _canonical_contract_blocked_audit_row,
          )

          def canonical_bytes(payload: object) -> bytes:
              return json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")

          def normalized_rows(raw_rows: object, *, label: str) -> list[dict[str, object]]:
              if not isinstance(raw_rows, list):
                  raise SystemExit(f"{label} contract-blocked evidence must be a list")
              rows: list[dict[str, object]] = []
              seen_lane_ids: set[str] = set()
              for raw_row in raw_rows:
                  if not isinstance(raw_row, dict):
                      raise SystemExit(f"{label} contract-blocked evidence rows must be objects")
                  lane_id = str(raw_row.get("lane_id") or "").strip()
                  if not lane_id or lane_id in seen_lane_ids:
                      raise SystemExit(
                          f"{label} contract-blocked lane IDs must be non-empty and unique"
                      )
                  if str(raw_row.get("status") or "") != "contract_blocked":
                      raise SystemExit(
                          f"{label} contract-blocked evidence has invalid status for {lane_id}"
                      )
                  canonical_input = dict(raw_row)
                  canonical_input["lane_kind"] = raw_row.get("kind")
                  try:
                      row = _canonical_contract_blocked_audit_row(
                          lane_id,
                          canonical_input,
                      )
                  except ValueError as exc:
                      raise SystemExit(
                          f"{label} contract-blocked evidence is invalid for {lane_id}: {exc}"
                      ) from exc
                  if canonical_bytes(row) != canonical_bytes(raw_row):
                      raise SystemExit(
                          f"{label} contract-blocked evidence is not canonical for {lane_id}"
                      )
                  seen_lane_ids.add(lane_id)
                  rows.append(row)
              return sorted(rows, key=lambda row: str(row["lane_id"]))

          def evidence_bundle(rows: list[dict[str, object]]) -> dict[str, object]:
              return {
                  "schema_version": 1,
                  "contract_blocked_lanes": rows,
              }

          def verified_previous_rows(report: object) -> list[dict[str, object]]:
              if not isinstance(report, dict):
                  raise SystemExit("previous checkpoint report must be an object")
              raw_count = report.get("contract_blocked_lane_count", 0)
              if isinstance(raw_count, bool) or not isinstance(raw_count, int) or raw_count < 0:
                  raise SystemExit(
                      "previous checkpoint contract-blocked lane count must be non-negative"
                  )
              raw_bundle = report.get("contract_blocked_evidence")
              raw_digest = str(report.get("contract_blocked_evidence_sha256") or "")
              if raw_bundle is None and raw_count == 0 and not raw_digest:
                  return []
              if not isinstance(raw_bundle, dict) or raw_bundle.get("schema_version") != 1:
                  raise SystemExit("previous checkpoint contract-blocked evidence is invalid")
              rows = normalized_rows(
                  raw_bundle.get("contract_blocked_lanes"),
                  label="previous checkpoint",
              )
              bundle = evidence_bundle(rows)
              actual_digest = hashlib.sha256(canonical_bytes(bundle)).hexdigest()
              if raw_digest != actual_digest:
                  raise SystemExit(
                      "previous checkpoint contract-blocked evidence digest does not match"
                  )
              if raw_count != len(rows):
                  raise SystemExit(
                      "previous checkpoint contract-blocked evidence count does not match"
                  )
              return rows

          audit = json.loads(
              Path(os.environ["EXTRACTION_AUDIT_PATH"]).read_text(encoding="utf-8")
          )
          if not isinstance(audit, dict):
              raise SystemExit("lane-control extraction audit must be an object")
          current_rows = normalized_rows(
              audit.get("contract_blocked_lanes"),
              label="lane-control audit",
          )
          expected_current_count = int(
              os.environ["LANE_CONTROL_CONTRACT_BLOCKED_LANE_COUNT"]
          )
          if expected_current_count != len(current_rows):
              raise SystemExit(
                  "lane-control contract-blocked evidence count does not match its output"
              )

          current_manifest = json.loads(
              Path(os.environ["CURRENT_MANIFEST_PATH"]).read_text(encoding="utf-8")
          )
          if not isinstance(current_manifest, dict):
              raise SystemExit("lane-control current manifest must be an object")
          manifest_lanes = current_manifest.get("lanes")
          if not isinstance(manifest_lanes, list):
              raise SystemExit("lane-control current manifest lanes must be a list")
          lanes_by_id: dict[str, dict[str, object]] = {}
          for lane in manifest_lanes:
              if not isinstance(lane, dict):
                  raise SystemExit("lane-control current manifest lane entries must be objects")
              lane_id = str(lane.get("lane_id") or "").strip()
              if not lane_id or lane_id in lanes_by_id:
                  raise SystemExit(
                      "lane-control current manifest lane IDs must be non-empty and unique"
                  )
              lanes_by_id[lane_id] = lane
          scope_fields = (
              ("kind", "lane_kind"),
              ("endpoints", "endpoints"),
              ("patterns", "patterns"),
              ("season_start", "season_start"),
              ("season_end", "season_end"),
              ("season_types", "season_types"),
              ("context_measures", "context_measures"),
              ("coverage_units_hash", "coverage_units_hash"),
          )
          for row in current_rows:
              lane_id = str(row["lane_id"])
              lane = lanes_by_id.get(lane_id)
              if lane is None:
                  raise SystemExit(
                      f"lane-control contract-blocked evidence is outside the current manifest: {lane_id}"
                  )
              for row_field, lane_field in scope_fields:
                  if row.get(row_field) != lane.get(lane_field):
                      raise SystemExit(
                          "lane-control contract-blocked evidence scope does not match "
                          f"the current manifest for {lane_id}: {row_field}"
                      )

          current_state = current_manifest.get("chain_state")
          if not isinstance(current_state, dict):
              raise SystemExit("lane-control current manifest chain_state must be an object")
          committed_previous_rows = normalized_rows(
              current_state.get("contract_blocked_evidence", []),
              label="current chain-state",
          )
          committed_previous_digest = str(
              current_state.get("contract_blocked_evidence_sha256") or ""
          )
          committed_previous_bundle = evidence_bundle(committed_previous_rows)
          actual_committed_previous_digest = hashlib.sha256(
              canonical_bytes(committed_previous_bundle)
          ).hexdigest()
          if committed_previous_rows or committed_previous_digest:
              if committed_previous_digest != actual_committed_previous_digest:
                  raise SystemExit(
                      "current chain-state contract-blocked evidence digest does not match"
                  )

          pending_rows = normalized_rows(
              current_state.get("pending_contract_blocked_evidence", []),
              label="current pending chain-state",
          )
          pending_digest = str(
              current_state.get("pending_contract_blocked_evidence_sha256") or ""
          )
          if pending_rows:
              actual_pending_digest = hashlib.sha256(
                  canonical_bytes(evidence_bundle(pending_rows))
              ).hexdigest()
              if pending_digest != actual_pending_digest:
                  raise SystemExit(
                      "current chain-state pending contract-blocked evidence digest "
                      "does not match"
                  )
          elif pending_digest:
              raise SystemExit(
                  "current chain-state pending contract-blocked evidence digest has no rows"
              )

          previous_rows: list[dict[str, object]] = []
          previous_report_path = os.environ.get("PREVIOUS_CHECKPOINT_REPORT_PATH", "")
          if previous_report_path:
              previous_report = json.loads(
                  Path(previous_report_path).read_text(encoding="utf-8")
              )
              previous_rows = verified_previous_rows(previous_report)
              verified_path = os.environ.get("VERIFIED_PREVIOUS_CHECKPOINT_PATH", "")
              if not verified_path:
                  raise SystemExit(
                      "previous contract-blocked evidence lacks verified checkpoint provenance"
                  )
              verified = json.loads(Path(verified_path).read_text(encoding="utf-8"))
              if not isinstance(verified, dict):
                  raise SystemExit("verified previous checkpoint identity must be an object")
              expected_digest = str(
                  verified.get("contract_blocked_evidence_sha256") or ""
              )
              actual_digest = str(
                  previous_report.get("contract_blocked_evidence_sha256") or ""
              )
              if expected_digest != actual_digest:
                  raise SystemExit(
                      "previous contract-blocked evidence does not match the verified checkpoint"
                  )
              if previous_rows != committed_previous_rows:
                  raise SystemExit(
                      "previous contract-blocked evidence does not match chain-state ancestry"
                  )
              if actual_digest != committed_previous_digest:
                  raise SystemExit(
                      "previous contract-blocked evidence digest does not match chain-state ancestry"
                  )
          elif committed_previous_rows or committed_previous_digest:
              raise SystemExit(
                  "chain-state blocked evidence lacks a previous checkpoint report"
              )

          rows_by_lane_id = {
              str(row["lane_id"]): row for row in previous_rows
          }
          for label, rows in (("pending", pending_rows), ("current", current_rows)):
              for row in rows:
                  lane_id = str(row["lane_id"])
                  previous_row = rows_by_lane_id.get(lane_id)
                  if (
                      previous_row is not None
                      and canonical_bytes(previous_row) != canonical_bytes(row)
                  ):
                      raise SystemExit(
                          f"{label} contract-blocked evidence changed across "
                          f"checkpoints for {lane_id}"
                      )
                  rows_by_lane_id[lane_id] = row

          merged_rows = [rows_by_lane_id[lane_id] for lane_id in sorted(rows_by_lane_id)]
          bundle = evidence_bundle(merged_rows)
          evidence_sha256 = hashlib.sha256(canonical_bytes(bundle)).hexdigest()
          next_manifest = json.loads(
              Path(os.environ["NEXT_MANIFEST_PATH"]).read_text(encoding="utf-8")
          )
          next_state = next_manifest.get("chain_state") if isinstance(next_manifest, dict) else None
          if not isinstance(next_state, dict):
              raise SystemExit("checkpoint next manifest chain_state must be an object")
          if next_state.get("contract_blocked_evidence") != merged_rows:
              raise SystemExit(
                  "checkpoint blocked evidence does not match next-manifest commitment"
              )
          if str(next_state.get("contract_blocked_evidence_sha256") or "") != evidence_sha256:
              raise SystemExit(
                  "checkpoint blocked evidence digest does not match next-manifest commitment"
              )
          if next_state.get("pending_contract_blocked_evidence") not in (None, []):
              raise SystemExit(
                  "checkpoint next-manifest commitment did not clear pending blocked evidence"
              )
          if str(next_state.get("pending_contract_blocked_evidence_sha256") or ""):
              raise SystemExit(
                  "checkpoint next-manifest commitment did not clear pending blocked evidence"
              )
          report_path = Path(os.environ["CHECKPOINT_REPORT_PATH"])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if not isinstance(report, dict):
              raise SystemExit("checkpoint report must be an object")
          report["contract_blocked_lane_count"] = len(merged_rows)
          report["contract_blocked_evidence"] = bundle
          report["contract_blocked_evidence_sha256"] = evidence_sha256
          report_path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate checkpoint database
        id: checkpoint
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          CHECKPOINT_ARTIFACT_NAME: ${{ needs.lane_control.outputs.checkpoint-artifact-name }}
          EXPECTED_CHECKPOINT_GENERATION: ${{ needs.lane_control.outputs.checkpoint-generation }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          LANE_CONTROL_ACTIVE_LANE_COUNT: ${{ needs.lane_control.outputs.active-lane-count }}
        run: |
          CHECKPOINT_MANIFEST_PATH=artifacts/full-extraction/checkpoint-manifest.json \
            CHECKPOINT_REPORT_PATH=artifacts/full-extraction/checkpoint-report.json \
            python - <<'PY'
          # CHECKPOINT_RESULT_VALIDATOR
          import json
          import os
          import re
          from pathlib import Path

          report = json.loads(
              Path(os.environ["CHECKPOINT_REPORT_PATH"]).read_text(encoding="utf-8")
          )
          manifest = json.loads(
              Path(os.environ["CHECKPOINT_MANIFEST_PATH"]).read_text(encoding="utf-8")
          )
          chain_id = os.environ["CHAIN_ID"]
          current_run_id = os.environ["CURRENT_RUN_ID"]
          expected_source_sha = os.environ["WORKFLOW_SOURCE_SHA"].lower()
          expected_generation = int(os.environ["EXPECTED_CHECKPOINT_GENERATION"])
          lane_control_active_lane_count = int(
              os.environ["LANE_CONTROL_ACTIVE_LANE_COUNT"]
          )
          checkpoint_active_lane_count = int(report.get("active_lane_count", -1))
          terminal_ready = report.get("terminal_ready") is True
          dependent_activation_required = (
              report.get("dependent_activation_required") is True
          )
          complete_lane_count = int(report.get("complete_lane_count", 0))
          checkpoint_output = Path(str(report.get("output_path") or ""))
          contract_blocked_evidence = report.get("contract_blocked_evidence")
          contract_blocked_evidence_sha256 = str(
              report.get("contract_blocked_evidence_sha256") or ""
          )

          failures: list[str] = []
          if expected_generation <= 0:
              failures.append("Expected checkpoint generation must be positive")
          expected_artifact_name = (
              f"full-extraction-checkpoint-{chain_id}-iter-{expected_generation}"
          )
          if os.environ["CHECKPOINT_ARTIFACT_NAME"] != expected_artifact_name:
              failures.append(
                  "Checkpoint artifact suffix/generation disagreement: "
                  f"expected={expected_artifact_name}, "
                  f"actual={os.environ['CHECKPOINT_ARTIFACT_NAME']}"
              )

          reported_generation = report.get("checkpoint_generation")
          if isinstance(reported_generation, bool) or not isinstance(reported_generation, int):
              failures.append("Checkpoint report generation must be an integer")
          elif reported_generation != expected_generation:
              failures.append(
                  "Lane-control/checkpoint generation disagreement: "
                  f"lane_control={expected_generation}, checkpoint={reported_generation}"
              )
          previous_generation = report.get("previous_checkpoint_generation")
          if isinstance(previous_generation, bool) or not isinstance(previous_generation, int):
              failures.append("Checkpoint report previous generation must be an integer")
          elif previous_generation != expected_generation - 1:
              failures.append(
                  "Checkpoint previous-generation disagreement: "
                  f"expected={expected_generation - 1}, actual={previous_generation}"
              )
          if str(report.get("chain_id") or "") != chain_id:
              failures.append("Checkpoint report chain identity does not match")
          if str(report.get("run_id") or "") != current_run_id:
              failures.append("Checkpoint report run identity does not match")
          if str(report.get("artifact_name") or "") != expected_artifact_name:
              failures.append("Checkpoint report artifact name does not match")
          if str(report.get("source_sha") or "").lower() != expected_source_sha:
              failures.append("Checkpoint report source SHA does not match")

          if not isinstance(manifest, dict):
              failures.append("Checkpoint manifest must be an object")
              manifest_payload = {}
              manifest_state = {}
          else:
              manifest_payload = manifest
              manifest_state = manifest.get("chain_state", {})
              if not isinstance(manifest_state, dict):
                  failures.append("Checkpoint manifest chain_state must be an object")
                  manifest_state = {}
          manifest_dependent = manifest_payload.get("dependent_workload")
          manifest_dependent_state = (
              manifest_dependent.get("state")
              if isinstance(manifest_dependent, dict)
              else None
          )
          if str(manifest_payload.get("chain_id") or "") != chain_id:
              failures.append("Checkpoint manifest chain identity does not match")
          if (
              str(manifest_payload.get("workflow_source_sha") or "").lower()
              != expected_source_sha
          ):
              failures.append("Checkpoint manifest source SHA does not match")
          manifest_generation = manifest_state.get("latest_checkpoint_generation")
          if isinstance(manifest_generation, bool) or not isinstance(manifest_generation, int):
              failures.append("Checkpoint manifest latest generation must be an integer")
          elif manifest_generation != expected_generation - 1:
              failures.append(
                  "Checkpoint candidate precommitted or skipped a generation: "
                  f"candidate={manifest_generation}, expected={expected_generation - 1}"
              )
          actual_coverage_hash = str(
              report.get("coverage_fingerprint") or ""
          ).lower()
          if re.fullmatch(r"[0-9a-f]{64}", actual_coverage_hash) is None:
              failures.append("Checkpoint report coverage hash must be a SHA-256")
          if checkpoint_active_lane_count != lane_control_active_lane_count:
              failures.append(
                  "Lane-control/checkpoint remaining-count disagreement: "
                  f"lane_control={lane_control_active_lane_count}, "
                  f"checkpoint={checkpoint_active_lane_count}"
              )
          if (
              lane_control_active_lane_count == 0
              and not terminal_ready
              and not dependent_activation_required
          ):
              failures.append(
                  "Lane control reported no remaining lanes but the checkpoint is neither "
                  "terminal-ready nor awaiting typed dependent activation"
              )
          if lane_control_active_lane_count > 0 and terminal_ready:
              failures.append(
                  "Lane control reported remaining lanes but the checkpoint is terminal-ready"
              )
          if dependent_activation_required:
              if manifest_dependent_state != "foundation_required":
                  failures.append(
                      "Checkpoint requires dependent activation without a foundation contract"
                  )
              if lane_control_active_lane_count != 0:
                  failures.append(
                      "Dependent activation requires zero remaining foundation lanes"
                  )
              if terminal_ready:
                  failures.append(
                      "Dependent activation checkpoint cannot also be terminal-ready"
                  )
          elif manifest_dependent_state == "foundation_required" and (
              lane_control_active_lane_count == 0
          ):
              failures.append(
                  "Completed foundation checkpoint omitted its dependent activation requirement"
              )
          if complete_lane_count > 0 and not checkpoint_output.is_file():
              failures.append(
                  "Checkpoint report includes completed lanes but its database is missing"
              )
          if (
              not isinstance(contract_blocked_evidence, dict)
              or contract_blocked_evidence.get("schema_version") != 1
              or not isinstance(
                  contract_blocked_evidence.get("contract_blocked_lanes"), list
              )
          ):
              failures.append("Checkpoint contract-blocked evidence is invalid")
          else:
              canonical_evidence = json.dumps(
                  contract_blocked_evidence,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")
              actual_evidence_sha256 = __import__("hashlib").sha256(
                  canonical_evidence
              ).hexdigest()
              if contract_blocked_evidence_sha256 != actual_evidence_sha256:
                  failures.append(
                      "Checkpoint contract-blocked evidence digest does not match"
                  )
              if int(report.get("contract_blocked_lane_count", -1)) != len(
                  contract_blocked_evidence["contract_blocked_lanes"]
              ):
                  failures.append(
                      "Checkpoint contract-blocked evidence count does not match"
                  )
          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              raise SystemExit(1)

          output_pairs = {
              "artifact_name": os.environ["CHECKPOINT_ARTIFACT_NAME"],
              "checkpoint_generation": reported_generation,
              "coverage_fingerprint": report.get("coverage_fingerprint", ""),
              "terminal_ready": str(terminal_ready).lower(),
              "active_lane_count": checkpoint_active_lane_count,
              "dependent_activation_required": str(
                  dependent_activation_required
              ).lower(),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for key, value in output_pairs.items():
                  handle.write(f"{key}={value}\n")
          PY

          {
            echo "## Full Extraction Checkpoint"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Artifact | \`$CHECKPOINT_ARTIFACT_NAME\` |"
            python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/full-extraction/checkpoint-report.json").read_text())
          rows = {
              "Generation": report.get("checkpoint_generation", 0),
              "Included lanes": report.get("complete_lane_count", 0),
              "Missing active lanes": report.get("active_lane_count", 0),
              "Skipped complete lanes": report.get("skipped_lane_count", 0),
              "Journal rows": report.get("journal_row_count", 0),
              "Terminal ready": report.get("terminal_ready", False),
              "Dependent activation required": report.get(
                  "dependent_activation_required", False
              ),
          }
          for key, value in rows.items():
              print(f"| {key} | {value} |")
          print(f"| Coverage fingerprint | `{report.get('coverage_fingerprint', '')}` |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build checkpoint transaction
        if: ${{ steps.checkpoint.outcome == 'success' }}
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          CHECKPOINT_ARTIFACT_NAME: ${{ needs.lane_control.outputs.checkpoint-artifact-name }}
          CHECKPOINT_GENERATION: ${{ needs.lane_control.outputs.checkpoint-generation }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          uv run python -m nbadb.orchestrate.full_extraction_control \
            build-checkpoint-transaction \
            --lane-manifest-path artifacts/full-extraction/checkpoint-manifest.json \
            --checkpoint-report-path artifacts/full-extraction/checkpoint-report.json \
            --checkpoint-database-path data/nbadb-checkpoint/nba.duckdb \
            --output-path artifacts/full-extraction/checkpoint-transaction.json \
            --chain-id "$CHAIN_ID" \
            --run-id "$CURRENT_RUN_ID" \
            --source-sha "$WORKFLOW_SOURCE_SHA" \
            --checkpoint-generation "$CHECKPOINT_GENERATION" \
            --checkpoint-artifact-name "$CHECKPOINT_ARTIFACT_NAME" \
            > artifacts/full-extraction/checkpoint-transaction.stdout.json

      - name: Upload checkpoint artifact
        id: canonical_checkpoint
        if: ${{ steps.checkpoint.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: false
          name: ${{ needs.lane_control.outputs.checkpoint-artifact-name }}
          path: |
            data/nbadb-checkpoint/nba.duckdb
            artifacts/full-extraction/checkpoint-report.json
            artifacts/full-extraction/checkpoint.stdout.json
            artifacts/full-extraction/checkpoint-manifest.json
            artifacts/full-extraction/checkpoint-transaction.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Resolve colliding checkpoint sibling
        id: checkpoint_collision
        if: ${{ always() && steps.checkpoint.outcome == 'success' && steps.canonical_checkpoint.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKPOINT_ARTIFACT_NAME: ${{ needs.lane_control.outputs.checkpoint-artifact-name }}
          CURRENT_RUN_HEAD_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          artifact_name = os.environ["CHECKPOINT_ARTIFACT_NAME"]
          current_run_id = os.environ["CURRENT_RUN_ID"]
          current_run_head_sha = os.environ["CURRENT_RUN_HEAD_SHA"].lower()
          source_sha = os.environ["WORKFLOW_SOURCE_SHA"].lower()
          if re.fullmatch(r"[1-9][0-9]*", current_run_id) is None:
              raise SystemExit("current workflow run ID must be positive")
          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit("workflow source SHA must be a full commit SHA")
          if re.fullmatch(r"[0-9a-f]{40}", current_run_head_sha) is None:
              raise SystemExit("current workflow run head SHA must be a full commit SHA")
          run_raw = subprocess.check_output(
              [
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  (
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{current_run_id}"
                  ),
              ],
              text=True,
          )
          owner_run = json.loads(run_raw)
          owner_head_sha = str(owner_run.get("head_sha") or "").lower()
          if (
              str(owner_run.get("id") or "") != current_run_id
              or re.fullmatch(r"[0-9a-f]{40}", owner_head_sha) is None
              or owner_head_sha != current_run_head_sha
          ):
              raise SystemExit("current checkpoint owner run identity is invalid")

          def inventory_snapshot() -> tuple[tuple[object, ...], ...]:
              raw = subprocess.check_output(
                  [
                      "gh",
                      "api",
                      "--method",
                      "GET",
                      "--paginate",
                      "--slurp",
                      "-H",
                      "Accept: application/vnd.github+json",
                      (
                          f"/repos/{os.environ['GITHUB_REPOSITORY']}"
                          f"/actions/runs/{current_run_id}/artifacts"
                      ),
                      "-f",
                      "per_page=100",
                      "-f",
                      f"name={artifact_name}",
                  ],
                  text=True,
              )
              pages = json.loads(raw)
              if not isinstance(pages, list) or not pages:
                  raise SystemExit("checkpoint sibling inventory response must contain pages")
              artifacts: list[dict[str, object]] = []
              totals: set[int] = set()
              for page in pages:
                  if not isinstance(page, dict):
                      raise SystemExit("checkpoint sibling inventory page must be an object")
                  total_count = page.get("total_count")
                  page_artifacts = page.get("artifacts")
                  if (
                      isinstance(total_count, bool)
                      or not isinstance(total_count, int)
                      or total_count < 0
                      or not isinstance(page_artifacts, list)
                  ):
                      raise SystemExit("checkpoint sibling inventory page is malformed")
                  totals.add(total_count)
                  for artifact in page_artifacts:
                      if not isinstance(artifact, dict):
                          raise SystemExit(
                              "checkpoint sibling inventory entry must be an object"
                          )
                      artifacts.append(artifact)
              if len(totals) != 1 or totals.pop() != len(artifacts):
                  raise SystemExit(
                      "checkpoint sibling inventory pagination is inconsistent"
                  )

              normalized: list[tuple[object, ...]] = []
              seen_ids: set[int] = set()
              for artifact in artifacts:
                  artifact_id = artifact.get("id")
                  digest = artifact.get("digest")
                  size = artifact.get("size_in_bytes")
                  workflow_run = artifact.get("workflow_run")
                  if (
                      isinstance(artifact_id, bool)
                      or not isinstance(artifact_id, int)
                      or artifact_id < 1
                      or artifact_id in seen_ids
                      or artifact.get("name") != artifact_name
                      or not isinstance(digest, str)
                      or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None
                      or isinstance(size, bool)
                      or not isinstance(size, int)
                      or size < 1
                      or artifact.get("expired") is not False
                      or not isinstance(workflow_run, dict)
                      or str(workflow_run.get("id") or "") != current_run_id
                      or str(workflow_run.get("head_sha") or "").lower()
                      != owner_head_sha
                  ):
                      raise SystemExit(
                          "checkpoint sibling inventory contains invalid provenance"
                      )
                  seen_ids.add(artifact_id)
                  normalized.append(
                      (
                          artifact_id,
                          artifact_name,
                          digest,
                          size,
                          current_run_id,
                          owner_head_sha,
                      )
                  )
              normalized.sort()
              if len(normalized) > 1:
                  raise SystemExit("checkpoint sibling inventory is ambiguous")
              return tuple(normalized)

          snapshots: list[tuple[tuple[object, ...], ...]] = []
          for attempt in range(4):
              snapshots.append(inventory_snapshot())
              if attempt < 3:
                  time.sleep(3)

          if all(not snapshot for snapshot in snapshots):
              with Path(os.environ["GITHUB_OUTPUT"]).open(
                  "a", encoding="utf-8"
              ) as handle:
                  handle.write("resolution=absent_timeout\n")
              raise SystemExit(0)
          if (
              len(snapshots[-1]) == 1
              and snapshots[-2] == snapshots[-1]
          ):
              artifact_id, _, digest, size, _, _ = snapshots[-1][0]
              with Path(os.environ["GITHUB_OUTPUT"]).open(
                  "a", encoding="utf-8"
              ) as handle:
                  handle.write("resolution=reuse\n")
                  handle.write(f"artifact_id={artifact_id}\n")
                  handle.write(f"artifact_digest={digest}\n")
                  handle.write(f"artifact_size_bytes={size}\n")
              raise SystemExit(0)
          raise SystemExit("checkpoint sibling inventory did not stabilize")
          PY

      - name: Download colliding checkpoint sibling
        if: ${{ steps.checkpoint_collision.outputs.resolution == 'reuse' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ steps.checkpoint_collision.outputs.artifact_id }}
          path: checkpoint-sibling/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error

      - name: Validate colliding checkpoint sibling
        id: checkpoint_sibling
        if: ${{ steps.checkpoint_collision.outputs.resolution == 'reuse' }}
        env:
          ARTIFACT_ID: ${{ steps.checkpoint_collision.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.checkpoint_collision.outputs.artifact_digest }}
          ARTIFACT_SIZE_BYTES: ${{ steps.checkpoint_collision.outputs.artifact_size_bytes }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          CHECKPOINT_ARTIFACT_NAME: ${{ needs.lane_control.outputs.checkpoint-artifact-name }}
          CHECKPOINT_GENERATION: ${{ needs.lane_control.outputs.checkpoint-generation }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from nbadb.orchestrate.checkpoint_contract import (
              CheckpointState,
              CheckpointTransaction,
          )

          local_root = Path(".")
          sibling_root = Path("checkpoint-sibling")
          relative_paths = {
              "database": Path("data/nbadb-checkpoint/nba.duckdb"),
              "report": Path("artifacts/full-extraction/checkpoint-report.json"),
              "transaction": Path(
                  "artifacts/full-extraction/checkpoint-transaction.json"
              ),
          }
          for label, relative_path in relative_paths.items():
              if not (local_root / relative_path).is_file():
                  raise SystemExit(f"local checkpoint {label} file is missing")
              if not (sibling_root / relative_path).is_file():
                  raise SystemExit(f"checkpoint sibling {label} file is missing")

          def load_transaction(path: Path) -> CheckpointTransaction:
              payload = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(payload, dict):
                  raise SystemExit("checkpoint transaction must be an object")
              return CheckpointTransaction.from_dict(payload)

          local_transaction = load_transaction(
              local_root / relative_paths["transaction"]
          )
          sibling_transaction = load_transaction(
              sibling_root / relative_paths["transaction"]
          )
          if (
              local_transaction.state is not CheckpointState.BUILT
              or sibling_transaction.state is not CheckpointState.BUILT
              or local_transaction.to_dict() != sibling_transaction.to_dict()
          ):
              raise SystemExit(
                  "checkpoint sibling transaction does not match the current build"
              )
          identity = local_transaction.identity
          if (
              identity.chain_id != os.environ["CHAIN_ID"]
              or identity.source_sha != os.environ["WORKFLOW_SOURCE_SHA"].lower()
              or identity.generation != int(os.environ["CHECKPOINT_GENERATION"])
              or local_transaction.artifact_name
              != os.environ["CHECKPOINT_ARTIFACT_NAME"]
              or not identity.coverage.coverage_fingerprint
          ):
              raise SystemExit(
                  "checkpoint sibling transaction provenance does not match"
              )
          assert local_transaction.build is not None

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          expected_hashes = {
              "database": local_transaction.build.database_sha256,
              "report": local_transaction.build.report_sha256,
          }
          for label, expected_hash in expected_hashes.items():
              relative_path = relative_paths[label]
              if (
                  sha256(local_root / relative_path) != expected_hash
                  or sha256(sibling_root / relative_path) != expected_hash
              ):
                  raise SystemExit(
                      f"checkpoint sibling {label} hash does not match the build"
                  )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"artifact_id={os.environ['ARTIFACT_ID']}\n")
              handle.write(f"artifact_digest={os.environ['ARTIFACT_DIGEST']}\n")
              handle.write(
                  f"artifact_size_bytes={os.environ['ARTIFACT_SIZE_BYTES']}\n"
              )
          PY

      - name: Retry checkpoint artifact upload after stable absence
        id: canonical_checkpoint_retry
        if: ${{ steps.checkpoint_collision.outputs.resolution == 'absent_timeout' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: false
          name: ${{ needs.lane_control.outputs.checkpoint-artifact-name }}
          path: |
            data/nbadb-checkpoint/nba.duckdb
            artifacts/full-extraction/checkpoint-report.json
            artifacts/full-extraction/checkpoint.stdout.json
            artifacts/full-extraction/checkpoint-manifest.json
            artifacts/full-extraction/checkpoint-transaction.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Verify immutable checkpoint receipt
        id: checkpoint_receipt
        if: ${{ always() && (steps.canonical_checkpoint.outcome == 'success' || steps.checkpoint_sibling.outcome == 'success' || steps.canonical_checkpoint_retry.outcome == 'success') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_HEAD_SHA: ${{ github.sha }}
          INITIAL_UPLOAD_OUTCOME: ${{ steps.canonical_checkpoint.outcome }}
          INITIAL_ARTIFACT_ID: ${{ steps.canonical_checkpoint.outputs.artifact-id }}
          INITIAL_ARTIFACT_DIGEST: ${{ steps.canonical_checkpoint.outputs.artifact-digest }}
          SIBLING_VALIDATION_OUTCOME: ${{ steps.checkpoint_sibling.outcome }}
          SIBLING_ARTIFACT_ID: ${{ steps.checkpoint_sibling.outputs.artifact_id }}
          SIBLING_ARTIFACT_DIGEST: ${{ steps.checkpoint_sibling.outputs.artifact_digest }}
          RETRY_UPLOAD_OUTCOME: ${{ steps.canonical_checkpoint_retry.outcome }}
          RETRY_ARTIFACT_ID: ${{ steps.canonical_checkpoint_retry.outputs.artifact-id }}
          RETRY_ARTIFACT_DIGEST: ${{ steps.canonical_checkpoint_retry.outputs.artifact-digest }}
          CHECKPOINT_ARTIFACT_NAME: ${{ needs.lane_control.outputs.checkpoint-artifact-name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          if os.environ["INITIAL_UPLOAD_OUTCOME"] == "success":
              artifact_id = os.environ["INITIAL_ARTIFACT_ID"]
              upload_digest = os.environ["INITIAL_ARTIFACT_DIGEST"]
              receipt_source = "newly_uploaded"
          elif os.environ["SIBLING_VALIDATION_OUTCOME"] == "success":
              artifact_id = os.environ["SIBLING_ARTIFACT_ID"]
              upload_digest = os.environ["SIBLING_ARTIFACT_DIGEST"]
              receipt_source = "validated_existing"
          elif os.environ["RETRY_UPLOAD_OUTCOME"] == "success":
              artifact_id = os.environ["RETRY_ARTIFACT_ID"]
              upload_digest = os.environ["RETRY_ARTIFACT_DIGEST"]
              receipt_source = "newly_uploaded_retry"
          else:
              raise SystemExit("checkpoint artifact receipt has no verified source")
          if re.fullmatch(r"[1-9][0-9]*", artifact_id) is None:
              raise SystemExit("checkpoint upload did not return a positive artifact ID")
          upload_digest = upload_digest.lower()
          if upload_digest.startswith("sha256:"):
              upload_digest = upload_digest.removeprefix("sha256:")
          if re.fullmatch(r"[0-9a-f]{64}", upload_digest) is None:
              raise SystemExit("checkpoint upload did not return a SHA-256 digest")
          run_raw = subprocess.check_output(
              [
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  (
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{os.environ['CURRENT_RUN_ID']}"
                  ),
              ],
              text=True,
          )
          owner_run = json.loads(run_raw)
          owner_head_sha = str(owner_run.get("head_sha") or "").lower()
          if (
              str(owner_run.get("id") or "") != os.environ["CURRENT_RUN_ID"]
              or re.fullmatch(r"[0-9a-f]{40}", owner_head_sha) is None
              or owner_head_sha != os.environ["CURRENT_RUN_HEAD_SHA"].lower()
          ):
              raise SystemExit("current checkpoint owner run identity is invalid")
          raw = subprocess.check_output(
              [
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}",
              ],
              text=True,
          )
          artifact = json.loads(raw)
          workflow_run = artifact.get("workflow_run", {})
          expected_digest = f"sha256:{upload_digest}"
          rest_artifact_id = artifact.get("id")
          size = artifact.get("size_in_bytes")
          if (
              isinstance(rest_artifact_id, bool)
              or not isinstance(rest_artifact_id, int)
              or rest_artifact_id != int(artifact_id)
              or artifact.get("name") != os.environ["CHECKPOINT_ARTIFACT_NAME"]
              or artifact.get("digest") != expected_digest
              or artifact.get("expired") is not False
              or isinstance(size, bool)
              or not isinstance(size, int)
              or size < 1
              or not isinstance(workflow_run, dict)
              or str(workflow_run.get("id") or "") != os.environ["CURRENT_RUN_ID"]
              or str(workflow_run.get("head_sha") or "").lower()
              != owner_head_sha
          ):
              raise SystemExit(
                  "checkpoint REST identity does not match the immutable upload receipt"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"artifact_id={artifact_id}\n")
              handle.write(f"artifact_digest={expected_digest}\n")
              handle.write(f"artifact_size_bytes={size}\n")
              handle.write(f"receipt_source={receipt_source}\n")
          PY

      - name: Commit checkpoint manifest
        id: commit_manifest
        if: ${{ steps.checkpoint_receipt.outcome == 'success' }}
        env:
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.checkpoint_receipt.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.checkpoint_receipt.outputs.artifact_digest }}
          ARTIFACT_SIZE_BYTES: ${{ steps.checkpoint_receipt.outputs.artifact_size_bytes }}
          MANIFEST_ARTIFACT_NAME: ${{ needs.lane_control.outputs.artifact-name }}
        run: |
          mkdir -p committed-manifest
          uv run python -m nbadb.orchestrate.full_extraction_control \
            commit-checkpoint-manifest \
            --lane-manifest-path artifacts/full-extraction/checkpoint-manifest.json \
            --checkpoint-transaction-path artifacts/full-extraction/checkpoint-transaction.json \
            --checkpoint-report-path artifacts/full-extraction/checkpoint-report.json \
            --checkpoint-database-path data/nbadb-checkpoint/nba.duckdb \
            --output-path committed-manifest/next-manifest.json \
            --chain-id "$CHAIN_ID" \
            --run-id "$CURRENT_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-sha "$WORKFLOW_SOURCE_SHA" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --artifact-size-bytes "$ARTIFACT_SIZE_BYTES" \
            > committed-manifest/checkpoint-commit.json
          cp artifacts/full-extraction/checkpoint-report.json \
            committed-manifest/checkpoint-report.json
          cp artifacts/full-extraction/checkpoint-transaction.json \
            committed-manifest/checkpoint-transaction.json
          cp lane-control-artifact/extraction-audit.json \
            committed-manifest/extraction-audit.json
          cp lane-control-artifact/chain-dispatch.json \
            committed-manifest/chain-dispatch.json
          {
            echo "artifact_id=$ARTIFACT_ID"
            echo "artifact_digest=$ARTIFACT_DIGEST"
            echo "manifest_artifact_name=$MANIFEST_ARTIFACT_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Upload committed next manifest
        id: committed_manifest_upload
        if: ${{ steps.commit_manifest.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: false
          name: ${{ needs.lane_control.outputs.artifact-name }}
          path: committed-manifest/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Verify committed next manifest receipt
        id: committed_manifest
        if: ${{ steps.committed_manifest_upload.outcome == 'success' }}
        env:
          ARTIFACT_DIGEST: ${{ steps.committed_manifest_upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.committed_manifest_upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ needs.lane_control.outputs.artifact-name }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_RUN_HEAD_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          receipt="$RUNNER_TEMP/committed-next-manifest-receipt.json"
          python .github/scripts/workflow_source_provenance.py verify-current-artifact \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$CURRENT_RUN_ID" \
            --run-attempt "$CURRENT_RUN_ATTEMPT" \
            --head-sha "$CURRENT_RUN_HEAD_SHA" \
            --trusted-branch "$WORKFLOW_SOURCE_REF" \
            --workflow-path .github/workflows/full-extraction.yml \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --output "$receipt"
          RECEIPT_PATH="$receipt" python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ["RECEIPT_PATH"]).read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"artifact-id={receipt['id']}\n")
              output.write(f"artifact-digest={receipt['digest']}\n")
              output.write(f"artifact-size-bytes={receipt['size_in_bytes']}\n")
              output.write(f"artifact-archive-url={receipt['archive_download_url']}\n")
          PY

      - name: Upload checkpoint failure diagnostics
        if: ${{ always() && (steps.checkpoint.outcome != 'success' || steps.checkpoint_receipt.outcome != 'success' || steps.commit_manifest.outcome != 'success' || steps.committed_manifest_upload.outcome != 'success' || steps.committed_manifest.outcome != 'success') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          overwrite: true
          name: full-extraction-checkpoint-diagnostics-${{ env.ACTIVE_CHAIN_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/nbadb-checkpoint/
            artifacts/full-extraction/
            lane-control-artifact/
            previous-checkpoint/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

  # ─────────────────────────────────────────────────────────────
  #  Redispatch only after the checkpoint for this iteration is durable
  # ─────────────────────────────────────────────────────────────
  dispatch_next:
    needs: [plan, preflight, lane_control, checkpoint]
    if: ${{ always() && !cancelled() && inputs.operation != 'targeted_smoke' && needs.plan.outputs.operation-authority-status == 'validated' && needs.plan.outputs.free-execution-collector-status == 'admitted' && needs.plan.outputs.free-execution-collector-authenticated == 'true' && needs.plan.outputs.free-execution-runtime-context-status == 'authenticated' && needs.plan.outputs.free-execution-storage-mutations-allowed == 'true' && needs.plan.outputs.free-execution-provider-calls-allowed == 'true' && needs.plan.outputs.free-execution-mutations-authorized == 'true' && needs.lane_control.result == 'success' && needs.checkpoint.result == 'success' && (needs.lane_control.outputs.active-lane-count != '0' || needs.checkpoint.outputs.dependent-activation-required == 'true') && needs.lane_control.outputs.vpn-auth-circuit-open != 'true' && needs.checkpoint.outputs.active-lane-count == needs.lane_control.outputs.active-lane-count && needs.checkpoint.outputs.terminal-ready == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: full-extraction-dispatch-${{ inputs.chain_id || github.run_id }}-iteration-${{ inputs.iteration }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    outputs:
      child-run-id: ${{ steps.dispatch.outputs.child_run_id }}
      child-run-url: ${{ steps.dispatch.outputs.child_run_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.WORKFLOW_SOURCE_SHA }}

      - name: Validate full extraction attempt
        env:
          FULL_EXTRACTION_ATTEMPT_GATE_ROLE: dispatch_reconcile
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/validate_full_extraction_attempt.py

      - name: Verify redispatch workflow definition
        id: redispatch_guard
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ false }}
          WORKFLOW_REF: ${{ env.WORKFLOW_SOURCE_REF }}
          WORKFLOW_PATH: .github/workflows/full-extraction.yml
        run: |
          set -euo pipefail
          if ! [[ "$WORKFLOW_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::workflow_sha must remain a full 40-character commit SHA before redispatch"
            exit 1
          fi
          if ! git check-ref-format --branch "$WORKFLOW_REF" >/dev/null 2>&1; then
            echo "::error::workflow_ref must remain a valid branch before redispatch"
            exit 1
          fi

          source_commit="$(git rev-parse "${WORKFLOW_SOURCE_SHA}^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "${WORKFLOW_SOURCE_SHA,,}" != "$source_commit" ] || [ "$checked_out_commit" != "$source_commit" ]; then
            echo "::error::Pinned source checkout mismatch before redispatch: expected $source_commit, got $checked_out_commit"
            exit 1
          fi

          trusted_branch_ref="refs/remotes/origin/trusted-redispatch-source"
          git fetch --no-tags --no-recurse-submodules origin \
            "+refs/heads/${WORKFLOW_REF}:${trusted_branch_ref}"
          trusted_branch_commit="$(git rev-parse "${trusted_branch_ref}^{commit}")"
          if ! git merge-base --is-ancestor "$source_commit" "$trusted_branch_commit"; then
            echo "::error::Pinned workflow_sha $source_commit is no longer an ancestor of workflow_ref '$WORKFLOW_REF' at $trusted_branch_commit"
            exit 1
          fi

          if [ "$PUBLISH" = "true" ]; then
            default_branch_ref="refs/remotes/origin/trusted-redispatch-default"
            git fetch --no-tags --no-recurse-submodules origin \
              "+refs/heads/${DEFAULT_BRANCH}:${default_branch_ref}"
            default_branch_commit="$(git rev-parse "${default_branch_ref}^{commit}")"
            if ! git merge-base --is-ancestor "$source_commit" "$default_branch_commit"; then
              echo "::error::publish=true requires pinned workflow_sha $source_commit to remain an ancestor of default branch '$DEFAULT_BRANCH' at $default_branch_commit"
              exit 1
            fi
          fi

          source_blob="$(git rev-parse "${source_commit}:${WORKFLOW_PATH}")"
          dispatch_blob="$(gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW_PATH}" \
            -f "ref=${WORKFLOW_REF}" \
            --jq '.sha')"
          if [ -z "$dispatch_blob" ] || [ "$dispatch_blob" != "$source_blob" ]; then
            echo "::error::Workflow definition drift detected: ${WORKFLOW_PATH} at redispatch ref ${WORKFLOW_REF} does not match workflow_source_sha ${source_commit}"
            exit 1
          fi
          workflow_definition_path="$RUNNER_TEMP/full-extraction-workflow-definition.json"
          gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/full-extraction.yml" \
            > "$workflow_definition_path"
          WORKFLOW_DEFINITION_PATH="$workflow_definition_path" python - <<'PY'
          import json
          import os
          from pathlib import Path

          definition = json.loads(
              Path(os.environ["WORKFLOW_DEFINITION_PATH"]).read_text(encoding="utf-8")
          )
          if not isinstance(definition, dict):
              raise SystemExit("redispatch workflow definition identity is invalid")
          workflow_id = definition.get("id")
          expected_url = (
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/workflows/{workflow_id}"
          )
          if (
              not isinstance(definition, dict)
              or isinstance(workflow_id, bool)
              or not isinstance(workflow_id, int)
              or workflow_id < 1
              or definition.get("path") != os.environ["WORKFLOW_PATH"]
              or definition.get("state") != "active"
              or definition.get("url") != expected_url
          ):
              raise SystemExit("redispatch workflow definition identity is invalid")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"workflow_id={workflow_id}\n")
          PY
          echo "trusted_branch_tip_sha=$trusted_branch_commit" >> "$GITHUB_OUTPUT"

      - name: Verify committed manifest dispatch receipt
        id: manifest_receipt
        env:
          ARTIFACT_ARCHIVE_URL: ${{ needs.checkpoint.outputs.manifest-artifact-archive-url }}
          ARTIFACT_DIGEST: ${{ needs.checkpoint.outputs.manifest-artifact-digest }}
          ARTIFACT_ID: ${{ needs.checkpoint.outputs.manifest-artifact-id }}
          ARTIFACT_NAME: ${{ needs.checkpoint.outputs.manifest-artifact-name }}
          ARTIFACT_SIZE_BYTES: ${{ needs.checkpoint.outputs.manifest-artifact-size }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_RUN_HEAD_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITERATION: ${{ inputs.iteration }}
          WORKFLOW_SOURCE_SHA: ${{ env.WORKFLOW_SOURCE_SHA }}
        run: |
          python - <<'PY'
          # REDISPATCH_MANIFEST_RECEIPT_VERIFIER
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          artifact_id_text = os.environ["ARTIFACT_ID"]
          artifact_name = os.environ["ARTIFACT_NAME"]
          artifact_digest = os.environ["ARTIFACT_DIGEST"].lower()
          artifact_size_text = os.environ["ARTIFACT_SIZE_BYTES"]
          current_run_id = os.environ["CURRENT_RUN_ID"]
          current_run_attempt = os.environ["CURRENT_RUN_ATTEMPT"]
          current_run_head_sha = os.environ["CURRENT_RUN_HEAD_SHA"].lower()
          iteration = os.environ["ITERATION"]
          workflow_source_sha = os.environ["WORKFLOW_SOURCE_SHA"].lower()
          for field_name, value in (
              ("current run ID", current_run_id),
              ("current run attempt", current_run_attempt),
              ("iteration", iteration),
          ):
              if re.fullmatch(r"[1-9][0-9]*", value) is None:
                  raise SystemExit(
                      f"redispatch manifest {field_name} must be a positive integer"
                  )
          if re.fullmatch(r"[0-9a-f]{40}", workflow_source_sha) is None:
              raise SystemExit(
                  "redispatch workflow source SHA must be a full commit SHA"
              )
          if re.fullmatch(r"[0-9a-f]{40}", current_run_head_sha) is None:
              raise SystemExit(
                  "redispatch current run head SHA must be a full commit SHA"
              )
          name_match = re.fullmatch(
              (
                  rf"full-extraction-next-manifest-"
                  rf"{re.escape(os.environ['CHAIN_ID'])}-"
                  rf"iter-(?P<iteration>[1-9][0-9]*)-"
                  rf"run-(?P<run_id>[1-9][0-9]*)-"
                  rf"attempt-(?P<attempt>[1-9][0-9]*)"
              ),
              artifact_name,
          )
          if name_match is None:
              raise SystemExit(
                  "redispatch requires an exact immutable "
                  "committed next-manifest artifact"
              )
          artifact_iteration = int(name_match.group("iteration"))
          artifact_run_id = int(name_match.group("run_id"))
          artifact_attempt = int(name_match.group("attempt"))
          if artifact_run_id != int(current_run_id):
              raise SystemExit(
                  "redispatch committed-manifest artifact run does not match "
                  "the current workflow run"
              )
          if artifact_iteration != int(iteration) + 1:
              raise SystemExit(
                  "redispatch committed-manifest artifact iteration is not "
                  "the exact next iteration"
              )
          if artifact_attempt != 1:
              raise SystemExit(
                  "redispatch committed-manifest artifact attempt must be exactly one"
              )
          if re.fullmatch(r"[1-9][0-9]*", artifact_id_text) is None:
              raise SystemExit(
                  "redispatch committed-manifest artifact ID must be positive"
              )
          if re.fullmatch(r"[1-9][0-9]*", artifact_size_text) is None:
              raise SystemExit(
                  "redispatch committed-manifest artifact size must be positive"
              )
          if not artifact_digest.startswith("sha256:"):
              artifact_digest = f"sha256:{artifact_digest}"
          if re.fullmatch(r"sha256:[0-9a-f]{64}", artifact_digest) is None:
              raise SystemExit(
                  "redispatch committed-manifest artifact digest must be SHA-256"
              )

          run_raw = subprocess.check_output(
              [
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  "-H",
                  "X-GitHub-Api-Version: 2026-03-10",
                  (
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{current_run_id}"
                  ),
              ],
              text=True,
          )
          owner_run = json.loads(run_raw)
          owner_head_sha = str(owner_run.get("head_sha") or "").lower()
          owner_run_attempt = owner_run.get("run_attempt")
          owner_repository = owner_run.get("repository")
          owner_workflow_id = owner_run.get("workflow_id")
          expected_run_url = (
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/{current_run_id}"
          )
          if (
              type(owner_run.get("id")) is not int
              or owner_run.get("id") != int(current_run_id)
              or owner_run.get("url") != expected_run_url
              or not isinstance(owner_repository, dict)
              or owner_repository.get("full_name")
              != os.environ["GITHUB_REPOSITORY"]
              or type(owner_run_attempt) is not int
              or owner_run_attempt != int(current_run_attempt)
              or re.fullmatch(r"[0-9a-f]{40}", owner_head_sha) is None
              or owner_head_sha != current_run_head_sha
              or owner_run.get("event") != "workflow_dispatch"
              or owner_run.get("head_branch") != os.environ["WORKFLOW_SOURCE_REF"]
              or owner_run.get("path")
              != ".github/workflows/full-extraction.yml"
              or type(owner_workflow_id) is not int
              or owner_workflow_id < 1
              or owner_run.get("status") not in {"queued", "in_progress"}
              or owner_run.get("conclusion") is not None
          ):
              raise SystemExit(
                  "redispatch committed-manifest owner run identity is invalid"
              )

          artifact_raw = subprocess.check_output(
              [
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  "-H",
                  "X-GitHub-Api-Version: 2026-03-10",
                  (
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/artifacts/{artifact_id_text}"
                  ),
              ],
              text=True,
          )
          artifact = json.loads(artifact_raw)
          workflow_run = artifact.get("workflow_run")
          rest_artifact_id = artifact.get("id")
          artifact_size = artifact.get("size_in_bytes")
          expected_archive_url = (
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/"
              f"{artifact_id_text}/zip"
          )
          if (
              isinstance(rest_artifact_id, bool)
              or not isinstance(rest_artifact_id, int)
              or rest_artifact_id != int(artifact_id_text)
              or artifact.get("name") != artifact_name
              or str(artifact.get("digest") or "").lower() != artifact_digest
              or artifact.get("archive_download_url") != expected_archive_url
              or os.environ["ARTIFACT_ARCHIVE_URL"] != expected_archive_url
              or isinstance(artifact_size, bool)
              or not isinstance(artifact_size, int)
              or artifact_size != int(artifact_size_text)
              or artifact.get("expired") is not False
              or not isinstance(workflow_run, dict)
              or type(workflow_run.get("id")) is not int
              or workflow_run.get("id") != int(current_run_id)
              or str(workflow_run.get("head_sha") or "").lower()
              != owner_head_sha
          ):
              raise SystemExit(
                  "redispatch committed-manifest REST identity does not match "
                  "the immutable upload receipt"
              )
          final_run_raw = subprocess.check_output(
              [
                  "gh",
                  "api",
                  "-H",
                  "Accept: application/vnd.github+json",
                  "-H",
                  "X-GitHub-Api-Version: 2026-03-10",
                  (
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{current_run_id}"
                  ),
              ],
              text=True,
          )
          if json.loads(final_run_raw) != owner_run:
              raise SystemExit(
                  "redispatch committed-manifest owner changed after exact artifact selection"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"artifact_name={artifact_name}\n")
              handle.write(f"artifact_id={artifact_id_text}\n")
              handle.write(f"artifact_digest={artifact_digest}\n")
          PY

      - name: Dispatch next iteration
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_REF: ${{ env.WORKFLOW_SOURCE_REF }}
          WORKFLOW_SHA: ${{ env.WORKFLOW_SOURCE_SHA }}
          TRUSTED_BRANCH_TIP_SHA: ${{ steps.redispatch_guard.outputs.trusted_branch_tip_sha }}
          ITERATION: ${{ inputs.iteration }}
          MAX_ITERATIONS: ${{ inputs.max_iterations }}
          CONCURRENCY: ${{ inputs.concurrency }}
          VPN_PARALLELISM: ${{ inputs.vpn_parallelism }}
          MATRIX_BATCH_SIZE: ${{ inputs.matrix_batch_size }}
          DIRECT_PARALLELISM: ${{ inputs.direct_parallelism }}
          DIRECT_REQUEST_PROFILE: ${{ inputs.direct_request_profile }}
          DIRECT_TIMEOUT_CAP_MINUTES: "30"
          RETRY_PIPELINE_FAILURES: ${{ inputs.retry_pipeline_failures }}
          NETWORK_MODE: ${{ inputs.network_mode }}
          CHUNK_PROFILE: ${{ env.FULL_EXTRACTION_CHUNK_PROFILE }}
          BACKFILL_ENDPOINTS: ${{ inputs.backfill_endpoints }}
          BACKFILL_PATTERNS: ${{ inputs.backfill_patterns }}
          PUBLISH: ${{ false }}
          CHAIN_ID: ${{ env.ACTIVE_CHAIN_ID }}
          ACTIVE_LANE_COUNT: ${{ needs.lane_control.outputs.active-lane-count }}
          ARTIFACT_NAME: ${{ steps.manifest_receipt.outputs.artifact_name }}
          ARTIFACT_ID: ${{ steps.manifest_receipt.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.manifest_receipt.outputs.artifact_digest }}
          ITERATION_BUDGET: ${{ needs.lane_control.outputs.iteration-budget }}
          CHILD_POLL_INTERVAL_SECONDS: "5"
        run: |
          set -euo pipefail
          if ! [[ "$TRUSTED_BRANCH_TIP_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::trusted redispatch branch tip must be a full commit SHA"
            exit 1
          fi
          if ! [[ "$ITERATION" =~ ^[0-9]+$ ]] || [ "$ITERATION" -lt 1 ]; then
            echo "::error::iteration must be a positive integer, got '$ITERATION'"
            exit 1
          fi
          current="$ITERATION"
          next=$((current + 1))
          next_concurrency="$CONCURRENCY"

          max_input="$MAX_ITERATIONS"
          if [ "$max_input" = "auto" ]; then
            if ! [[ "$ITERATION_BUDGET" =~ ^[0-9]+$ ]] || [ "$ITERATION_BUDGET" -lt 1 ]; then
              echo "::error::Auto iteration budget must be a positive integer, got '$ITERATION_BUDGET'"
              exit 1
            fi
            effective_max="$ITERATION_BUDGET"
          elif [[ "$max_input" =~ ^[0-9]+$ ]] && [ "$max_input" -ge 1 ]; then
            effective_max="$max_input"
          else
            echo "::error::max_iterations must be 'auto' or a positive integer, got '$MAX_ITERATIONS'"
            exit 1
          fi

          if [ "$next" -gt "$effective_max" ]; then
            echo "::error::Reached max iterations ($effective_max) with incomplete extraction; next-manifest and checkpoint artifacts were uploaded for manual resume."
            exit 1
          fi

          next_run_name="Full Extraction chain=${CHAIN_ID} iteration=${next}"
          runs_path="$RUNNER_TEMP/full-extraction-run-pages.json"
          existing_child_run_ids_path="$RUNNER_TEMP/full-extraction-existing-child-run-ids.json"
          child_dispatch_may_exist=false
          child_acknowledged=false
          child_run_id=""

          cancel_dispatched_child() {
            set +e
            candidate_ids=""
            if [[ "$child_run_id" =~ ^[1-9][0-9]*$ ]]; then
              candidate_ids="$child_run_id"
            elif [ "$child_dispatch_may_exist" = "true" ] && [ -f "$existing_child_run_ids_path" ]; then
              cancel_runs_path="$RUNNER_TEMP/full-extraction-cancel-run-pages.json"
              gh api \
                --method GET \
                --paginate \
                --slurp \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "/repos/${{ github.repository }}/actions/workflows/full-extraction.yml/runs" \
                -f "per_page=100" \
                > "$cancel_runs_path"
              candidate_ids="$(
                RUNS_PATH="$cancel_runs_path" \
                  EXISTING_CHILD_RUN_IDS_PATH="$existing_child_run_ids_path" \
                  EXPECTED_RUN_NAME="$next_run_name" \
                  python - <<'PY'
          import json
          import os
          from pathlib import Path

          pages = json.loads(Path(os.environ["RUNS_PATH"]).read_text(encoding="utf-8"))
          existing_ids = set(
              json.loads(
                  Path(os.environ["EXISTING_CHILD_RUN_IDS_PATH"]).read_text(encoding="utf-8")
              )
          )
          expected = os.environ["EXPECTED_RUN_NAME"]
          for page in pages:
              for run in page.get("workflow_runs", []):
                  run_id = str(run.get("id") or "")
                  if (
                      str(run.get("event") or "") == "workflow_dispatch"
                      and str(run.get("display_title") or "") == expected
                      and run_id not in existing_ids
                      and run_id.isdigit()
                  ):
                      print(run_id)
          PY
              )"
            fi
            while IFS= read -r candidate_id; do
              if [[ "$candidate_id" =~ ^[1-9][0-9]*$ ]]; then
                echo "::warning::Cancelling unacknowledged child run $candidate_id after parent interruption"
                gh api \
                  --method POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2026-03-10" \
                  "/repos/${{ github.repository }}/actions/runs/${candidate_id}/cancel" \
                  >/dev/null 2>&1 || true
              fi
            done <<< "$candidate_ids"
          }

          on_dispatch_exit() {
            rc=$?
            trap - EXIT INT TERM
            if [ "$rc" -ne 0 ] && [ "$child_dispatch_may_exist" = "true" ] && [ "$child_acknowledged" != "true" ]; then
              cancel_dispatched_child
            fi
            exit "$rc"
          }

          on_dispatch_signal() {
            trap - EXIT INT TERM
            if [ "$child_dispatch_may_exist" = "true" ] && [ "$child_acknowledged" != "true" ]; then
              cancel_dispatched_child
            fi
            exit 130
          }

          trap on_dispatch_exit EXIT
          trap on_dispatch_signal INT TERM
          gh api \
            --method GET \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${{ github.repository }}/actions/workflows/full-extraction.yml/runs" \
            -f "per_page=100" \
            > "$runs_path"
          duplicate_runs="$(
            RUNS_PATH="$runs_path" \
              EXISTING_CHILD_RUN_IDS_PATH="$existing_child_run_ids_path" \
              EXPECTED_RUN_NAME="$next_run_name" \
              python - <<'PY'
          # CHILD_RUN_PRECHECK
          import json
          import os
          from pathlib import Path

          pages = json.loads(Path(os.environ["RUNS_PATH"]).read_text(encoding="utf-8"))
          expected_run_name = os.environ["EXPECTED_RUN_NAME"]
          runs: list[dict[str, object]] = []
          if not isinstance(pages, list) or not pages:
              raise SystemExit("redispatch workflow run inventory must contain pages")
          total_count: int | None = None
          run_ids: set[int] = set()
          for page in pages:
              if not isinstance(page, dict):
                  raise SystemExit("redispatch workflow run inventory pages must be objects")
              page_total = page.get("total_count")
              entries = page.get("workflow_runs")
              if (
                  isinstance(page_total, bool)
                  or not isinstance(page_total, int)
                  or page_total < 0
                  or not isinstance(entries, list)
              ):
                  raise SystemExit("redispatch workflow run inventory page is malformed")
              if total_count is None:
                  total_count = page_total
              elif total_count != page_total:
                  raise SystemExit(
                      "redispatch workflow run total changed during pagination"
                  )
              for run in entries:
                  if not isinstance(run, dict):
                      raise SystemExit(
                          "redispatch workflow run inventory entries must be objects"
                      )
                  run_id = run.get("id")
                  title = run.get("display_title")
                  event = run.get("event")
                  status = run.get("status")
                  conclusion = run.get("conclusion")
                  html_url = run.get("html_url")
                  if (
                      isinstance(run_id, bool)
                      or not isinstance(run_id, int)
                      or run_id < 1
                      or not isinstance(title, str)
                      or not title
                      or not isinstance(event, str)
                      or not event
                      or not isinstance(status, str)
                      or not status
                      or (conclusion is not None and not isinstance(conclusion, str))
                      or (html_url is not None and not isinstance(html_url, str))
                  ):
                      raise SystemExit(
                          "redispatch workflow run inventory entry is malformed"
                      )
                  if run_id in run_ids:
                      raise SystemExit(
                          "redispatch workflow run inventory repeated a run ID"
                      )
                  run_ids.add(run_id)
                  runs.append(run)
          if total_count != len(runs):
              raise SystemExit(
                  "redispatch workflow run inventory count does not match total_count"
              )
          matches = sorted(
              (
                  run
                  for run in runs
                  if str(run.get("event") or "") == "workflow_dispatch"
                  and str(run.get("display_title") or "") == expected_run_name
              ),
              key=lambda run: int(run.get("id") or 0),
          )
          existing_ids = [str(run.get("id") or "") for run in matches]
          Path(os.environ["EXISTING_CHILD_RUN_IDS_PATH"]).write_text(
              json.dumps(existing_ids, indent=2) + "\n",
              encoding="utf-8",
          )
          blockers = [
              run
              for run in matches
              if str(run.get("status") or "") != "completed"
              or str(run.get("conclusion") or "")
              not in {"action_required", "cancelled", "failure", "timed_out"}
          ]
          print(
              ", ".join(
                  f"{run.get('id')}:{run.get('status')}:{run.get('conclusion')}:{run.get('html_url')}"
                  for run in blockers
              )
          )
          PY
          )"
          if [ -n "$duplicate_runs" ]; then
            echo "::error::Refusing duplicate redispatch for chain $CHAIN_ID iteration $next; existing run(s): $duplicate_runs"
            exit 1
          fi

          echo "::notice::Some lanes incomplete — triggering iteration $next/$effective_max at $next_concurrency concurrency (chain $CHAIN_ID; max_iterations=$MAX_ITERATIONS)"
          child_dispatch_may_exist=true
          dispatch_payload_path="$RUNNER_TEMP/full-extraction-dispatch-payload.json"
          DISPATCH_PAYLOAD_PATH="$dispatch_payload_path" \
            NEXT_ITERATION="$next" \
            NEXT_CONCURRENCY="$next_concurrency" \
            PARENT_RUN_ID="${{ github.run_id }}" \
            python - <<'PY'
          # EXACT_WORKFLOW_DISPATCH_PAYLOAD
          import json
          import os
          from pathlib import Path

          inputs = {
              "concurrency": os.environ["NEXT_CONCURRENCY"],
              "vpn_parallelism": os.environ["VPN_PARALLELISM"],
              "matrix_batch_size": os.environ["MATRIX_BATCH_SIZE"],
              "direct_parallelism": os.environ["DIRECT_PARALLELISM"],
              "direct_request_profile": os.environ["DIRECT_REQUEST_PROFILE"],
              "direct_timeout_cap_minutes": os.environ["DIRECT_TIMEOUT_CAP_MINUTES"],
              "retry_pipeline_failures": os.environ["RETRY_PIPELINE_FAILURES"],
              "network_mode": os.environ["NETWORK_MODE"],
              "chunk_profile": os.environ["CHUNK_PROFILE"],
              "iteration": os.environ["NEXT_ITERATION"],
              "max_iterations": os.environ["MAX_ITERATIONS"],
              "backfill_endpoints": os.environ["BACKFILL_ENDPOINTS"],
              "backfill_patterns": os.environ["BACKFILL_PATTERNS"],
              "force_reextract": "false",
              "publish": os.environ["PUBLISH"],
              "chain_id": os.environ["CHAIN_ID"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "lane_manifest_run_id": os.environ["PARENT_RUN_ID"],
              "lane_manifest_artifact_name": os.environ["ARTIFACT_NAME"],
              "lane_manifest_artifact_id": os.environ["ARTIFACT_ID"],
              "lane_manifest_artifact_digest": os.environ["ARTIFACT_DIGEST"],
          }
          payload = {
              "ref": os.environ["WORKFLOW_REF"],
              "inputs": inputs,
          }
          Path(os.environ["DISPATCH_PAYLOAD_PATH"]).write_text(
              json.dumps(payload, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          dispatch_response_path="$RUNNER_TEMP/full-extraction-dispatch-response.json"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${{ github.repository }}/actions/workflows/full-extraction.yml/dispatches" \
            --input "$dispatch_payload_path" \
            > "$dispatch_response_path"
          child_run_path="$RUNNER_TEMP/full-extraction-child-run.json"
          DISPATCH_RESPONSE_PATH="$dispatch_response_path" \
            CHILD_RUN_PATH="$child_run_path" \
            EXPECTED_RUN_NAME="$next_run_name" \
            python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          response = json.loads(
              Path(os.environ["DISPATCH_RESPONSE_PATH"]).read_text(encoding="utf-8")
          )
          if not isinstance(response, dict) or set(response) != {
              "workflow_run_id",
              "run_url",
              "html_url",
          }:
              raise SystemExit(
                  f"workflow dispatch did not return an exact child identity: {response!r}"
              )
          expected_run_name = os.environ["EXPECTED_RUN_NAME"]
          raw_child_run_id = response.get("workflow_run_id")
          if (
              isinstance(raw_child_run_id, bool)
              or not isinstance(raw_child_run_id, int)
              or raw_child_run_id < 1
          ):
              raise SystemExit(
                  f"workflow dispatch did not return an exact child identity: {response!r}"
              )
          child_run_id = str(raw_child_run_id)
          child_run_url = str(response.get("html_url") or "").strip()
          run_api_url = str(response.get("run_url") or "").strip()
          repository = os.environ["GITHUB_REPOSITORY"]
          if re.fullmatch(r"[^/]+/[^/]+", repository) is None:
              raise SystemExit("GitHub repository identity is invalid")
          expected_child_url = (
              f"{os.environ['GITHUB_SERVER_URL'].rstrip('/')}/{repository}/"
              f"actions/runs/{child_run_id}"
          )
          expected_api_url = (
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{repository}/"
              f"actions/runs/{child_run_id}"
          )
          if (
              re.fullmatch(r"[1-9][0-9]*", child_run_id) is None
              or child_run_url != expected_child_url
              or run_api_url != expected_api_url
          ):
              raise SystemExit(
                  f"workflow dispatch did not return an exact child identity: {response!r}"
              )
          Path(os.environ["CHILD_RUN_PATH"]).write_text(
              json.dumps(
                  {
                      "display_title": expected_run_name,
                      "id": child_run_id,
                      "url": expected_child_url,
                      "api_url": expected_api_url,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          child_run_id="$(CHILD_RUN_PATH="$child_run_path" python - <<'PY'
          import json
          import os
          from pathlib import Path

          print(json.loads(Path(os.environ["CHILD_RUN_PATH"]).read_text())["id"])
          PY
          )"
          child_run_url="$(CHILD_RUN_PATH="$child_run_path" python - <<'PY'
          import json
          import os
          from pathlib import Path

          print(json.loads(Path(os.environ["CHILD_RUN_PATH"]).read_text())["url"])
          PY
          )"
          child_run_api_url="$(CHILD_RUN_PATH="$child_run_path" python - <<'PY'
          import json
          import os
          from pathlib import Path

          print(json.loads(Path(os.environ["CHILD_RUN_PATH"]).read_text())["api_url"])
          PY
          )"
          child_details_path="$RUNNER_TEMP/full-extraction-child-details.json"
          child_visible=false
          for _attempt in 1 2 3; do
            if gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$child_run_api_url" > "$child_details_path"; then
              child_visible=true
              break
            fi
            sleep "$CHILD_POLL_INTERVAL_SECONDS"
          done
          if [ "$child_visible" != "true" ]; then
            echo "::error::Exact self-dispatched child run $child_run_id was not readable"
            exit 1
          fi
          CHILD_DETAILS_PATH="$child_details_path" \
            EXPECTED_CHILD_API_URL="$child_run_api_url" \
            EXPECTED_CHILD_BRANCH="$WORKFLOW_REF" \
            EXPECTED_CHILD_RUN_ID="$child_run_id" \
            EXPECTED_RUN_NAME="$next_run_name" \
            EXPECTED_CHILD_URL="$child_run_url" \
            EXPECTED_WORKFLOW_ID="${{ steps.redispatch_guard.outputs.workflow_id }}" \
            EXPECTED_WORKFLOW_PATH=".github/workflows/full-extraction.yml" \
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          child = json.loads(
              Path(os.environ["CHILD_DETAILS_PATH"]).read_text(encoding="utf-8")
          )
          if not isinstance(child, dict):
              raise SystemExit(
                  f"self-dispatched child provenance does not match: {child!r}"
              )
          workflow_id = child.get("workflow_id")
          if (
              str(child.get("id") or "") != os.environ["EXPECTED_CHILD_RUN_ID"]
              or str(child.get("display_title") or "") != os.environ["EXPECTED_RUN_NAME"]
              or str(child.get("html_url") or "") != os.environ["EXPECTED_CHILD_URL"]
              or str(child.get("url") or "") != os.environ["EXPECTED_CHILD_API_URL"]
              or str(child.get("event") or "") != "workflow_dispatch"
              or str(child.get("head_branch") or "")
              != os.environ["EXPECTED_CHILD_BRANCH"]
              or str(child.get("head_sha") or "").lower()
              != os.environ["TRUSTED_BRANCH_TIP_SHA"].lower()
              or isinstance(workflow_id, bool)
              or not isinstance(workflow_id, int)
              or str(workflow_id) != os.environ["EXPECTED_WORKFLOW_ID"]
              or str(child.get("path") or "")
              != os.environ["EXPECTED_WORKFLOW_PATH"]
              or child.get("run_attempt") != 1
          ):
              raise SystemExit(
                  f"self-dispatched child provenance does not match: {child!r}"
              )
          PY
          child_acknowledged=true
          trap - EXIT INT TERM
          {
            echo "child_run_id=$child_run_id"
            echo "child_run_url=$child_run_url"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Full Extraction Redispatch"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Child run ID | \`$child_run_id\` |"
            echo "| Child run | [$next_run_name]($child_run_url) |"
            echo "| Publish | \`$PUBLISH\` |"
          } >> "$GITHUB_STEP_SUMMARY"
