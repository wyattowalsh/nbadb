name: Update Kaggle Metadata

on:
  push:
    branches: [main]
    paths:
      - "src/nbadb/cli/commands/metadata.py"
      - "src/nbadb/kaggle/metadata.py"
      - "src/nbadb/load/parquet_loader.py"
      - "src/nbadb/transform/**"
      - "src/nbadb/schemas/**"

permissions:
  contents: write

concurrency:
  group: update-metadata
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: metadata

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - run: uv sync

      - uses: ./.github/actions/refresh-metadata
